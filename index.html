   exp:"399条の13 第１項１号イ。監査等委員会設置会社の取締役会は、① 経営の基本方針、② 監査等委員会の職務の執行のため必要なものとして法務省令で定める事項、③ 取締役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務ならびに当該株式会社およびその子会社から成る企業集団の業務の適正を確保するために必要なものとして法務省令で定める体制の整備（内部統制システムの整備）、④ その他監査等委員会設置会社の業務執行の決定を行う（399条の13 第１項１号）。なお、監査等委員会設置会社の取締役会は、①～③の事項を決定しなければならない（同条２項）。"},
  {id:"K-02-13-022",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:2,rank:"A",src:"令６Ⅱ問題８イ類・平28Ⅱ問題13 ア類",
   q:"監査等委員会設置会社の取締役会は、監査等委員である取締役を代表取締役として選定することができる。",ans:"誤り",
   exp:"399条の13 第１項３号３項。監査等委員会設置会社の取締役会は、取締役（監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。また、代表取締役を解職する権限も有する。"},
  {id:"K-02-13-023",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:3,rank:"A",src:"",
   q:"監査等委員会設置会社の取締役会は、常に、その決議によって、重要な財産の処分および譲受けの決定を取締役に委任することができる。",ans:"誤り",
   exp:"399条の13 第４項１号。監査等委員会設置会社の取締役会は、重要な財産の処分および譲受けの決定を取締役に委任することができない。ただし、一定の要件を満たす場合は、この限りではない。"},
  {id:"K-02-13-024",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:4,rank:"A",src:"",
   q:"監査等委員会設置会社の取締役会は、監査等委員会の承認を受けたときは、多額の借財の決定を取締役に委任することができる。",ans:"誤り",
   exp:"399条の13 第４項２号。監査等委員会設置会社の取締役会は、一定の要件を満たす場合は、その決議によって多額の借財の決定を取締役に委任することができるが、監査等委員会の承認を受けても委任することができない。"},
  {id:"K-02-13-025",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:5,rank:"A",src:"令６Ⅰ問題13 エ類",
   q:"監査等委員会設置会社の取締役の過半数が社外取締役である場合には、当該監査等委員会設置会社の取締役会は、その決議によって、支配人その他の重要な使用人の選任および解任の決定を取締役に委任することができる。",ans:"正しい",
   exp:"399条の13 第５項柱書本文。監査等委員会設置会社の取締役の過半数が社外取締役である場合には、業務執行者からの独立性が制度的に担保された監査等委員会が取締役の選解任や報酬等について意見陳述権を有していることと相まって、指名委員会や報酬委員会がなくても取締役会の業務執行者からの独立性がその構成上担保されているということができる。そこで、この場合には、監査等委員会設置会社の取締役会は、その決議によって、重要な業務執行の決定を取締役に委任することができることとしている。"},
  {id:"K-02-13-026",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:6,rank:"A",src:"令３問題７ア類・平28Ⅰ問題９ア類",
   q:"監査等委員会設置会社の取締役の過半数が社外取締役である場合には、当該監査等委員会設置会社の取締役会は、その決議によって、株主総会に提出する議案の内容の決定を取締役に委任することができる。",ans:"誤り",
   exp:"399条の13 第５項５号。監査等委員会設置会社において取締役に委任できる事項の範囲と指名委員会等設置会社において執行役に委任できる事項の範囲は実質的に等しい。したがって、監査等委員会設置会社の取締役の過半数が社外取締役である場合であっても、株主総会に提出する議案の内容の決定を取締役に委任することはできない。"},
  {id:"K-02-13-027",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:7,rank:"A",src:"平28Ⅱ問題13 ウ",
   q:"監査等委員会設置会社は、その定款において、支店その他重要な組織の設置、変更および廃止に係る決定を、取締役会の決議によって取締役に委任することができる旨を定めることができる。",ans:"正しい",
   exp:"399条の13 第６項。監査等委員会設置会社においては、① 取締役の過半数が社外取締役である場合、または、② 定款の定めがある場合は、取締役会の決議によって、取締役に重要な業務執行の決定を委任することができる。ここで、監査等委員会設置会社において取締役に委任できる事項の範囲と指名委員会等設置会社において執行役に委任できる事項の範囲は実質的に等しい。したがって、監査等委員会設置会社において、①または②の要件を満たした場合は、取締役会の決議によって、支店その他重要な組織の設置、変更および廃止に係る決定を取締役に委任することができる。"},
  {id:"K-02-13-028",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:8,rank:"A",src:"",
   q:"監査等委員会設置会社においては、特別取締役による取締役会の決議の制度を採用することはできない。",ans:"誤り",
   exp:"373条１項柱書かっこ書。監査等委員会設置会社においては、① 取締役の過半数が社外取締役である場合（399条の13 第５項）、または、② 取締役会の決議によって重要な財産の処分および讓受けならびに多額の借財を取締役に委任することができる旨の定款の定めがある場合（399条の13 第６項）は、特別取締役による取締役会の決議の制度を採用することができない（373条１項柱書かっこ書）。この場合は、取締役会の決議によって、重要な財産の処分および譲受け等の決定を代表取締役等に委任することにより迅速な意思決定が可能なためである。"},
  {id:"K-02-13-029",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:9,rank:"B",src:"",
   q:"監査等委員会設置会社においては、招集権者の定めがある場合であっても、監査等委員会が選定する監査等委員は、取締役会を招集することができる。",ans:"正しい",
   exp:"399条の14。監査等委員会の職務の執行にあたって取締役会の決議を要する場合に備えた規定である。"},
  {id:"K-02-13-030",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:10,rank:"C",src:"",
   q:"監査等委員会がその委員の中から選定する者は、遅滞なく、当該監査等委員会の職務の執行の状況を取締役会に報告しなければならない。",ans:"誤り",
   exp:"監査等委員会設置会社においては、指名委員会等設置会社における監査委員会が選定する監査委員の委員会の職務執行の状況を取締役会に報告する義務（417条３項）に対応するものは規定されていない。これは、監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して、監査役会と同様の規律としたものである。"},
  {id:"K-02-14-001",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:1,rank:"A",src:"平31Ⅱ問題12 イ類・平28Ⅱ問題12 ア・平24Ⅰ問題10 イ類",
   q:"取締役会設置会社において、取締役が、自己のために競業取引をすることについて当該取引につき重要な事実を開示して取締役会の承認を受けた場合、当該取締役の株式会社に対する任務懈怠責任の追及において、当該取引によって当該取締役が得た利益の額は、当該取締役の任務懈怠によって当該株式会社に生じた損害の額と推定される。",ans:"誤り",
   exp:"423条２項。取締役が、会社の承認を得ることなく、自己または第三者のために株式会社の事業の部類に属する取引をしたときは、当該取引によって取締役または第三者が得た利益の額は、株式会社に生じた損害の額と推定する。競業取引における損害額の推定規定の趣旨は、競業取引（356条１項１号）によって会社が被った損害の額の立証を容易にすることである。また、執行役も同様に責任を負う。"},
  {id:"K-02-14-002",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:2,rank:"A",src:"令４Ⅰ問題11 ウ類",
   q:"取締役会設置会社の取締役が自己または第三者のために会社とした取引によって当該会社に損害が生じたときは、事前に取締役会で承認を得なかった場合に限り、会社と直接取引をした取締役に任務懈怠が推定される。",ans:"誤り",
   exp:"423条３項１号。取締役会設置会社の取締役が自己または第三者のために会社とした取引によって当該会社に損害が生じたときは、事前に取締役会で承認を得ていたか否かにかかわらず、会社と直接取引をした取締役に任務懈怠が推定される。利益相反取引（356条１項２号３号）における任務懈怠の推定規定が設けられている趣旨は、利益相反取引は会社に損害を及ぼすおそれの大きい行為であることから、取締役または執行役に任務を怠らなかったことの立証責任を転換することで会社の利益の保護を図っているのである。また、執行役も同様に責任を負う。さらに、利益相反取引をすることを決定した取締役または執行役（423条３項２号）、利益相反取引に関する取締役会の承認決議に賛成した取締役（指名委員会等設置会社では、当該取引が会社と取締役との間の取引または会社と取締役との利益が相反する取引に限る）（423条３項３号）も同様である。"},
  {id:"K-02-14-003",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:3,rank:"A",src:"令２Ⅱ問題12 ア・平22Ⅰ問題11 ウ",
   q:"指名委員会等設置会社において、取締役を兼ねていない執行役と指名委員会等設置会社との間の取引によって当該指名委員会等設置会社に損害が生じたときは、当該取引を承認する取締役会の決議に賛成した取締役は、任務を懈怠したものと推定される。",ans:"誤り",
   exp:"423条３項３号かっこ書。会社と執行役間の利益相反取引によって会社に損害が生じても、当該取引に関する取締役会決議に賛成した取締役は任務懈怠を推定されない。会社取締役間の利益相反取引ならば、同じ取締役という情実が入る余地があるので、損害が生じた場合に承認決議に賛成した取締役の任務懈怠が推定されるが、会社執行役間ではそのような事情がないからである。"},
  {id:"K-02-14-004",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:4,rank:"A",src:"令８Ⅰ問題13 イ類・平31Ⅱ問題12 ウ・平30Ⅰ問題11 エ",
   q:"監査等委員でない取締役が自己のために株式会社とする取引につき、取締役会の承認に加え、監査等委員会の承認を受けたときでも、当該取引によって当該株式会社に損害が生じた場合には、当該取締役はその任務を怠ったものと推定される。",ans:"誤り",
   exp:"423条４項。取締役の利益相反取引（356条１項２号３号）によって株式会社に損害が生じたときは、当該取引を行った取締役等はその任務を怠ったものと推定される（423条３項）。しかし、監査等委員会設置会社において、取締役（監査等委員であるものを除く）が利益相反取引につき監査等委員会の承認を受けたときは、当該任務懈怠の推定規定が適用されない。これは、社外取締役に期待される利益相反の監督機能を前提に、監査等委員会制度の利用を促進するという政策的観点から認められたものである。"},
  {id:"K-02-14-005",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:5,rank:"B",src:"",
   q:"監査等委員会設置会社においては、取締役（監査等委員であるものを除く）の利益相反取引によって株式会社に損害が生じた場合であっても、取締役会の承認に加え、事後的に当該取引につき監査等委員会の承認を受けたときはその任務懈怠が推定されない。",ans:"誤り",
   exp:"423条４項。423条４項は、「356条１項２号３号に掲げる場合において、取締役（監査等委員であるものを除く）が当該取引につき監査等委員会の承認を受けたとき」に、取締役の任務懈怠の推定規定を適用しないと定めている。ここで、356条１項２号３号に掲げる場合とは、取締役が利益相反取引を「しようとするとき」であることから、423条４項は、監査等委員会が利益相反取引を事前に承認した場合の規定ということである。"},
  {id:"K-02-14-006",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:6,rank:"A",src:"平31Ⅱ問題12 エ類",
   q:"自己または第三者のために株式会社と取引をした取締役の、会社に対する損害賠償責任は、無過失責任であり、当該取締役が任務を怠らなかったことを証明しても免れることができない。",ans:"誤り",
   exp:"428条１項。自己のために株式会社と取引をした取締役の、会社に対する損害賠償責任は、無過失責任である。当該責任が無過失責任とされている理由は、自己のための直接取引は、利益相反性が著しく高いためである。"},
  {id:"K-02-14-007",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:7,rank:"A",src:"平25Ⅱ問題11 ウ",
   q:"指名委員会等設置会社において、執行役が自己のためにした利益相反取引により株式会社に損害が生じた場合には、総株主の同意により、当該執行役の当該株式会社に対する損害賠償責任を免除することができる。",ans:"正しい",
   exp:"424条。自己のために直接取引をした取締役または執行役の株式会社に対する損害賠償責任には、一部免除の規定（425条、426条、427条）を適用することができない（428条２項）。しかし、424条の規定による総株主の同意による免除の規定は適用される。"},
  {id:"K-02-14-008",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:8,rank:"B",src:"",
   q:"役員等が株式会社に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は、連帯債務者とする。",ans:"正しい",
   exp:"430条。"},
  {id:"K-02-14-009",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:9,rank:"A",src:"令７Ⅰ問題10 イ類",
   q:"役員等の株式会社に対する損害賠償責任を全額免除するためには、株主総会の特殊決議を要する。",ans:"誤り",
   exp:"424条。役員等の責任を追及する株主の代表訴訟提起権（847条）が単独株主権であることから、責任免除には、総株主の同意が要求されている。なお、総株主が同意すればよいと規定されているため、株主総会を開催することまでは要求されていない。"},
  {id:"K-02-14-010",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:10,rank:"A",src:"平31Ⅰ問題12 ア",
   q:"取締役が自己のために株式会社と取引をした場合に、当該取引から生じた当該取締役の任務懈怠責任は、株主総会の特別決議による一部免除の対象とはならない。",ans:"正しい",
   exp:"428条２項。自己のために株式会社と取引をした取締役の株式会社に対する損害賠償責任は、総株主の同意があれば免除することができる（424条）が、責任の一部免除の規定（425条、426条、427条）は適用されない。"},
  {id:"K-02-14-011",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:11,rank:"A",src:"平24Ⅰ問題13 ア",
   q:"役員等の株式会社に対する損害賠償責任（自己のために直接取引をした取締役または執行役の責任は除く）は、当該役員等が職務を行うについて善意無重過失である場合は、賠償の責任を負う額から最低責任限度額を控除して得た額を限度として、株主総会の特別決議により免除することができる。なお、当該株式会社に最終完全親会社等はないものとする。",ans:"正しい",
   exp:"425条１項、309条２項８号。この場合には、取締役は、当該株主総会において責任の原因となった事実および賠償の責任を負う額、免除可能限度額とその算定根拠、責任を免除すべき理由および免除額を開示しなければならない。"},
  {id:"K-02-14-012",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:12,rank:"A",src:"平31Ⅰ問題12 ウ",
   q:"指名委員会等設置会社の執行役の任務懈怠責任（自己のために直接取引をした執行役の責任は除く）は、株主総会の特別決議による一部免除の対象となる。",ans:"正しい",
   exp:"423条１項、425条。「役員等」には執行役も含まれる。株主総会の特別決議による一部免除の対象となる役員等に制限はないため、本肢は正しい。"},
  {id:"K-02-14-013",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:13,rank:"A",src:"平31Ⅰ問題12 エ",
   q:"会計監査人の任務懈怠責任は、株主総会の特別決議による一部免除の対象とはならない。",ans:"誤り",
   exp:"423条１項、425条。「役員等」には会計監査人も含まれる。株主総会の特別決議による一部免除の対象となる役員等に制限はないため、会計監査人の任務懈怠責任は、株主総会の特別決議による一部免除の対象となる。"},
  {id:"K-02-14-014",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:14,rank:"B",src:"",
   q:"代表取締役以外の取締役の株式会社に対する損害賠償責任に係る最低責任限度額の算定に際して、１年あたりの職務執行の対価として受ける財産上の利益の額に乗じる数は、社外取締役を除き、「４」である。",ans:"誤り",
   exp:"425条１項１号。最低責任限度額は、次の①と②の合計額により算出する。① 当該役員等がその在職中に会社から職務執行の対価として受け、または受けるべき財産上の利益の１年間あたりの額に相当する額として法務省令で定める方法により算定される額の、代表取締役または代表執行役は６年分、代表取締役以外の取締役（業務執行取締役等であるものに限る）または代表執行役以外の執行役は４年分、取締役（代表取締役および業務執行取締役等を除く）、監査役、会計参与または会計監査人は２年分に相当する額、② 当該役員等が当該株式会社の新株予約権を有利な条件または金額で引き受けた場合（238条３項各号）で、当該役員等が就任後に新株予約権を行使または譲渡した場合の利益の額（会社法施行規則114条）。代表取締役以外の取締役の責任についての最低責任限度額を区別する基準は、社外取締役であるか否かではなく、業務執行取締役等であるか否かによる。"},
  {id:"K-02-14-015",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:15,rank:"B",src:"平25Ⅱ問題11 イ",
   q:"監査役会設置会社において、監査役の株式会社に対する損害賠償責任の一部免除に関する議案を株主総会に提出するには、他の監査役全員の同意を得なければならない。",ans:"誤り",
   exp:"425条３項。監査役会設置会社においては、取締役は、役員等の株式会社に対する損害賠償責任の一部免除（取締役の責任の免除に限る）に関する議案を株主総会に提出するには、各監査役の同意を得なければならない（425条３項）。"},
  {id:"K-02-14-016",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:16,rank:"B",src:"平25Ⅱ問題11 ア",
   q:"取締役の株式会社に対する損害賠償責任の一部を免除する株主総会の決議があった場合において、当該株式会社が当該決議後に当該取締役に対し退職慰労金を与えるときは、株主総会の特別決議による承認を受けなければならない。",ans:"誤り",
   exp:"425条４項前段、309条１項。役員等の責任を一部免除する株主総会の決議があった場合において、株式会社が当該決議後にその役員等に対して、退職慰労金その他の法務省令で定める財産上の利益を与えるときは、株主総会の承認を受けなければならない。当該決議は、普通決議で足りる。"},
  {id:"K-02-14-017",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:17,rank:"C",src:"",
   q:"指名委員会等設置会社では、役員等の会社に対する損害賠償責任は、当該役員等が職務を行うにつき善意無重過失である場合は、賠償の責任を負う額から最低責任限度額を控除して得た額を限度として、取締役会の決議によって一部免除することができる旨を定款で定めることができる。",ans:"誤り",
   exp:"426条１項。監査役設置会社（取締役が２人以上ある場合に限る）、監査等委員会設置会社または指名委員会等設置会社は、役員等の株式会社に対する損害賠償責任（423条１項）について、当該役員等が職務を行うにつき善意・無重過失であり、特に必要であると認められるときは、賠償の責任を負う額から最低責任限度額を控除して得た額を限度として、取締役（当該責任を負う取締役を除く）の過半数の同意（取締役会設置会社では取締役会の決議）によって免除することができる旨を定款で定めることができる。株主総会の特別決議による一部免除と異なり、特に必要と認められる場合に限定されるのは、取締役の過半数の同意・取締役会の決議による一部免除の場合は、一度定款が変更されてしまえば、その後、株主は責任免除に一切関与できないことになるため、免除することができる要件を厳格にしているのである。"},
  {id:"K-02-14-018",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:18,rank:"B",src:"令５Ⅰ問題12 ア類",
   q:"株式会社は、取締役（業務執行取締役等を除く）の株式会社に対する損害賠償責任について、当該取締役が職務を行うにつき善意でかつ重大な過失がないときは、定款で定めた額の範囲内であらかじめ株式会社が定めた額と最低責任限度額とのいずれか高い額を限度とする旨の契約を当該取締役と締結することができる旨を定款で定めることができる。",ans:"正しい",
   exp:"427条１項。株式会社は、非業務執行取締役等（取締役（業務執行取締役等であるものを除く）、会計参与、監査役または会計監査人）の株式会社に対する損害賠償責任（423条１項）について、当該非業務執行取締役等が職務を行うにつき善意・無重過失である場合には、定款で定めた額の範囲内であらかじめ株式会社が定めた額と最低責任限度額とのいずれか高い額を限度とする旨の契約を非業務執行取締役等と締結することができる旨を定款で定めることができる。すなわち、責任限定契約を締結することができる者を業務執行を行うかどうかで区別することとしているのである。責任限定契約の趣旨は、賠償責任に関する不安を除去し、非業務執行取締役等の人材を確保しやすくすることにある。"},
  {id:"K-02-14-019",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:19,rank:"B",src:"平25Ⅱ問題11 エ",
   q:"会計参与設置会社は、会計参与の株式会社に対する損害賠償責任について、責任限定契約を会計参与と締結することができる旨を定款で定めることができる。",ans:"正しい",
   exp:"427条１項。株式会社は、非業務執行取締役等（取締役（業務執行取締役等であるものを除く）、会計参与、監査役または会計監査人）の株式会社に対する損害賠償責任（423条１項）について、責任限定契約を非業務執行取締役等と締結することができる旨を定款で定めることができる。非業務執行取締役等との責任限定契約の趣旨は、賠償責任に関する不安を除去し、非業務執行取締役等の人材を確保しやすくすることにある。"},
  {id:"K-02-14-020",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:20,rank:"B",src:"令５Ⅰ問題12 イ・平24Ⅰ問題13 イ",
   q:"株式会社が、社外取締役との間で責任限定契約を締結した場合において、当該社外取締役が当該株式会社の業務執行取締役に就任したときは、当該契約は、その締結時に遡って、その効力を失う。",ans:"誤り",
   exp:"427条２項。責任限定契約を締結した非業務執行取締役等である社外取締役が社外性を喪失した場合、当該契約は将来に向かってその効力を失う。"},
  {id:"K-02-14-021",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (1) 役員等の会社に対する損害賠償責任",num:21,rank:"B",src:"平24Ⅰ問題13 エ",
   q:"株式会社は、社外取締役との間で責任限定契約を締結することができる旨を定款で定めた場合には、当該定款の定めについて登記しなければならない。",ans:"正しい",
   exp:"911条３項25号。"},
  {id:"K-02-14-022",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:1,rank:"A",src:"平26Ⅱ問題10 ウ",
   q:"会計参与がその職務を行うについて悪意または重大な過失があったときは、当該会計参与は、これによって第三者に生じた損害を賠償する責任を負う。",ans:"正しい",
   exp:"429条１項。役員等（取締役、会計参与、監査役、執行役または会計監査人）がその職務を行うについて悪意または重過失があったときは、当該役員等は、これによって第三者に生じた損害を賠償する責任を負う。"},
  {id:"K-02-14-023",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:2,rank:"A",src:"",
   q:"会計監査人は、その職務を行うについて悪意または重大な過失があったとしても、これによって第三者に生じた損害を賠償する責任を負わない。",ans:"誤り",
   exp:"429条１項。会計監査人も役員等に該当するので、第三者に対して損害賠償責任を負う。"},
  {id:"K-02-14-024",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:3,rank:"B",src:"平24Ⅰ問題13 ウ",
   q:"役員等の第三者に対する損害賠償責任は、総株主の同意によって免除することができる。",ans:"誤り",
   exp:"役員等の第三者に対する損害賠償責任（429条）は、会社に対する損害賠償責任（423条１項）と異なり、総株主の同意による免除は認められない。"},
  {id:"K-02-14-025",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:4,rank:"C",src:"",
   q:"最高裁判所の判例によれば、役員等の第三者に対する損害賠償責任は、役員等の保護を図るために責任を軽減することとした民法上の不法行為責任の特則であると解している。",ans:"誤り",
   exp:"最判昭44年11月26日。判例によると、役員等の任務懈怠によって損害を受けた第三者を保護するために、民法上の不法行為責任（民法709条）とは別に、会社法が定めた特別の法定責任であると解している。"},
  {id:"K-02-14-026",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:5,rank:"B",src:"",
   q:"最高裁判所の判例によれば、役員等の第三者に対する損害賠償責任の対象となる損害は、直接損害のみならず、間接損害も含むとされる。",ans:"正しい",
   exp:"最判昭44年11月26日。"},
  {id:"K-02-14-027",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:6,rank:"B",src:"",
   q:"役員等が第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は、連帯債務者とする。",ans:"正しい",
   exp:"430条。なお、役員等の株式会社に対する損害賠償責任も同様に、役員等は連帯責任とされている。"},
  {id:"K-02-14-028",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:7,rank:"B",src:"令７Ⅱ問題12 ア類",
   q:"最高裁判所の判例によれば、取締役会設置会社において、代表取締役でない平取締役は、取締役会に上程されていない事項について監視義務を負わないとしている。",ans:"誤り",
   exp:"最判昭48年５月22日。判例によると、取締役会設置会社において、代表取締役でない平取締役が取締役会に上程されていない事項についても監視義務を負うとしている。なぜなら、各取締役には取締役会の招集権や招集請求権（366条）が認められているため、取締役会決議に至っていない事項においても、取締役会を招集して、取締役会による取締役の職務執行の監督機能（362条２項２号）を発揮させることが可能であるし、期待されているからである。"},
  {id:"K-02-14-029",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:8,rank:"B",src:"",
   q:"最高裁判所の判例によれば、名目的取締役であっても取締役であることには変わりはなく、職務として監視義務を負っているため、監視義務を怠った場合は任務懈怠があるとされる。",ans:"正しい",
   exp:"最判昭55年３月18日。"},
  {id:"K-02-14-030",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:9,rank:"C",src:"",
   q:"最高裁判所の判例によれば、株主総会において取締役として選任されていないにもかかわらず、取締役として登記がなされている者は、役員等の第三者に対する損害賠償責任を負うことはない。",ans:"誤り",
   exp:"最判昭47年６月15日。判例によると、表見的取締役が、登記がなされることに承諾するなど、不実登記の作出に帰責性が認められる場合は、908条２項の類推適用によって、自己が取締役でないことを善意の第三者に対抗することができず、429条１項の責任を負うとしている。"},
  {id:"K-02-14-031",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:10,rank:"C",src:"",
   q:"最高裁判所の判例によれば、取締役を退任しているにもかかわらず、取締役の退任登記が未了で、取締役としての登記が残存している者は、退任後に生じた会社の損害について、役員等の第三者に対する損害賠償責任を負うことはない。",ans:"誤り",
   exp:"最判昭62年４月16日。退任登記未了の取締役が、不実登記を残存させることについて明示的に承諾を与えていたなどの特段の事情がある場合は、908条２項の類推適用によって、自己が取締役でないことを善意の第三者に対抗することができず、429条１項の責任を負うとしている。"},
  {id:"K-02-14-032",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:11,rank:"B",src:"",
   q:"取締役が計算書類に記載すべき重要な事項についての虚偽の記載をしたときは、当該取締役が当該記載をすることについて注意を怠らなかったことを証明しない限り、当該取締役は、第三者に対して損害賠償責任を負う。",ans:"正しい",
   exp:"429条２項１号ロ。計算書類等に重要な虚偽記載が行われた場合、それを用いて取引を行った結果として損害を受けた第三者を保護する必要がある。そして、情報開示の重要性から、第三者の保護を強化する必要があるため、429条１項の責任と異なり、立証責任が転換された過失責任とされているのである。"},
  {id:"K-02-14-033",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (2) 役員等の第三者に対する損害賠償責任",num:12,rank:"B",src:"令８Ⅰ問題13 ア",
   q:"株式会社に関する虚偽の登記によって損害を被った第三者から、当該損害の賠償を求められた当該株式会社の取締役は、当該虚偽の登記につき注意を怠らなかったことを証明したときは、責任を負わない。",ans:"正しい",
   exp:"429条２項１号ハ。取締役および執行役が虚偽の登記をした場合において、これによって第三者に損害が生じたときは、その者は第三者に生じた損害を賠償する責任を負う。ただし、その者が当該行為をすることについて注意を怠らなかったことを証明したときは、責任を負わない（429条２項ただし書）。"},
  {id:"K-02-14-034",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:1,rank:"B",src:"平31Ⅰ問題５イ類",
   q:"株主代表訴訟は、株主の権利の行使に関して利益供与を受けた者に対して、その利益の返還を求める訴えについても対象とする。",ans:"正しい",
   exp:"847条１項本文。株主代表訴訟の対象となる訴えを責任追及等の訴えという。具体的には、① 発起人、設立時取締役、設立時監査役、役員等または清算人（発起人等）の責任を追及する訴え、② 株主等の権利の行使に関して利益供与を受けた者から利益の返還を求める訴え（120条３項）、③ 出資の履行等を仮装した者に支払等を求める訴え（102条の２第１項、213条の２第１項、286条の２第１項）、④ 不公正な払込金額等で株式または新株予約権を引き受けた者に差額の支払を求める訴え（212条１項、285条１項）である。"},
  {id:"K-02-14-035",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:2,rank:"A",src:"平29Ⅰ問題７エ",
   q:"株式会社に対して取締役の責任を追及する訴えの提起を請求する権利は、単独株主権である。",ans:"正しい",
   exp:"847条１項本文。"},
  {id:"K-02-14-036",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:3,rank:"A",src:"平26Ⅰ問題９ア",
   q:"公開会社でない株式会社において、当該株式会社に対し、責任追及等の訴えの提起を請求しようとする株主は、６か月前から引き続き当該株式会社の株式を有していなければならない。",ans:"誤り",
   exp:"847条２項。株主が頻繁に変動する公開会社では、株式を取得した直後から株主提案権（303条～305条）や監督是正権（360条等）などの行使を認めてしまうと、当該権利を濫用的に行使されてしまう危険性がある。したがって、６か月の保有期間要件を要求し、権利が濫用されるのを防いでいるのである。これに対して、非公開会社においては、そのような保有期間要件は要求されていない。"},
  {id:"K-02-14-037",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:4,rank:"A",src:"",
   q:"６か月前から継続して株式を有する株主は、会社による役員等に対する責任追及がなされない場合に、会社のために、会社に代わって役員等の会社に対する責任を追及する訴えを、直ちに提起することができる。",ans:"誤り",
   exp:"847条１項３項。株式会社が役員等の責任を追及しない場合でも、株主は直ちに責任追及等の訴えを提起することができるわけではない。まず、会社に対して役員等の責任を追及する訴えの提起を請求し、その請求から60日間経過しても会社が責任追及等の訴えをしない場合に、当該請求をした株主は責任追及等の訴えを提起することができるのである。"},
  {id:"K-02-14-038",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:5,rank:"B",src:"",
   q:"株主が会社に対して役員等の会社に対する責任を追及する訴えを請求してから60日を経過した後に訴えを提起したのでは会社に回復することができない損害が生ずるおそれがある場合には、当該株主は、会社のために、直ちに責任追及等の訴えを提起することができる。",ans:"正しい",
   exp:"847条５項本文。"},
  {id:"K-02-14-039",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (3) 株主代表訴訟",num:6,rank:"B",src:"",
   q:"株式会社は、株主の会社に対する役員等の責任を追及する訴えの提起の請求の日から、60日以内に責任追及等の訴えを提起しない場合は、当該請求をした株主に対し、遅滞なく、責任追及等の訴えを提起しない理由を書面その他の法務省令で定める方法により通知しなければならない。",ans:"誤り",
   exp:"847条４項。株式会社は、株主の会社に対する役員等の責任を追及する訴えの提起の請求の日から、60日以内に責任追及等の訴えを提起しない場合は、当該請求をした株主または責任追及等の対象とされている者から請求を受けたときは、当該請求をした者に対し、遅滞なく、責任追及等の訴えを提起しない理由を書面等により通知しなければならない。"},
  {id:"K-02-14-040",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (4) 旧株主による責任追及等の訴え",num:1,rank:"C",src:"",
   q:"旧株主とは、株式会社の株式交換または株式移転、もしくは、株式会社が吸収合併により消滅する会社となる吸収合併の効力発生日の６か月前から当該効力発生日まで引き続き株式会社の総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100 分の１以上の議決権を有する株主または発行済株式（自己株式を除く）の100 分の１以上の数の株式を有する株主であった者をいう。",ans:"誤り",
   exp:"847条の２第１項柱書。旧株主による責任追及等の訴えは、単独株主権である。旧株主とは、株式会社の株式交換または株式移転、もしくは、株式会社が吸収合併により消滅する会社となる吸収合併の効力発生日の６か月（定款で短縮可）前から当該効力発生日まで引き続き株式会社の株主であった者をいう。なお、単元未満株主の権利を制限する定款の定め（189条２項）で旧株主による責任追及等の訴えの提起を請求することができない単元未満株主は、旧株主に該当しない。また、非公開会社においては、６か月の保有期間要件は不要とされている（847条の２第２項）。"},
  {id:"K-02-14-041",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (4) 旧株主による責任追及等の訴え",num:2,rank:"C",src:"",
   q:"旧株主は、当該株式会社の株主でなくなった場合であっても、株式移転により当該株式会社の完全親会社の株式を取得し、引き続き当該株式を有するときは、株式移転完全子会社に対し、責任追及等の訴え（株式移転の効力発生日から訴えを提起する時までにその原因となった事実が生じた責任または義務に係るものを含む）の提起を請求することができる。",ans:"誤り",
   exp:"847条の２第１項本文。旧株主は、当該株式会社の株主でなくなった場合であっても、次に掲げるときは、株式交換等完全子会社に対し、書面その他の法務省令で定める方法により、責任追及等の訴え（効力発生時までにその原因となった事実が生じた責任または義務に係るものに限る）の提起を請求することができる。ただし、責任追及等の訴えが当該旧株主もしくは第三者の不正な利益を図り、または、当該株式交換等完全子会社もしくはその完全親会社に損害を加えることを目的とする場合は、当該請求をすることができない（847条の２第１項ただし書）。旧株主による責任追及等の訴えの制度は、旧株主の意思によらずに責任追及等の訴えを提起し得る地位を失ったことから、株式交換等完全子会社に対して、責任追及等の訴えの提起を請求することができることとするものである。そのため、旧株主が責任追及等の訴えの提起を請求することができる責任または義務は、株式交換等の効力が生じた時点で旧株主が当該株式会社に対してその提起を請求することができたものとするのが相当である。そこで、旧株主は、当該株式交換等の効力が生じた時までにその原因となった事実が生じた責任または義務に係る責任追及等の訴えに限って、その提起を請求することができることとしている。"},
  {id:"K-02-14-042",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (4) 旧株主による責任追及等の訴え",num:3,rank:"C",src:"",
   q:"株式交換等完全子会社が旧株主による責任追及等の訴えの提訴請求の日から60日以内に責任追及等の訴えを提起しないときは、当該提訴請求をした旧株主は、株式交換等完全子会社のために、責任追及等の訴えを提起することができる。",ans:"正しい",
   exp:"847条の２第６項。"},
  {id:"K-02-14-043",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (4) 旧株主による責任追及等の訴え",num:4,rank:"C",src:"",
   q:"株式交換等完全子会社に係る適格旧株主がある場合において、提訴請求の対象とすることができる責任（その免除について総株主の同意が必要とされているものに限る）は、株式交換等完全子会社の総株主の同意に加えて、適格旧株主の全員の同意がなければ、免除することができない。",ans:"正しい",
   exp:"847条の２第９項。株式交換等完全子会社の総株主の同意のみで責任を免除することができてしまうと、旧株主に原告適格を認めた意味がなくなってしまうからである。"},
  {id:"K-02-14-044",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:1,rank:"B",src:"",
   q:"他の株式会社の議決権の80％を有する株式会社であって、その完全親会社等がないものは、最終完全親会社等に該当する。",ans:"誤り",
   exp:"847条の３第１項柱書本文かっこ書。最終完全親会社等とは、株式会社の完全親会社等であって、その完全親会社等がないものをいう。完全親会社等ではない親会社、つまり子会社に少数株主がいる場合は、当該少数株主が株主代表訴訟を提起し、子会社の取締役等に対して責任を追及することで当該子会社の損害を回復することができる。この場合は、親会社の役員等には提訴懈怠の可能性があるとしても、当該少数株主にはそのような提訴懈怠の可能性はないと考えられるため、当該少数株主に子会社の取締役等の責任追及を委ねることが合理的であると考えられたのである。そこで、特定責任追及の訴えの提起を請求することができる株主を「完全」親会社等の株主に限定しているのである。"},
  {id:"K-02-14-045",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:2,rank:"B",src:"",
   q:"特定責任とは、株式会社に最終完全親会社等がある場合の当該株式会社の発起人等の責任である。",ans:"誤り",
   exp:"847条の３第４項。特定責任とは、最終完全親会社等のある株式会社の発起人等の責任の原因となった事実が生じた日において最終完全親会社等およびその完全子会社等における当該株式会社の株式の帳簿価額が当該最終完全親会社等の総資産額として法務省令で定める方法により算定される額の５分の１（定款で緩和可）を超える場合における当該発起人等の責任をいう。企業集団にとって重要性の乏しい子会社については、親会社株主に与える影響も小さいと考えられ、そのような場合にまで特定責任追及の訴えの提訴請求の対象とするのは適切ではないことから、その対象を企業集団にとって一定程度の重要性を有する子会社に限定しているのである。"},
  {id:"K-02-14-046",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:3,rank:"B",src:"",
   q:"６か月前から引き続き株式会社の最終完全親会社等（公開会社であるものとする）の株式を有する株主が、当該株式会社に対し特定責任追及の訴えの提起を請求することができる権利は、単独株主権である。",ans:"誤り",
   exp:"847条の３第１項柱書本文。６か月（定款で短縮可）前から引き続き株式会社の最終完全親会社等の総株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の議決権の100 分の１（定款で緩和可）以上の議決権を有する株主またはその発行済株式（自己株式を除く）の100 分の１（定款で緩和可）以上の数の株式を有する株主は、当該株式会社に対して、特定責任追及の訴えの提起を請求することができる。なお、最終完全親会社等が非公開会社である場合は、６か月の保有期間要件は不要とされている（847条の３第６項）。すなわち、特定責任追及の訴えの提訴請求は少数株主権である。責任追及等の訴えの提訴請求（847条１項）と異なり、特定責任追及の訴えの提訴請求が少数株主権とされたのは、最終完全親会社等の株主と子会社との関係は、最終完全親会社等を通じた間接的なものにすぎないためである。"},
  {id:"K-02-14-047",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:4,rank:"B",src:"",
   q:"株式会社が特定責任追及の訴えの提訴請求の日から60日以内に特定責任追及の訴えを提起しないときは、当該請求をした最終完全親会社等の株主は、株式会社のために、特定責任追及の訴えを提起することができる。",ans:"正しい",
   exp:"847条の３第７項。60日間という期間の経過により株式会社に回復することができない損害が生ずるおそれがある場合には、提訴請求をすることができる最終完全親会社等の株主は、株式会社のために、直ちに特定責任追及の訴えを提起することができる（847条の３第９項）。ただし、不提訴事由（同条１項各号）に該当する場合は、当該提起をすることができない（同条９項ただし書）。"},
  {id:"K-02-14-048",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:5,rank:"B",src:"令８Ⅰ問題13 エ類",
   q:"株式会社に最終完全親会社等がある場合において、特定責任（その免除について総株主の同意が必要とされているものに限る）を免除する場合は、株式会社の総株主の同意に加えて、当該株式会社の最終完全親会社等の総株主の全員の同意がなければ、免除することができない。",ans:"正しい",
   exp:"847条の３第10項。株式会社の総株主の同意のみで責任を免除することができてしまうと、多重代表訴訟制度を認めた意味がなくなってしまうからである。"},
  {id:"K-02-14-049",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (5) 最終完全親会社等の株主による特定責任追及等の訴え（多重代表訴訟）",num:6,rank:"B",src:"",
   q:"株式会社に旧株主や最終完全親会社等が存在する場合であっても、当該株式会社において、財産上の利益の供与（当該株式会社またはその子会社の計算においてするものに限る）が禁止されるのは、当該株式会社の株主の権利の行使に関するものに限られる。",ans:"誤り",
   exp:"120条１項。120条１項は、株主の権利の行使に関してのみならず、当該株式会社に係る適格旧株主の権利、または、当該株式会社の最終完全親会社等の株主の権利に関する利益供与も禁止している。株式会社の取締役等が、適格旧株主または最終完全親会社等の株主から責任追及等の訴えを提起されないようにするために、当該責任追及等の訴えに関して利益の供与をするおそれがあること、また、株式会社が当該責任追及等の訴えの提起等に関して利益の供与をした場合に、当該権利の行使が害されるおそれがあることは、株式会社が株主による責任追及等の訴えの提起に関し財産上の利益の供与をする場合と同様だからである。"},
  {id:"K-02-14-050",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (6) その他の規定",num:1,rank:"C",src:"平26Ⅰ問題９イ",
   q:"株主が提起した責任追及等の訴えの被告が担保提供の申立てをするには、当該被告は、当該訴えの提起が悪意によるものであることを証明しなければならない。",ans:"誤り",
   exp:"847条の４第３項。株主等（株主、適格旧株主または最終完全親会社等の株主）が責任追及等の訴えを提起したときは、裁判所は、被告の申立てにより、当該株主等に対し、相当の担保を立てるべきことを命ずることができる。この場合、被告は、責任追及等の訴えの提起が悪意によるものであることを疎明しなければならない。疎明とは、一応確からしいということを示すことであり、証明よりも確からしいという水準が低いものである。"},
  {id:"K-02-14-051",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (6) その他の規定",num:2,rank:"C",src:"",
   q:"株主は、責任追及等の訴えに係る訴訟に参加することは認められていない。",ans:"誤り",
   exp:"849条１項本文。株主等または株式会社等（株式会社または株式交換等完全子会社）は、共同訴訟人として、または当事者の一方を補助するため、責任追及等の訴え（適格旧株主にあっては株式交換等の行為の効力が生じた時までにその原因となった事実が生じた責任または義務に係るものに限り、最終完全親会社等の株主にあっては特定責任追及の訴えに限る）に係る訴訟に参加することができる。ただし、不当に訴訟手続を遅延させることとなるとき、または、裁判所に対し過大な事務負担を及ぼすこととなるときは、訴訟参加をすることができない（849条１項ただし書）。"},
  {id:"K-02-14-052",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (6) その他の規定",num:3,rank:"B",src:"平26Ⅰ問題９ウ",
   q:"株主は、責任追及等の訴えを提起したときは、遅滞なく、株式会社に対し、訴訟告知をしなければならない。",ans:"正しい",
   exp:"849条４項。株式会社に訴訟参加をする機会を与えるためである。"},
  {id:"K-02-14-053",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (6) その他の規定",num:4,rank:"C",src:"",
   q:"会社により役員等に係る責任追及等の訴えが提起された場合において、会社および役員等が共謀して訴訟の目的である会社の権利を害する目的で判決を確定させたときは、株主は、確定判決に対して、再審の訴えをもって、不服を申し立てることができる。",ans:"正しい",
   exp:"853条１項。"},
  {id:"K-02-14-054",subject:"企業法",chapter:"第2章 機関",sub:"14. 役員等の損害賠償責任 (6) その他の規定",num:5,rank:"B",src:"平26Ⅰ問題９エ",
   q:"責任追及等の訴えを提起した株主が敗訴した場合であっても、悪意があったときを除き、当該株主は、株式会社に対し、これによって生じた損害を賠償する義務を負わない。",ans:"正しい",
   exp:"852条２項。株主に責任追求等の訴えを認める制度趣旨から考えれば、過失により敗訴した場合にまで会社に対する損害賠償責任を負わせることは提訴株主に酷であるし、会社は訴訟参加により牽制が可能であり、提訴株主が嫌がらせや不適切な訴訟追行をすることを抑止する手段をもっている。したがって、株主が悪意であった場合を除き、会社に損害賠償責任を負わないこととしたのである。"},
  {id:"K-02-15-001",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:1,rank:"B",src:"",
   q:"取締役会設置会社が、補償契約の内容を決定するには、株主総会の普通決議によらなければならない。",ans:"誤り",
   exp:"430条の２第１項柱書、309条１項。株式会社が、補償契約の内容を決定するには、株主総会の普通決議（取締役会設置会社にあっては取締役会の決議）によらなければならない。なお、補償契約とは、株式会社が、役員等に対して次に掲げる費用等の全部または一部を当該株式会社が補償することを約する契約をいう。① 当該役員等が、その職務の執行に関し、法令の規定に違反したことが疑われ、または責任の追及に係る請求を受けたことに対処するために支出する費用 ② 当該役員等が、その職務の執行に関し、第三者に生じた損害を賠償する責任を負う場合における次に掲げる損失１損害を役員等が賠償することにより生ずる損失（損害賠償金）２損害の賠償に関する紛争について当事者間に和解が成立したときは、役員等が当該和解に基づく金銭を支払うことにより生ずる損失（和解金）"},
  {id:"K-02-15-002",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:2,rank:"B",src:"令６Ⅱ問題12 ア類",
   q:"株式会社は、補償契約を締結している場合であっても、役員等が、その職務の執行に関し、責任の追及に係る請求を受けたことに対処するために支出する費用のうち通常要する費用の額を超える部分は、当該補償契約に基づき、補償することができない。",ans:"正しい",
   exp:"430条の２第２項１号。過大な費用支出については、株式会社ひいては株主にとって不利益となるためである。"},
  {id:"K-02-15-003",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:3,rank:"B",src:"令６Ⅱ問題12 エ",
   q:"株式会社は、補償契約を締結している場合であっても、取締役がその職務を行うにつき悪意または重過失があるときは、当該取締役に対して補償契約に基づき防御費用を補償することができない。",ans:"誤り",
   exp:"430条の２第２項３号参照。防御費用については役員等がその職務を行うにつき悪意または重大な過失があったか否かにかかわらず、補償契約に基づく補償を行うことができる。"},
  {id:"K-02-15-004",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:4,rank:"B",src:"令６Ⅱ問題12 ウ",
   q:"取締役に対して補償契約に基づき防御費用を補償した株式会社は、当該取締役が自己もしくは第三者の不正な利益を図り、または当該株式会社に損害を加える目的でその職務を執行したことを知ったときは、当該取締役に対し、補償した金額に相当する金銭を返還することを請求することができる。",ans:"正しい",
   exp:"430条の２第３項。"},
  {id:"K-02-15-005",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:5,rank:"B",src:"",
   q:"取締役会設置会社が補償契約に基づき補償を実行し、金銭を役員等に対して実際に支払う場合には、取締役会の承認を受けなければならない。",ans:"誤り",
   exp:"株式会社が補償契約に基づき補償を実行し、金銭を役員等に対して実際に支払う場合には、株主総会の決議や取締役会の決議は必要とされていない。しかし、補償契約に基づき補償する旨の決定が重要な業務執行の決定（362条４項）に該当することもあると解されており、この場合は、取締役会設置会社においては、取締役会の決議が必要となる。"},
  {id:"K-02-15-006",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (1) 補償契約",num:6,rank:"B",src:"",
   q:"取締役会設置会社においては、補償契約に基づき補償をした取締役および当該補償を受けた取締役は、遅滞なく、当該補償についての重要な事実を取締役会に報告しなければならない。",ans:"正しい",
   exp:"430条の２第４項。"},
  {id:"K-02-15-007",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (2) 役員等のために締結される保険契約",num:1,rank:"B",src:"令８Ⅰ問題13 ウ",
   q:"取締役会設置会社が、保険者との間で締結する保険契約のうち取締役がその職務の執行に関し責任を負うことによって生ずることのある損害を保険者が塡補することを約するものであって、当該取締役を被保険者とするものの内容の決定をするには、株主総会の決議を要する。",ans:"誤り",
   exp:"430条の３第１項。株式会社が、役員等賠償責任保険契約の内容を決定するには、株主総会の普通決議（取締役会設置会社にあっては取締役会の決議）によらなければならない。なお、役員等賠償責任保険契約とは、株式会社が、保険者との間で締結する保険契約のうち役員等がその職務の執行に関し責任を負うことまたは当該責任の追及に係る請求を受けることによって生ずることのある損害を保険者が塡補することを約するものであって、役員等を被保険者とするもの（当該保険契約を締結することにより被保険者である役員等の職務の執行の適正性が著しく損なわれるおそれがないものとして法務省令で定めるものを除く）をいう。"},
  {id:"K-02-15-008",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (2) 役員等のために締結される保険契約",num:2,rank:"C",src:"",
   q:"自動車賠償責任保険は役員等賠償責任保険契約の対象に含まれる。",ans:"誤り",
   exp:"430条の３第１項かっこ書。罰金や過料、生産物賠償責任保険（ＰＬ保険）、企業総合賠償責任保険（ＣＧＬ保険）、自動車賠償責任保険、海外旅行保険等は、被保険者である役員等の職務の執行の適正性が著しく損なわれるおそれがないものとして、役員等賠償責任保険契約の対象から除外される。"},
  {id:"K-02-15-009",subject:"企業法",chapter:"第2章 機関",sub:"15. 補償契約・役員保険契約 (2) 役員等のために締結される保険契約",num:3,rank:"B",src:"",
   q:"指名委員会等設置会社において、取締役会は、役員等賠償責任保険契約の内容の決定を執行役に委任することができる。",ans:"誤り",
   exp:"416条４項15号。指名委員会等設置会社の取締役会は、その決議によって、役員等賠償責任保険契約の内容の決定を執行役に委任することができない。"},
  {id:"K-02-16-001",subject:"企業法",chapter:"第2章 機関",sub:"16. 株主の違法行為差止請求権",num:1,rank:"B",src:"令４Ⅱ問題４イ類・平21 問題14 エ類・平20 問題12 ア類",
   q:"公開会社である監査役設置会社において、６か月前から引き続き株式を有する株主は、取締役が法令または定款に違反するおそれがある場合において、当該行為によって当該株式会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し、当該行為をやめることを請求することができる。",ans:"誤り",
   exp:"360条。公開会社である監査役設置会社において、６か月前から引き続き株式を有する株主は、取締役が株式会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし、またはこれらの行為をするおそれがある場合において、当該行為によって当該株式会社に回復することができない損害が生ずるおそれがあるときは、当該取締役に対し、当該行為をやめることを請求することができる。監査役設置会社、監査等委員会設置会社または指名委員会等設置会社である場合は、著しい損害ではなく回復することができない損害が生ずるおそれがある必要がある。なお、当該違法行為差止請求権は単独株主権である。"},
  {id:"K-02-16-002",subject:"企業法",chapter:"第2章 機関",sub:"16. 株主の違法行為差止請求権",num:2,rank:"B",src:"平20 問題12 イ類",
   q:"公開会社である指名委員会等設置会社において、６か月前から引き続き株式を有する株主は、執行役が指名委員会等設置会社の定款に違反する行為をする場合において、当該行為によって当該指名委員会等設置会社に回復することができない損害が生じるおそれがある場合は、当該執行役に対し、当該行為をやめることを請求することができる。",ans:"正しい",
   exp:"422条１項。なお、非公開会社では、６か月の継続保有要件は課されない（422条２項）。"},
  {id:"K-03-01-001",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:1,rank:"A",src:"",
   q:"（平30Ⅰ問題５ア類・平29Ⅰ問題６ア類・平27Ⅰ問題５ア・平23Ⅰ問題４ウ類・平20 問題４イ類）株式会社が、株主に剰余金の配当を受ける権利または残余財産の分配を受ける権利のいずれかを与えない旨の定款の定めを置いた場合には、当該定めは無効である。",ans:"誤り",
   exp:"105条２項。株主に剰余金配当請求権および残余財産分配請求権の全部を与えない旨の定款の定めは、その効力を有しない。これは、株式会社の営利性に反するためである。したがって、剰余金配当請求権または残余財産分配請求権のいずれかの全部を与えない旨を定款に定めることは認められるので、本肢は誤りである。"},
  {id:"K-03-01-002",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:2,rank:"B",src:"",
   q:"株式が２以上の者の共有に属するとき、共有者は、当該株式について権利を行使する者１人を定め、株式会社に対し、その者の氏名または名称を通知しなければ、当該株式会社が当該権利を行使することに同意していたとしても、当該株式についての権利を行使することができない。",ans:"誤り",
   exp:"106条。株式が２以上の者の共有に属するとき、共有者は、当該株式について権利を行使する者１人を定め、株式会社に対し、その者の氏名または名称を通知しなければ、当該株式についての権利を行使することができない。ただし、当該規定は、会社の事務処理の便宜を図る趣旨であるので、株式会社が当該権利を行使することに同意した場合は、会社に対して通知をしていなくても、共有株式についての権利を行使することができる。"},
  {id:"K-03-01-003",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:3,rank:"B",src:"令７Ⅰ問題５ア類・令３問題５エ類・平30Ⅰ問題５イ",
   q:"最高裁判所の判例によれば、株式の共有者間において、当該株式についての権利を行使する者を定めるに当たっては、各共有者の持分の価格に従い、その過半数をもってこれを決定することができる。",ans:"正しい",
   exp:"最判平９年１月28日。最高裁判所の判例によれば、共有株式の権利行使者を定めるにあたっては、各共有株主の持分の価格に従って、その過半数で決定することができるとしている。なお、共有株式の権利行使者を選定し、会社に届け出たときは、当該権利行使者は他の共有者の意思に拘束されず、自己の判断で当該株式についての権利を行使することができる（最判昭53年４月14日）。"},
  {id:"K-03-01-004",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:4,rank:"B",src:"",
   q:"最高裁判所の判例によれば、権利行使者としての指定および通知を欠く共有株式の議決権行使は、各共有者の持分の価格に従って、その過半数で決定される。",ans:"正しい",
   exp:"最判平27年２月19日。なお、権利行使者としての指定および通知を欠く場合であっても、株式会社が権利行使に同意した場合は、共有者は、共有株式についての権利を行使することができるが（106条ただし書）、当該規定は、株式の共有者が、民法の共有に関する規定（民法252条本文）に従って権利行使の方法を決定していることが前提であるため、その前提を欠く場合は、たとえ株式会社が同意をしたとしても、権利行使の方法が適法となるものではないと考えられる。そして、共有株式の議決権行使は、特段の事情のない限り、株式の管理に関する行為として、民法の規定により、各共有者の持分の価格に従い、その過半数で決せられることになる。"},
  {id:"K-03-01-005",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:5,rank:"B",src:"",
   q:"最高裁判所の判例によれば、共同相続人が株主総会の決議の不存在の確認の訴えを提起する場合において、権利行使者としての指定を受けてその旨を通知していないときであっても、特段の事情がない限り、原告適格を有する。",ans:"誤り",
   exp:"最判平２年12月４日。最高裁判所の判例によれば、共同相続人が株主総会決議不存在確認の訴えを提起する場合も、権利行使者としての指定を受けてその旨を通知していないときは、特段の事情がない限り、原告適格を有しないとしている。"},
  {id:"K-03-01-006",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:6,rank:"B",src:"平22Ⅱ問題４ウ",
   q:"株主は、その権利のうち議決権のみを譲渡することができる。",ans:"誤り",
   exp:"このような規定はない。株主権は、包括的な権利であることから、株主権に含まれる権利（剰余金配当請求権や議決権等）の一部を切り離して譲渡することはできない。ただし、株主総会の決議により具体的に確定した配当金の支払請求権のように具体的な権利となったものは、株主の権利とは別個独立のものとして譲渡することができる。"},
  {id:"K-03-01-007",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:7,rank:"B",src:"平22Ⅱ問題４イ",
   q:"株主は、株主総会決議によって具体的に発生した剰余金配当請求権を、譲渡することができる。",ans:"正しい",
   exp:"株主総会決議によって確定した剰余金配当請求権は、総会決議時の株主を債権者として具体化された金銭債権であるので、株式とは別個独立に処分することができる。したがって、債権譲渡の方法で第三者に譲渡することができる。"},
  {id:"K-03-01-008",subject:"企業法",chapter:"第3章 株式",sub:"1. 総則",num:8,rank:"B",src:"令３問題５イ",
   q:"最高裁判所の判例によれば、株主総会の決議の取消しの訴えを提起した株主が、その係属中に死亡した場合は、相続により株式を取得した相続人は、その訴訟の原告たる地位を承継しない。",ans:"誤り",
   exp:"最判昭45年７月15日。最高裁判所の判例によれば、株主の提起した会社解散の訴え（833条）、株主総会の決議取消しの訴え（831条）、決議無効確認の訴え（830条２項）の係属中に、当該株主が死亡した場合には、相続により株式を取得した相続人がその訴訟の原告たる地位を承継するとしている。相続等の一般承継によって株式が移転された場合、株式の取得者は、従前の株主の法律上の地位を包括的に承継することになるためである。これに対して、株式が譲渡された場合には、譲渡人は原告としての地位を失うとともに、譲受人はその地位を承継するわけではない。"},
  {id:"K-03-02-001",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (1) 全部の株式の内容とすることができる事項",num:1,rank:"A",src:"",
   q:"株式会社は、その発行する全部の株式の内容として、譲渡制限株式を発行することができる。",ans:"正しい",
   exp:"107条１項１号。株式会社がその発行する全部の株式の内容として定めることができるのは、譲渡制限株式、取得請求権付株式または取得条項付株式である（107条１項各号参照）。また、これらの株式は種類株式として発行することもできる（108条１項４号～６号）。"},
  {id:"K-03-02-002",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (1) 全部の株式の内容とすることができる事項",num:2,rank:"A",src:"",
   q:"株式会社は、その発行する全部の株式の内容として、議決権制限株式を発行することができる。",ans:"誤り",
   exp:"107条１項各号参照。株式会社は、その発行する全部の株式の内容として、議決権制限株式を発行することはできない。"},
  {id:"K-03-02-003",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (2) 種類株式総論",num:1,rank:"A",src:"令８Ⅰ問題５ウ類",
   q:"定款において内容の異なる２種類の株式を発行する旨を定めている株式会社であっても、そのうちの１種類の株式のみを現に発行している場合は、当該株式会社は種類株式発行会社とならない。",ans:"誤り",
   exp:"２条13号。種類株式発行会社とは、剰余金の配当その他一定の事項について内容の異なる２以上の種類の株式を発行する株式会社をいう。つまり、実際に２種類以上の株式を発行していなくても、定款において108条１項各号に掲げる事項について２種類以上の異なる定めをした場合は種類株式発行会社となる。"},
  {id:"K-03-02-004",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (2) 種類株式総論",num:2,rank:"A",src:"",
   q:"株式会社は、一定の事項について内容の異なる２以上の種類の株式を発行する場合には、発行可能種類株式総数を定款で定めなければならない。",ans:"正しい",
   exp:"108条２項柱書。"},
  {id:"K-03-02-005",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (3) 譲渡制限株式",num:1,rank:"B",src:"平30Ⅰ問題９エ",
   q:"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は、特別決議によって行わなければならない。",ans:"誤り",
   exp:"107条２項１号、309条３項１号。発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は、309条３項の特殊決議によって行わなければならない。譲渡制限株式については、株式の譲渡、すなわち投下資本回収の機会が制限されることになり、株主に対して重大な影響を及ぼすことになるため、定款変更に必要な要件を厳格にしており、309条３項の特殊決議を求めている。"},
  {id:"K-03-02-006",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (3) 譲渡制限株式",num:2,rank:"B",src:"平24Ⅱ問題５イ",
   q:"公開会社でない株式会社は、株主総会の特別決議により、株式の内容として、譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを廃止することができる。",ans:"正しい",
   exp:"466条、309条２項11号。新たに譲渡制限を設ける定款変更と違い、株主にとっては投下資本回収の機会に関する制限が緩和されることとなるため、通常の定款変更と同様に株主総会の特別決議によって定款変更をすることができる。"},
  {id:"K-03-02-007",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (3) 譲渡制限株式",num:3,rank:"B",src:"令２Ⅱ問題５ア",
   q:"株式会社は、譲渡制限株式の内容として、一定の場合において当該株式会社が譲渡等承認請求に対して承認をしたものとみなす旨を定款に定めることができる。",ans:"正しい",
   exp:"107条２項１号ロ、108条２項４号参照。ここでいう一定の場合とは、例えば、特定の者への譲渡（株主間の譲渡や従業員への譲渡等）である。このような定めが認められるのは、取得者の属性（株主や従業員等）による区別は、会社の閉鎖性の基準を定款に明示したに過ぎず、譲渡制限を緩和するものであり、現在の株主を区別するものではなく株主平等原則に反しないからである。"},
  {id:"K-03-02-008",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (3) 譲渡制限株式",num:4,rank:"B",src:"",
   q:"発行する全部の株式を譲渡制限株式とする定款の変更をする場合、反対株主は、株式会社に対して、自己の有する株式を公正な価格で買い取ることを請求することができる。",ans:"正しい",
   exp:"107条１項１号、116条１項１号。反対株主の投下資本の回収を保障するためである。また、新株予約権者にも新株予約権買取請求権が認められる（118条１項１号）。なお、種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更をする場合も同様に、株式買取請求権および新株予約権買取請求権が認められる（116条１項２号、118条１項２号）。"},
  {id:"K-03-02-009",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (3) 譲渡制限株式",num:5,rank:"A",src:"平29Ⅰ問題６エ・平24Ⅱ問題５ウ",
   q:"種類株式発行会社である公開会社は、譲渡制限株式の数が発行済株式の総数の２分の１を超えるに至ったときは、直ちに、譲渡制限株式の数を発行済株式の総数の２分の１以下にするための必要な措置をとらなければならない。",ans:"誤り",
   exp:"115条。種類株式発行会社が公開会社である場合において、議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは、株式会社は、直ちに、議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。"},
  {id:"K-03-02-010",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (4) 取得請求権付株式",num:1,rank:"B",src:"",
   q:"取得請求権付株式とは、株式会社がその発行する全部または一部の株式の内容として当該株式会社が当該株式を有する株主に対して、当該株式を譲り渡すよう請求することができる旨の定めを設けている場合における当該株式をいう。",ans:"誤り",
   exp:"２条18号。取得請求権付株式とは、株式会社がその発行する全部または一部の株式の内容として、株主が当該株式会社に対して当該株式の取得を請求することができる旨の定めを設けている場合における当該株式をいう。"},
  {id:"K-03-02-011",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (4) 取得請求権付株式",num:2,rank:"C",src:"",
   q:"発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う株主総会は、特別決議によって行わなければならない。",ans:"正しい",
   exp:"466条、107条２項２号、309条２項11号。発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う株主総会は、株主に有利となるものであるので、原則通り特別決議で足りる。"},
  {id:"K-03-02-012",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (4) 取得請求権付株式",num:3,rank:"B",src:"",
   q:"発行する全部の株式を取得請求権付株式とする定款の変更をする場合、反対株主は、株式会社に対して、自己の有する株式を公正な価格で買い取ることを請求することができる。",ans:"誤り",
   exp:"116条１項参照。発行する全部の株式を取得請求権付株式とする旨の定款の定めを設ける定款の変更を行う場合、反対株主には株式買取請求権が認められていない。なぜなら、当該定款変更によって株主が望むときに投下資本の回収が可能となるので、反対株主の株式買取請求権を認めて投下資本回収手段を確保する必要がないからである。"},
  {id:"K-03-02-013",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (4) 取得請求権付株式",num:4,rank:"B",src:"平30Ⅱ問題５イ",
   q:"種類株式発行会社は、取得請求権付株式を発行する場合に、取得の対価を当該株式会社の他の種類の株式とすることができる。",ans:"正しい",
   exp:"108条２項５号ロ。対価を他の種類株式とすることによって、株主の請求により株式の種類を変更することができる。"},
  {id:"K-03-02-014",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (4) 取得請求権付株式",num:5,rank:"B",src:"",
   q:"株式会社は、その発行する全部の株式を取得請求権付株式とする場合、当該株式の取得の対価を当該株式会社の社債とすることを定款で定めることができる。",ans:"正しい",
   exp:"107条２項２号。取得請求権付株式の取得対価として交付される財産の内容は、特に限定はされていない（107条２項２号ロ～ホ）。つまり、取得の対価として、①社債・②新株予約権・③新株予約権付社債・④株式等以外の財産（金銭等）を交付することができる。ただし、種類株式発行会社でない株式会社の株式の内容はすべて同一であるため、対価として株式が交付されることはない。なお、取得請求権付株式の取得については財源規制が設けられている（166条１項ただし書）。"},
  {id:"K-03-02-015",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:1,rank:"B",src:"",
   q:"取得条項付株式とは、株式会社がその発行する全部または一部の株式の内容として、当該株式会社が一定の事由が生じたことを条件として当該株式を取得することができる旨の定めを設けている場合における当該株式をいう。",ans:"正しい",
   exp:"２条19号。"},
  {id:"K-03-02-016",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:2,rank:"B",src:"令７Ⅰ問題５イ類・平31Ⅱ問題10 ア",
   q:"定款を変更して、その発行する全部の株式の内容として株式会社が一定の事由が生じたことを条件としてこれを取得することができる旨の定款の定めを設けようとする場合の株主総会決議は、当該株主総会において議決権を行使することができる株主の半数以上であって、当該株主の議決権の３分の２以上に当たる多数をもって行なわなければならない。",ans:"誤り",
   exp:"110条。定款を変更して、その発行する全部の株式を取得条項付株式とする場合、一定の事由の発生により株式会社に株式が取得されることとなるため、定款変更に必要な要件をさらに厳格にし、株主全員の同意を求めている。"},
  {id:"K-03-02-017",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:3,rank:"C",src:"",
   q:"株式会社は、取得条項付株式の内容として、取得事由が生じた日にその一部を取得することとする旨を定款に定めることはできない。",ans:"誤り",
   exp:"107条２項３号ハ、108条２項６号イ。株式会社は、取得条項付株式の内容として、取得事由が生じた日にその一部を取得することとする旨を定款に定めることはできる。"},
  {id:"K-03-02-018",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:4,rank:"B",src:"",
   q:"株式会社は、その発行する全部の株式を取得条項付株式とする場合、当該株式の取得の対価を当該株式会社の社債とすることを定款で定めることができる。",ans:"正しい",
   exp:"107条２項３号ニ。取得条項付株式の取得対価として交付される財産の内容は、特に限定はされていない（107条２項３号ニ～ト）。つまり、取得の対価として、① 社債・② 新株予約権・③ 新株予約権付社債・④ 株式等以外の財産（金銭等）を交付することができる。ここで、対価として株式が交付されることがない理由は、発行する全部の株式の内容として取得条項付株式を発行している場合は、株式の内容がすべて同一であるためである。また、取得対価については、取得請求権付株式の場合も同様である（107条２項２号ロ～ホ）。"},
  {id:"K-03-02-019",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:5,rank:"B",src:"",
   q:"種類株式発行会社がある種類株式を取得条項付株式とする場合、当該株式の取得の対価を当該株式会社の他の種類株式とすることを定款で定めることはできない。",ans:"誤り",
   exp:"108条２項６号ロ。種類株式発行会社がある種類株式を取得条項付株式とする場合、取得の対価を当該株式会社の他の種類株式とすることを定款で定めることができる。これは、取得請求権付株式の場合も同様である（108条２項５号ロ）。また、取得条項付株式の取得については、他の種類の株式を対価とする場合を除き、財源規制が設けられている（170条５項）。"},
  {id:"K-03-02-020",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (5) 取得条項付株式",num:6,rank:"B",src:"平30Ⅰ問題５ウ",
   q:"株式会社が、定款の変更により、その発行する全部の株式の内容として、当該株式会社が一定の事由が生じたことを条件として当該株式を取得することができることを定める場合において、当該定款の変更に反対する株主は、株式買取請求権を行使することができる。",ans:"誤り",
   exp:"116条１項参照。発行する全部の株式を取得条項付株式とする旨の定款の定めを設ける定款の変更を行う場合、反対株主には株式買取請求権が認められていない。なぜなら、当該定款の変更については、株主全員の同意が必要となるため反対株主が存在しないからである。"},
  {id:"K-03-02-021",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (6) 剰余金の配当・残余財産の分配について内容の異なる株式",num:1,rank:"A",src:"平27Ⅰ問題５イ類・平23Ⅱ問題４ア",
   q:"株式会社は、剰余金の配当については普通株式よりも優先的に取り扱われるが、残余財産の分配については普通株式よりも劣後的に取り扱われる種類の株式を、発行することができる。",ans:"正しい",
   exp:"108条２項１号２号。剰余金の配当については劣後するが、残余財産の分配については優先するというような株式の発行も認められ、組み合わせは自由である。"},
  {id:"K-03-02-022",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (6) 剰余金の配当・残余財産の分配について内容の異なる株式",num:2,rank:"C",src:"",
   q:"株式会社は、剰余金の配当について他の種類株式よりも優先的な地位が与えられる株式を発行する場合は、当該株式を実際に発行していなくとも、定款で具体的な配当金額またはその決定方法を定めておかなければならない。",ans:"誤り",
   exp:"108条３項、会社法施行規則20条。株式会社が種類株式を発行する場合、種類株式の一定の事項については、定款にその内容の要綱を定めておけば、詳細な内容は、当該種類株式を初めて発行するときまでに、株主総会（取締役会設置会社にあっては株主総会または取締役会）の決議によって定めることを認めている。したがって、剰余金の配当について定款で具体的な配当金額またはその決定方法を定めず、その内容の要綱を定めるだけでもよい。これは、発行時の経済情勢に適した権利内容を機動的に定めることを可能にするためである。なお、定款で要綱のみを定めることのできる株式の種類は、すべての種類株式である。"},
  {id:"K-03-02-023",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (6) 剰余金の配当・残余財産の分配について内容の異なる株式",num:3,rank:"B",src:"平27Ⅰ問題５エ",
   q:"株式会社が剰余金の配当を受ける権利について内容の異なる株式を発行する旨の定款変更をする場合において、当該株式に関する事項についての定めを設ける旨の定款の変更に反対する株主は、株式買取請求権を行使することができる。",ans:"誤り",
   exp:"116条１項各号参照。この場合においては、株主に株式買取請求権は与えられていない。"},
  {id:"K-03-02-024",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (7) 議決権制限株式",num:1,rank:"B",src:"平27Ⅱ問題４エ",
   q:"株主総会において議決権を行使することができる事項に関する定款の定めは、種類株主総会における議決権の行使にも適用される。",ans:"誤り",
   exp:"108条１項３号参照。議決権制限株式を発行することによって制限することができるのは、株主総会において議決権を行使することができる事項であり、種類株主総会における議決権は制限されない。"},
  {id:"K-03-02-025",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (7) 議決権制限株式",num:2,rank:"B",src:"平20 問題４ア類",
   q:"種類株式発行会社は、株主総会において全く議決権を有しない完全無議決権株式のみならず、一定の事項についてのみ議決権を制限した一部議決権制限株式を発行することも認められる。",ans:"正しい",
   exp:"108条２項３号イ。"},
  {id:"K-03-02-026",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (7) 議決権制限株式",num:3,rank:"A",src:"平29Ⅰ問題６ウ類・平23Ⅱ問題４イ類",
   q:"公開会社でない種類株式発行会社において、議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは、当該種類株式発行会社は、直ちに、議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。",ans:"誤り",
   exp:"115条。種類株式発行会社が公開会社である場合において、議決権制限株式の数が発行済株式総数の２分の１を超えるに至ったときは、株式会社は、直ちに、議決権制限株式の数を発行済株式総数の２分の１以下にするための必要な措置をとらなければならない。議決権制限株式について発行限度が設けられているのは、少額の出資で株式会社を支配することは適当ではないからである。ただし、非公開会社においては、株式会社にとって好ましくない者が株主となることをそもそも阻止することができるため、株式の取得を認めたうえで議決権を制限することについても規制を加える必要性は乏しいことから、当該規制の対象は公開会社に限られている。"},
  {id:"K-03-02-027",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (8) 全部取得条項付種類株式",num:1,rank:"B",src:"",
   q:"株式会社は、全部取得条項付種類株式の内容として、株主総会の特別決議によって当該全部取得条項付種類株式の一部を取得することとする旨を定款に定めることができる。",ans:"誤り",
   exp:"108条１項７号参照。全部取得条項付種類株式とは、当該種類の株式について、当該株式会社が株主総会の決議（特別決議）によってその全部を取得する定めがある種類の株式である。"},
  {id:"K-03-02-028",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (8) 全部取得条項付種類株式",num:2,rank:"B",src:"",
   q:"株式会社は、全部取得条項付種類株式を取得するのと引換えに金銭等を交付しなければならない。",ans:"誤り",
   exp:"171条１項１号参照。全部取得条項付種類株式の取得の対価について特に制限はなく、無償による取得も可能である。なお、全部取得条項付種類株式の取得については、他の種類の株式を対価とする場合を除き、財源規制が設けられている（461条１項４号）。"},
  {id:"K-03-02-029",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (8) 全部取得条項付種類株式",num:3,rank:"B",src:"",
   q:"ある種類の株式を全部取得条項付種類株式とする定款の変更をする場合、当該種類の株式を有する反対株主は、株式会社に対して、自己の有する株式を公正な価格で買い取ることを請求することができる。",ans:"正しい",
   exp:"116条１項２号。反対株主の投下資本の回収を保障するためである。また、当該株式を目的とする新株予約権者にも新株予約権買取請求権が認められる（118条１項２号）。"},
  {id:"K-03-02-030",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (9) 拒否権付株式",num:1,rank:"B",src:"平20 問題４ウ",
   q:"取締役会で決議すべき事項のうち、取締役会の決議のほか、ある種類の株式の株主を構成員とする種類株主総会の決議があることを必要とする旨の定款の定めは無効である。",ans:"誤り",
   exp:"108条１項８号。株式会社は、拒否権付株式として、株主総会、取締役会または清算人会において決議すべき事項のうち、当該決議のほか、ある種類株主を構成員とする種類株主総会の決議が必要であることを内容とした株式を発行することができる。"},
  {id:"K-03-02-031",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (9) 拒否権付株式",num:2,rank:"B",src:"令６Ⅰ問題ア",
   q:"株式会社は、会計参与の選任につき株主総会決議のほか、ある種類の株式の種類株主を構成員とする種類株主総会の決議を必要とする旨を定款で定めることができない。",ans:"誤り",
   exp:"108条１項８号。拒否権付株式とは、株主総会、取締役会または清算人会において決議すべき事項のうち、当該決議のほか、当該種類の株式の種類株主を構成員とする種類株主総会の決議があることを必要と定められた株式をいう。そのため、拒否権付株式の内容として、会計参与の選任につき株主総会決議のほか、ある種類の株式の種類株主を構成員とする種類株主総会の決議を必要とする旨を定款で定めることは可能である。"},
  {id:"K-03-02-032",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (9) 拒否権付株式",num:3,rank:"B",src:"",
   q:"公開会社は、株主総会または取締役会において決議すべき事項のうち、当該決議のほか、ある種類株主を構成員とする種類株主総会の決議が必要であることを内容とした株式を発行することができない。",ans:"誤り",
   exp:"拒否権付株式を発行することができる株式会社に制限はない。"},
  {id:"K-03-02-033",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (10) 取締役等選任権付種類株式",num:1,rank:"A",src:"平31Ⅱ問題４ウ類・平30Ⅱ問題５エ類・平29Ⅰ問題６イ類・平23Ⅱ問題４エ類",
   q:"株式会社は、指名委員会等設置会社を除き、ある種類株主を構成員とする種類株主総会において取締役または監査役を選任することを内容とした株式を発行することができる。",ans:"誤り",
   exp:"108条１項柱書ただし書９号。指名委員会等設置会社および公開会社は、取締役等選任権付種類株式を発行することができない。したがって、指名委員会等設置会社でなくても公開会社は取締役等選任付種類株式を発行することができないので、本肢は誤りである。指名委員会等設置会社では、指名委員会が株主総会に提出する取締役の選任および解任に関する議案の内容の決定権限を有しているため、種類株主総会に取締役の選任および解任権限を与えてしまうと、矛盾が生じてしまうからである。また、取締役等選任権付種類株式は、議決権制限株式（108条１項３号）に比べて、誰が当該種類株式を取得するかが会社運営に大きな影響を及ぼすと考えられるため、誰が当該種類株主になるかという点について、会社の意思が反映される非公開会社に限ってその発行を認めるべきである。"},
  {id:"K-03-02-034",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (10) 取締役等選任権付種類株式",num:2,rank:"B",src:"令６Ⅰ問題イ類",
   q:"株式会社（指名委員会等設置会社および公開会社を除く）は、ある種類株主を構成員とする種類株主総会において会計参与を選任することを内容とした株式を発行することができる。",ans:"誤り",
   exp:"108条１項９号参照。種類株式として発行することができるのは、ある種類株主を構成員とする種類株主総会において取締役または監査役を選任することができる株式のみである。したがって、本肢のような種類株式を発行することはできない。"},
  {id:"K-03-02-035",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (10) 取締役等選任権付種類株式",num:3,rank:"C",src:"",
   q:"ある種類株主を構成員とする種類株主総会において取締役を選任することを内容とした株式についての定款の定めは、会社法または定款で定めた取締役の員数を欠いた場合において、そのために当該員数に足りる数の取締役を選任することができないときは、廃止されたものとみなす。",ans:"正しい",
   exp:"112条。当該規定は取締役等の欠員が永続することを回避するために設けられている。"},
  {id:"K-03-02-036",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (10) 取締役等選任権付種類株式",num:4,rank:"A",src:"",
   q:"指名委員会等設置会社において取締役等選任権付種類株式を発行している場合、指名委員会は、当該種類株式を有する種類株主と共同して、取締役の選任に関する議案の内容を決定しなければならない。",ans:"誤り",
   exp:"108条１項柱書ただし書９号。指名委員会等設置会社は、取締役等選任権付種類株式を発行することができない。なぜなら、指名委員会等設置会社においては、指名委員会が株主総会に提出する取締役の選任および解任に関する議案の内容の決定権限を有しているため、種類株主総会に取締役の選任および解任権限を与えてしまうと、矛盾が生じてしまうからである。"},
  {id:"K-03-02-037",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (11) 種類株式に係る定款変更手続",num:1,rank:"B",src:"",
   q:"種類株式発行会社が新しく株式の種類を追加する定款の変更をする場合において、ある種類の株式の種類株主に損害を及ぼすおそれがあるときは、当該種類の種類株主を構成員とする種類株主総会において議決権を行使することができる種類株主が存しない場合を除き、当該種類株主総会の決議がなければ、当該定款の変更は効力を生じない。",ans:"正しい",
   exp:"322条１項１号イ、324条２項４号。種類株式発行会社が新しく株式の種類を追加する定款の変更をする場合において、ある種類株主に損害を及ぼすおそれがあるときは、当該行為は、当該種類株主を構成員とする種類株主総会の決議がなければその効力を生じない。当該種類株主総会の決議は、特別決議である。"},
  {id:"K-03-02-038",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (11) 種類株式に係る定款変更手続",num:2,rank:"B",src:"令５Ⅰ問題10 ア",
   q:"種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更は、株主総会の特別決議のほかに、譲渡制限が設けられる当該種類の株式の種類株主により構成される種類株主総会の特別決議が必要である。",ans:"誤り",
   exp:"111条２項１号、324条３項１号。種類株式発行会社がある種類株式について譲渡制限を設ける定款の変更は、株主総会の特別決議のほかに、譲渡制限が設けられる当該種類の株式の種類株主により構成される種類株主総会の特殊決議が必要である。すなわち、譲渡制限が設けられると、株式の譲渡、すなわち投下資本回収の機会が制限されることになり、種類株主に対して重大な影響を及ぼすことになるため、種類株主総会の特殊決議を求めているのである。なお、取得請求権付種類株式・取得条項付種類株式の取得の対価としての株式を譲渡制限株式とする場合は、当該種類株主により構成される種類株主総会の特殊決議も必要となる（111条２項２号３号、324条３項１号）。"},
  {id:"K-03-02-039",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (11) 種類株式に係る定款変更手続",num:3,rank:"B",src:"令８Ⅰ問題５エ類・令５Ⅰ問題10 イ",
   q:"種類株式発行会社がある種類の株式の発行後に定款を変更して、当該種類の株式を取得条項付株式とする定款の定めを設けようとするときは、当該種類の株式を有する株主全員の同意を得なければならない。",ans:"正しい",
   exp:"111条１項。一定の事由の発生により株式会社に株式が取得されることとなるので、当該種類株式を有する種類株主を保護するために、当該種類株式を有する株主全員の同意を求めている。"},
  {id:"K-03-02-040",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (11) 種類株式に係る定款変更手続",num:4,rank:"A",src:"令５Ⅰ問題10 ウ・平30Ⅱ問題５ウ・平23Ⅱ問題４ウ",
   q:"種類株式発行会社が、ある種類の株式の発行後に、当該種類の株式を全部取得条項付種類株式にしようとするときは、当該種類の株式を有する株主全員の同意を得なければならない。",ans:"誤り",
   exp:"111条２項１号、324条２項１号。種類株式発行会社が、ある種類株式の発行後に、当該種類の株式を全部取得条項付種類株式にしようとする定款の定めを設ける場合には、当該定款の変更は、当該種類の株式を有する種類株主を構成員とする種類株主総会の特別決議がなければ、その効力を生じない。全部取得条項が設けられると、株主総会の特別決議で種類株式が会社に取得されてしまうことから、当該種類株主に対して重大な影響を及ぼすことになるため、普通決議よりも重い特別決議を課して、種類株主に慎重な判断を求めているのである。"},
  {id:"K-03-02-041",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:1,rank:"B",src:"平24Ⅱ問題５ア",
   q:"公開会社でない株式会社は、定款を変更して発行可能株式総数についての定めを廃止することができる。",ans:"誤り",
   exp:"113条１項。公開・非公開を問わず、株式会社は、定款を変更して発行可能株式総数についての定めを廃止することができない。"},
  {id:"K-03-02-042",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:2,rank:"B",src:"",
   q:"定款を変更して発行可能株式総数を減少するときは、変更後の発行可能株式総数は、当該定款の変更が効力を生じた時における発行済株式総数を下ることができない。",ans:"正しい",
   exp:"113条２項。"},
  {id:"K-03-02-043",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:3,rank:"B",src:"平31Ⅱ問題４エ",
   q:"公開会社でない株式会社が定款を変更して発行可能株式総数を増加させる場合は、当該定款の変更後の発行可能株式総数は、当該定款の変更が効力を生じたときにおける発行済株式総数の４倍を超えることができない。",ans:"誤り",
   exp:"113条３項１号。公開会社において、定款を変更して発行可能株式総数を増加する場合は、変更後の発行可能株式総数は、当該定款の変更が効力を生じたときにおける発行済株式総数の４倍を超えることができない（113条３項本文）。公開会社においては、授権資本制度が採用されているため、授権限度を法定することにより取締役会の権限濫用の危険性を回避しているのである。また、授権限度を定めることにより、既存株主が受ける持株比率の低下の限界を既存株主に示すこともできるのである。"},
  {id:"K-03-02-044",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:4,rank:"B",src:"",
   q:"公開会社でない株式会社が定款を変更して公開会社となる場合には、当該定款の変更後の発行可能株式総数は、当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができる。",ans:"誤り",
   exp:"113条３項２号。非公開会社が定款を変更して公開会社となる場合には、当該定款の変更後の発行可能株式総数は、当該定款の変更が効力を生じた時における発行済株式総数の４倍を超えることができない。発行済株式総数の４倍を超える発行可能株式総数を定款に定めている非公開会社が、公開会社となる場合にその発行可能株式総数を維持できてしまうと、発行可能株式総数に係る規律（37条３項本文、113条３項１号）を設けた趣旨が達せられなくなるためである。"},
  {id:"K-03-02-045",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:5,rank:"A",src:"平25Ⅰ問題４ウ",
   q:"新株予約権の行使期間の初日が到来している場合には、新株予約権者が新株予約権を行使することにより取得することとなる株式の数は、発行可能株式総数から、自己株式を含む発行済株式の総数を控除して得た数を超えてはならない。",ans:"誤り",
   exp:"113条４項。新株予約権（権利行使期間の初日が到来していないものを除く）の新株予約権者が権利行使することにより取得することとなる株式の数は、発行可能株式総数から発行済株式（自己株式を除く）の総数を控除して得た数を超えてはならない。つまり、権利行使期間の初日が到来している新株予約権の新株予約権者が権利を行使することにより取得することとなる株式の数を、未発行または自己株式という形で留保することが求められているのである。"},
  {id:"K-03-02-046",subject:"企業法",chapter:"第3章 株式",sub:"2. 株式の内容 (12) 発行可能株式総数と発行可能種類株式総数",num:6,rank:"A",src:"令３問題４ア類・平30Ⅱ問題５ア・平25Ⅰ問題４イ",
   q:"種類株式発行会社においては、発行可能種類株式総数の合計数は、発行可能株式総数と一致しなければならない。",ans:"誤り",
   exp:"発行可能株式総数と発行可能種類株式総数の関係については、特に規律が設けられていないので、発行可能種類株式総数の合計額が発行可能株式総数を超えることも、逆に下回ることも差し支えない。"},
  {id:"K-03-03-001",subject:"企業法",chapter:"第3章 株式",sub:"3. 株主平等原則",num:1,rank:"A",src:"",
   q:"株式会社が内容の異なる種類株式を発行している場合、株式会社は、それぞれの種類株主について、その内容に応じ異なる取扱いをすることができる。",ans:"正しい",
   exp:"109条１項参照。株式会社は、株主を、その有する株式の内容および数に応じて、平等に取り扱わなければならない。これを株主平等原則という。すなわち、株式会社が内容の異なる種類株式を発行している場合、株式会社は、それぞれの種類株主について、その内容に応じ異なる取扱いをすることが許容される。"},
  {id:"K-03-03-002",subject:"企業法",chapter:"第3章 株式",sub:"3. 株主平等原則",num:2,rank:"A",src:"",
   q:"（令６Ⅰ問題５ウ類・平31Ⅱ問題４イ類・平27Ⅰ問題５ウ類・平22Ⅱ問題４ア類・平22Ⅰ問題９エ類）公開会社は、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権に関する事項について、株主ごとに異なる取扱いを行う旨を定款で定めることができる。",ans:"誤り",
   exp:"109条２項。非公開会社は、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権に関する事項について、株主ごとに異なる取扱いを行う旨を定款で定めることができる。非公開会社は、株主の変動が頻繁に生じないため、株主間の関係が緊密になり、株主に個性が認められる。そのため、株主に着目してそれぞれ異なる取扱いを認めても問題はないためである。"},
  {id:"K-03-03-003",subject:"企業法",chapter:"第3章 株式",sub:"3. 株主平等原則",num:3,rank:"A",src:"令４Ⅱ問題４ウ類・平24Ⅱ問題16 イ",
   q:"公開会社でない株式会社が、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権に関する事項について、株主ごとに異なる取扱いを行う旨を定款で定める定款変更の株主総会の決議は、当該株主総会において議決権を行使することができる株主の半数以上であって、当該株主の議決権の３分の２以上に当たる多数をもって行う。",ans:"誤り",
   exp:"109条２項、309条４項。非公開会社が、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権について、株主ごとに異なる取扱いを行う旨を定款で定めるための定款変更の株主総会の決議は、総株主の半数以上（定款で加重可）であって、総株主の議決権の４分の３（定款で加重可）以上に当たる多数をもって行わなければならない。当該定款変更は、株主の基本的な権利について株主ごとに異なる取扱いをする旨の定款の定めを新設するものであり、株主平等原則の例外であることから、株主にとって大変重大な影響を及ぼす。そのため、309条３項の特殊決議よりもさらに厳重な要件が課せられている。"},
  {id:"K-03-03-004",subject:"企業法",chapter:"第3章 株式",sub:"3. 株主平等原則",num:4,rank:"A",src:"",
   q:"公開会社でない株式会社が、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権に関する事項について、株主ごとに異なる取扱いを行う旨を廃止する定款変更をする場合は、株主総会の特別決議により行うことができる。",ans:"正しい",
   exp:"309条４項かっこ書、466条、309条２項11号。"},
  {id:"K-03-03-005",subject:"企業法",chapter:"第3章 株式",sub:"3. 株主平等原則",num:5,rank:"C",src:"",
   q:"最高裁判所の判例によれば、株式会社が特定の株主に対して無配による損失填補のため金銭を贈与する契約を締結した場合であっても、株主平等原則に反することなく、当該契約は有効である。",ans:"誤り",
   exp:"最判昭45年11月24日。確かに、贈与であるので形式的には、株主の有する株主権の内容に基づく法律関係ではないが、無配による損失填補の趣旨で行った贈与なので、実質的には剰余金配当となり、株主権の内容に基づく法律関係にあたるといえる。そのため、株主平等原則に反し当該契約は無効である。"},
  {id:"K-03-04-001",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (1) 株式譲渡の方法と対抗要件（株式等振替制度を除く）",num:1,rank:"A",src:"平28Ⅱ問題６ア類・平20 問題３イ",
   q:"株券発行会社の株式の譲渡は、自己株式の処分による株式の譲渡を除き、当該株式に係る株券を交付しなければ、その効力を生じない。",ans:"正しい",
   exp:"128条１項。株券発行会社における株式の譲渡は、株券の交付を効力発生要件とするのが原則である。ただし、自己株式の処分による株式の譲渡についてはこの限りでない。"},
  {id:"K-03-04-002",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (1) 株式譲渡の方法と対抗要件（株式等振替制度を除く）",num:2,rank:"A",src:"令２Ⅰ問題４イ・平28Ⅰ問題５ア",
   q:"株券発行会社が自己株式の処分による株式の譲渡をする場合、当該株式に係る株券の交付がなくても、当該譲渡の効力が生じる。",ans:"正しい",
   exp:"128条１項ただし書。自己株式の処分の法的性質は株式の譲渡であるため、株券発行会社においては株券の交付がなければ、株式譲渡の効力が生じないはずである。しかし、会社法は、自己株式の処分を新株発行と合わせて「募集株式の発行等」として規制し（199条以下）、自己株式の処分の効力は、払込期日を定めた場合は払込期日に、払込期間を定めた場合は出資の履行をした日に発生することとしている（209条）。したがって、自己株式の処分、すなわち、株式の譲渡の効力はこの日に生じることになるので、128条１項ただし書は、自己株式の処分について、株券交付を効力要件にしない旨を定めている。"},
  {id:"K-03-04-003",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (1) 株式譲渡の方法と対抗要件（株式等振替制度を除く）",num:3,rank:"A",src:"平30Ⅱ問題６ウ・平28Ⅱ問題６イ",
   q:"株券発行会社であるか否かを問わず、株式会社の株式の譲渡を当該株式会社を除く第三者に対抗するためには、株主名簿の名義書換が必要である。",ans:"誤り",
   exp:"130条２項。株券発行会社でない株式会社においては、株主名簿の名義書換が第三者に対する対抗要件である（130条１項）。これに対して、株券発行会社における第三者に対する対抗要件は、株券の占有である。"},
  {id:"K-03-04-004",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (1) 株式譲渡の方法と対抗要件（株式等振替制度を除く）",num:4,rank:"A",src:"平28Ⅱ問題６ウ",
   q:"株券発行会社であるか否かを問わず、株式会社の株式の譲渡を当該株式会社に対抗するためには、株主名簿の名義書換が必要である。",ans:"正しい",
   exp:"130条。名義書換の確定的効力である。名義書換の確定的効力が認められるのは、株主名簿制度の趣旨のうち、会社の事務処理の便宜を図るためである。すなわち、株式会社は多数の流動的な株主の反復的かつ継続的な権利行使に対応しなければならないため、株主名簿の記載を基準として会社と株主との関係を決定することにより、会社の事務処理が煩雑になるのを防いでいるのである。"},
  {id:"K-03-04-005",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (2) 法律による譲渡制限",num:1,rank:"A",src:"平20 問題３ア類",
   q:"出資の履行をすることにより募集株式の株主となる権利の譲渡は、その効力を生じない。",ans:"誤り",
   exp:"208条４項。出資の履行をすることにより募集株式の株主となる権利の譲渡は、株式会社に対抗することができない。会社設立時における権利株の譲渡も同様である（35条、50条２項、63条２項）。"},
  {id:"K-03-04-006",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (2) 法律による譲渡制限",num:2,rank:"A",src:"",
   q:"株券発行前にした株式の譲渡は、株券発行会社に対し、その効力を生じない。",ans:"正しい",
   exp:"128条２項。株券発行事務の渋滞を防止し、株券発行が円滑かつ正確に行われるようにするために、株券発行前の株式の譲渡は制限されている。"},
  {id:"K-03-04-007",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (2) 法律による譲渡制限",num:3,rank:"B",src:"",
   q:"最高裁判所の判例によれば、会社が株券の発行を不当に遅滞した場合であっても、株券発行前の株式の譲渡の効力を否定し、譲渡人を株主として扱わなければならないとしている。",ans:"誤り",
   exp:"最判昭47年11月８日。判例は、会社が株券の発行を不当に遅滞し、信義則に照らしても株式譲渡の効力を否定することを相当としない状況においては、株主は、意思表示のみによって有効に株式を譲渡でき、会社はもはや、株券発行前であることを理由としてその効力を否定することができず、譲受人を株主として扱わなければならないとしている。"},
  {id:"K-03-04-008",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:1,rank:"B",src:"",
   q:"株式会社が譲渡制限株式を発行する場合は、その旨を登記しなければならない。",ans:"正しい",
   exp:"911条３項７号。発行する株式の内容は登記事項である。"},
  {id:"K-03-04-009",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:2,rank:"B",src:"",
   q:"株券発行会社が譲渡制限株式を発行する場合、当該株式を表章する株券に当該株式が譲渡制限株式である旨を記載する必要はない。",ans:"誤り",
   exp:"216条３号。株券発行会社が譲渡制限株式を発行する場合、当該株式を表章する株券に当該株式が譲渡制限株式である旨を記載しなければならない。"},
  {id:"K-03-04-010",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:3,rank:"B",src:"令４Ⅱ問題４エ",
   q:"譲渡制限株式の株主は、その有する譲渡制限株式を他人（当該譲渡制限株式を発行した株式会社を除く）に譲り渡そうとするときは、当該株式会社に対し、当該他人が当該譲渡制限株式を取得することについて承認するか否かの決定をすることを請求することができる。",ans:"正しい",
   exp:"136条。"},
  {id:"K-03-04-011",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:4,rank:"B",src:"平29Ⅱ問題５イ",
   q:"譲渡制限株式を取得した株式取得者は、当該譲渡制限株式を発行した株式会社に対し、当該譲渡制限株式を取得したことについて承認するか否かの決定を請求することができない。",ans:"誤り",
   exp:"137条１項。譲渡制限株式を取得した株式取得者は、当該譲渡制限株式を発行した株式会社に対し、当該譲渡制限株式を取得したことについて承認するか否かの決定を請求することができる。"},
  {id:"K-03-04-012",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:5,rank:"B",src:"",
   q:"株券発行会社における譲渡制限株式の譲渡について、株式取得者は、当該譲渡制限株式に係る株券を提示することで、会社に対し、当該譲渡制限株式を取得したことについて承認するか否かの決定の請求を単独で行うことができる。",ans:"正しい",
   exp:"137条２項、会社法施行規則24条２項１号。譲渡制限株式を取得した株式取得者による譲渡等承認請求は、利害関係人の利益を害するおそれがないものとして法務省令で定める場合を除き、その取得した株式の株主として株主名簿に記載され、もしくは記録された者（譲渡人）またはその相続人その他一般承継人と共同してしなければならない。無権利者による請求を防止する趣旨である。ここで、利害関係人の利益を害するおそれがないものとして法務省令で定める場合とは、名義書換請求の規定（133条２項、会社法施行規則22条）とほぼ同じである。株券発行会社において、株券の占有者は、当該株券に係る株式についての権利を適法に有するものと推定される（131条１項）。したがって、株式取得者が株券を提示した場合は、利害関係人の利益を害するおそれがない場合とされ、単独で譲渡等承認請求をすることができる。"},
  {id:"K-03-04-013",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:6,rank:"B",src:"",
   q:"譲渡制限株式の株主が譲渡等承認請求をする場合には、当該譲渡制限株式を譲り受ける者の氏名または名称を明らかにしてしなければならない。",ans:"正しい",
   exp:"138条１号ロ。"},
  {id:"K-03-04-014",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:7,rank:"B",src:"",
   q:"譲渡制限株式を取得した株式取得者が譲渡等承認請求をする場合、株式会社がその承認をしない旨の決定をするのであれば、当該株式会社または指定買取人が当該譲渡制限株式を買い取ることを同時に請求しなければならない。",ans:"誤り",
   exp:"138条２号ハ。株式会社または指定買取人による譲渡制限株式の買取請求は、任意である。これは、譲渡制限株式の株主による譲渡等承認請求の場合も同様である（138条１号ハ）。"},
  {id:"K-03-04-015",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:8,rank:"B",src:"平23Ⅰ問題５ア",
   q:"株券発行会社の譲渡制限株式を当該株式を発行した株式会社以外の者から取得した者は、当該株式会社に対し、株券を提示しても、当該譲渡制限株式を取得したことについて承認をするか否かの決定をすることを請求することができない。",ans:"誤り",
   exp:"137条２項、会社法施行規則24条２項１号。株式取得者からの承認請求は、原則として名義人またはその相続人その他の一般承継人と共同してしなければならないが、株券発行会社にあっては株券を提示して承認請求することができる。"},
  {id:"K-03-04-016",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:9,rank:"A",src:"平24Ⅱ問題５エ類",
   q:"取締役会設置会社において譲渡制限株式の譲渡等承認請求を承認するか否かの決定をするには、定款に別段の定めがある場合を除き、取締役会の決議によらなければならない。",ans:"正しい",
   exp:"139条１項本文かっこ書。"},
  {id:"K-03-04-017",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:10,rank:"A",src:"平23Ⅰ問題５ウ",
   q:"取締役会設置会社以外の株式会社において譲渡制限株式の譲渡等承認請求を承認するか否かの決定をするには、定款に別段の定めがある場合を除き、株主総会の特別決議によらなければならない。",ans:"誤り",
   exp:"139条１項本文、309条２項各号参照。取締役会設置会社以外の株式会社において譲渡等承認請求を承認するか否かの決定をするには、原則として株主総会の決議によらなければならないが、当該決議は普通決議で足りる。"},
  {id:"K-03-04-018",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:11,rank:"B",src:"",
   q:"取締役会設置会社において、譲渡制限株式の譲渡等承認請求を承認するか否かの決定を株主総会の決議により行う旨の定款の定めは、その効力を生じない。",ans:"誤り",
   exp:"139条１項ただし書。取締役会設置会社か否かに関係なく、譲渡等承認請求を承認するか否かの承認機関は、定款で別段の定めを設けることが認められている。例えば、取締役会設置会社において承認機関を株主総会と定めることや、譲渡制限種類株式に関する承認機関を当該種類株主総会と定めること等が考えられる。"},
  {id:"K-03-04-019",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:12,rank:"B",src:"",
   q:"株式会社は、譲渡制限株式の譲渡等承認請求に対して承認するか否かの決定をしたときは、譲渡等承認請求者に対して、当該決定の内容を通知しなければならない。",ans:"正しい",
   exp:"139条２項。当該通知が譲渡等承認請求の日から２週間以内になされなかった場合には、株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き、譲渡等の承認をする旨の決定をしたものとみなす（145条１号）。"},
  {id:"K-03-04-020",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:13,rank:"B",src:"平29Ⅱ問題５ウ・平26Ⅰ問題５エ類",
   q:"譲渡制限株式を譲り渡そうとする株主が譲渡承認の請求をした場合において、当該請求の日から２週間（これを下回る期間を定款で定めた場合はその期間）以内に株式会社が承認するか否かの決定の内容を通知しないときは、当該株式会社は、当該株主との合意による別段の定めをした場合を除き、承認をする旨の決定をしたものとみなされる。",ans:"正しい",
   exp:"145条１号。① 株式会社が、承認するか否かの通知の日から40日以内に、買取りの通知をしなかった場合（承認するか否かの通知の日から10日以内に指定買取人が買取りの通知をした場合を除く）（145条２号）、② 買取りの通知の期間内（会社は40日以内、指定買取人は10日以内）に、供託を証明する書面を譲渡等承認請求者に対して交付しなかった場合等（145条３号、会社法施行規則26条１号２号）も同様である。ここで、指定買取人による買取りの通知に係る期間（10日以内）よりも、会社による買取りの通知に係る期間（40日以内）の方が長い理由であるが、取締役会設置会社においては、指定買取人の指定は取締役会の決議で行うが（140条５項）、会社が買い取る場合は、株主総会の特別決議が必要となる（140条２項、309条２項１号）。したがって、株主総会を招集しなければならないという点で、会社による買取りの通知に係る期間の方が長くなっているのである。"},
  {id:"K-03-04-021",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:14,rank:"B",src:"平27Ⅰ問題４ア類・平26Ⅰ問題５ア類",
   q:"譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合、当該買取りに関する事項の決定は、株主総会の普通決議によらなければならない。",ans:"誤り",
   exp:"140条１項２項、309条２項１号。譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合、当該買取りに関する事項の決定は、特定の者からの自己株式の取得となるので、株主総会の特別決議によらなければならない。"},
  {id:"K-03-04-022",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:15,rank:"B",src:"",
   q:"譲渡等承認請求者からの買取請求に応じて株式会社が当該譲渡等承認請求に係る譲渡制限株式を買い取る場合、当該譲渡承認請求者以外の株主の全部が当該買取りに関する事項の決定をする株主総会において議決権を行使することができない場合を除き、当該譲渡等承認請求者は当該株主総会において議決権を行使することができない。",ans:"正しい",
   exp:"140条１項２項３項。決議の公正を図るため、原則として、譲渡等承認請求者は当該買取りに関する事項の決定をする株主総会において議決権を行使することができない。ただし、当該譲渡承認請求者以外の株主の全部が当該株主総会において議決権を行使することができない場合は、この限りではない。"},
  {id:"K-03-04-023",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:16,rank:"B",src:"",
   q:"譲渡等承認請求者からの買取請求があった場合において、株式会社は、当該譲渡等承認請求に係る譲渡制限株式の全部または一部を買い取る者を指定することができる。",ans:"正しい",
   exp:"140条４項。この場合、対象株式の一部を指定買取人が買取り、その残りを株式会社が買い取ることも認められる。"},
  {id:"K-03-04-024",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:17,rank:"B",src:"平26Ⅰ問題５イ",
   q:"取締役会設置会社における指定買取人の指定は、定款に別段の定めがある場合を除き、株主総会の特別決議によらなければならない。",ans:"誤り",
   exp:"140条５項。取締役会設置会社における指定買取人の指定は、原則として、取締役会の決議によらなければならない。また、取締役会非設置会社においては、株主総会の特別決議が必要となる（309条２項１号）。ただし、取締役会設置会社か否かに関係なく、定款で別段の定めを設けることが認められる。"},
  {id:"K-03-04-025",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:18,rank:"C",src:"",
   q:"株式会社は、譲渡等承認請求者からの買取請求に応じて譲渡制限株式を買い取る決定をした場合には、譲渡等承認請求者に対し、決定事項を通知しなければならない。",ans:"正しい",
   exp:"141条１項。なお、株式会社が、譲渡等承認請求を承認するか否かの通知の日から40日以内（定款で短縮可）に、当該通知をしなかった場合（譲渡等承認請求を承認するか否かの通知の日から10日以内に指定買取人が買取りの通知をした場合を除く）は、株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き、譲渡等の承認をする旨の決定をしたものとみなす（145条２号）。"},
  {id:"K-03-04-026",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:19,rank:"C",src:"",
   q:"株式会社が指定買取人を指定した場合、当該株式会社は、譲渡等承認請求者に対して、指定買取人を指定した旨を通知しなければならない。",ans:"誤り",
   exp:"142条１項。指定買取人は、指定を受けたときは、指定買取人として指定を受けた旨等を、譲渡等承認請求者に対して通知しなければならない。なお、指定買取人が、譲渡等承認請求を承認するか否かの通知の日から10日以内（定款で短縮可）に買取りの通知をしなかった場合は、株式会社と譲渡等承認請求者との合意により別段の定めがある場合を除き、譲渡等の承認をする旨の決定をしたものとみなす（145条２号）。"},
  {id:"K-03-04-027",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:20,rank:"A",src:"令２Ⅱ問題５エ・平26Ⅰ問題５ウ類",
   q:"譲渡等承認請求をした者は、当該請求に係る譲渡制限株式を指定買取人が買い取る旨の通知を受けた後は、当該株式の売買価格が決定されていない場合に限り、当該請求を撤回することができる。",ans:"誤り",
   exp:"143条。譲渡等承認請求者は、会社または指定買取人による通知を受けた後は、会社または指定買取人の承諾を得なければ、買取請求を撤回することができない。すなわち、通知を受けるまでは、買取請求の撤回は自由にすることができるが、会社または指定買取人が買取りに向けて整えている準備を無駄にしないよう、通知を受けた後は、会社または指定買取人の承諾を得なければ買取請求の撤回をすることができないのである。"},
  {id:"K-03-04-028",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:21,rank:"C",src:"",
   q:"株式会社が買取請求に応じて譲渡制限株式を買い取る場合の売買価格は、株式会社と譲渡等承認請求者との協議によって定めるが、協議が調わない場合は、株式会社または譲渡等承認請求者は、株式会社から買取りの通知があった日から20日以内に、裁判所に対し、売買価格の決定の申立てをしなければならない。",ans:"誤り",
   exp:"144条１項２項。売買価格は、株式会社と譲渡等承認請求者との協議によって定めるが、協議が調わない場合は、株式会社または譲渡等承認請求者は、株式会社から買取りの通知があった日から20日以内に、裁判所に対し、売買価格の決定の申立てをすることができる。そして、裁判所に対する売買価格の決定の申立てがない場合は、１株当たり純資産額に対象株式の数を乗じて得た額をもって売買価格とする（144条５項）。なお、当該規定は、指定買取人による買取りにも準用される（144条７項）。"},
  {id:"K-03-04-029",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:22,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式会社の承認を欠く譲渡制限株式の譲渡は、株式会社に対する関係においても、譲渡当事者間においても無効である。",ans:"誤り",
   exp:"最判昭48年６月15日。判例によれば、株式会社の承認を欠く譲渡制限株式の譲渡は、株式会社に対する関係では無効であるが、譲渡当事者間では有効である。"},
  {id:"K-03-04-030",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:23,rank:"C",src:"",
   q:"最高裁判所の判例によれば、取締役会設置会社において、一人会社の株主がその有する譲渡制限株式を他に譲渡した場合は、取締役会の決議がなくても、当該譲渡は会社との関係では有効であるとしている。",ans:"正しい",
   exp:"最判平５年３月30日。譲渡制限株式を発行する趣旨は、会社にとって好ましくない者が株主になり、会社の経営に参加されることを防ぎ、譲渡株主以外の株主の利益を保護することにある。したがって、一人株主がその保有する株式を譲渡する場合は、当該趣旨に反することはない。また、一人会社においては、株主総会の特別決議により定款変更をして（466条、309条２項11号）、公開会社になることも一人株主の意向により可能であることも根拠とされる。"},
  {id:"K-03-04-031",subject:"企業法",chapter:"第3章 株式",sub:"4. 株式譲渡 (3) 定款による譲渡制限",num:24,rank:"B",src:"令２Ⅱ問題５イ",
   q:"最高裁判所の判例の趣旨によれば、公開会社でない株式会社において、当該株式会社の承認を得ずになされた株式の譲渡は、当該譲渡の当事者間においては有効であるが、当該株式会社に対する関係では効力を生じないから、当該株式会社は当該株式の譲渡人を株主として扱う義務がある。",ans:"正しい",
   exp:"最判昭63年３月15日。判例によれば、株式会社に対する関係では譲渡は無効であることを前提として、当該株式会社は譲渡人を株主として取扱う義務があるため、譲渡人は当該株式会社に対してなお株主としての地位を有し、権利行使することができる。したがって、株式会社側から譲受人を株主と認めて権利行使させることはできない。"},
  {id:"K-03-05-001",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:1,rank:"B",src:"",
   q:"株式会社が株主との合意により自己株式を有償で取得する場合には、原則として、あらかじめ、株主総会の決議によって、取得する株式の数、株式を取得するのと引換えに交付する金銭等の内容およびその総額、株式を取得することができる期間を定めなければならない。",ans:"正しい",
   exp:"156条１項。株主総会における授権決議である。授権決議は、定時株主総会に限られず、臨時株主総会であってもよい。"},
  {id:"K-03-05-002",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:2,rank:"B",src:"",
   q:"株式会社が株主との合意により自己株式を有償で取得する場合には、原則として、あらかじめ、株主総会の決議によって、株式を取得することができる期間を定めなければならないが、当該期間は１年間を超えることができない。",ans:"正しい",
   exp:"156条１項柱書ただし書、３号。"},
  {id:"K-03-05-003",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:3,rank:"B",src:"平27Ⅰ問題４イ類",
   q:"株式会社が株主との合意により自己の株式を無償で取得する場合、株主総会の決議が必要である。",ans:"誤り",
   exp:"自己株式を無償で取得することは認められている（155条13号、会社法施行規則27条１号）。しかし、156条～ 165条は、株主との合意による自己株式の有償取得を対象としていることから、無償で取得する場合、株主総会の決議は不要である。"},
  {id:"K-03-05-004",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:4,rank:"B",src:"",
   q:"株式会社は、市場取引により自己株式を取得することができない。",ans:"誤り",
   exp:"165条１項。株式会社が株主との合意によって自己株式を有償で取得する場合には、① 株主全員に申込みの機会を与える場合（いわゆる「ミニ公開買付け」）（156条～159条）、② 特定の株主から取得する場合（160条～164条）、③ 市場取引または金融商品取引法による公開買付けにより取得する場合（165条）がある。"},
  {id:"K-03-05-005",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:5,rank:"A",src:"平23Ⅱ問題５ア",
   q:"株式会社が特定の株主から自己株式を有償で取得する場合、取得する株式が市場価格のある株式であるときは、自己株式の取得に関する事項の決定を、株主総会の普通決議で行うことができる。",ans:"誤り",
   exp:"156条１項、160条１項、309条２項２号。株式会社が特定の株主から自己株式を有償で取得する場合、他の株主にも平等に投下資本の回収機会を与えるという趣旨で、株主総会の授権決議は特別決議が要求されている。"},
  {id:"K-03-05-006",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:6,rank:"B",src:"",
   q:"株式会社は、特定の株主から自己株式を有償で取得することを決定する株主総会の決議に先立ち、株主に対して、当該特定の株主に自己を加えたものを当該決議の議案とすることができる旨を通知することができる。",ans:"誤り",
   exp:"160条２項３項。株式会社は、特定の株主から自己株式を取得する株主総会の決議に先立ち、株主に対して、当該特定の株主に自己を加えたものを当該決議の議案とすることができる旨を通知しなければならない。他の株主にも平等に投下資本の回収機会を与える趣旨である。"},
  {id:"K-03-05-007",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:7,rank:"B",src:"",
   q:"株式会社が特定の株主から自己株式を有償で取得することを決定する株主総会において、当該特定の株主は、いかなる場合であっても、議決権を行使することができない。",ans:"誤り",
   exp:"160条４項ただし書。株式会社が特定の株主から自己株式を取得する場合において、自己株式の売主である株主は、決議の公平性を維持するという観点から、当該決議において議決権を行使することができない。ただし、当該特定の株主以外の株主の全部が当該株主総会において議決権を行使することができない場合は、この限りではない。"},
  {id:"K-03-05-008",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:8,rank:"C",src:"令５Ⅰ問題５ア類",
   q:"株式会社が特定の株主から有償で取得する自己株式が市場価格のある株式であり、当該株式会社が株主に支払う対価が市場価格を超えない場合は、他の株主に売主追加請求権を認める必要はない。",ans:"正しい",
   exp:"161条。市場価格のある株式については、他の株主は市場で売却する機会を有しているため、投下資本の回収を行いたければ市場で売却すればよく、また、市場価格以下での取得は他の株主を害するおそれがないため、他の株主に売主追加請求権は認められない。"},
  {id:"K-03-05-009",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:9,rank:"C",src:"",
   q:"公開会社でない株式会社が株主の相続人その他の一般承継人（株主総会または種類株主総会において相続その他一般承継により取得した株式について議決権を行使していないものとする。）からその相続その他一般承継により取得した当該株式会社の株式を取得する場合には、他の株主に売主追加請求権を認める必要はない。",ans:"正しい",
   exp:"162条。非公開会社が株主の相続人その他の一般承継人からその相続その他の一般承継により取得した当該株式会社の株式を取得する場合には、他の株主に売主追加請求権を認める必要はない。なぜなら、非公開会社のような閉鎖的な会社においては、会社経営に関心がない相続人から株式を取得しなければならないという場面が考えられるが、その場合において、他の株主に売主追加請求権を認めなければならないのでは、株式会社が必要以上に資金を拠出しなければならないことになり、また、財源規制（461条１項２号）により、当該相続人から株式を取得することができなくなる可能性があるからである。ただし、相続人その他の一般承継人が株主総会または種類株主総会において当該株式について議決権を行使した場合は、株式会社が株主の相続人その他の一般承継人からその相続その他一般承継により取得した当該株式会社の株式を取得する場合であっても、他の株主に売主追加請求権を認める必要がある。なぜなら、当該株主（相続人等）が株主として議決権の行使をした場合、当該相続人等は株主として会社に参加する意図を有しているといえるからである。"},
  {id:"K-03-05-010",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:10,rank:"C",src:"",
   q:"株式会社は、特定の株主から自己株式を有償で取得する場合であっても、他の株主に売主追加請求権を認めない旨を定款で定めることができる。",ans:"正しい",
   exp:"164条１項。なお、株式会社が、株式の発行後に定款を変更して当該株式について、特定の株主から自己株式を有償で取得する場合に他の株主に売主追加請求権を認めない旨の定款の定めを設けようとするときは、当該株式を有する株主全員の同意を得なければならない（164条２項）。また、種類株式が発行されている場合に、ある特定の種類株式の取得についてのみ、当該規定を設けることも可能である。"},
  {id:"K-03-05-011",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:11,rank:"A",src:"令５Ⅰ問題５エ類・平27Ⅰ問題４ウ・平25Ⅱ問題６ア類・平23Ⅱ問題５イ",
   q:"取締役会設置会社でない株式会社が、その子会社の有する当該株式会社の株式を有償で取得する場合には、自己の株式の取得に関する事項は、当該株式会社の取締役が決定することができる。",ans:"誤り",
   exp:"163条前段。株式会社がその子会社の有する当該株式会社の株式を取得する場合は、株主総会の普通決議（取締役会設置会社では取締役会決議）で決定する必要がある（309条１項）。親会社株式の取得は原則として禁止され、例外的に取得した場合であっても、相当の時期に処分しなければならないとされている（135条）。しかし、親会社株式について流通性がない場合にはその処分が困難なことがあるし、市場価格があっても大量に取得した場合には市場に与える影響の大きさからその売却が困難となる場合もある。このような場合に、親会社が当該株式を取得することで子会社の親会社株式の処分が簡易かつ迅速に行えるようにするため、他の特定の株主からの取得による場合よりも規制が緩和されているのである。"},
  {id:"K-03-05-012",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:12,rank:"A",src:"",
   q:"株式会社がその子会社の有する当該株式会社の株式を有償で取得する場合は、他の株主に対して売主追加請求権を認める必要がある。",ans:"誤り",
   exp:"163条後段。株式会社がその子会社の有する当該株式会社の株式を取得する場合は、他の株主に対して売主追加請求権を認める必要はない。なお、この場合には、157条から160条までの規定は適用されないため、取締役会による具体的な取得事項の決定等は必ずしも必要ではなく、通常の業務執行と同様に業務執行担当者（代表取締役等）が授権決議に基づき取得することになる。"},
  {id:"K-03-05-013",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:13,rank:"A",src:"平28Ⅱ問題７ア・平25Ⅱ問題６イ類",
   q:"株式会社が、金融商品取引法上の公開買付けの方法により自己の株式を有償で取得するには、株主総会の特別決議によって、取得する株式の数や株式を取得することができる期間などの事項を決定しなければならない。",ans:"誤り",
   exp:"165条１項。市場取引または公開買付けの方法により自己株式を取得する場合でも、株主総会の決議により、156条１項各号の事項を定めなければならない。ただし、当該方法により自己株式を取得する場合は、株主全員に申込みの機会が与えられていることから、授権決議は普通決議で足りる。また、取締役会設置会社は、市場取引または公開買付けの方法により当該株式会社の株式を取得することを取締役会の決議によって定めることができる旨を定款で定めることができる（165条２項）。この場合、156条１項各号の事項は株主総会または取締役会の決議で定めることになる（同条３項）。"},
  {id:"K-03-05-014",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:14,rank:"A",src:"",
   q:"株式会社が市場取引または公開買付けの方法により自己株式を有償で取得する場合には、他の株主に売主追加請求権を認める必要はない。",ans:"正しい",
   exp:"165条１項。市場取引または公開買付けにより自己株式を取得する場合は、株主全員に申込みの機会が与えられていることから、他の株主に売主追加請求権を認める必要はない。また、この場合には157条から160条までの規定は適用されないため、取締役会による具体的な取得事項の決定等は必ずしも必要ではなく、授権手続後は、市場取引の場合は通常の業務執行と同様に業務執行担当者（代表取締役等）の決定により、公開買付けの場合は金融商品取引法の規定にしたがって自己株式を取得する。"},
  {id:"K-03-05-015",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:15,rank:"B",src:"",
   q:"取締役会設置会社において、市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる旨を定款で定めた場合は、株主総会の決議によって当該取得の決定をすることができない。",ans:"誤り",
   exp:"165条３項。当該定款の定めは、株主総会の決議による取得を排除するものではないため、原則通り株主総会の決議に基づいて取得することも可能である。"},
  {id:"K-03-05-016",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:16,rank:"A",src:"",
   q:"取締役会設置会社においては、定款に別段の定めがなくとも、市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる。",ans:"誤り",
   exp:"165条２項。取締役会設置会社は、市場取引または公開買付けにより自己株式を取得することを取締役会の決議によって定めることができる旨を定款で定めることができる。このような規定が認められる理由は、事前に定款による授権がある場合には、機動的な自己株式の取得を可能とするために取締役会の決議による取得を認めるべきだからである。したがって、定款に上記の定めがない場合は、株主総会の決議によって取得に関する事項を決定しなければならない。この場合は、株主全員に売渡す機会が与えられていることから普通決議で足りる。"},
  {id:"K-03-05-017",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (1) 株主との合意による自己株式取得",num:17,rank:"A",src:"平28Ⅱ問題７ウ・平23Ⅱ問題５エ類",
   q:"株式会社は、自己の株式を取得した場合には、当該株式を相当の期間内に消却または処分しなければならない。",ans:"誤り",
   exp:"自己株式の取得には、取得目的、取得数量、保有期間等の規制はなされていないため、相当の期間に消却または処分する義務はない。"},
  {id:"K-03-05-018",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (2) 取得請求権付株式の取得",num:1,rank:"C",src:"",
   q:"株式会社は、取得請求権付株式を有する株主による取得請求が適法になされた場合は、当該取得請求の日に、当該取得請求権付株式を取得する。",ans:"正しい",
   exp:"167条１項。"},
  {id:"K-03-05-019",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (2) 取得請求権付株式の取得",num:2,rank:"C",src:"",
   q:"株券発行会社の株主がその有する取得請求権付株式について取得請求をしようとするときは、当該取得請求権付株式に係る株券が発行されていない場合を除き、当該取得請求権付株式に係る株券を株券発行会社に提出しなければならない。",ans:"正しい",
   exp:"166条３項。"},
  {id:"K-03-05-020",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (2) 取得請求権付株式の取得",num:3,rank:"C",src:"",
   q:"市場価格のある取得請求権付株式の取得の対価が当該株式会社の他の株式である場合において、交付される株式に１株に満たない端数があるときは、当該端数は切り捨てるものとする。この場合には、当該株主には１株当たりの純資産額にその端数を乗じて得た額に相当する金銭を交付しなければならない。",ans:"誤り",
   exp:"167条３項。前文は正しい。しかし、当該株式が市場価格のある株式である場合には、定款に別段の定めがある場合を除き、当該株式１株の市場価格として法務省令で定める方法により算定される額にその端数を乗じて得た額に相当する金銭を交付しなければならない。"},
  {id:"K-03-05-021",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (3) 取得条項付株式の取得",num:1,rank:"C",src:"",
   q:"株式会社が、その発行する株式の内容として、別に定める日が到来することをもって取得事由とする定めがある場合、株式会社は、定款に別段の定めがある場合を除き、その日を株主総会の特別決議によって定めなければならない。",ans:"誤り",
   exp:"168条１項、309条１項。株式会社が別に定める日が到来することをもって取得事由とする定めがある場合、株式会社は、定款に別段の定めがある場合を除き、その日を株主総会の普通決議（取締役会設置会社では取締役会決議）によって定めなければならない。"},
  {id:"K-03-05-022",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (3) 取得条項付株式の取得",num:2,rank:"C",src:"",
   q:"株式会社が、その発行する株式の内容として、別に定める日が到来することをもって取得事由とする定めがある場合であって、その取得の日を定めたときは、当該株式会社は、取得条項付株式の株主に対して、その取得の日までに当該日を通知または公告すれば足りる。",ans:"誤り",
   exp:"168条２項。株式会社が別に定める日が到来することをもって取得事由とする定めがある場合であって、その取得の日を定めたときは、当該株式会社は、取得条項付株式の株主に対して、その取得の日の２週間前までに、当該日を通知しなければならない。また、登録株式質権者がいる場合は、当該登録株式質権者に対しても当該通知をすることを要する。なお、当該通知は、公告をもって代えることができる（168条３項）。ここで、取得の日の２週間前までという事前の通知が要求されている理由は、取得条項付株式の取得は、当該株式を有する株主の投資判断等に影響するため、株主に対応する時間的猶予を与える必要があるからである。"},
  {id:"K-03-05-023",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (3) 取得条項付株式の取得",num:3,rank:"C",src:"",
   q:"株式会社が取得条項付株式について当該株式の一部を取得する決定をした場合は、取得することが決定された株式を有する株主に対し、当該決定の日から２週間以内に、当該取得条項付株式を取得する旨を通知または公告すれば足りる。",ans:"誤り",
   exp:"169条３項。株式会社が取得条項付株式について当該株式の一部を取得する決定をした場合は、取得することが決定された株式を有する株主に対し、直ちに、当該取得条項付株式を取得する旨を通知しなければならない。また、登録株式質権者がいる場合は、当該登録株式質権者に対しても当該通知をすることを要する。なお、当該通知は、公告をもって代えることができる（169条４項）。ここで、取得決定後、直ちに通知することが要求されている理由は、取得条項付株式の取得は、当該株式を有する株主の投資判断等に影響するためである。"},
  {id:"K-03-05-024",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (3) 取得条項付株式の取得",num:4,rank:"C",src:"",
   q:"株式会社が取得条項付株式の全部を取得する場合、当該株式会社は、取得事由が生じた日に当該株式を取得する。",ans:"正しい",
   exp:"170条１項柱書。なお、取得事由が生じたときに取得条項付株式の一部を取得する定めがある場合には、取得対象株式について株主等に周知させる必要があるため、取得事由が生じた日と取得条項付株式の株主およびその登録株式質権者に対する通知・公告の日から２週間を経過した日のいずれか遅い日に、取得条項付株式を取得することになる（170条１項柱書かっこ書各号）。"},
  {id:"K-03-05-025",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:1,rank:"B",src:"",
   q:"株式会社は、全部取得条項付種類株式を取得するのと引換えに金銭等を交付しなければならない。",ans:"誤り",
   exp:"171条１項１号参照。全部取得条項付種類株式の取得の対価について特に制限はなく、無償による取得も可能である。"},
  {id:"K-03-05-026",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:2,rank:"C",src:"",
   q:"全部取得条項付種類株式を取得する株式会社の株主は、当該株式会社に対して、その営業時間内は、いつでも、取得日等一定の事項を記載した書面の閲覧を請求することができる。",ans:"正しい",
   exp:"171条の２第２項本文、１号。事前開示手続を設けた趣旨は、キャッシュ・アウトされる株主に対して、当該取得の是非についての判断材料として十分な情報提供をすることにある。"},
  {id:"K-03-05-027",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:3,rank:"A",src:"平25Ⅱ問題６ウ",
   q:"取締役会設置会社において、金銭を取得対価として当該取締役会設置会社の発行する全部取得条項付種類株式の全部を取得する場合には、その額または算定方法の決定は、取締役会の決議による。",ans:"誤り",
   exp:"171条１項１号ホ。全部取得条項付種類株式の取得は、株主総会の特別決議によらなければならない（309条２項３号）。"},
  {id:"K-03-05-028",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:4,rank:"B",src:"",
   q:"取締役は、全部取得条項付種類株式を取得する株主総会において、全部取得条項付種類株式の全部を取得することを必要とする理由を説明しなければならない。",ans:"正しい",
   exp:"171条３項。全部取得条項付種類株式の取得は、株主総会の決議により当該株主から株主たる地位を奪うことになるので、その理由を説明する必要があるためである。"},
  {id:"K-03-05-029",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:5,rank:"B",src:"",
   q:"株式会社が全部取得条項付種類株式を取得する場合は、株主総会の特別決議のほか、当該全部取得条項付種類株式を有する種類株主を構成員とする種類株主総会の特別決議が必要である。",ans:"誤り",
   exp:"種類株式発行会社がある種類の株式を全部取得条項付種類株式とする定款の変更は、株主総会の特別決議のほかに、当該種類の株式の種類株主を構成員とする種類株主総会の特別決議が必要であるが（111条２項、324条２項１号）、全部取得条項付種類株式の取得時には種類株主総会の決議は要求されていない。"},
  {id:"K-03-05-030",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:6,rank:"B",src:"",
   q:"株式会社が株主総会の決議に基づき全部取得条項付種類株式を取得する場合において、当該株主総会の決議に賛成した株主であっても、裁判所に対し、株式会社による全部取得条項付種類株式の取得の価格の決定の申立てをすることができる。",ans:"誤り",
   exp:"172条１項。① 当該株主総会に先立って、当該株式会社による全部取得条項付種類株式の取得に反対する旨を当該株式会社に対して通知し、かつ、当該株主総会において当該取得に反対した株主、および、② 当該株主総会において議決権を行使することができない株主は、裁判所に対し、全部取得条項付種類株式の取得の価格の決定の申立てをすることができる。このような申立てが認められている理由は、全部取得条項付種類株式の取得価格は、発行時に定めることが要求されておらず、取得時に定めることが要求されているため、当該取得価格が不服である株主を保護する必要があるためである。"},
  {id:"K-03-05-031",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:7,rank:"B",src:"",
   q:"全部取得条項付種類株式の取得に関する事項を定めた場合には、取得に関する事項を定める株主総会において議決権を行使することができない株主は、取得日の20日前の日から取得日の前日までの間に、裁判所に対し、株式会社による全部取得条項付種類株式の取得の価格の決定の申立てをすることができる。",ans:"正しい",
   exp:"172条１項２号。改正前会社法では、全部取得条項付種類株式の取得の価格の決定の申立期間は、当該取得に係る決議をした株主総会の日から20日以内とされていたが、当該株主総会の日と取得日との関係については、会社法上特段の規律は存在しなかったため、取得日が株主総会の日から20日以内に設定される場合には、申立期間の満了前に取得日が到来することがあり得た。しかし、取得日以降に取得価格決定の申立てがされた場合は、いったん株主に交付された対価の返還が必要となるという事態が生じることとなり、法律関係が複雑化するおそれがあるとの指摘がなされていた。そこで、改正法は、組織再編行為等における反対株主の株式買取請求権を参考にして、全部取得条項付種類株式の取得の価格の決定の申立てを取得日の20日前の日から取得日の前日までの間にしなければならないものと定めたのである。"},
  {id:"K-03-05-032",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:8,rank:"B",src:"",
   q:"株式会社は、取得日の20日前までに、全部取得条項付種類株式の株主に対し、当該全部取得条項付種類株式の全部を取得する旨を通知または公告しなければならない。",ans:"正しい",
   exp:"172条２項３項。裁判所に対する価格の決定の申立ては、取得を決定する株主総会の決議において議決権を行使することができない株主にも認められている（172条１項２号）。しかし、改正前会社法においては、取得をする旨の通知または公告の制度が設けられていなかったため、株主が取得の事実を知らないまま申立期間が経過する可能性があった。そこで、改正法は、全部取得条項付種類株式の株主への通知または公告を求めたのである。"},
  {id:"K-03-05-033",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:9,rank:"B",src:"平30Ⅰ問題６ア",
   q:"全部取得条項付種類株式を発行した種類株式発行会社による全部取得条項付種類株式の取得が法令または定款に違反する場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該全部取得条項付種類株式の取得をやめることを請求することができる。",ans:"正しい",
   exp:"171条の３。全部取得条項付種類株式の取得の無効を争う手段としては、株主総会の決議取消しの訴えがあるが、事後的に取得の効力が否定されると法律関係を不安定にするおそれがある。そうであれば、株主が、取得の効力発生前にその差止めを請求することができることとするのが相当である。そこで、会社法は、株主に全部取得条項付種類株式の取得差止請求を認めたのである。"},
  {id:"K-03-05-034",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:10,rank:"C",src:"",
   q:"全部取得条項付種類株式の取得の対価が当該全部取得条項付種類株式を発行している株式会社の他の種類の株式であると定められた場合において、当該株式会社以外の全部取得条項付種類株式の株主は、裁判所に対して価格の決定の申立てをしたときであっても、取得日に、株主総会の決議による定めに従い、当該取得の対価である他の種類の株式に係る株主となる。",ans:"誤り",
   exp:"173条２項。株式会社は、株主総会の特別決議で定めた取得日に、全部取得条項付種類株式の全部を取得する（173条１項）。そして、当該株式会社以外の全部取得条項付種類株式の株主（裁判所に対する価格の決定の申立て（172条１項）をした株主を除く）は、それぞれ対価の交付を受けることとなる。取得の価格の決定の申立てをした株主については、取得対価にかかわらず金銭による処理が予定されており、このような株主に対して取得日に取得対価が交付されることは合理的ではないと考えられるためである。"},
  {id:"K-03-05-035",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:11,rank:"C",src:"",
   q:"株式会社が全部取得条項付種類株式を取得した後は、取得日後に当該株式会社の株主である者に限り、当該株式会社に対して、株式会社が取得した全部取得条項付種類株式の数その他の全部取得条項付種類株式の取得に関する事項として法務省令で定める事項を記載した書面を閲覧の請求をすることができる。",ans:"誤り",
   exp:"173条の２第３項本文、１号。① 全部取得条項付種類株式を取得した株式会社の株主、または、②取得日に全部取得条項付種類株式の株主であった者は、当該株式会社に対して、その営業時間内は、いつでも、事後開示事項の内容を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる。事後開示手続を設けた趣旨は、全部取得条項付種類株式の取得に関して、株主総会の決議取消しの訴え（831条１項）等を提起するか否かの判断材料を株主に提供することにある。すなわち、全部取得条項付種類株式の取得がキャッシュ・アウトに利用される場合は、キャッシュ・アウトにより株式を失った者も、閲覧等を請求することができるのである。"},
  {id:"K-03-05-036",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (4) 全部取得条項付種類株式の取得",num:12,rank:"B",src:"平27Ⅱ問題４ウ",
   q:"株式会社が全部取得条項付種類株式を株主総会の決議に基づいて取得した場合には、当該決議において別段の定めをしたときを除き、当該株式会社は取得した当該全部取得条項付種類株式のすべてを相当の期間内に消却しなければならない。",ans:"誤り",
   exp:"株式会社が全部取得条項付種類株式を取得した場合であっても消却義務はない。"},
  {id:"K-03-05-037",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:1,rank:"A",src:"令７Ⅱ問題５エ類・令４Ⅰ問題６ア類・平23Ⅰ問題５エ",
   q:"公開会社は、相続その他の一般承継により当該株式会社の譲渡制限株式を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。",ans:"正しい",
   exp:"174条。公開会社、非公開会社を問わず、相続その他の一般承継により当該株式会社の譲渡制限株式を取得した者に対し、当該株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。譲渡制限株式の制限は、売買等の特定承継にのみ適用され、相続等の一般承継には適用されない（134条４号）。しかし、会社にとって好ましくない者の参加を防止し、もって会社経営の安定を図るという趣旨は、一般承継の場合にも同様に妥当するため、相続人から合意が得られてなくてもその株式を強制的に取得することができる制度を設けたのである。この点、相続人等との合意による取得の場合の特則（他の株主に売主追加請求権を認める必要がない）が、非公開会社に限られるのと異なることに注意する必要がある（162条１号）。"},
  {id:"K-03-05-038",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:2,rank:"B",src:"令４Ⅰ問題６イ類",
   q:"取締役会設置会社が、譲渡制限株式の相続人等に対して売渡しの請求をすることができる定款の定めに基づき売渡請求をしようとする場合は、その都度、取締役会の決議によって、請求する株式の数、請求の相手方となる株主の氏名または名称を定めなければならない。",ans:"誤り",
   exp:"175条１項、309条２項３号。株式会社が、譲渡制限株式の相続人等に対して売渡しの請求をすることができる定款の定めに基づき売渡請求しようとする場合は、その都度、株主総会の特別決議によって、請求する株式の数、請求の相手方となる株主の氏名または名称を定めなければならない。これは、特定の者からの自己株式の取得となるためである。"},
  {id:"K-03-05-039",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:3,rank:"C",src:"",
   q:"相続人等に対する売渡請求の対象となる株式を有する者は、当該者以外の株主の全部が売渡請求に関する事項を決定する株主総会において議決権を行使することができない場合を除き、当該株主総会の決議において議決権を行使することができない。",ans:"正しい",
   exp:"175条２項。決議の公正を図る必要があるためである。"},
  {id:"K-03-05-040",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:4,rank:"C",src:"令４Ⅰ問題６エ類",
   q:"株式会社は、当該株式会社が譲渡制限株式の相続その他の一般承継があったことを知った日から１年を経過した場合は、相続人等に対する売渡請求をすることができない。",ans:"正しい",
   exp:"176条１項ただし書。当該期間制限は、相続人等に対する売渡請求が株主との合意がなくてもその株式を取得することができる制度であることから、売渡請求の相手方となりうる株主の利益を保護するために設けられている。"},
  {id:"K-03-05-041",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:5,rank:"C",src:"",
   q:"株式会社は、譲渡制限株式の相続人等に対する売渡請求を撤回することができない。",ans:"誤り",
   exp:"176条３項。株式会社は、いつでも、譲渡制限株式の相続人等に対する売渡請求を撤回することができる。"},
  {id:"K-03-05-042",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (5) 譲渡制限株式の相続人等に対する売渡請求による取得手続",num:6,rank:"C",src:"",
   q:"譲渡制限株式の相続人等に対する売渡請求があった日から20日以内に売買価格についての協議が調わず、かつ、当該期間内に裁判所に対する売買価格決定の申立てがないときは、当該売渡請求はその効力を失う。",ans:"正しい",
   exp:"177条１項２項５項。"},
  {id:"K-03-05-043",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:1,rank:"A",src:"令８Ⅰ問題５ア・平23Ⅱ問題５ウ類・平20 問題５エ類",
   q:"取得請求権付株式の株主は、株式会社に対して、当該取得請求権付株式を取得する場合の対価として交付する当該株式会社の発行する株式以外の財産の帳簿価額が当該請求の日における分配可能額を超えているときであっても、その有する株式を取得することを請求することができる。",ans:"誤り",
   exp:"166条１項ただし書。取得請求権付株式の取得については、財源規制がある。自己株式の有償取得は、実質的には株主への出資の払い戻しと同様の結果となり、株主が有限責任（104条）しか負わない株式会社においては、これを無制限に認めてしまうと資本維持の原則に反し、会社債権者を害するおそれがあるのである。なお、対価が他の種類の株式である場合は、会社財産の減少を伴わないため、財源規制は課されない。"},
  {id:"K-03-05-044",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:2,rank:"A",src:"",
   q:"取得条項付株式を取得する場合の対価として交付する当該取得条項付株式を発行する株式会社の株式以外の財産の帳簿価額が、取得事由が生じた日における分配可能額を超えているときは、当該株式会社は、当該取得条項付株式を取得することができない。",ans:"正しい",
   exp:"170条５項。"},
  {id:"K-03-05-045",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:3,rank:"A",src:"令６Ⅱ問題14 ア・平23Ⅱ問題15 ア・平20 問題５ア",
   q:"譲渡制限株式の譲渡を承認しない場合の買取請求に応じた自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"正しい",
