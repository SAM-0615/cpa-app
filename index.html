   q:"指名委員会等設置会社以外の取締役会設置会社においては、株主総会の決議によって、取締役（監査等委員会設置会社では監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。",ans:"誤り",
   exp:"362条２項３号３項、399条の13 第１項３号３項。指名委員会等設置会社以外の取締役会設置会社においては、取締役会の決議によって、取締役（監査等委員会設置会社では監査等委員である取締役を除く）の中から代表取締役を選定しなければならない。なお、取締役会は、その決議によって、いつでも、代表取締役を解職する権限を有する（362条２項３号、399条の13 第１項３号）。"},
  {id:"K-02-06-005",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:5,rank:"A",src:"平30Ⅰ問題13 イ",
   q:"指名委員会等設置会社以外の取締役会設置会社においては、代表取締役の解職は、取締役会の決議によって行われる。",ans:"正しい",
   exp:"362条２項３号、399条の13 第１項３号。取締役会は、その決議によって、いつでも、代表取締役を解職する権限を有する（362条２項３号）。代表取締役の選定および解職権限は、取締役会の重要な監督権限の一つである。"},
  {id:"K-02-06-006",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:6,rank:"B",src:"令２Ⅰ問題10 イ・平25Ⅰ問題９イ",
   q:"株式会社は、代表取締役その他の代表者がその職務を行うについて第三者に加えた損害を賠償する責任を負う。",ans:"正しい",
   exp:"350条。350条は、代表者の不法行為（故意または過失によって他人の権利を侵害する行為）によって他人に加えた損害についても株式会社が責任を負う旨を定めているのである。"},
  {id:"K-02-06-007",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:7,rank:"C",src:"",
   q:"代表取締役の職務代行者選任の仮処分命令により選任された代表取締役の職務を代行する者は、株式会社の常務に属しない行為を一切することができない。",ans:"誤り",
   exp:"352条１項。代表取締役の職務代行者選任の仮処分命令により選任された代表取締役の職務を代行する者は、仮処分命令に別段の定めがある場合を除き、株式会社の常務に属しない行為をするには、裁判所の許可を得なければならない。ここで、常務に属しない行為について裁判所の許可を得なかった場合、職務執行者の行為は無効である（352条２項本文）。ただし、株式会社は、これをもって善意の第三者に対抗することができない（352条２項ただし書）。"},
  {id:"K-02-06-008",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:8,rank:"A",src:"令７Ⅱ問題12 エ・令６Ⅰ問題11 ア類・令２Ⅰ問題10 エ・平25Ⅰ問題９エ",
   q:"代表取締役の解職により、株式会社の代表取締役が欠けた場合には、新たに選定された代表取締役が就任するまで、解職された当該代表取締役は、なお代表取締役としての権利義務を有する。",ans:"誤り",
   exp:"351条１項。代表取締役が欠けた場合または定款で定めた代表取締役の員数が欠けた場合には、任期の満了または辞任により退任した代表取締役は、新たに選定された代表取締役が就任するまで、なお代表取締役としての権利義務を有する。なお、代表執行役の場合にも留任義務がある（420条３項、401条２項）。この留任義務は、解職された代表取締役には適用されない。"},
  {id:"K-02-06-009",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:9,rank:"B",src:"",
   q:"代表取締役が欠けた場合または定款で定めた代表取締役の員数が欠けた場合において、裁判所は、必要があると認めるときは、利害関係人の申立てにより、一時代表取締役の職務を行うべき者を選任することができる。",ans:"正しい",
   exp:"351条２項。また、裁判所は、一時代表取締役の職務を行うべき者を選任した場合には、株式会社がその者に対して支払う報酬の額を定めることができる（351条３項）。"},
  {id:"K-02-06-010",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:10,rank:"B",src:"平30Ⅰ問題13 ア類",
   q:"指名委員会等設置会社以外の取締役会設置会社において、代表取締役の氏名および住所は登記しなければならない。",ans:"正しい",
   exp:"911条３項14号。代表取締役の氏名および住所は絶対的登記事項である。"},
  {id:"K-02-06-011",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:11,rank:"A",src:"",
   q:"指名委員会等設置会社以外の取締役会設置会社において、当該取締役会設置会社の業務を執行する取締役は、株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。",ans:"誤り",
   exp:"349条４項参照。指名委員会等設置会社以外の株式会社において、代表取締役は、株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。代表権の包括性についての規定である。また、指名委員会等設置会社の代表執行役の代表権についても同様に、包括的な代表権が付与されている（420条３項）。"},
  {id:"K-02-06-012",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:12,rank:"A",src:"令７Ⅱ問題11 イ類・平25Ⅰ問題９ア",
   q:"株式会社は、定款により代表取締役の代表権に制限を加えた場合には、そのような制限を知らない第三者には、当該制限を対抗することはできない。",ans:"正しい",
   exp:"349条５項。代表権の不可制限性である。また、指名委員会等設置会社の代表執行役の代表権についても同様に、包括的な代表権が付与されている（420条３項）。"},
  {id:"K-02-06-013",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:13,rank:"A",src:"令６Ⅰ問題11 イ・平26Ⅱ問題８ウ",
   q:"取締役会設置会社以外の株式会社の業務に関する裁判外の行為をする代表取締役の権限につき、その一部を制限する旨の定款の定めは、無効である。",ans:"誤り",
   exp:"349条５項。代表取締役の代表権に加えた制限は、善意の第三者に対抗することができないとされており、無効となるわけではない。"},
  {id:"K-02-06-014",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:14,rank:"B",src:"",
   q:"最高裁判所の判例によれば、代表取締役が取締役会の決議を経てすることを要する重要な財産の処分を取締役会の決議なしでした場合は、当該重要な財産の処分の効力は無効となる。",ans:"誤り",
   exp:"最判昭40年9月22日。最高裁判所の判例によれば、取締役会の決議を経ずになされた「重要な財産の処分および譲受け」や「多額の借財」等の行為は、原則として有効であるが、相手方が悪意または有過失の場合に限り無効となる。"},
  {id:"K-02-06-015",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:15,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式会社の代表取締役が取締役会の決議を経ないで重要な業務執行に該当する取引をした場合に、取締役会の決議を経ていないことを理由とする当該取引の無効は、特段の事情がない限り、当該株式会社以外の者も主張することができる。",ans:"誤り",
   exp:"最判平21年４月17日。最高裁判所の判例によれば、代表取締役が362条４項に違反し、取締役会の決議を経ないで重要な業務執行に当たる取引をした場合、取締役会の決議を経ていないことを理由とする当該取引の無効は、原則として株式会社のみが主張できるとしている。例外として、当該株式会社の取締役会が当該無効を主張する旨の決議をしているなどの特段の事情がある場合は、当該株式会社以外の者もその無効を主張することができる。"},
  {id:"K-02-06-016",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:16,rank:"A",src:"令２Ⅱ問題10 エ・平24Ⅱ問題11 ウ類",
   q:"監査役が監査役設置会社に対して負う損害賠償責任について、当該会社が当該監査役に対して訴えを提起する場合、当該会社を代表するのは、代表取締役である。",ans:"正しい",
   exp:"349条４項。代表取締役は、株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する。したがって、会社を当事者とする訴訟において、会社を代表するのは代表取締役である。ただし、監査役設置会社と取締役との間の訴えにおいては、馴れ合い訴訟を防止するために、当該訴えについては、監査役が監査役設置会社を代表する（386条１項）。"},
  {id:"K-02-06-017",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:17,rank:"B",src:"令７Ⅱ問題11 ウ・平26Ⅱ問題８エ",
   q:"監査役設置会社でない取締役会設置会社以外の株式会社において、代表取締役が当該株式会社に対して訴えを提起する場合には、株主総会は、当該訴えについて当該株式会社を代表する者を定めることができる。",ans:"正しい",
   exp:"353条。代表取締役は株式会社の業務に関する一切の裁判上または裁判外の行為をする権限を有する（349条４項）。したがって、株式会社が訴訟の当事者となる場合には、原則として代表取締役が当該訴訟について株式会社を代表する。しかし、株式会社と取締役の間の訴えの場面では、馴れ合いによる訴訟が行われるという弊害が生じるため、会社法は、この馴れ合い訴訟を防止するために、株式会社と取締役の間の訴えにおける会社代表者についての特例を設けている。"},
  {id:"K-02-06-018",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:18,rank:"B",src:"平21 問題10 イ",
   q:"取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）であって、監査役設置会社でない株式会社が取締役に対して訴えを提起する場合において、取締役会は会社を代表する者を定めなければならない。",ans:"誤り",
   exp:"353条、364条。この場合においては、まず、① 株主総会が定めた代表者が株式会社を代表するが、当該会社代表者の定めがないときは、② 取締役会が定めた代表者が株式会社を代表する。そして取締役会においても定めがないときは、③ 代表取締役が当該株式会社を代表する。株式会社と取締役の間の訴えの場面では、馴れ合いによる訴訟が行われるという弊害が生じるため、会社法は、この馴れ合い訴訟を防止するために、株式会社と取締役の間の訴えにおける会社代表者についての特例を設けている。"},
  {id:"K-02-06-019",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:19,rank:"A",src:"平23Ⅰ問題９ア類・平21 問題10 ウ類",
   q:"監査役設置会社が取締役に対して訴えを提起する場合には、株主総会および取締役会による会社代表者の定めがない場合に限り、監査役が当該株式会社を代表する。",ans:"誤り",
   exp:"386条１項１号。監査役設置会社と取締役との間の訴訟については、いかなる場合であっても監査役が監査役設置会社を代表する。"},
  {id:"K-02-06-020",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:20,rank:"A",src:"平23Ⅰ問題９イ",
   q:"監査役設置会社と取締役であった者との間の訴えについては、代表取締役が会社を代表する。",ans:"誤り",
   exp:"386条１項１号かっこ書。監査役設置会社と取締役であった者との間の訴えについても、監査役が会社を代表する。"},
  {id:"K-02-06-021",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:21,rank:"A",src:"平23Ⅰ問題９ウ",
   q:"監査役設置会社と会計監査人との間の訴えについては、監査役が会社を代表する。",ans:"誤り",
   exp:"349条４項。会社と会計監査人との間の訴えは、代表取締役が会社を代表する。"},
  {id:"K-02-06-022",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:22,rank:"B",src:"",
   q:"株式会社は、代表取締役以外の取締役に社長、副社長その他株式会社を代表する権限を有するものと認められる名称を付した場合には、当該取締役がした行為について、善意の第三者に対してその責任を負う。",ans:"正しい",
   exp:"354条。表見代表取締役の規定である。当該規定の趣旨は、外観法理に基づき、取引の安全を図ることにある。なお、代表執行役にも同様に、表見代表執行役の規定がある（421条）。"},
  {id:"K-02-06-023",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:23,rank:"C",src:"",
   q:"最高裁判所の判例によれば、第三者が善意であっても重大な過失があるときは、表見代表取締役の規定は適用しないとしている。",ans:"正しい",
   exp:"最判昭52年10月14日。354条の目的は第三者の正当な信頼を保護しようとする点にあり、相手方の重過失は悪意と同等に評価すべきだからである。"},
  {id:"K-02-06-024",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:24,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式会社の使用人が代表権を有するものと認められる名称でなした行為について、当該株式会社は、表見代表取締役の規定による責任を負うことはない。",ans:"誤り",
   exp:"最判昭35年10月14日。判例によると、株式会社の使用人が、当該株式会社の了解を得て代表権を有するものと認められる名称でなした行為について、当該株式会社は、表見代表取締役（354条）の規定を類推適用することにより、善意の第三者に対してその責任を負うとしている。"},
  {id:"K-02-07-001",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:1,rank:"A",src:"",
   q:"取締役会非設置会社において、取締役が自己のために株式会社の事業の部類に属する取引をしようとするときは、当該取引について重要な事実を開示し、株主総会の承認を得なければならないが、第三者のために株式会社の事業の部類に属する取引をしようとするときは、株主総会の承認を得る必要はない。",ans:"誤り",
   exp:"356条１項１号。取締役が自己だけでなく第三者のために株式会社の事業の部類に属する取引をしようとする場合も、競業避止義務の対象となる。なお、指名委員会等設置会社における執行役についても、同様に競業避止義務が課されている（419条２項）。"},
  {id:"K-02-07-002",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:2,rank:"A",src:"",
   q:"取締役会設置会社の取締役は、自己または第三者のために株式会社の事業の部類に属する取引をしようとするときは、株主総会の普通決議において、当該取引につき重要な事実を開示し、その承認を受けなければならない。",ans:"誤り",
   exp:"356条１項１号、365条１項。取締役会設置会社において、取締役が競業取引を行う場合は、取締役会において、当該取引につき重要な事実を開示し、その承認を得なければならない。ここで、承認機関を取締役会としているのは、取締役会による相互牽制による監督が期待できるほか、430条により連帯責任を負う取締役によって構成される取締役会で、株式会社の利益保護を図れるのかを判断させるためであり、株主総会の承認機関としないのは、承認の適時性を確保するためである。これに対して、取締役会非設置会社における承認機関は、株主総会（普通決議）である（356条１項）。なお、承認機関は、利益相反取引（356条１項２号３号）についても同様である。"},
  {id:"K-02-07-003",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:3,rank:"A",src:"令６Ⅰ問題12 イ",
   q:"取締役会設置会社においては、自己または第三者のために株式会社の事業の部類に属する取引をした取締役は、当該取引後、遅滞なく、当該取引についての重要な事実を取締役会に報告しなければならない。",ans:"正しい",
   exp:"365条２項。取締役会設置会社における事後報告は、実際に行われた競業取引が事前に承認された範囲内かどうか、取締役に善管注意義務または忠実義務違反がなかったかどうかを取締役会が事後的に確認し、会社に損害が生じる可能性がある場合は事後措置を適切に講じることができるようにするためのものである。なお、取締役会非設置会社においては、事後報告は必要ない。"},
  {id:"K-02-07-004",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:4,rank:"A",src:"平24Ⅰ問題10 ア",
   q:"取締役会設置会社以外の株式会社において、取締役が、自己または第三者のために株式会社の事業の部類に属する取引をしようとするときは、株主総会において、当該取引につき重要な事実を開示し、その承認を受けなければならない。",ans:"正しい",
   exp:"356条１項１号。当該株主総会の決議は普通決議（309条１項）である。"},
  {id:"K-02-07-005",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:5,rank:"A",src:"平31Ⅱ問題12 ア",
   q:"監査等委員である取締役が、自己のために株式会社の事業の部類に属する取引をしようとするときは、当該取引につき取締役会の承認を受けることを要しない。",ans:"誤り",
   exp:"356条１項１号、365条１項。監査等委員である取締役にも競業避止義務は課されるため、本肢は誤りである。"},
  {id:"K-02-07-006",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:6,rank:"C",src:"令４Ⅰ問題11 ア",
   q:"取締役が取締役会の承認を受けずに競業取引を行った場合、当該取引は無効である。",ans:"誤り",
   exp:"会社の承認を得ないで競業取引が行われたとしても、当該取引は相手方の善意・悪意を問わず有効である。なぜなら、競業取引自体は取締役と第三者との取引であり、第三者は規制対象外なのでその保護を図る必要があるからである。"},
  {id:"K-02-07-007",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:7,rank:"A",src:"令４Ⅰ問題11 イ類・平28Ⅱ問題12 ア・平24Ⅰ問題10 イ類",
   q:"取締役が、自己のために競業取引をすることについて当該取引につき重要な事実を開示して取締役会の承認を受けた場合、当該取締役の株式会社に対する任務懈怠責任の追及において、当該取引によって当該取締役が得た利益の額は、当該取締役の任務懈怠によって当該株式会社に生じた損害の額と推定される。",ans:"誤り",
   exp:"423条２項。取締役が、会社の承認を得ることなく、自己または第三者のために株式会社の事業の部類に属する取引をしたときは、当該取引によって取締役または第三者が得た利益の額は、株式会社に生じた損害の額と推定する。競業取引における損害額の推定規定の趣旨は、競業取引によって会社が被った損害の額の立証が困難な場合に、その立証を容易にすることである。これに対して、会社の承認を得ている場合は、当該推定規定は適用されない。"},
  {id:"K-02-07-008",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:8,rank:"A",src:"平24Ⅰ問題10 ウ",
   q:"取締役が、自己または第三者のために株式会社の事業の部類に属する取引をしたことによって会社に損害が生じたときは、株主総会の承認の有無を問わず、その任務を怠ったものと推定される。",ans:"誤り",
   exp:"競業取引については、利益相反取引のような任務懈怠の推定規定（423条３項）は設けられていない。"},
  {id:"K-02-07-009",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:9,rank:"B",src:"",
   q:"取締役会設置会社において、取締役が利益相反取引をしようとするときには、株主総会の普通決議において、当該取引につき重要な事実を開示し、その承認を受けなければならない。",ans:"誤り",
   exp:"356条１項２号３号、365条１項。取締役会設置会社において、取締役が利益相反取引をしようとする場合は、取締役会において、当該取引につき重要な事実を開示し、その承認を得なければならない。ここで、承認機関を取締役会としているのは、取締役会による相互牽制による監督が期待できるほか、430条により連帯責任を負う取締役によって構成される取締役会で、株式会社の利益保護を図れるのかを判断させるためであり、株主総会の承認機関としないのは、承認の適時性を確保するためである。これに対して、取締役会非設置会社における承認機関は、株主総会（普通決議）である（356条１項）。"},
  {id:"K-02-07-010",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:10,rank:"B",src:"",
   q:"取締役会設置会社においては、自己または第三者のために株式会社と取引をした取締役は、当該取引後、遅滞なく、当該取引についての重要な事実を取締役会に報告しなければならない。",ans:"正しい",
   exp:"365条２項。取締役会設置会社における事後報告は、実際に行われた利益相反取引が事前に承認された範囲内かどうか、取締役に善管注意義務または忠実義務違反がなかったかどうかを取締役会が事後的に確認し、会社に損害が生じる可能性がある場合は事後措置を適切に講じることができるようにするためのものである。一方、取締役会非設置会社において、事後報告は必要ない。"},
  {id:"K-02-07-011",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:11,rank:"B",src:"平28Ⅱ問題12 イ",
   q:"取締役会設置会社である甲株式会社の代表権のない取締役Ａが、第三者のために甲株式会社と取引をする場合、Ａ以外の者が甲株式会社を代表して当該取引をするときには、当該取引については甲株式会社の取締役会による承認が必要である。",ans:"正しい",
   exp:"356条１項２号、365条１項。取締役が自己だけでなく第三者のために株式会社と取引をしようとする場合も、利益相反取引の規制の対象となる。"},
  {id:"K-02-07-012",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:12,rank:"B",src:"",
   q:"株式会社が取締役の債務を保証する場合、当該取締役は、株主総会（取締役会設置会社にあっては、取締役会）において、当該取引につき重要な事実を開示し、その承認を受けなければならない。",ans:"正しい",
   exp:"356条１項３号、365条１項。利益相反取引の規制の対象となるのは、直接取引と間接取引である。間接取引とは、形式的には会社と第三者との間の取引であるが、実質的には会社と取締役との利益が相反する取引である。なお、指名委員会等設置会社における執行役についても、同様に利益相反取引の制限がなされている（419条２項）。"},
  {id:"K-02-07-013",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:13,rank:"A",src:"平26Ⅱ問題10 ア",
   q:"取締役会設置会社の会計参与が自己のために当該取締役会設置会社と取引をしようとするときは、当該会計参与は、取締役会において、その承認を受けなければならない。",ans:"誤り",
   exp:"会計参与には、競業避止義務や利益相反取引の制限の規定（356条）といった利益衝突を防止するための規定は設けられていない。また、忠実義務についても課せられていない（355条参照）。"},
  {id:"K-02-07-014",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:14,rank:"C",src:"平28Ⅱ問題12 ウ",
   q:"最高裁判所の判例によれば、取締役会設置会社である株式会社に対し取締役が無利息、無担保で金銭を貸し付ける行為は、取締役会による承認を必要としない。",ans:"正しい",
   exp:"最判昭38年12月６日。株式会社の利益が害されないためである。"},
  {id:"K-02-07-015",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:15,rank:"B",src:"令７Ⅱ問題12 イ類・平28Ⅱ問題12 エ",
   q:"最高裁判所の判例によれば、取締役を債務者とし、株式会社を債権者とする金銭消費貸借契約が取締役会の承認を受けていない場合、当該取締役は当該取引が無効であることを当該株式会社に対して主張することができる。",ans:"誤り",
   exp:"最判昭48年12月11日。取締役を債務者とし、株式会社を債権者とする金銭消費貸借契約が取締役会の承認を受けていない場合、当該取引は無効であるが、取締役や第三者が株式会社に対して無効を主張することは許されない。これは、利益相反取引の規制の趣旨が会社の利益を保護するという点にあるからである。"},
  {id:"K-02-07-016",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:16,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式会社の株式全部を取締役が所有しているような一人会社において、当該取締役が利益相反取引を行う場合は、当該株式会社の承認を得る必要はない。",ans:"正しい",
   exp:"最判昭45年８月20日。"},
  {id:"K-02-07-017",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:17,rank:"B",src:"",
   q:"最高裁判所の判例によれば、取締役会設置会社において、利益相反取引に関して株主全員の同意がある場合には、取締役会の承認を得る必要はない。",ans:"正しい",
   exp:"最判昭49年９月26日。なお、判例によれば、この場合であっても、取引の効力は有効であるとしている。"},
  {id:"K-02-07-018",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:18,rank:"A",src:"",
   q:"利益相反取引によって会社に損害が生じたときであっても、会社の承認を得ていた場合、会社が利益相反取引をすることを決定した取締役は、その任務を怠ったものと推定されることはない。",ans:"誤り",
   exp:"423条３項。利益相反取引は会社に損害を及ぼすおそれの大きい行為であることから、利益相反取引によって会社に損害が生じたときは、会社の承認の有無にかかわらず、取締役に任務を怠らなかったことの立証責任を転換することで会社の利益の保護を図っているのである。"},
  {id:"K-02-07-019",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:19,rank:"A",src:"",
   q:"自己のために直接取引をした取締役の株式会社に対する損害賠償責任は、任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。",ans:"正しい",
   exp:"428条１項。自己のための直接取引は、利益相反性が著しく高いため、会社に対して無過失の損害賠償責任を負うこととされている。"},
  {id:"K-02-07-020",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:20,rank:"A",src:"平24Ⅰ問題10 エ",
   q:"取締役が、自己のために株式会社の事業の部類に属する取引をした場合、株主総会の承認を受けていたときであっても、当該取引によって会社に生じた損害についての会社に対する賠償責任は、任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。",ans:"誤り",
   exp:"競業取引については、利益相反取引のような自己のために直接取引をした取締役の無過失責任の規定（428条１項）は設けられていない。"},
  {id:"K-02-07-021",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (1) 競業避止義務と利益相反取引の制限",num:21,rank:"A",src:"令４Ⅰ問題11 エ",
   q:"第三者のために取締役会設置会社と取引をした取締役の当該取締役会設置会社に対する任務懈怠責任は、任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって、免れることができない。",ans:"誤り",
   exp:"428条１項。自己のために直接取引をした取締役の株式会社に対する損害賠償責任は、任務を怠ったことが当該取締役の責めに帰することができない事由によるものであることをもって免れることができない。すなわち、自己のために直接取引をした取締役は、株式会社に対して無過失の損害賠償責任を負う。利益相反取引の中でも、自己のための直接取引は、利益相反性が著しく高いためである。"},
  {id:"K-02-07-022",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:1,rank:"A",src:"",
   q:"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち額が確定しているものについては、定款にその額を定めていないときは、株主総会の普通決議によって定める。",ans:"正しい",
   exp:"361条１項１号。取締役の報酬規制の趣旨は、お手盛りを防止することにある。本来、報酬等の決定は業務執行に関する決定として取締役会等の業務執行機関の権限に属するはずである。しかし、報酬等の決定を取締役会等に委ねると、不当に高額の報酬を定めるというお手盛りが生じるため、取締役の報酬等については定款または株主総会の決議によって定めることを要求し、会社の利益の保護を図っているのである。"},
  {id:"K-02-07-023",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:2,rank:"A",src:"",
   q:"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち額が確定しているものについて株主総会の普通決議でその額を定める場合、当該議案を株主総会に提出した取締役は、当該株主総会において、当該事項を相当とする理由を説明しなければならない。",ans:"正しい",
   exp:"361条４項。取締役の報酬等に関する事項を定め、またはこれを改定する議案を提出する場合に取締役の説明を要求したのは、株主が当該報酬の妥当性を判断できるようにするためである。"},
  {id:"K-02-07-024",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:3,rank:"A",src:"",
   q:"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち当該株式会社の募集株式については、定款または株主総会の決議によって、募集株式の数の上限を定めなければならない。",ans:"正しい",
   exp:"361条１項３号。なお、種類株式発行会社にあっては、募集株式の種類および種類ごとの数の上限を定める必要がある。"},
  {id:"K-02-07-025",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:4,rank:"A",src:"平27Ⅱ問題８イ",
   q:"指名委員会等設置会社以外の株式会社の取締役は、定款に別段の定めがない場合であっても、株主総会の決議を経ずに、株式会社から賞与を受けることができる。",ans:"誤り",
   exp:"361条１項。取締役の報酬、賞与その他の職務執行の対価として株式会社から受ける財産上の利益（報酬等）については、定款に定めがないときは、株主総会の決議により定める。"},
  {id:"K-02-07-026",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:5,rank:"B",src:"令４Ⅱ問題10 ア",
   q:"監査等委員会設置会社においては、報酬等に関する事項は、監査等委員である取締役とそれ以外の取締役とを区別して定めなければならない。",ans:"正しい",
   exp:"361条２項。また、監査等委員である各取締役の報酬等について定款の定めまたは株主総会の決議がないときは、当該報酬等は、定款または株主総会により決定した報酬等の範囲内において、監査等委員である取締役の協議によって定める（361条３項）。さらに、監査等委員である取締役は、株主総会において、監査等委員である取締役の報酬等について意見を述べることができる（361条５項）。監査等委員である取締役の報酬規制の趣旨は、監査等委員である取締役の独立性を確保することである。"},
  {id:"K-02-07-027",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:6,rank:"B",src:"令４Ⅱ問題10 ウ類・平31Ⅱ問題13 エ類",
   q:"監査等委員である取締役以外の取締役の報酬等については、監査等委員会が選定する監査等委員であっても、株主総会において監査等委員会の意見を述べることができない。",ans:"誤り",
   exp:"361条６項。監査等委員会が選定する監査等委員は、株主総会において、監査等委員である取締役以外の取締役の報酬等について監査等委員会の意見を述べることができる。このように、監査等委員会には、指名委員会等設置会社における報酬委員会に準ずる経営評価の役割が期待されているのである。"},
  {id:"K-02-07-028",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:7,rank:"A",src:"平23Ⅱ問題11 ア",
   q:"指名委員会等設置会社または監査等委員会設置会社を除く株式会社において、取締役は、株主総会において、取締役の報酬等について意見を述べることが認められている。",ans:"誤り",
   exp:"361条参照。取締役（監査等委員である取締役を除く）には、報酬に関する意見陳述権は認められていない。"},
  {id:"K-02-07-029",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:8,rank:"B",src:"平31Ⅱ問題13 ア",
   q:"監査等委員会設置会社における取締役の報酬等のうち額が確定しているものについては、定款または株主総会の決議によって取締役全員に支給する報酬等の総額のみを定め、各取締役の報酬等の決定を取締役会に委ねることが認められる。",ans:"誤り",
   exp:"361条２項。監査等委員会設置会社においては、取締役の報酬等に関する事項は、監査等委員である取締役とそれ以外の取締役とを区別して定めなければならない。監査等委員である取締役の独立性を確保するためである。したがって、取締役全員に支給する報酬等の総額のみを定めることはできないため、本肢は誤りである。"},
  {id:"K-02-07-030",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:9,rank:"A",src:"",
   q:"監査役会設置会社（公開大会社であるものに限る）であって、金融商品取引法第24条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならない株式会社の取締役会は、取締役の報酬等の内容として定款または株主総会の決議による定めがある場合（取締役の個人別の報酬等の内容が定められている場合を除く）には、当該定めに基づく取締役の個人別の報酬等の内容についての決定に関する方針として法務省令で定める事項を決定しなければならない。",ans:"正しい",
   exp:"361条７項１号。「報酬等の決定方針」の決定が求められるのは、取締役の報酬等が取締役に対して職務を適切に執行するインセンティブを付与するための重要な手段であることに鑑み、取締役に対してどのような内容の報酬等を支払い、どのようなインセンティブを付与するかという取締役の報酬等に関する方針が重要なものであると考えられるためである。"},
  {id:"K-02-07-031",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:10,rank:"B",src:"",
   q:"最高裁判所の判例によれば、使用人兼取締役の使用人としての給与は、使用人の受ける給与体系が明確に確立されており、かつ、それによって給与が支給されている場合であっても、取締役としての報酬額に含めて、定款または株主総会で定めなければならない。",ans:"誤り",
   exp:"最判昭60年３月26日。判例によると、使用人兼取締役の使用人としての給与は、使用人の受ける給与体系が明確に確立しており、かつ、それによって給与が支給されている限り、361条１項の報酬等には該当しないとしている。したがって、この場合には使用人としての給与を定款または株主総会で定める必要はない。"},
  {id:"K-02-07-032",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:11,rank:"B",src:"平20 問題13 ア",
   q:"最高裁判所の判例によれば、取締役に対する退職慰労金は、定款または株主総会で定めなければならない報酬等に該当しない。",ans:"誤り",
   exp:"最判昭39年12月11日。判例によると、退職慰労金は、361条１項の報酬等に該当するとしている。退任した取締役の在職中の功労金としての性質の他に、取締役の在任中における職務執行の対価の後払いという性質を有するし、退職慰労金を決める取締役会において、退任した取締役に多くの退職慰労金を支給しておけば、自己が退職するときに多くの退職慰労金を支給してもらえるという期待が生じることは否定できないため、お手盛りの弊害があるからである。"},
  {id:"K-02-07-033",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:12,rank:"B",src:"平20 問題13 イ類",
   q:"最高裁判所の判例によれば、指名委員会等設置会社および監査等委員会設置会社を除く取締役会設置会社（監査役会設置会社ではないものとする）において、株主総会は、その決議により取締役報酬の総額を定めれば足り、各取締役に対する配分の決定を取締役会の決議に委ねてもよい。",ans:"正しい",
   exp:"最判昭60年３月26日。取締役の報酬等の規制の趣旨は、お手盛りを防止することで会社の利益の保護を図ることにあるが、株主総会で取締役全員の報酬等の総額または総額の上限が定められていれば、お手盛りは生じないためである。"},
  {id:"K-02-07-034",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:13,rank:"B",src:"",
   q:"最高裁判所の判例によれば、指名委員会等設置会社および監査等委員会設置会社を除く取締役会設置会社（監査役会設置会社ではないものとする）において、取締役の報酬については、株主総会の決議により、取締役全員の報酬の総額の最高限度額を定め、各取締役に対する配分の決定を取締役会の決定に委任することができ、その委任を受けた取締役会は、その決議によって、各取締役の報酬の額の決定を代表取締役に再委任することができる。",ans:"正しい",
   exp:"最判昭31年10月５日。判例によると、株主総会で取締役全員の報酬等の総額または総額の上限を定めた上で、個々の取締役への具体的な配分の決定が取締役会に一任された場合、当該具体的な配分の決定を代表取締役に再一任することができる。個々の取締役への報酬の具体的な配分の決定は、取締役会の専決事項ではなく、総額または総額の上限が定められていればお手盛りは生じないためである。"},
  {id:"K-02-07-035",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:14,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株主総会が取締役に対する退職慰労金の金額、支払時期、支払方法の決定を取締役会に一任する旨の決議は、いかなる場合であっても無効としている。",ans:"誤り",
   exp:"最判昭39年12月11日。判例によると、① 会社の業績、退任取締役の勤続年数、担当業務、功績の軽重などから算定した一定の基準による決定方法が慣例となっており、② その基準の存在を株主が知ることができる状況であって、③ 当該基準の範囲内において定めることを明示または黙示して決議がなされた場合には、取締役会に一任することも許されるとしている。なぜなら、この場合は、実質的にお手盛りの弊害がないといえるからである。"},
  {id:"K-02-07-036",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:15,rank:"A",src:"",
   q:"指名委員会等設置会社以外の株式会社の取締役の報酬等のうち金銭でないもの（当該株式会社の募集株式および募集新株予約権を除く）については、その具体的な内容を定款または株主総会によって定めることを要する。",ans:"正しい",
   exp:"361条１項６号。"},
  {id:"K-02-07-037",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:16,rank:"B",src:"平20 問題13 エ",
   q:"最高裁判所の判例によれば、定款または株主総会決議によって取締役の報酬額が具体的に定められた後でも、株主総会が当該取締役につき無報酬とする決議をした場合には、当該取締役は当然に報酬請求権を失う。",ans:"誤り",
   exp:"最判平４年12月18日。361条に基づき取締役の報酬等の額が具体的に定められた場合、その報酬額は株式会社と取締役間の委任契約の内容となるので、その後に当該取締役の職務内容に著しい変更があっても、当該取締役が同意しない限り、報酬額を変更することができない。"},
  {id:"K-02-07-038",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (2) 取締役の報酬等",num:17,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株主総会の決議を経ずに支払われた取締役の報酬について事後的に株主総会の決議を経た場合には、当該株主総会の決議の内容等に照らして、取締役の報酬等の規制の趣旨目的を没却するような特段の事情があると認められない限り、取締役の報酬の支払いは株主総会の決議に基づく有効なものとなる。",ans:"正しい",
   exp:"最判平17年２月15日。株主総会の決議を経ずに取締役に報酬が支払われた場合であっても、その後株主総会の決議を経ることにより、事後的ではあるもののお手盛りの弊害を防止するという取締役の報酬等の規制の趣旨は達せられる。そのため、株主総会の決議の内容等に照らして、当該趣旨目的を没却するような特段の事情があると認められない限り、取締役の報酬の支払いは株主総会の決議に基づく有効なものになる。"},
  {id:"K-02-07-039",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:1,rank:"A",src:"平25Ⅱ問題10 ア・平23Ⅰ問題12 イ",
   q:"監査役設置会社の取締役は、株式会社に著しい損害を及ぼすおそれがある事実があることを発見したときは、直ちに、当該事実を株主に報告しなければならない。",ans:"誤り",
   exp:"357条。取締役は、株式会社に著しい損害を及ぼすおそれのある事実があることを発見したときは、直ちに、当該事実を株主（監査役設置会社では監査役、監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会）に報告しなければならない。当該趣旨は、会社の損害を未然に防止することにある。なお、当該規定は、指名委員会等設置会社においては適用されず（419条３項）、同趣旨の報告は、執行役から監査委員に対してなされるべきものとされている（419条１項）。"},
  {id:"K-02-07-040",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:2,rank:"A",src:"平23Ⅰ問題12 ア",
   q:"取締役会設置会社ではなく監査役設置会社でもない会社の取締役は、会社に著しい損害を及ぼすおそれのある事実があることを発見したときは、直ちに、当該事実を株主に報告しなければならない。",ans:"正しい",
   exp:"357条１項。"},
  {id:"K-02-07-041",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:3,rank:"A",src:"平23Ⅰ問題12 ウ・平22Ⅰ問題13 ア",
   q:"監査役会設置会社の取締役は、会社に著しい損害を及ぼすおそれのある事実があることを発見したときは、直ちに、当該事実を監査役会に報告しなければならない。",ans:"正しい",
   exp:"357条２項"},
  {id:"K-02-07-042",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:4,rank:"A",src:"平30Ⅱ問題12 ウ・平25Ⅰ問題11 ア",
   q:"取締役会設置会社でない大会社において、取締役は、定款に別段の定めがある場合を除き、その過半数をもって、株式会社の業務の適正を確保するための体制の整備を決定しなければならない。",ans:"正しい",
   exp:"348条４項。大会社であれば、取締役会設置会社であるか否かを問わず、内部統制システムの整備義務があり（348条４項、362条５項）、その決定は、各取締役に委任することができない（348条３項４号、362条４項６号）。ある程度以上の規模の株式会社には、その業務の適正を確保するための組織体制の構築が必要であるという考え方に基づくものである。また、監査等委員会設置会社および指名委員会等設置会社においては、大会社か否かを問わず、内部統制システムの整備義務がある（399条の13 第１項１号ロハ、２項、416条１項１号ロホ、２項）。"},
  {id:"K-02-07-043",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:5,rank:"C",src:"平25Ⅰ問題11 ウ",
   q:"取締役会設置会社である監査役設置会社において、取締役会は、取締役が株主に報告すべき事項の報告をするための体制の整備を決定しなければならない。",ans:"誤り",
   exp:"362条４項６号、会社法施行規則100条２項。監査役設置会社以外の取締役会設置会社が、取締役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務の適正を確保するために必要なものとして法務省令で定める体制の整備を決定する場合は、当該体制には、取締役が株主に報告すべき事項の報告をするための体制を含むものとする。なぜなら、監査役設置会社以外の株式会社（指名委員会等設置会社および監査等委員会設置会社を除く）において、取締役は、株式会社に著しい損害を及ぼすおそれのあることを発見したときは、直ちに、当該事実を株主に報告しなければならないとされているからである（357条１項）。"},
  {id:"K-02-07-044",subject:"企業法",chapter:"第2章 機関",sub:"7. 取締役の義務と報酬 (3) 取締役の報告義務",num:6,rank:"B",src:"平30Ⅱ問題12 エ・平25Ⅰ問題11 エ類",
   q:"監査役設置会社は、内部統制システムの整備について決定したときは、その決定の内容の概要および当該内部統制システムの運用状況の概要について、事業報告に記載しなければならない。",ans:"正しい",
   exp:"会社法施行規則118条２号。"},
  {id:"K-02-08-001",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:1,rank:"A",src:"",
   q:"会計参与設置会社の監査役は、取締役だけでなく、会計参与の職務執行も監査する。",ans:"正しい",
   exp:"381条１項。"},
  {id:"K-02-08-002",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:2,rank:"A",src:"令２Ⅱ問題11 ウ",
   q:"監査役会設置会社でない監査役設置会社において、監査役が２人以上ある場合、監査役は、全員が共同して監査報告を作成しなければならない。",ans:"誤り",
   exp:"381条１項後段、会社法施行規則129条、会社計算規則122条、127条。監査役設置会社においては、監査役が２人以上ある場合であっても、各監査役が監査報告を作成する。これは、監査役会設置会社においても同様であり、各監査役が作成した監査報告に基づき、監査役会の決議によって、監査役会としての監査報告（監査役会監査報告）を作成しなければならないとされている（390条２項１号、会社法施行規則 130条１項、会社計算規則128条１項）。"},
  {id:"K-02-08-003",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:3,rank:"A",src:"",
   q:"監査役は、いつでも、取締役および会計参与ならびに支配人その他の使用人に対して事業の報告を求めることができる。",ans:"正しい",
   exp:"381条２項。"},
  {id:"K-02-08-004",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:4,rank:"A",src:"",
   q:"監査役は、その職務を行うため必要があるときに限り、監査役設置会社の業務および財産の状況の調査をすることができる。",ans:"誤り",
   exp:"381条２項。監査役は、いつでも、監査役設置会社の業務および財産の状況の調査をすることができる。"},
  {id:"K-02-08-005",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:5,rank:"A",src:"",
   q:"監査役は、いつでも、監査役設置会社の子会社に対して事業の報告を求め、またはその子会社の業務および財産の状況の調査をすることができる。",ans:"誤り",
   exp:"381条３項。監査役は、その職務を行うため必要があるときは、監査役設置会社の子会社に対して事業の報告を求め、またはその子会社の業務および財産の状況の調査をすることができる。"},
  {id:"K-02-08-006",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:6,rank:"A",src:"平31Ⅱ問題11 ア・平25Ⅱ問題10 ウ・平22Ⅰ問題13 ウ",
   q:"取締役会設置会社において、監査役は、取締役が不正の行為をし、もしくは当該行為をするおそれがあると認めるとき、または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認めるときは、遅滞なく、その旨を取締役会に報告しなければならない。",ans:"正しい",
   exp:"382条。監査役は、取締役が不正の行為をし、もしくは当該行為をするおそれがあると認めるとき、または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認めるときは、遅滞なく、その旨を取締役（取締役会設置会社では取締役会）に報告しなければならない。なお、当該報告義務に会社の損害の発生可能性は要件とされていない。この報告に基づき、取締役会の業務執行の監督権限が適切に発揮されることが期待されている。また、「遅滞なく」という要件は、「直ちに」という要件よりは若干の時間的余裕が認められるが、可能な限り迅速に報告することが求められる。"},
  {id:"K-02-08-007",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:7,rank:"A",src:"",
   q:"監査役は、取締役会に出席し、必要があると認めるときは、意見を述べなければならない。",ans:"正しい",
   exp:"383条１項。監査役は取締役の職務の執行の状況を把握する必要があり、また、取締役会に上程された議案の内容に法令違反等がある場合は、意見を述べて是正することが求められているのである。"},
  {id:"K-02-08-008",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:8,rank:"B",src:"令４Ⅱ問題11 エ類・令２Ⅱ問題11 イ類・平29Ⅰ問題11 ウ",
   q:"監査役設置会社において、特別取締役による取締役会決議が行われる取締役会には、監査役は出席することを要しない。",ans:"誤り",
   exp:"383条１項。監査役は、特別取締役による取締役会決議が行われる取締役会に出席し、必要があると認めるときは、意見を述べなければならない。ただし、監査役が２人以上ある場合において、監査役の互選によって、監査役の中から特に当該取締役会に出席する監査役を定めることができる（383条１項ただし書）。"},
  {id:"K-02-08-009",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:9,rank:"A",src:"令７Ⅱ問題８ウ・平25Ⅱ問題10 エ",
   q:"監査役設置会社における監査役は、取締役が株主総会に提出しようとする議案、書類その他法務省令で定めるものを調査し、法令もしくは定款に違反し、または著しく不当な事項があると認めるときは、その調査の結果を株主総会に報告しなければならない。",ans:"正しい",
   exp:"384条。"},
  {id:"K-02-08-010",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:10,rank:"B",src:"平20 問題12 エ",
   q:"監査役は、取締役が監査役設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし、または、これらの行為をするおそれがある場合において、当該行為によって会社に回復することができない損害が生ずるおそれがある場合に限り、当該取締役に対し、当該行為をやめることを請求することができる。",ans:"誤り",
   exp:"385条１項。監査役は、取締役が監査役設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし、または、これらの行為をするおそれがある場合において、当該行為によって会社に著しい損害が生ずるおそれがあるときは、当該取締役に対し、当該行為をやめることを請求することができる。この場合において、裁判所が仮処分をもって当該取締役に対し、その行為をやめることを命ずるときは、監査役に担保を立てさせないものとする（385条２項）。"},
  {id:"K-02-08-011",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:11,rank:"B",src:"令７Ⅱ問題13 イ類・平29Ⅰ問題13 イ",
   q:"株式会社がその監査役の債務を保証する契約を第三者との間で締結する場合、当該監査役は、株主総会において当該契約について重要な事実を開示し、株主総会の承認を受けなければならない。",ans:"誤り",
   exp:"監査役には業務執行権限がないため、利益相反取引の規制は設けられていない。"},
  {id:"K-02-08-012",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (1) 監査役の権限",num:12,rank:"A",src:"令７Ⅱ問題13 エ類・平30Ⅰ問題12 ウ・平20 問題12 ウ類",
   q:"監査役会設置会社における監査役が、取締役の法令違反行為をやめることを請求するには、その旨の監査役会の決議が必要である。",ans:"誤り",
   exp:"385条参照。監査役が取締役の違法行為差止請求権を行使する場合に、監査役会の決議は不要である。"},
  {id:"K-02-08-013",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:1,rank:"A",src:"令６Ⅰ問題８ア・平30Ⅰ問題12 ア",
   q:"公開会社でない監査役会設置会社は、その監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができない。",ans:"正しい",
   exp:"389条１項かっこ書。非公開会社（監査役会設置会社および会計監査人設置会社を除く）では、監査役の監査の範囲を会計に関するものに限定する旨を定款で定めることができる。非公開非大会社の中には、業務監査を行うことのできる適切な人材を確保することが困難な株式会社が存在すると考えられるため、そのような会社の負担を減らすことが、定款の定めによる監査範囲の限定規定の趣旨である。非公開会社に限定している理由は、公開会社の株主は頻繁に変動することが想定されるため、株主による監督を期待することができないからである。また、監査役会設置会社が除かれる理由は、監査役会をわざわざ置く以上は監査役に業務監査権限を与えることがふさわしいからである。そして、会計監査人設置会社が除かれる理由は、会計監査人設置会社に、会計の専門的知識や経験を有しない会計監査権のみを有する監査役を置く意義は乏しいし、監査役が会計監査人の監査の方法および結果の相当性を判断するためには業務監査権を有する必要性があると考えられたためである。"},
  {id:"K-02-08-014",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:2,rank:"A",src:"平28Ⅰ問題７エ・平20 問題７ア",
   q:"公開会社は、定款の定めによっても、監査役の監査の範囲を会計に関するものに限定することができない。",ans:"正しい",
   exp:"389条１項。問題１の解説参照。"},
  {id:"K-02-08-015",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:3,rank:"B",src:"平27Ⅰ問題10 ア",
   q:"監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社の監査役の資格を株主に限定する旨の定款の定めは、無効である。",ans:"誤り",
   exp:"389条１項、335条１項、331条２項ただし書き。会計限定監査役は非公開会社（監査役会設置会社および会計監査人設置会社を除く）にのみ設置が許容され、非公開会社においては、監査役が株主でなければならない旨を定款で定めることができる。"},
  {id:"K-02-08-016",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:4,rank:"B",src:"令７Ⅰ問題13 ウ類",
   q:"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は、その旨を登記しなければならない。",ans:"正しい",
   exp:"911条３項17号イ。"},
  {id:"K-02-08-017",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:5,rank:"B",src:"",
   q:"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社は、監査役設置会社である。",ans:"誤り",
   exp:"２条９号。監査役設置会社とは、監査役を置く株式会社（その監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがあるものを除く）または会社法の規定により監査役を置かなければならない株式会社をいう。"},
  {id:"K-02-08-018",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:6,rank:"B",src:"平27Ⅱ問題10 ウ",
   q:"監査の範囲を会計に関するものに限定された監査役は、いつでも、会計帳簿またはこれに関する資料の閲覧および謄写をすることができる。",ans:"正しい",
   exp:"389条４項。取締役および会計参与ならびに支配人その他の使用人に対して会計に関する報告を求める場合も同様である。"},
  {id:"K-02-08-019",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:7,rank:"B",src:"令７Ⅰ問題13 エ類",
   q:"監査の範囲を会計に関するものに限定された監査役は、いつでも、株式会社の業務および財産の状況の調査をすることができる。",ans:"誤り",
   exp:"389条５項。監査の範囲を会計に関するものに限定された監査役は、その職務を行うため必要があるときは、株式会社の業務および財産の状況の調査をすることができる。また、株式会社の子会社に会計に関する報告を求めること、または、その子会社の業務および財産の状況の調査をする場合も同様である。"},
  {id:"K-02-08-020",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:8,rank:"B",src:"平29Ⅰ問題13 エ",
   q:"監査の範囲を会計に関するものに限定された監査役は、取締役が株主総会に提出しようとするすべての議案、書類等を調査し、その調査の結果を株主総会に報告しなければならない。",ans:"誤り",
   exp:"389条３項。監査の範囲を会計に関するものに限定された監査役は、取締役が株主総会に提出しようとする会計に関する議案、書類等を調査し、その調査の結果を株主総会に報告しなければならない。監査の範囲を限定していない監査役の調査結果報告義務（384条後段）と異なり、株主総会に対する報告を常に要求している。"},
  {id:"K-02-08-021",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:9,rank:"B",src:"平27Ⅱ問題10 イ",
   q:"株式会社の定款の定めにより監査の範囲を会計監査に限定された監査役は、当該株式会社の株主が取締役の責任追及の訴えを提起する前に、当該株式会社に対して行う当該責任追及に係る提訴請求を適法に受けることができる。",ans:"誤り",
   exp:"389条７項。386条の規定（会社と取締役との間の訴えにおいて、馴れ合い訴訟を防止するために、監査役が会社を代表する規定）は、監査役設置会社に適用されるものであるため、監査の範囲を会計に関するものに限定する旨の定款の定めがある株式会社には適用されない。したがって、株式会社が監査役の監査の範囲を会計に関するものに限定する旨を定款で定めた場合、株式会社と取締役との間の訴えにおいては、監査役がいない株式会社と同様に、株主総会または取締役会での定めがない場合は、代表取締役が株式会社を代表することとなる（353条、364条、349条４項）。"},
  {id:"K-02-08-022",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:10,rank:"B",src:"平27Ⅰ問題10 イ",
   q:"取締役会設置会社において、監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある監査役は、取締役会に出席しなければならない。",ans:"誤り",
   exp:"389条７項、383条。定款の定めにより監査役の監査の範囲を会計に関するものに限定した株式会社については、取締役会出席義務および意見陳述義務に関する規定は適用されない。"},
  {id:"K-02-08-023",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (2) 定款の定めによる監査範囲の限定",num:11,rank:"B",src:"平27Ⅰ問題10 ウ",
   q:"監査役の監査の範囲を会計に関するものに限定する旨の定款の定めがある監査役は、取締役に対して事業の報告を求める権限を有しない。",ans:"正しい",
   exp:"389条７項、381条２項。定款の定めにより監査役の監査の範囲を会計に関するものに限定した株式会社については、事業報告要求権に関する規定は適用されない。"},
  {id:"K-02-08-024",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (3) 監査役の報酬等",num:1,rank:"A",src:"",
   q:"取締役会設置会社において、監査役の報酬等は、取締役会の決議によって定める。",ans:"誤り",
   exp:"387条１項。監査役の報酬等は、定款にその額を定めていないときは、株主総会の決議によって定める。監査役の報酬規制の趣旨は、監査役の独立性を確保することである。本来、報酬等の決定は業務執行に関する決定として取締役会等の業務執行機関の権限に属するはずである。しかし、報酬等の決定を取締役会等に委ねると、監査役の監査対象者である取締役によって監査役の報酬等が決定されてしまうことになるため、監査役の独立性を確保することができない。したがって、監査役の報酬等については定款または株主総会の決議によって定めることを要求しているのである。また、同趣旨で、監査役は、株主総会において、監査役の報酬等について意見を述べることができる（387条３項）。"},
  {id:"K-02-08-025",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (3) 監査役の報酬等",num:2,rank:"A",src:"平23Ⅱ問題11 ウ",
   q:"監査役は、株主総会において、監査役の報酬等について意見を述べることができる。",ans:"正しい",
   exp:"387条３項。"},
  {id:"K-02-08-026",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (3) 監査役の報酬等",num:3,rank:"A",src:"",
   q:"監査役が２人以上いる場合においては、各監査役の報酬について定款または株主総会の決議によって定めなければならない。",ans:"誤り",
   exp:"387条２項。監査役が２人以上いる場合において、各監査役の報酬等について定款の定めまたは株主総会の決議がない場合は、当該報酬等は、定款または株主総会により決定した報酬等の範囲内において、監査役の協議によって定めることとされている。"},
  {id:"K-02-08-027",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (4) 費用等の請求",num:1,rank:"A",src:"令２Ⅱ問題11 ア",
   q:"監査役が費用の前払を株式会社に請求する場合には、当該監査役は、当該費用が監査に必要な費用であることを証明する必要はない。",ans:"正しい",
   exp:"388条１号。監査役がその職務の執行について会社に対して費用の前払の請求をしたときは、当該会社は、当該請求に係る費用が当該監査役の職務の執行に必要でないことを証明した場合を除き、当該請求を拒むことができない。監査役の監査費用等の請求規定の趣旨は、監査役の独立性を確保することである。監査役に監査費用が職務の執行に必要であるという証明責任を負わせてしまうと、監査費用の支出に躊躇し、十分な監査を行うことができない危険性がある。そこで、会社法は、証明責任を会社側に転換することにより監査の充実を図っているのである。"},
  {id:"K-02-08-028",subject:"企業法",chapter:"第2章 機関",sub:"8. 監査役 (4) 費用等の請求",num:2,rank:"A",src:"平29Ⅰ問題13 ウ",
   q:"監査役の監査の範囲を会計に関するものに限定する旨を定款で定めている株式会社において、監査役は、その職務の執行について当該株式会社に対して費用の前払の請求をすることができない。",ans:"誤り",
   exp:"388条１号。監査役がその職務の執行について監査役設置会社（監査役の監査の範囲を会計に関するものに限定する旨の定めがある株式会社を含む）に対して費用の前払の請求をしたときは、当該会社は、当該請求に係る費用または債務が当該監査役の職務の執行に必要でないことを証明した場合を除き、当該請求を拒むことができない。この規定は、監査役の監査の範囲を会計に関するものに限定する旨の定めがある株式会社にも適用されるため、本肢は誤りである。"},
  {id:"K-02-09-001",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (1) 監査役会の構成",num:1,rank:"A",src:"令６Ⅰ問題10 ウ・令３問題10 ウ類・平28Ⅰ問題７ウ・平23Ⅰ問題10 ア",
   q:"監査役会設置会社においては、監査役は、３人以上で、そのうち過半数は、社外監査役でなければならない。",ans:"誤り",
   exp:"335条３項。監査役会設置会社において、監査役は、３人以上で、そのうち半数以上は、社外監査役でなければならない。ここで、監査役会設置会社において社外監査役の員数が監査役の半数以上とされたのは、監査役就任前に株式会社または子会社の取締役や使用人であったために社内情報に通じた者と、社外監査役として株式会社の過去のしがらみにとらわれず判断し、かつ、代表取締役にも直言できる独立性の高い者とが協力して監査を実施することが期待されているからである。"},
  {id:"K-02-09-002",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (1) 監査役会の構成",num:2,rank:"A",src:"令３問題10 エ類・平23Ⅰ問題10 イ類・平23Ⅱ問題10 ア・平22Ⅱ問題８エ類",
   q:"監査役会は、社外監査役以外の監査役の中から、常勤の監査役を選定しなければならない。",ans:"誤り",
   exp:"390条３項。監査役会は、監査役の中から常勤の監査役を選定しなければならない。したがって、社外監査役を常勤監査役として選定することも認められる。"},
  {id:"K-02-09-003",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (1) 監査役会の構成",num:3,rank:"A",src:"平21 問題８エ",
   q:"大会社でない監査役会設置会社は、常勤の監査役を選定しなくてもよい。",ans:"誤り",
   exp:"390条２項２号。監査役会の職務として、常勤の監査役の選定および解職が定められており、大会社か否かにかかわらず、常勤の監査役を設置する必要がある。"},
  {id:"K-02-09-004",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (1) 監査役会の構成",num:4,rank:"A",src:"平30Ⅰ問題８ウ",
   q:"監査役会設置会社は、常勤の監査役を選定する旨を、定款によって定めなければならない。",ans:"誤り",
   exp:"監査役会設置会社は、常勤の監査役を選定する必要があるが（390条３項）、その旨を定款に定める必要はない。"},
  {id:"K-02-09-005",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (2) 監査役会の権限等",num:1,rank:"A",src:"平24Ⅱ問題12 エ類・平23Ⅰ問題10 ウ",
   q:"監査役会は、監査の方針、監査役会設置会社の業務および財産の状況の調査の方法その他の監査役の職務の執行に関する事項の決定をするが、当該決定は、監査役の権限の行使を妨げることはできない。",ans:"正しい",
   exp:"390条２項柱書ただし書３号。監査の方針等の決定は、監査役の権限の行使を妨げることはできないとされている。すなわち、監査役会において役割分担等を決定したとしても、各監査役の監査権限を制限することはできないのである。このように、監査役会を設置した場合であっても、各監査役は独任制の機関である。"},
  {id:"K-02-09-006",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (2) 監査役会の権限等",num:2,rank:"B",src:"",
   q:"監査役は、監査役会の要請があるときは、いつでも、その職務の状況を監査役会に報告しなければならない。",ans:"正しい",
   exp:"390条４項。各監査役の監査機関としての活動について連絡・調整を行い、連携協力することで、監査の実効性を高めるためである。"},
  {id:"K-02-09-007",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (3) 監査役会の招集",num:1,rank:"A",src:"平23Ⅱ問題10 ウ",
   q:"定款で監査役会を招集する監査役を定めたときは、他の監査役は、監査役会を招集することができない。",ans:"誤り",
   exp:"391条。監査役会は、各監査役が招集する。監査役会の招集権者は、取締役会の場合（366条１項ただし書参照）と異なり、招集権者を限定することは認められない。これは、監査役が独任制の機関だからである。"},
  {id:"K-02-09-008",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (3) 監査役会の招集",num:2,rank:"B",src:"平22Ⅰ問題12 イ類",
   q:"監査役会は、監査役の全員の同意があっても、招集の手続を省略することができない。",ans:"誤り",
   exp:"392条２項。監査役会は、監査役の全員の同意がある場合は、招集の手続を経ることなく開催することができる。"},
  {id:"K-02-09-009",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (4) 監査役会の決議",num:1,rank:"B",src:"",
   q:"監査役会の決議は、議決に加わることができる監査役の過半数が出席し、その過半数をもって行う。",ans:"誤り",
   exp:"393条１項。監査役会の決議は、監査役の過半数をもって行う。すなわち、監査役会の決議は、取締役会の場合（369条１項参照）と異なり、定足数は設けられていない。また、決議の省略の制度（370条参照）も認められない。"},
  {id:"K-02-09-010",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (4) 監査役会の決議",num:2,rank:"A",src:"平30Ⅰ問題12 イ・平23Ⅰ問題10 エ",
   q:"監査役会設置会社は、監査役の全員が書面または電磁的記録により同意の意思表示をしたときは、当該議案を可決する旨の監査役会の決議があったものとみなす旨を定款で定めることができる。",ans:"誤り",
   exp:"319条参照。監査役会制度の趣旨は、大規模な株式会社において、監査役が集まって監査の方針やそれぞれの役割分担を取り決め、互いに連携協力をすることにより、監査の重複等を避けた組織的かつ効率的な監査を可能とすることにある。したがって、決議の省略を認めてしまうと当該趣旨を達成することができないため、監査役会の決議には、取締役会の場合（370条参照）と異なり、決議の省略の制度は設けられていない。"},
  {id:"K-02-09-011",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (5) 監査役会の議事録",num:1,rank:"B",src:"",
   q:"監査役会の議事については、議事録を作成し、議事録が書面をもって作成されているときは、出席した監査役は当該議事録に署名または記名押印しなければならない。",ans:"正しい",
   exp:"393条２項。監査役会の決議に参加した監査役であって、議事録に異議をとどめない者は、その決議に賛成したものと推定される（393条４項）。"},
  {id:"K-02-09-012",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (5) 監査役会の議事録",num:2,rank:"A",src:"平22Ⅰ問題12 エ",
   q:"監査役会の決議に参加した監査役であって、監査役会の議事録に異議をとどめないものは、その決議に賛成したものと推定される。",ans:"正しい",
   exp:"393条４項。"},
  {id:"K-02-09-013",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (5) 監査役会の議事録",num:3,rank:"B",src:"令７Ⅱ問題13 ウ類・平23Ⅱ問題10 エ類",
   q:"株主は、その権利を行使するため必要があるときは、株式会社の営業時間内はいつでも、監査役会議事録の閲覧を請求することができる。",ans:"誤り",
   exp:"394条２項。株主は、その権利を行使するために必要があるときは、裁判所の許可を得て、監査役会議事録の閲覧または謄写を請求することができる。また、債権者が役員の責任を追及するため必要があるとき、および、親会社社員がその権利を行使するため必要があるときも、裁判所の許可を得て、議事録の閲覧または謄写を請求することができる（394条３項）。ただし、裁判所は、監査役設置会社の株主の請求、もしくは、監査役会設置会社の債権者または親会社社員の請求に係る議事録の閲覧または謄写をすることにより、当該監査役会設置会社またはその親会社もしくは子会社に著しい損害を及ぼすおそれがあると認めるときは、当該請求を許可することができない（394条４項）。"},
  {id:"K-02-09-014",subject:"企業法",chapter:"第2章 機関",sub:"9. 監査役会 (6) 監査役会への報告の省略",num:1,rank:"C",src:"令３問題10 イ類",
   q:"取締役、会計参与、監査役または会計監査人が監査役の全員に対して監査役会に報告すべき事項を通知したときは、当該事項を監査役会へ報告することを要しない。",ans:"正しい",
   exp:"395条。"},
  {id:"K-02-10-001",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:1,rank:"A",src:"",
   q:"会計参与は、取締役（指名委員会等設置会社では執行役）の代わりに、計算書類およびその附属明細書、臨時計算書類ならびに連結計算書類を作成する。",ans:"誤り",
   exp:"374条１項前段６項。会計参与は、取締役（指名委員会等設置会社では執行役）と共同して、計算書類およびその附属明細書、臨時計算書類ならびに連結計算書類を作成する。この場合において、会計参与は、法務省令で定めるところにより、会計参与報告を作成しなければならない（374条１項後段）。"},
  {id:"K-02-10-002",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:2,rank:"B",src:"",
   q:"会計参与は、いつでも、会計帳簿またはこれに関する資料の閲覧および謄写をすることができる。",ans:"正しい",
   exp:"374条２項。また、会計参与は、いつでも、取締役（指名委員会等設置会社では取締役および執行役）および支配人その他の使用人に対して会計に関する報告を求めることができる（374条２項柱書）。"},
  {id:"K-02-10-003",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:3,rank:"B",src:"令４Ⅱ問題12 ア",
   q:"会計参与は、いつでも、取締役および支配人その他の使用人に対して会計に関する報告を求めることができる。",ans:"正しい",
   exp:"374条２項柱書。"},
  {id:"K-02-10-004",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:4,rank:"B",src:"令８Ⅰ問題11 イ類・令４Ⅱ問題12 イ",
   q:"会計参与は、いつでも、会計参与設置会社の業務および財産の状況の調査をすることができる。",ans:"誤り",
   exp:"374条３項。会計参与は、その職務を行うため必要があるときは、会計参与設置会社の業務および財産の状況の調査をすることができる。これは、会計参与設置会社の子会社に対して会計に関する報告を求め、または、業務および財産の状況を調査する場合も同様である。"},
  {id:"K-02-10-005",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:5,rank:"B",src:"平24Ⅰ問題11 エ類",
   q:"会計参与は、その職務を行うため必要があるときは、会計参与設置会社の子会社に対して会計に関する報告を求めることができるが、当該子会社は、正当な理由があるときは、当該報告を拒むことができる。",ans:"正しい",
   exp:"374条３項４項。"},
  {id:"K-02-10-006",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:6,rank:"B",src:"令４Ⅱ問題12 エ類",
   q:"会計参与は、株主総会において、計算書類等の作成に関して株主から質問がなされた場合に限り、意見を述べることができる。",ans:"誤り",
   exp:"377条１項。計算書類等の作成に関する事項について会計参与が取締役（指名委員会等設置会社では執行役）と意見を異にするときは、会計参与は、株主総会において意見を述べることができる（377条）。すなわち、会計参与は自発的に意見を述べることが認められている。"},
  {id:"K-02-10-007",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:7,rank:"A",src:"令２Ⅰ問題11 イ類・平27Ⅱ問題９ウ・平25Ⅱ問題10 イ類・平22Ⅰ問題13 イ類",
   q:"監査役設置会社の会計参与は、その職務を行うに際して取締役の職務の執行に関し不正の行為または法令もしくは定款に違反する重大な事実があることを発見したときは、遅滞なく、これを株主に報告しなければならない。",ans:"誤り",
   exp:"375条１項。会計参与は、その職務を行うに際して取締役（指名委員会等設置会社では執行役または取締役）の職務執行に関し不正の行為または法令もしくは定款に違反する重大な事実があることを発見したときは、遅滞なく、これを株主（監査役設置会社では監査役、監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会）に報告しなければならない（375条）。"},
  {id:"K-02-10-008",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:8,rank:"A",src:"平22Ⅱ問題10 ウ",
   q:"指名委員会等設置会社の会計参与は、その職務を行うに際して執行役または取締役の職務執行に関し不正の行為を発見したときは、遅滞なく、監査委員会に報告しなければならない。",ans:"正しい",
   exp:"375条１項４項。"},
  {id:"K-02-10-009",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:9,rank:"A",src:"平26Ⅱ問題10 イ",
   q:"取締役会設置会社の会計参与が税理士法人である場合には、その職務を行うべき社員は、臨時計算書類の承認をする取締役会に出席しなければならない。",ans:"正しい",
   exp:"376条１項前段。取締役会設置会社の会計参与（会計参与が監査法人または税理士法人である場合にはその職務を行うべき社員）は、計算書類、臨時計算書類または連結計算書類の承認をする取締役会に出席しなければならない。この場合において、会計参与は、必要があると認めるときは、意見を述べなければならない（376条１項後段）。"},
  {id:"K-02-10-010",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:10,rank:"A",src:"令４Ⅱ問題12 ウ",
   q:"取締役会設置会社の会計参与は、必要があると認めるときは、各事業年度に係る計算書類および事業報告ならびにこれらの附属明細書、臨時計算書類または連結計算書類を承認する取締役会の招集を請求することができる。",ans:"誤り",
   exp:"取締役会設置会社の会計参与は、計算書類、臨時計算書類または連結計算書類の承認をする取締役会に出席しなければならない（376条１項前段）。この場合において、会計参与は、必要があると認めるときは、意見を述べなければならない（同条項後段）。このような取締役会出席義務や意見陳述義務は法定されているが、取締役会の招集請求権は会計参与には認められていないため、本肢は誤りである。"},
  {id:"K-02-10-011",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (1) 会計参与の権限",num:11,rank:"C",src:"令８Ⅰ問題11 エ",
   q:"会計参与は、会社法所定の期間、法務省令で定めるところにより、当該会計参与が定めた場所に各事業年度に係る計算書類およびその附属明細書ならびに会計参与報告を備え置かなければならない。",ans:"正しい",
   exp:"378条１項。会計参与は、各事業年度に係る計算書類およびその附属明細書ならびに会計参与報告を、定時株主総会の日の１週間（取締役会設置会社では２週間）前の日から５年間、法務省令で定めるところにより、当該会計参与が定めた場所に備え置かなければならない。なお、計算書類の承認についての株主総会の決議が、319条１項の規定により省略された場合には、各事業年度に係る計算書類およびその附属明細書ならびに会計参与報告の備置期間は、承認議案が提案された日から５年間となる（378条１項１号かっこ書）。"},
  {id:"K-02-10-012",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (2) 会計参与の報酬等",num:1,rank:"A",src:"平31Ⅰ問題11 エ・平24Ⅰ問題11 ウ類",
   q:"指名委員会等設置会社以外の取締役会設置会社における会計参与の報酬等は、定款にその額を定めていないときは、取締役会の決議によって定める。",ans:"誤り",
   exp:"379条１項。指名委員会等設置会社以外の株式会社における会計参与の報酬等については、定款または株主総会（普通決議）によって定める（379条１項）。この趣旨は、会計参与の独立性を確保することにある。また、会計参与が２人以上ある場合において、各会計参与の報酬等について定款の定めまたは株主総会の決議がない場合は、当該報酬等は、定款または株主総会により決定した報酬等の範囲内において、会計参与の協議によって定めることとされている（379条２項）。"},
  {id:"K-02-10-013",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (2) 会計参与の報酬等",num:2,rank:"A",src:"平23Ⅱ問題11 イ",
   q:"会計参与は、株主総会において、会計参与の報酬等について意見を述べることができる。",ans:"正しい",
   exp:"379条３項。会計参与の独立性を確保するためである。"},
  {id:"K-02-10-014",subject:"企業法",chapter:"第2章 機関",sub:"10. 会計参与 (2) 会計参与の報酬等",num:3,rank:"B",src:"",
   q:"会計参与がその職務の執行について会計参与設置会社に対して費用の前払の請求をする場合は、当該会計参与設置会社に対して、当該請求に係る費用が当該会計参与の職務の執行に必要であることを証明しなければならない。",ans:"誤り",
   exp:"380条１号。会計参与がその職務の執行について会社に対して費用の前払の請求をしたときは、当該会社は、当該請求に係る費用が当該会計参与の職務の執行に必要でないことを証明した場合を除き、当該請求を拒むことができない。監査役の監査費用等の請求規定と同様である。"},
  {id:"K-02-11-001",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:1,rank:"A",src:"",
   q:"会計監査人は、いつでも、会計帳簿またはこれに関する資料の閲覧または謄写をすることができる。",ans:"正しい",
   exp:"396条２項。"},
  {id:"K-02-11-002",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:2,rank:"A",src:"令３問題12 ア類・平26Ⅱ問題11 ア",
   q:"会計監査人は、いつでも、支配人その他の使用人に対し、会計に関する報告を求めることができる。",ans:"正しい",
   exp:"396条２項柱書。会計監査人の職務は会計監査であるので、会計監査人は、いつでも、取締役（指名委員会等設置会社では執行役および取締役）、会計参与ならびに支配人その他の使用人に対し、会計に関する報告を求めることができる。"},
  {id:"K-02-11-003",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:3,rank:"A",src:"",
   q:"会計監査人は、いつでも、会計監査人設置会社の業務および財産の状況の調査をすることができる。",ans:"誤り",
   exp:"396条３項。会計監査人の職務および権限は、計算書類等の監査、すなわち会計監査に限定されており、業務監査権限はない。したがって、会計監査人設置会社の業務および財産の状況の調査をするためには、職務を行うため必要であることが要件となる。なお、裁判所の許可は不要である。また、会計監査人の監査対象会社は、会計監査人設置会社であるため、その子会社に対して会計に関する報告を求めること、または、子会社の業務および財産の状況の調査をする場合も同様に、職務を行うため必要であることが要件となる。"},
  {id:"K-02-11-004",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:4,rank:"A",src:"平26Ⅱ問題11 イ",
   q:"会計監査人は、その職務を行うために必要があるときは、会計監査人設置会社の親会社に対して会計に関する報告を求めることができる。",ans:"誤り",
   exp:"このような規定はない。会計監査人は、その職務を行うために必要があるときは、その子会社に対して会計に関する報告を求め、または会計監査人設置会社の子会社の業務および財産の状況の調査をすることができる（396条３項）。"},
  {id:"K-02-11-005",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:5,rank:"A",src:"令３問題12 イ類・平25Ⅰ問題10 ア",
   q:"株式会社の会計監査人は、裁判所の許可を得なければ、当該株式会社の子会社の業務および財産の状況の調査をすることができない。",ans:"誤り",
   exp:"396条３項。会計監査人は、その職務を行うため必要があるときは、会計監査人設置会社の子会社の業務および財産の状況の調査をすることができる。なお、会計監査人の子会社調査権の行使については、裁判所の許可は不要である。"},
  {id:"K-02-11-006",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:6,rank:"A",src:"平29Ⅱ問題12 エ",
   q:"会計監査人が、会計監査人設置会社の子会社に対して会計に関する報告を求める場合において、当該子会社は、正当な理由があるときは、当該報告を拒むことができる。",ans:"正しい",
   exp:"396条４項。子会社調査権は、親会社が子会社を利用して粉飾決算を行う等の事例が少なくないことなどから、会計監査人に対して付与されている。"},
  {id:"K-02-11-007",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:7,rank:"A",src:"平26Ⅱ問題11 ウエ類",
   q:"計算書類が法令に適合するかどうかについて監査役会設置会社の会計監査人が監査役会と意見を異にするときは、当該会計監査人は、監査役会に出席して意見を述べることができる。",ans:"誤り",
   exp:"398条１項３項。計算書類が法令または定款に適合するかどうかについて会計監査人が監査役（監査役会設置会社では監査役会または監査役、監査等委員会設置会社では監査等委員会またはその委員、指名委員会等設置会社では監査委員会またはその委員）と意見を異にするときは、会計監査人（会計監査人が監査法人である場合にはその職務を行うべき社員）は、定時株主総会に出席して意見を述べることができる（398条１項３項４項５項）。"},
  {id:"K-02-11-008",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:8,rank:"A",src:"令３問題12 ウ類・令２Ⅰ問題11 アエ類・平27Ⅰ問題11 ウ・平22Ⅰ問題13 エ",
   q:"監査役会設置会社において、会計監査人は、その職務を行うに際して取締役の職務の執行に関し不正の行為があることを発見したときは、遅滞なく、これを取締役会に報告しなければならない。",ans:"誤り",
   exp:"397条１項３項。会計監査人は業務監査権を有しないが、会計監査人が行う会計監査の過程において取締役の不正な行為等について発見することがあり得る。そこで、そのような場合に適切な是正措置をとることができるようにするため、会計監査人には、当該事実を監査役（監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会）へ報告することが義務づけられている。これは、会計参与に課せられている報告義務（375条）と同趣旨の規定である。"},
  {id:"K-02-11-009",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:9,rank:"A",src:"令２Ⅱ問題11 エ・平27Ⅱ問題10 エ",
   q:"監査役は、その職務を行うため必要があるときは、会計監査人に対し、その監査に関する報告を求めることができる。",ans:"正しい",
   exp:"397条２項。監査役の会計監査人に対する報告請求権は、監査役と会計監査人が連携し、効率的な監査を進めるためのものである。なお、監査等委員会設置会社においては監査等委員会が選定した監査等委員、指名委員会等設置会社においては監査委員会が選定した監査委員も同様の報告を求めることができる（397条２項４項５項）。"},
  {id:"K-02-11-010",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:10,rank:"A",src:"平25Ⅰ問題10 ウ類",
   q:"定時株主総会において会計監査人の出席を求める決議は、計算書類等が法令または定款に適合するか否かについて会計監査人が監査役と意見を異にする場合に限ってすることができる。",ans:"誤り",
   exp:"398条２項。定時株主総会において、会計監査人の出席を求める決議があったときは、会計監査人は、定時株主総会に出席して意見を述べなければならない。したがって、定時株主総会における出席要求決議に関しては、計算書類等の法令または定款の適合性について会計監査人と監査役とが意見を異にする必要はない。これに対して、会計監査人の株主総会における意見陳述権（398条１項）については、計算書類等の法令または定款の適合性について会計監査人と監査役とが意見を異にすることが要件となっている。"},
  {id:"K-02-11-011",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:11,rank:"B",src:"平22Ⅰ問題12 ウ",
   q:"会計監査人は、監査役が作成した監査報告を受領した後でなければ、会計監査報告を作成することができない。",ans:"誤り",
   exp:"会社計算規則128条。会計監査については、監査役と会計監査人の権限の無意味な重複を避けるため、まず、会計監査人が会計監査を行い（会社計算規則126条）、監査役は、その会計監査人の監査を前提として、会計監査人の監査の方法または結果についての各監査役の報告に基づき、会計監査人の監査の方法または結果を相当でないと認めた場合に、その旨および理由を監査報告に記載するという構造をとっている。"},
  {id:"K-02-11-012",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:12,rank:"B",src:"平22Ⅰ問題12 ア",
   q:"会計監査人は、監査役に対し、監査役会の目的である事項を示して、監査役会の招集を請求することができる。",ans:"誤り",
   exp:"このような規定はない。"},
  {id:"K-02-11-013",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:13,rank:"A",src:"令６Ⅰ問題13 ア類・平28Ⅱ問題13 エ",
   q:"監査等委員会設置会社において、会計監査人の報酬等の内容は監査等委員会が決定する。",ans:"誤り",
   exp:"会計監査人の報酬等については、会計監査人と株式会社との間で締結される監査契約において定められるため、一般の取引契約と同様に、通常の業務執行に関する事項として決定される。すなわち、取締役会等によって会計監査人の報酬等は決定される。ただし、会計監査人の独立性を確保するために、取締役は、会計監査人または一時会計監査人の職務を行うべき者の報酬等を定める場合には、監査役（監査役が２人以上ある場合はその過半数、監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会）の同意を得なければならない（399条）。"},
  {id:"K-02-11-014",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:14,rank:"A",src:"平29Ⅱ問題12 ウ",
   q:"指名委員会等設置会社以外の取締役会設置会社において、定款に会計監査人の報酬等の額を定めていないときは、株主総会の決議によってこれを定める。",ans:"誤り",
   exp:"このような規定はない。問題13 の解説参照。"},
  {id:"K-02-11-015",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:15,rank:"A",src:"平23Ⅱ問題11 エ",
   q:"会計監査人の報酬等は株主総会の決議によって定められ、会計監査人は、株主総会において、会計監査人の報酬等について意見を述べることが認められている。",ans:"誤り",
   exp:"399条参照。会計監査人の報酬等は監査契約で定められるため、株主総会で決定されるものではなく、会計監査人には、報酬に関する意見陳述権は認められていない。"},
  {id:"K-02-11-016",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:16,rank:"A",src:"平27Ⅰ問題11 エ",
   q:"指名委員会等設置会社における会計監査人の報酬の決定は、取締役会、または取締役会の決議によって委任を受けた執行役が行う。",ans:"正しい",
   exp:"会計監査人の報酬等は、通常の業務執行に関する事項として決定される。また、指名委員会等設置会社において執行役に委任することができない事項（416条４項各号参照）に含まれていないため、取締役会の決議によってその決定を執行役に委任することができる。"},
  {id:"K-02-11-017",subject:"企業法",chapter:"第2章 機関",sub:"11. 会計監査人",num:17,rank:"A",src:"平31Ⅱ問題13 イ・平25Ⅰ問題10 イ",
   q:"監査役会設置会社において、取締役が会計監査人の報酬を定める場合には、監査役会の同意を得なければならない。",ans:"正しい",
   exp:"399条１項２項。会計監査人の報酬等の決定に関する監査役等の同意が要求されている趣旨は、会計監査人の独立性を確保することにある。会計監査人の報酬等は、通常の業務執行に関する事項として決定されるが、多額の報酬等を与えることにより会計監査に手を加えてもらう、あるいは、少額の報酬等しか与えないことによって適切な監査の質および量を確保できなくなるといった事態が生じるのを防止するため、監査役等に対して同意権を与えて報酬等の適正さを確保し、もって、会計監査人の独立性を保持しようとしているのである。"},
  {id:"K-02-12-001",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:1,rank:"A",src:"令２Ⅱ問題８エ",
   q:"指名委員会等設置会社は、定款に、指名委員会、監査委員会および報酬委員会を置く旨を定めなければならない。",ans:"正しい",
   exp:"２条12号、326条２項。指名委員会等設置会社とは、指名委員会、監査委員会および報酬委員会（指名委員会等）を置く株式会社をいう。株式会社は、定款の定めによって、取締役会、会計参与、監査役、監査役会、会計監査人、監査等委員会または指名委員会等を置くことができる。つまり、株式会社において必ず設置が義務づけられている機関（株主総会および取締役）以外の機関を置く場合には、定款にその旨を定めなければならない。"},
  {id:"K-02-12-002",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:2,rank:"A",src:"令６Ⅰ問題８イ類・平30Ⅱ問題13 イ類",
   q:"指名委員会等設置会社において、各委員会は、委員３人以上で組織し、そのうち１人以上は、社外取締役でなければならない。",ans:"誤り",
   exp:"400条１項３項。各委員会の委員の過半数は、社外取締役でなければならない。業務執行の監督機能を強化するために、各委員会の委員の構成については、独立性の高い社外取締役が過半数を占めることが要請されているのである。"},
  {id:"K-02-12-003",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:3,rank:"A",src:"平21 問題13 エ",
   q:"監査役会は、その半数の監査役が社外監査役であればよいが、監査委員会は、その過半数の委員が社外取締役でなければならない。",ans:"正しい",
   exp:"335条３項、400条３項。"},
  {id:"K-02-12-004",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:4,rank:"A",src:"令７Ⅰ問題12 ア類・令６Ⅱ問題８エ",
   q:"指名委員会等設置会社において、各委員会の委員は、取締役の中から、取締役会の決議によって選定する。",ans:"正しい",
   exp:"400条２項。"},
  {id:"K-02-12-005",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:5,rank:"A",src:"平29Ⅱ問題８ウ",
   q:"指名委員会等設置会社においては、取締役の選任は、各委員会の委員である取締役とそれ以外の取締役とを区別してしなければならない。",ans:"誤り",
   exp:"400条２項。各委員会の委員は、取締役の中から、取締役会の決議によって選定する。これに対して、監査等委員会設置会社においては、取締役の選任は、監査等委員である取締役とそれ以外の取締役とを区別してしなければならない（329条２項）。監査等委員の独立性を確保するためである。このように、監査等委員は、株主総会の決議により取締役の地位と一体となって選任されるのである。この点、指名委員会等設置会社の監査委員が取締役会で選定されることと異なるため（400条２項）、監査等委員会設置会社における監査等委員の身分は、監査役に近いものと考えられる。"},
  {id:"K-02-12-006",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:6,rank:"A",src:"平24Ⅰ問題12 ウ",
   q:"執行役でない取締役は、取締役会において、各委員会のいずれかの委員に選定されなければならない。",ans:"誤り",
   exp:"指名委員会等設置会社の取締役は各委員会の委員にならなくてもよい。"},
  {id:"K-02-12-007",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:7,rank:"B",src:"令７Ⅰ問題12 ウ類・平23Ⅰ問題11 イ",
   q:"取締役会は、監査委員会の決議がなければ、指名委員会の委員を解職することができない。",ans:"誤り",
   exp:"401条１項。各委員会の委員は、いつでも、取締役会の決議によって解職することができる。なお、監査委員会には、指名委員会の委員を解職する権限はない。"},
  {id:"K-02-12-008",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (1) 委員の選定および解職等",num:8,rank:"B",src:"",
   q:"取締役会の決議によって解職された各委員会の委員は、その解職について正当な理由がある場合を除き、指名委員会等設置会社に対して、解職によって生じた損害の賠償を請求することができる。",ans:"誤り",
   exp:"各委員会の委員の解職については、役員等のような正当な理由なく任期途中で解任された場合の損害賠償請求に関する規定（339条２項、403条２項）はない。"},
  {id:"K-02-12-009",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (2) 指名委員会",num:1,rank:"A",src:"平29Ⅰ問題12 イ",
   q:"指名委員会等設置会社の指名委員会の委員は、社外取締役である者を除いて、当該会社の執行役を兼ねることができる。",ans:"正しい",
   exp:"指名委員会および報酬委員会の委員については、監査委員のような兼任禁止の規定（400条４項）は設けられていない。"},
  {id:"K-02-12-010",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (2) 指名委員会",num:2,rank:"A",src:"平25Ⅱ問題12 ア類・平22Ⅱ問題12 ウ類・平21 問題12 ア類・平20 問題14 エ",
   q:"指名委員会は、株主総会に提出する取締役および執行役の選任および解任に関する議案の内容を決定する。",ans:"誤り",
   exp:"404条１項。指名委員会は、株主総会に提出する取締役（会計参与設置会社では、取締役および会計参与）の選任および解任に関する議案の内容を決定する。執行役の選任および解任は取締役会の決議によってなされ（402条２項、403条１項）、指名委員会には、執行役の選任および解任に関する権限は一切与えられていない。その理由は、指名委員会等設置会社における取締役会は、執行役の職務の分掌、指揮命令関係その他の執行役相互の関係に関する事項を定めなければならないため（416条１項１号ハ）、当該事項の決定と密接に関係する執行役の選任および解任についても、執行役に対する監督権限の一部として取締役会の権限とする必要があるからである。"},
  {id:"K-02-12-011",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (2) 指名委員会",num:3,rank:"B",src:"",
   q:"指名委員会は、取締役（会計参与設置会社では、取締役および会計参与）の選任および解任を決定する。",ans:"誤り",
   exp:"指名委員会の権限は、あくまで、株主総会に提出する取締役（会計参与設置会社では、取締役および会計参与）の選任および解任に関する議案の内容の決定であるため（404条１項）、取締役の選任および解任権限は有していないことに注意する必要がある。すなわち、指名委員会等設置会社においても、取締役の選任および解任は、指名委員会によって決定された議案を基に、株主総会の決議によってなされるのである（329条１項、339条１項、341条）。"},
  {id:"K-02-12-012",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (2) 指名委員会",num:4,rank:"A",src:"令２Ⅰ問題12 イ",
   q:"指名委員会は、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容を決定する。",ans:"誤り",
   exp:"404条２項２号。株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は、監査委員会が決定する。会計監査人の独立性を確保すると同時に、監査委員会と会計監査人との職務上の密接な関係に鑑みて、その選任等につき監査委員会の意思を反映させるためである。"},
  {id:"K-02-12-013",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (2) 指名委員会",num:5,rank:"A",src:"平26Ⅰ問題11 エ",
   q:"指名委員会等設置会社において、取締役が会計監査人の解任を株主総会の目的とする場合には、指名委員会の同意を得なければならない。",ans:"誤り",
   exp:"指名委員会等設置会社においては、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容の決定は監査委員会が行う（404条２項２号）。なお、問題文のような規定は設けられていない。"},
  {id:"K-02-12-014",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:1,rank:"A",src:"平25Ⅱ問題12 イ・平21 問題13 ウ類",
   q:"指名委員会等設置会社において、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は、監査委員会によって決定される。",ans:"正しい",
   exp:"404条２項２号。会計監査人の業務執行者からの独立性を確保すると同時に、会計監査業務の面で密接に関係するため、会計監査人の人事について監査委員会の意見を反映させることに合理性があるためである。なお、株主総会に提出する取締役（会計参与設置会社では、取締役および会計参与）の選任および解任に関する議案の内容の決定は指名委員会の職務であるため、区別しておさえてほしい。"},
  {id:"K-02-12-015",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:2,rank:"A",src:"令２Ⅰ問題７エ類・平28Ⅰ問題11 ア",
   q:"監査役会設置会社は常勤の監査役を置かなければならないが、指名委員会等設置会社は常勤の監査委員を置かなくてもよい。",ans:"正しい",
   exp:"監査役の場合、自らが業務および財産の調査等を行うのが通常であるのに対し、監査委員は、取締役会が設ける内部統制部門を通じて監査を行う。すなわち、監査委員会の職務は、内部統制システムが適切に整備および運用されているかを監視し、必要に応じて内部統制部門に対し具体的指示をすることである。こうした監査方法の違いを反映して、監査委員の中に監査役会設置会社における常勤監査役（390条３項）に相当する者を定めることは義務づけられていない。"},
  {id:"K-02-12-016",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:3,rank:"A",src:"平23Ⅰ問題11 ウ",
   q:"執行役を兼ねる取締役は、監査委員となることができない。",ans:"正しい",
   exp:"400条４項。自己監査の防止と独立性の確保の趣旨から、監査委員は指名委員会等設置会社もしくはその子会社の執行役を兼ねることができない。"},
  {id:"K-02-12-017",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:4,rank:"A",src:"平24Ⅰ問題12 ア",
   q:"監査委員会の委員は、当該指名委員会等設置会社の子会社の業務執行取締役を兼ねることができない。",ans:"正しい",
   exp:"400条４項。監査対象者からの独立性を確保するため、監査委員会の委員は、当該指名委員会等設置会社の子会社の業務執行取締役を兼ねることができない。"},
  {id:"K-02-12-018",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:5,rank:"A",src:"",
   q:"監査委員会の委員は、子会社の会計参与を兼ねることができる。",ans:"誤り",
   exp:"400条４項。監査委員は、指名委員会等設置会社もしくはその子会社の執行役もしくは業務執行取締役または指名委員会等設置会社の子会社の会計参与（会計参与が法人であるとき、その職務を行うべき社員）もしくは支配人その他の使用人を兼ねることができない。"},
  {id:"K-02-12-019",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:6,rank:"A",src:"平29Ⅰ問題12 ウ",
   q:"指名委員会等設置会社においては、監査委員のうち、監査委員会が選定する者に限り、当該会社の業務および財産の状況の調査をすることができる。",ans:"正しい",
   exp:"405条１項。指名委員会等設置会社においては、監査委員会が選定する監査委員が監査権限を行使するのが原則である。監査委員の場合、監査役のように自らが業務および財産の調査等を行うことは想定されておらず、調査等は、必要があれば内部統制部門に対し指示をする形で行われるため、その指示が複数の者からなされることになると組織に混乱をもたらしてしまうことになるからである。したがって、監査委員は、監査役と異なり独任制の機関ではない。"},
  {id:"K-02-12-020",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:7,rank:"B",src:"平28Ⅰ問題11 イ・平21 問題13 イ類",
   q:"監査役会設置会社の監査役は、監査役会が作成した監査報告に自己が作成した監査報告の内容を付記することができるが、指名委員会等設置会社の監査委員は、監査委員会が作成した監査報告に異なる意見を付記することができない。",ans:"誤り",
   exp:"会社法施行規則130条２項後段、会社計算規則128条２項後段、会社法施行規則131条１項後段、会社計算規則129条１項後段。監査委員は独任制の機関ではないが、監査役設置会社における監査役の独任制の長所とされる部分について、例外的に監査委員に対しても認めているのである。"},
  {id:"K-02-12-021",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:8,rank:"A",src:"平28Ⅰ問題11 エ・平21 問題13 ア",
   q:"株式会社の業務および財産の状況の調査につき、監査役会設置会社の監査役は監査役会が定めた調査の方法とは異なる方法で調査を行うことができるが、指名委員会等設置会社の監査委員は調査に関する監査委員会の決議に従わなければならない。",ans:"正しい",
   exp:"405条４項。指名委員会等設置会社における監査委員は、監査役と異なり独任制の機関ではないため、事業報告要求権、業務財産調査権または子会社調査権（405条１項２項）について、監査委員会の決議があるときは、監査委員会が選定する監査委員は、これに従わなければならない。このように監査委員会が選定する監査委員は、監査委員会としての意思決定に従い、統一のとれた調査活動を行うことが求められている。"},
  {id:"K-02-12-022",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:9,rank:"A",src:"",
   q:"監査委員会から選定された監査委員は、業務および財産の状況の調査に関する事項についての監査委員会の決議がある場合であっても、その権限の行使が妨げられることはない。",ans:"誤り",
   exp:"405条４項。監査委員会から選定された監査委員は、事業報告の徴収や業務財産の調査に関する事項についての監査委員会の決議があるときは、これに従わなければならない。監査委員会が選定する監査委員は、監査委員会としての意思決定に従い、統一のとれた調査活動を行うことが求められる。"},
  {id:"K-02-12-023",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:10,rank:"C",src:"",
   q:"すべての監査委員は、執行役または取締役が不正の行為をするおそれがあると認めるときは、遅滞なく、その旨を取締役会に報告しなければならない。",ans:"正しい",
   exp:"406条。① 取締役会への報告義務（406条）、② 執行役または取締役の違法行為差止請求権（407条１項）といった迅速な対応が期待されるものについては、各監査委員が単独で行使することができることとされている。"},
  {id:"K-02-12-024",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:11,rank:"B",src:"",
   q:"監査委員会が選定する監査委員以外の監査委員は、執行役または取締役が法令または定款に違反する行為をするおそれがある場合において、当該行為によって当該指名委員会等設置会社に著しい損害が生じるおそれがあるときであっても、当該執行役または取締役に対し、当該行為をやめさせることを請求することができない。",ans:"誤り",
   exp:"407条１項。迅速な対応が期待されるため、執行役または取締役の違法行為差止請求権の行使については、監査委員会が選定する監査委員に限定されず、各監査委員が単独で行使することができる。"},
  {id:"K-02-12-025",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (3) 監査委員会",num:12,rank:"C",src:"令２Ⅱ問題12 エ",
   q:"指名委員会等設置会社において、監査委員は、取締役が株主総会に提出しようとする議案が法令または定款に違反すると認めるときは、その旨を株主総会に報告しなければならない。",ans:"誤り",
   exp:"監査役設置会社において、監査役は、取締役が株主総会に提出しようとする議案、書類その他法務省令で定めるものを調査しなければならない。この場合において、法令もしくは定款に違反し、または著しく不当な事項があると認めるときは、その調査の結果を株主総会に報告しなければならない（384条）。また、監査等委員会設置会社において、監査等委員は、取締役が株主総会に提出しようとする議案、書類その他法務省令で定めるものについて法令もしくは定款に違反し、または著しく不当な事項があると認めるときは、その旨を株主総会に報告しなければならない（399条の５）。これに対して、指名委員会等設置会社における監査委員には、これに対応する義務はない。監査委員は、取締役として株主総会の議案等を検討し、これに法令違反等があると認めるときは、取締役会への報告（406条）により対応することが想定されているためである。"},
  {id:"K-02-12-026",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:1,rank:"A",src:"平24Ⅰ問題12 イ",
   q:"報酬委員会の委員は、指名委員会の委員を兼ねることができない。",ans:"誤り",
   exp:"各委員会の委員間の兼任禁止規定は存在しない。"},
  {id:"K-02-12-027",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:2,rank:"A",src:"",
   q:"報酬委員会は、株主総会に提出する執行役等の報酬等の議案の内容の決定をする。",ans:"誤り",
   exp:"404条３項前段。報酬委員会は、執行役等（執行役および取締役（会計参与設置会社では執行役、取締役および会計参与））の個人別の報酬等の内容を決定する。したがって、指名委員会等設置会社では、指名委員会等設置会社以外の株式会社のように取締役の報酬等について定款または株主総会で定める必要はなく、それゆえ取締役の報酬等が株主総会の議案となることもない。"},
  {id:"K-02-12-028",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:3,rank:"A",src:"令７Ⅰ問題12 イ類・平31Ⅱ問題13 ウ",
   q:"指名委員会等設置会社の報酬委員会の委員である取締役の報酬等の内容は、定款または株主総会の決議によって定めなければならない。",ans:"誤り",
   exp:"404条３項前段。指名委員会等設置会社においては、報酬委員会が執行役等（執行役および取締役（会計参与設置会社では執行役、取締役および会計参与））の個人別の報酬等の内容を決定する。この規定は、報酬委員会の委員である取締役についても適用される。"},
  {id:"K-02-12-029",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:4,rank:"A",src:"令２Ⅰ問題12 ウ",
   q:"報酬委員会は、執行役の個人別の報酬の内容を決定するに際し、執行役が当該指名委員会等設置会社の支配人その他の使用人を兼ねているときは、使用人分の報酬についても決定する。",ans:"正しい",
   exp:"404条３項後段。報酬委員会が使用人兼務執行役の使用人部分の報酬等の内容も決定するのは、使用人部分の報酬等を通じた規制の回避を防止するためである。"},
  {id:"K-02-12-030",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:5,rank:"A",src:"平23Ⅰ問題11 エ",
   q:"報酬委員会は、代表執行役に執行役の個人別の報酬内容の決定を委任することができない。",ans:"正しい",
   exp:"404条３項。報酬委員会を設置する趣旨は、業務執行に対する監督機能を執行役等の報酬等を通じて強化することにあるため、その権限を代表執行役に委任することはできない。"},
  {id:"K-02-12-031",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:6,rank:"A",src:"平25Ⅱ問題12 ウ",
   q:"報酬委員会の委員の報酬等については、報酬委員会がその内容を決定することはできない。",ans:"誤り",
   exp:"404条３項前段。報酬委員会は、執行役等（執行役および取締役（会計参与設置会社では執行役、取締役および会計参与））の個人別の報酬等の内容を決定する。ここで、報酬委員会の委員は取締役であるので、報酬委員会がその個人別の報酬等の内容を決定することになる。"},
  {id:"K-02-12-032",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:7,rank:"A",src:"",
   q:"報酬委員会は、執行役等の個人別の報酬等の内容に係る決定に関する方針を定めなければならず、報酬等の内容を決定するには、当該方針に従わなければならない。",ans:"正しい",
   exp:"409条１項２項。"},
  {id:"K-02-12-033",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:8,rank:"A",src:"令６Ⅱ問題13 エ",
   q:"指名委員会等設置会社の場合には、会計参与の報酬等の内容は、報酬委員会が決定する。",ans:"正しい",
   exp:"409条１項。報酬委員会は、執行役等（会計参与設置会社では執行役、取締役および会計参与）の個人別の報酬等の内容に係る決定に関する方針を定めなければならない。また、報酬委員会は、執行役等の個人別の報酬等の内容を決定するには、当該方針に従わなければならない（同条２項）。"},
  {id:"K-02-12-034",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (4) 報酬委員会",num:9,rank:"A",src:"平27Ⅱ問題９エ類",
   q:"報酬委員会は、会計参与の報酬等として業績連動型報酬を定めることができる。",ans:"誤り",
   exp:"409条３項柱書ただし書。報酬委員会が決定する会計参与の報酬等は、額が確定しているものでなければならない。"},
  {id:"K-02-12-035",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:1,rank:"C",src:"令４Ⅰ問題12 イ類",
   q:"指名委員会等は、当該指名委員会等の各委員が招集するが、定款または当該委員会で定めることにより、当該指名委員会等を招集することができる委員を限定することができる。",ans:"誤り",
   exp:"410条。指名委員会等は、当該指名委員会等の各委員が招集する。招集権者を限定することができないのは、社外取締役である委員の招集権を確保するためである。"},
  {id:"K-02-12-036",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:2,rank:"C",src:"",
   q:"指名委員会等は、当該委員会の委員の全員の同意があるときは、招集の手続を経ることなく開催することができる。",ans:"正しい",
   exp:"411条２項。指名委員会等を招集するには、その委員は、指名委員会等の日の１週間（取締役会で短縮可）前までに当該指名委員会等の各委員に対してその通知を発しなければならない（411条１項）。しかし、当該指名委員会等の委員の全員の同意があれば、招集の手続を経ることなく開催することができる。"},
  {id:"K-02-12-037",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:3,rank:"C",src:"",
   q:"執行役は、その職務を行うため必要があるときは、自ら指名委員会等に出席することができる。",ans:"誤り",
   exp:"411条３項。執行役は、委員会の要求があったときは、当該委員会に出席し、当該委員会が求めた事項について説明をしなければならない。すなわち、指名委員会等に求められたときに出席義務があるだけで、出席権はない。なお、当該委員会の委員でない者や会計参与も同様である。"},
  {id:"K-02-12-038",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:4,rank:"C",src:"",
   q:"ある委員会の委員でない取締役であっても、当該委員会の要求があったときは、当該委員会に出席し、当該委員会が求めた事項について説明しなければならない。",ans:"正しい",
   exp:"411条３項。"},
  {id:"K-02-12-039",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:5,rank:"C",src:"",
   q:"指名委員会等の決議は、議決に加わることができるその委員の過半数（取締役会で加重可）が出席し、その過半数（取締役会で加重可）をもって行う。",ans:"正しい",
   exp:"412条１項。指名委員会等は取締役会の内部機関としての性質を有するため、定足数および決議要件の加重は、取締役会の決議によってすることができる。なお、緩和は認められない。また、指名委員会等については、取締役会と異なり、定款の定めによっても決議の省略制度（書面決議）を採用することができない（370条対比）。"},
  {id:"K-02-12-040",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:6,rank:"C",src:"",
   q:"指名委員会等の議事については、議事録を作成し、議事録が書面をもって作成されているときは、出席した委員は当該議事録に署名または記名押印しなければならない。",ans:"正しい",
   exp:"412条３項。"},
  {id:"K-02-12-041",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (5) 委員会の運営",num:7,rank:"A",src:"令７Ⅰ問題12 エ・令４Ⅰ問題12 エ類・平31Ⅰ問題13 エ",
   q:"執行役、取締役、会計参与または会計監査人が委員の全員に対して指名委員会等に報告すべき事項を通知したときは、当該事項を指名委員会等へ報告することを要しない。",ans:"正しい",
   exp:"414条。委員会への報告義務は、委員に情報を与えることを目的としているから、各委員に情報が通知により到達していれば、委員会への報告を省略しても問題はないのである。"},
  {id:"K-02-12-042",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:1,rank:"A",src:"平22Ⅱ問題12 ア",
   q:"公開会社である指名委員会等設置会社は、執行役が株主でなければならない旨を定款で定めることができない。",ans:"正しい",
   exp:"402条５項本文。公開会社は、株主が頻繁に変動することが想定されるため、株主以外の者からも広く有能な人材を執行役として選任できることが適切だからである。一方、非公開会社である指名委員会等設置会社にあっては、株主に限る旨を定款で定めることができる。"},
  {id:"K-02-12-043",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:2,rank:"B",src:"令２Ⅰ問題12 エ類",
   q:"執行役は、取締役を兼ねることができる。",ans:"正しい",
   exp:"402条６項。当該規定は、執行役による業務の執行と取締役会による業務執行の監督を区別することにより、業務執行の監督機能を強化するという趣旨に反するとも考えられるが、執行役と取締役の兼任を禁止してしまうと人材確保が困難となってしまうため、取締役との兼任が認められている。また、取締役会の監督機能の実行性を確保するためには、むしろ執行役兼務取締役を通じた情報提供が有用な場合もあり得るとされ、取締役と執行役の兼任自体は株式会社ごとに決定すべき事項であると捉え、その兼任を法律で禁止するまでもないとされたのである。"},
  {id:"K-02-12-044",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:3,rank:"B",src:"",
   q:"法人は執行役となることができる。",ans:"誤り",
   exp:"402条４項。取締役の資格の規定（331条１項）は、執行役について準用されるため、法人は執行役となることができない。"},
  {id:"K-02-12-045",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:4,rank:"A",src:"",
   q:"執行役は、支配人その他の使用人を兼ねることはできない。",ans:"誤り",
   exp:"指名委員会等設置会社の執行役は、当該指名委員会等設置会社の支配人その他の使用人を兼ねることができる。ただし、執行役は取締役を兼任することが認められているため、その場合は、支配人その他の使用人を兼ねることはできない（331条４項）。"},
  {id:"K-02-12-046",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:5,rank:"A",src:"平20 問題14 ウ",
   q:"執行役でもある取締役は、いずれの委員会の委員にもなることができない。",ans:"誤り",
   exp:"自己監査の防止と独立性の確保の趣旨から、監査委員は執行役を兼ねることができないが、指名委員および報酬委員については執行役を兼ねることができる。"},
  {id:"K-02-12-047",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:6,rank:"B",src:"",
   q:"執行役の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。",ans:"誤り",
   exp:"402条７項本文。執行役の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結後最初に招集される取締役会の終結の時までとする。執行役は、取締役会によって選任されるため（402条２項）、定時株主総会で選任された取締役によって組織される取締役会で、新執行役が選任されるまでが任期となっているのである。また、取締役会で選任されるという関係上、取締役の任期との連動がなされている。"},
  {id:"K-02-12-048",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:7,rank:"B",src:"",
   q:"執行役の任期は、定款または取締役会の決議によって、その任期を法定の任期よりも短縮することができる。",ans:"誤り",
   exp:"402条７項ただし書。執行役の任期は定款により短縮することが認められているが、決議による任期の短縮は認められていない。この点、取締役の場合は、株主総会の決議による短縮が認められていることと対比しておさえるようにしてほしい。また、執行役の任期の伸長は認められていない。"},
  {id:"K-02-12-049",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:8,rank:"A",src:"令３問題11 イ類・平22Ⅱ問題12 ウ類",
   q:"執行役は、株主総会の決議により選任する。",ans:"誤り",
   exp:"402条２項。執行役は、取締役会の決議によって選任される。また、執行役は、いつでも、取締役会の決議によって解任することができる（403条１項）。"},
  {id:"K-02-12-050",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:9,rank:"A",src:"平22Ⅰ問題11 ア",
   q:"取締役会の決議によって解任された執行役は、その解任について正当な理由がある場合を除き、指名委員会等設置会社に対して、解任によって生じた損害の賠償を請求することができる。",ans:"正しい",
   exp:"403条２項。"},
  {id:"K-02-12-051",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:10,rank:"B",src:"令２Ⅱ問題12 イ・平22Ⅰ問題14 イ",
   q:"執行役が欠けた場合または定款で定めた執行役の員数が欠けた場合において、裁判所は、必要があると認めるときは、利害関係人の申立てにより、一時執行役の職務を行うべき者を選任することができる。",ans:"正しい",
   exp:"403条３項、401条３項。委員の留任義務および一時委員の選任の規定は、執行役が欠けた場合、または、定款で定めた執行役の員数が欠けた場合について準用される。"},
  {id:"K-02-12-052",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:11,rank:"A",src:"",
   q:"執行役は、取締役会の決議によって委任を受けていなくても、指名委員会等設置会社が行う株式の分割の決定をすることができる。",ans:"誤り",
   exp:"418条１号。執行役の権限は、① 取締役会の決議によって委任を受けた指名委員会等設置会社の業務執行の決定、および、② 指名委員会等設置会社の業務の執行である。すなわち、執行役は、取締役会の決議によって委任された範囲で業務執行の決定権限を有するのである。"},
  {id:"K-02-12-053",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:12,rank:"B",src:"平22Ⅱ問題12 イ",
   q:"執行役は、株式会社に対して善管注意義務を負うが、取締役とは異なり競業避止義務は負わない。",ans:"誤り",
   exp:"402条３項、419条２項、356条１項１号。執行役についても、競業避止義務（356条１項１号）や利益相反取引の制限（356条１項２号３号）については、取締役の場合と同様の規制がなされている。"},
  {id:"K-02-12-054",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (6) 執行役",num:13,rank:"A",src:"平31Ⅰ問題13 ウ類・平23Ⅰ問題12 エ類",
   q:"執行役は、指名委員会等設置会社に著しい損害を及ぼすおそれのある事実を発見したときは、直ちに、当該事実を監査委員会に報告しなければならない。",ans:"誤り",
   exp:"419条１項。執行役は、指名委員会等設置会社に著しい損害を及ぼすおそれのある事実を発見したときは、直ちに、当該事実を監査委員に報告しなければならない。当該報告義務の趣旨は、会社の損害を未然に防止することである。ここで、執行役の報告の相手方を監査委員会とせず、監査委員にしているのは、執行役に報告義務が生じたときは、最寄りの監査委員に直ちに報告させることによって、当該監査委員に迅速に対応させるためである。"},
  {id:"K-02-12-055",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (7) 代表執行役",num:1,rank:"A",src:"平21 問題10 エ",
   q:"指名委員会等設置会社において執行役が２人以上いる場合、その互選によって代表執行役を選定しなければならない。",ans:"誤り",
   exp:"420条１項。指名委員会等設置会社において、取締役会は、執行役の中から代表執行役を選定しなければならない。この場合において、執行役が１人のときは、その者が代表執行役に選定されたものとする。また、いつでも、取締役会の決議によって解職することができる（420条２項）。"},
  {id:"K-02-12-056",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (7) 代表執行役",num:2,rank:"A",src:"平25Ⅱ問題12 エ・平23Ⅰ問題９エ類",
   q:"指名委員会等設置会社がその執行役に対して訴えを提起する場合には、当該訴えについて指名委員会等設置会社を代表する監査委員は、取締役会によって選定される。",ans:"誤り",
   exp:"408条１項２号。指名委員会等設置会社において、株式会社と取締役または執行役との間の訴えについては、① 監査委員が当該訴えに係る訴訟の当事者である場合は、取締役会が定める者（株主総会が当該訴えについて会社を代表する者を定めた場合はその者）、②監査委員が当該訴えに係る訴訟の当事者でない場合は、監査委員会が選定する監査委員が指名委員会等設置会社を代表する。"},
  {id:"K-02-12-057",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (7) 代表執行役",num:3,rank:"A",src:"令２Ⅰ問題12 ア",
   q:"指名委員会等設置会社において、取締役会は、代表取締役を選定することができない。",ans:"正しい",
   exp:"指名委員会等設置会社においては、代表執行役が指名委員会等設置会社を代表するため（420条３項、349条４項）、代表取締役が選定されることはない。"},
  {id:"K-02-12-058",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:1,rank:"A",src:"平29Ⅰ問題12 ア・平24Ⅰ問題12 エ類",
   q:"指名委員会等設置会社の取締役は、各委員会の委員である者を除いて、当該会社の使用人を兼ねることができる。",ans:"誤り",
   exp:"331条４項。指名委員会等設置会社の取締役は、当該指名委員会等設置会社の支配人その他の使用人を兼ねることができない。指名委員会等設置会社における取締役会は、執行役等の業務執行の監督が中心であり、取締役会を構成する取締役が監督対象である執行役に従属する使用人となれば、実効的な監督をすることができないと考えられるからである。"},
  {id:"K-02-12-059",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:2,rank:"B",src:"",
   q:"指名委員会等設置会社の取締役は、会社法または会社法に基づく命令に別段の定めがある場合を除き、指名委員会等設置会社の業務を執行することができない。",ans:"正しい",
   exp:"415条。これは、執行役による業務の執行と取締役会による業務執行の監督を区別することにより、業務執行の監督機能を強化するという趣旨から規定されている。"},
  {id:"K-02-12-060",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:3,rank:"A",src:"平25Ⅰ問題11 イ・平20 問題14 イ類",
   q:"指名委員会等設置会社において、取締役会は、取締役の職務の執行が効率的に行われることを確保するための体制の整備を決定しなければならない。",ans:"誤り",
   exp:"416条１項１号ホ、会社法施行規則112条２項３号。指名委員会等設置会社の取締役会は、執行役の職務の執行が法令および定款に適合することを確保するための体制その他株式会社の業務の適正を確保するために必要なものとして法務省令で定める体制の整備の決定をしなければならない。そして、法務省令では、執行役の職務の執行が効率的に行われることを確保するための体制の整備を求めているが、取締役の職務の執行が効率的に行われることを確保するための体制については求められていない。したがって、本肢は誤りである。"},
  {id:"K-02-12-061",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:4,rank:"A",src:"平23Ⅱ問題13 ア",
   q:"指名委員会等設置会社の取締役会は、経営の基本方針の決定を、執行役に委任することができる。",ans:"誤り",
   exp:"416条１項１号イ。指名委員会等設置会社の取締役会は、会社経営の基本方針、会社の業務執行の決定、執行役等の職務執行の監督を行う。したがって、執行役に委任することも認められない。"},
  {id:"K-02-12-062",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:5,rank:"A",src:"令３問題11 ウ類・平29Ⅰ問題12 エ",
   q:"指名委員会等設置会社において執行役が２人以上いる場合、執行役の職務の分掌に関する事項は、執行役の協議によって定める。",ans:"誤り",
   exp:"416条１項１号ハ、２項。指名委員会等設置会社の取締役会は、執行役が２人以上いる場合における執行役の職務の分掌および指揮命令の関係その他の執行役相互の関係に関する事項を決定しなければならず、当該決定を取締役や執行役に委任することができない（416条３項）。"},
  {id:"K-02-12-063",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:6,rank:"A",src:"平23Ⅰ問題11 ア",
   q:"監査委員ではない取締役は、執行役の職務執行を監督する義務を負わない。",ans:"誤り",
   exp:"416条１項２号。指名委員会等設置会社の取締役会は執行役の職務執行の監督をする義務があるため、監査委員ではなくてもその構成員である取締役は当該義務を負うこととなる。"},
  {id:"K-02-12-064",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:7,rank:"A",src:"平26Ⅰ問題10 ア",
   q:"指名委員会等設置会社の取締役会は、その決議によって、譲渡制限株式の譲渡等承認の決定および指定買取人の指定を執行役に委任することができる。",ans:"誤り",
   exp:"416条４項１号。指名委員会等設置会社の取締役会は、その決議によって、譲渡制限株式の譲渡等承認の決定および指定買取人の指定を執行役に委任することができない。"},
  {id:"K-02-12-065",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:8,rank:"A",src:"平30Ⅱ問題10 エ・平26Ⅰ問題７イ類・平23Ⅱ問題８イ類",
   q:"指名委員会等設置会社の取締役会は、その決議によって、株主総会の日時および場所等の株主総会の招集に関する事項の決定を執行役に委任することができない。",ans:"正しい",
   exp:"416条４項４号。指名委員会等設置会社の取締役会は、その決議によって、株主総会の招集事項の決定を執行役に委任することができない。"},
  {id:"K-02-12-066",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:9,rank:"A",src:"平27Ⅰ問題９エ・平26Ⅰ問題10 イ類・平21 問題12 イ",
   q:"指名委員会等設置会社の取締役会は、その決議によって、重要な財産の処分および譲受けならびに多額の借財の決定を執行役に委任することができる。",ans:"正しい",
   exp:"416条４項各号参照。監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において、取締役会は、重要な財産の処分および譲受け、多額の借財を取締役に委任することはできない（362条４項）。また、監査等委員会設置会社においても、原則として、当該事項を取締役に委任することができないが（399条の13 第４項１号２号）、一定の要件を満たした場合に限り、取締役会の決議によって、取締役に委任することができるとされている（同条５項６項）。これに対して、指名委員会等設置会社においては、特段の要件を求めることなく、取締役会の決議によって、当該事項を執行役に委任することができる。"},
  {id:"K-02-12-067",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:10,rank:"A",src:"平26Ⅰ問題10 ウ類・平23Ⅱ問題13 イ",
   q:"指名委員会等設置会社の取締役会は、その決議によって、支配人その他の重要な使用人の選任および解任の決定を、執行役に委任することができる。",ans:"正しい",
   exp:"416条４項各号参照。"},
  {id:"K-02-12-068",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:11,rank:"A",src:"平21 問題12 ウ類",
   q:"指名委員会等設置会社の取締役会は、その決議によって、会社と取締役との間の取引の承認を執行役に委任することができる。",ans:"誤り",
   exp:"416条４項７号。競業取引および利益相反取引の承認については、執行役への委任が認められていない。"},
  {id:"K-02-12-069",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:12,rank:"A",src:"令６Ⅱ問題16 ア・令２Ⅱ問題12 ウ・平21 問題12 エ",
   q:"指名委員会等設置会社における取締役会は、社債を引き受ける者の募集に関する重要な事項の決定を執行役に委任することができる。",ans:"正しい",
   exp:"416条４項各号参照。指名委員会等設置会社は、取締役会の決議により執行役を選任し、その執行役に業務執行の決定権限を大幅に委任することによって、迅速な業務執行の決定を可能にしている。ここで、社債を引き受ける者の募集に関する重要な事項の決定は執行役に委任できない事項に含まれていないことから、取締役会の決議によって、その決定を執行役に委任することができる。"},
  {id:"K-02-12-070",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:13,rank:"A",src:"",
   q:"指名委員会等設置会社の取締役会は、その決議によって、補償契約の内容の決定を執行役に委任することができる。",ans:"誤り",
   exp:"416条４項14号。指名委員会等設置会社の取締役会は、その決議によって、補償契約の内容の決定を執行役に委任することができない。"},
  {id:"K-02-12-071",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:14,rank:"A",src:"平23Ⅱ問題13 ウ",
   q:"指名委員会等設置会社の取締役会は、その決議によって、当該指名委員会等設置会社の株主総会の決議による承認を要しない略式吸収合併契約の内容の決定を、執行役に委任することができる。",ans:"正しい",
   exp:"416条４項19号かっこ書。略式吸収合併をする場合は、株主総会の特別決議を要しないため、執行役に当該契約の内容の決定を委任することができる。"},
  {id:"K-02-12-072",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (8) 指名委員会等設置会社の取締役および取締役会の権限",num:15,rank:"A",src:"令６Ⅰ問題18 ア・平26Ⅰ問題10 エ・平23Ⅱ問題13 エ",
   q:"指名委員会等設置会社の取締役会は、その決議によって、株式移転計画の内容の決定を、執行役に委任することができる。",ans:"誤り",
   exp:"416条４項23号。株式移転契約の内容の決定は株式会社の運命を左右する重要事項であるので、執行役に当該契約の内容の決定を委任することができない。"},
  {id:"K-02-12-073",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (9) 指名委員会等設置会社の取締役会の運営",num:1,rank:"A",src:"令４Ⅰ問題12 イ類・平31Ⅰ問題13 イ・平24Ⅱ問題10 ウ類",
   q:"指名委員会等の委員は、各自、遅滞なく、自己の職務の執行の状況を取締役会に報告しなければならない。",ans:"誤り",
   exp:"417条３項。指名委員会等がその委員の中から選定する者は、遅滞なく、当該指名委員会等の職務の執行の状況を取締役会に報告しなければならない。各委員会の活動に関して取締役会が情報を得ることにより、経営の基本方針（416条１項１号イ）を確認しつつ、委員である取締役の職務執行の監督を実行するためである。"},
  {id:"K-02-12-074",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (9) 指名委員会等設置会社の取締役会の運営",num:2,rank:"A",src:"",
   q:"（平31Ⅰ問題13 ア類・平27Ⅰ問題９ウ類・平24Ⅱ問題10 エ・平22Ⅱ問題12 エ・平22Ⅰ問題11 エ類）執行役は、３か月に１回以上、自己の職務の執行状況を取締役会に報告しなければならない。この場合において、執行役は、代理人により報告をすることができない。",ans:"誤り",
   exp:"417条４項。執行役は、３か月に１回以上、自己の職務執行の状況を取締役会に報告しなければならない。この場合において、執行役は、他の執行役を代理人として当該報告をすることが認められている。これは、報告の効率性を考慮したものである。これに対して、指名委員会等設置会社以外の株式会社における代表取締役等の職務執行状況の定例報告（363条２項）については、代理人による報告は認められていない。また、執行役は、取締役会の要求があったときは、取締役会に出席し、取締役会が求めた事項について説明しなければならない（417条５項）。"},
  {id:"K-02-12-075",subject:"企業法",chapter:"第2章 機関",sub:"12. 指名委員会等設置会社 (9) 指名委員会等設置会社の取締役会の運営",num:3,rank:"A",src:"令３問題11 エ類・平22Ⅰ問題11 イ",
   q:"執行役は、取締役会に出席する義務を負っており、必要があると認めるときは、意見を述べなければならない。",ans:"誤り",
   exp:"417条５項。執行役は、取締役会の要求があった場合に、取締役会の出席義務および説明義務を負う。"},
  {id:"K-02-13-001",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (1) 総論",num:1,rank:"B",src:"",
   q:"監査等委員会設置会社とは、監査等委員会を置く株式会社をいう。",ans:"正しい",
   exp:"２条11号の２。監査等委員会設置会社の制度趣旨は、社外取締役の普及を図ることにある。"},
  {id:"K-02-13-002",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (1) 総論",num:2,rank:"A",src:"平31Ⅰ問題８エ",
   q:"監査等委員会設置会社には、１人または２人以上の執行役を置かなければならない。",ans:"誤り",
   exp:"監査等委員会設置会社は、指名委員会等設置会社と異なり、執行役が置かれず、指名委員会等設置会社以外の取締役会設置会社と同様、① 取締役の中から選定される代表取締役、および、② 代表取締役以外の取締役であって、取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定されたものが業務を執行する（363条１項）。"},
  {id:"K-02-13-003",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:1,rank:"A",src:"令５Ⅱ問題11 イ類・令２Ⅱ問題８ウ・平29Ⅱ問題８エ類",
   q:"監査等委員会設置会社においては、取締役の過半数が社外取締役でなければならない。",ans:"誤り",
   exp:"331条６項。監査等委員会の構成員である監査等委員は、３人以上で、その過半数は、社外取締役でなければならないとされている（331条６項）。しかし、監査等委員以外の取締役を含めた全体の取締役の過半数が社外取締役であることは求められていない。なお、取締役の過半数が社外取締役である場合は、監査等委員会設置会社の取締役会は、その決議によって、重要な業務執行の決定を取締役に委任することができる（399条の13 第５項）。"},
  {id:"K-02-13-004",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:2,rank:"A",src:"平31Ⅰ問題８ウ",
   q:"監査等委員は、取締役の中から、取締役会の決議によって選定する。",ans:"誤り",
   exp:"329条２項。監査等委員会設置会社においては、取締役の選任は、株主総会の決議において、監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。このように、監査等委員は、株主総会の決議により取締役の地位と一体となって選任されるのである。"},
  {id:"K-02-13-005",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:3,rank:"B",src:"",
   q:"監査等委員がその職務の執行について監査等委員会設置会社に対して費用の前払の請求をしたときは、当該監査等委員会設置会社は、当該請求に係る費用または債務が当該監査等委員の職務の執行に必要でないことを証明した場合を除き、これを拒むことができない。",ans:"正しい",
   exp:"399条の２第４項。監査役と同様の規定である。"},
  {id:"K-02-13-006",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:4,rank:"A",src:"",
   q:"監査等委員会は、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容の決定を行う。",ans:"正しい",
   exp:"399条の２第３項２号。会計監査人の独立性を確保すると同時に、監査等委員会と会計監査人との職務上の密接な関係に鑑みて、その選任等につき監査等委員会の意思を反映させるためである。"},
  {id:"K-02-13-007",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:5,rank:"B",src:"令６Ⅰ問題８エ・平30Ⅰ問題11 ア",
   q:"監査等委員会は、監査等委員の中から常勤の監査等委員を選定しなければならない。",ans:"誤り",
   exp:"監査等委員会による取締役の職務の執行に対する監査の方法は、指名委員会等設置会社における監査委員会の監査の方法と同様である。すなわち、監査等委員は、取締役会が設ける内部統制部門を通じて監査を行う。すなわち、監査等委員会の職務は、内部統制システムが適切に整備および運用されているかを監視し、必要に応じて内部統制部門に対し具体的指示をすることである。こうした監査方法の違いを反映して、監査等委員の中に監査役会設置会社における常勤監査役（390条３項）に相当する者を定めることは義務づけられていない。"},
  {id:"K-02-13-008",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:6,rank:"A",src:"平31Ⅰ問題８イ類",
   q:"監査等委員である取締役は、監査等委員会設置会社の子会社の会計参与を兼ねることができる。",ans:"誤り",
   exp:"331条３項。監査等委員である取締役は、監査等委員会設置会社もしくはその子会社の業務執行取締役もしくは支配人その他の使用人または当該子会社の会計参与（会計参与が法人であるときは、その職務を行うべき社員）もしくは執行役を兼ねることができない。監査等委員である取締役の兼任禁止規定の趣旨は、監査役の兼任禁止規定の趣旨と同じである。すなわち、自己監査の防止と独立性の確保である。"},
  {id:"K-02-13-009",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:7,rank:"A",src:"",
   q:"監査等委員である取締役は、監査等委員会設置会社の親会社の会計参与を兼ねることができる。",ans:"誤り",
   exp:"333条３項１号。会計参与の兼任禁止の規定（333条３項１号）により、株式会社またはその子会社の取締役は会計参与となることができないため、監査等委員である取締役は株式会社またはその親会社の会計参与を兼ねることができない。"},
  {id:"K-02-13-010",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:8,rank:"A",src:"",
   q:"監査等委員である取締役は、監査等委員会設置会社の親会社の監査役を兼ねることができる。",ans:"誤り",
   exp:"335条２項。監査役の兼任禁止の規定（335条２項）により、監査役は株式会社の子会社の取締役を兼ねることができないため、監査等委員である取締役はその親会社の監査役を兼ねることができない。"},
  {id:"K-02-13-011",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:9,rank:"A",src:"",
   q:"各監査等委員は、いつでも、取締役に対して、その職務の執行に関する事項の報告を求めることができる。",ans:"誤り",
   exp:"399条の３第１項。監査等委員会が選定する監査等委員は、いつでも、取締役に対して、その職務の執行に関する事項の報告を求めることができる。監査等委員の場合、監査役のように自らが業務および財産の調査等を行うことは想定されておらず、調査等は、必要があれば内部統制部門に対し指示をする形で行われるため、その指示が複数の者からなされることになると組織に混乱をもたらしてしまうことになるからである。したがって、監査等委員は、監査役と異なり独任制の機関ではない。ただし、例外的に、① 取締役会または株主総会への報告義務（399条の４、399条の５）、② 取締役の違法行為差止請求権（399条の６）といった迅速な対応が期待されるものについては、各監査等委員が単独で行使することができることとされている。"},
  {id:"K-02-13-012",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:10,rank:"A",src:"",
   q:"監査等委員会が選定する監査等委員は、監査等委員会設置会社の業務および財産の状況の調査に関する事項について、監査等委員会の決議があるときは、これに従わなければならない。",ans:"正しい",
   exp:"399条の３第４項。事業報告要求権、業務財産調査権または子会社調査権（399条の３第１項第２項）について、監査等委員会の決議があるときは、監査等委員会が選定する監査等委員は、これに従わなければならない。監査等委員会が選定する監査等委員は、監査等委員会としての意思決定に従い、統一のとれた調査活動を行うことが求められる。"},
  {id:"K-02-13-013",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:11,rank:"B",src:"平30Ⅰ問題11 イ",
   q:"監査等委員は、取締役が株主総会に提出しようとする議案について法令もしくは定款に違反し、または著しく不当な事項があると認めるとき、その旨を株主総会に報告する義務を負う。",ans:"正しい",
   exp:"399条の５。監査等委員の株主総会に対する報告義務は、指名委員会等設置会社の監査委員にはない義務であるが、監査役の義務にならって盛り込まれた（384条参照）。指名委員会等設置会社における監査委員に当該義務がないのは、取締役として議案等を検討し、これに法令違反等があると認めるときは、取締役会への報告（406条）により対応することが想定されるためである。ここで、監査等委員会設置会社の監査等委員も取締役であるので、議案等を検討し、これに法令違反等があると認めるときに、取締役会への報告をしなければならないことは、監査委員と同じであるが（399条の４）、監査等委員会設置会社には、指名委員会等設置会社と異なり指名委員会および報酬委員会が置かれないことに鑑みれば、監査等委員には、取締役会だけでなく株主総会にも報告義務を課すことが適切と考えられるため、監査役と同様に（384条後段参照）、株主総会への報告義務を課すこととしたのである。"},
  {id:"K-02-13-014",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:12,rank:"A",src:"",
   q:"監査等委員会設置会社と取締役（取締役であった者を含む）との間の訴えにおいては、監査等委員会が選定する監査等委員が監査等委員会設置会社を代表する。",ans:"誤り",
   exp:"399条の７第１項。監査等委員会設置会社と取締役（取締役であった者を含む）との間の訴えにおいては、① 監査等委員が当該訴えに係る訴訟の当事者である場合は、取締役会が定める者（株主総会が当該訴えについて監査等委員会設置会社を代表する者を定めた場合にあっては、その者）、② 監査等委員が当該訴えに係る訴訟の当事者でない場合は、監査等委員会が選定する監査等委員が監査等委員会設置会社を代表する。馴れ合い訴訟を防止する趣旨である。"},
  {id:"K-02-13-015",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:13,rank:"B",src:"令６Ⅰ問題13 イ",
   q:"監査等委員会を招集する監査等委員（招集権者）を監査等委員会で定めた場合には、招集権者以外の監査等委員は、招集権者に対して監査等委員会の招集を請求し、当該請求の日から５日以内に、当該請求の日から２週間以内に開催される監査等委員会の招集の通知が発せられないときに限り、監査等委員会を招集することができる。",ans:"誤り",
   exp:"399条の８。監査等委員会は、各監査等委員が招集するものとされ、招集権者を限定することはできない。招集権者を限定することができないのは、社外取締役である監査等委員の招集権を確保するためである。"},
  {id:"K-02-13-016",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:14,rank:"C",src:"",
   q:"監査等委員会を招集するには、監査等委員は、監査等委員会の日の１週間（これを下回る期間を取締役会で定めた場合にあっては、その期間）前までに、各監査等委員に対してその通知を発しなければならない。",ans:"誤り",
   exp:"399条の９第１項。指名委員会等設置会社の指名委員会等と異なり（411条１項参照）、監査等委員会における招集通知期限の短縮は、取締役会の決議ではなく、定款の定めによることとしている。これは、監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して、監査役会と同様の規律（392条１項参照）としたものである。"},
  {id:"K-02-13-017",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:15,rank:"B",src:"",
   q:"監査等委員会の決議は、監査等委員の過半数をもって行う。",ans:"誤り",
   exp:"399条の10 第１項。監査等委員会の決議は、議決に加わることができる監査等委員の過半数が出席し、その過半数をもって行う。指名委員会等設置会社の指名委員会等と異なり（412条１項参照）、監査等委員会の定足数および決議要件については、取締役会の決議によって加重することはできない。これは、監査等委員会が取締役会から一定程度独立したものとして位置づけられることを考慮して、監査役会と同様の規律（393条１項参照）としたものである。"},
  {id:"K-02-13-018",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:16,rank:"C",src:"",
   q:"監査等委員会設置会社のすべての取締役は、監査等委員会の議事録の閲覧または謄写をすることができる。",ans:"誤り",
   exp:"399条の11 参照。監査等委員会設置会社の監査等委員会は、取締役会の構成員である取締役から構成されるものの、取締役会の内部機関であるとはいえず、むしろ、取締役会から一定程度独立したものとして位置づけられる。そこで、監査役会設置会社における監査役会の議事録に関する規律（394条参照）と同様に、監査等委員である取締役以外の取締役には監査等委員会の議事録の閲覧または謄写を認めないこととしている。これに対して、指名委員会等設置会社の取締役は、指名委員会等の委員でない場合であっても、指名委員会等の議事録の閲覧または謄写が認められている（413条２項）。"},
  {id:"K-02-13-019",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:17,rank:"C",src:"",
   q:"監査等委員会設置会社の債権者は、取締役または会計参与の責任を追及する必要があるときは、裁判所の許可を得て、監査等委員会の議事録の閲覧または謄写の請求をすることができる。",ans:"正しい",
   exp:"399条の11 第３項。指名委員会等設置会社の債権者は「委員」の責任を追及するため必要があるときは、裁判所の許可を得て、指名委員会等の議事録の閲覧または謄写の請求をすることができることとされている（413条４項）。これは、指名委員会等は、あくまでも取締役会の内部機関として位置づけられることによるものである。これに対して、監査等委員会設置会社においては、監査役会設置会社における監査役会の議事録に関する規律（394条参照）と同様に、監査等委員である取締役だけでなく、監査等委員である取締役以外の取締役または会計参与の責任を追及するため必要がある場合であっても、議事録の閲覧または謄写の請求をすることができる。"},
  {id:"K-02-13-020",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (2) 監査等委員会",num:18,rank:"C",src:"令２Ⅰ問題11 ウ",
   q:"取締役、会計参与または会計監査人が監査等委員の全員に対して監査等委員会に報告すべき事項を通知したときは、当該事項を監査等委員会へ報告することを要しない。",ans:"正しい",
   exp:"399条の12。"},
  {id:"K-02-13-021",subject:"企業法",chapter:"第2章 機関",sub:"13. 監査等委員会設置会社 (3) 監査等委員会設置会社の取締役会",num:1,rank:"A",src:"",
   q:"監査等委員会設置会社の取締役会は、経営の基本方針の決定を行う。",ans:"正しい",
