   exp:"461条１項１号。取得請求権付株式または取得条項付株式を取得する場合以外で、自己株式を有償取得した場合（以下の(ⅰ)～(ⅵ) まで）に株主に対して交付する金銭等（当該株式会社の株式を除く）の帳簿価額の総額は、自己株式取得の効力が発生した日における分配可能額（461条２項）を超えてはならない。(ⅰ) 譲渡制限株式の譲渡を承認しない場合の買取請求による取得（140条以下） (ⅱ) 株主との合意による取得（156条以下） (ⅲ) 全部取得条項付種類株式の取得（171条～173条） (ⅳ) 譲渡制限株式の相続人等に対する売渡請求による取得（174条～177条） (ⅴ) 所在不明株主の株式の買取りによる取得（197条３項４項） (ⅵ) 端数処理手続における株式の買取りによる取得（234条、235条）"},
  {id:"K-03-05-046",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:4,rank:"A",src:"平30Ⅰ問題15 ア類・平28Ⅱ問題７イ類・平27Ⅰ問題４エ類・平20 問題５ウ類",
   q:"株主との合意による自己株式の有償取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"正しい",
   exp:"461条１項２号３号。上記問題３の解説参照。"},
  {id:"K-03-05-047",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:5,rank:"A",src:"令４問題６ウ類・平30Ⅰ問題15 ウ",
   q:"相続により株式会社の譲渡制限株式を取得した者に対し、当該株式会社が、定款の定めおよび株主総会の決議に基づき、当該株式を当該株式会社に売り渡すことを請求した場合において、当該請求に基づき、当該株式会社が当該株式を買い取る行為により株主に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額は、当該行為がその効力を生ずる日における分配可能額を超えてはならない。",ans:"正しい",
   exp:"461条１項５号。上記問題３の解説参照。"},
  {id:"K-03-05-048",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:6,rank:"A",src:"平30Ⅰ問題15 エ・平23Ⅱ問題15 イ類",
   q:"株式会社が、株主の請求により、その有する単元未満株式を買い取る行為により株主に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額は、当該行為がその効力を生ずる日における分配可能額を超えてはならない。",ans:"誤り",
   exp:"461条１項参照。単元未満株式買取請求により、単元未満株式を買い取る行為は、一般的に買取代金がさほど高額にならないし、株主の投下資本回収を保障する必要性が高いことから、財源規制の対象とならない。"},
  {id:"K-03-05-049",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:7,rank:"A",src:"",
   q:"吸収合併に伴う自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"誤り",
   exp:"461条１項参照。吸収合併に伴う自己株式の取得は、債権者異議手続が設けられているため、財源規制は課せられていない。なお、吸収分割に伴う自己株式の取得も同様である。"},
  {id:"K-03-05-050",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:8,rank:"A",src:"平30Ⅰ問題15 イ",
   q:"株式会社が、他の会社の事業の全部を譲り受ける場合において、当該他の会社が有する当該株式会社の株式を取得する行為により当該他の会社に対して交付する金銭等（当該株式会社の株式を除く。）の帳簿価額の総額は、当該行為がその効力を生ずる日における分配可能額を超えてはならない。",ans:"誤り",
   exp:"461条１項参照。他の会社の事業の全部の譲受けに伴う自己株式の取得はやむを得ない取得であるため、財源規制の対象とならない。"},
  {id:"K-03-05-051",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:9,rank:"A",src:"令４Ⅰ問題15 ウエ類・平25Ⅰ問題16 エ類・平20 問題５イ類",
   q:"吸収分割契約にかかる反対株主の株式買取請求に伴う自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"誤り",
   exp:"461条１項参照。組織再編行為等にかかる反対株主の株式買取請求による自己株式の取得は、反対株主の投下資本回収という利益を保護するため、財源規制は課せられていない。"},
  {id:"K-03-05-052",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:10,rank:"A",src:"",
   q:"株主との合意による自己株式の有償取得により株式会社が株主に対して交付した金銭等（当該株式会社の株式を除く）の帳簿価額の総額が、その効力発生日における分配可能額を超える場合は、金銭等を受領した株主および当該取得に関する職務を行った業務執行者等は、当該株式会社に対し、連帯して、交付した金銭等のうち分配可能額を超えた部分に相当する金銭を支払う義務を負う。",ans:"誤り",
   exp:"462条１項。株主との合意による自己株式の取得が、その効力発生日における分配可能額を超える場合は、金銭等を受領した株主および当該取得に関する職務を行った業務執行者、株主総会または取締役会に議案を提出した取締役等は、当該株式会社に対し、連帯して、交付を受けた金銭等に相当する金銭を支払う義務を負う。すなわち、分配可能額の超過額の支払責任ではなく、交付を受けた金銭等の全額に相当する金銭を支払う義務を負うのである。"},
  {id:"K-03-05-053",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:11,rank:"A",src:"",
   q:"譲渡制限株式の相続人等に対する売渡請求による自己株式の取得により株式会社が株主に対して交付した金銭の額が、その効力発生日における分配可能額を超える場合、金銭を受領した株主が分配可能額を超えていることについて善意であるならば、当該株主は、当該株式会社に対して、交付を受けた金銭の額を支払う義務を負わない。",ans:"誤り",
   exp:"462条１項２項。財源規制違反の株主の株式会社に対する支払責任は、無過失責任である。したがって、金銭等を受領した株主が分配可能額を超えていることについて善意である場合でも、当該株主は、当該株式会社に対して、交付を受けた金銭等に相当する金銭を支払わなければならない。"},
  {id:"K-03-05-054",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:12,rank:"A",src:"",
   q:"譲渡制限株式の譲渡を承認しない場合の買取請求に応じた自己株式の取得により株式会社が株主に対して交付した金銭の額が、その効力発生日における分配可能額を超える場合であっても、当該自己株式の取得に関する職務を行った業務執行者がその職務を行うについて注意を怠らなかったことを証明したときは、当該株式会社に対して、株主が交付を受けた金銭の額を支払う義務を負わない。",ans:"正しい",
   exp:"462条１項２項。株主以外の業務執行者、株主総会または取締役会に議案を提出した取締役等の財源規制違反の責任は、立証責任の転換された過失責任である。"},
  {id:"K-03-05-055",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:13,rank:"A",src:"",
   q:"株式会社における取得条項付株式の取得により株式会社が株主に対して交付した金銭の額が、取得事由の生じた日における分配可能額を超える場合は、当該取得に関する職務を行った業務執行者等は、当該株式会社に対し、連帯して、取得条項付株式を有する株主が交付を受けた金銭の額を支払う義務を負う。",ans:"誤り",
   exp:"462条１項、461条１項参照。株式会社における取得条項付株式の取得が取得事由の生じた日における分配可能額を超える場合は、当該取得に関する職務を行った業務執行者等は、当該株式会社に対し、連帯して、取得条項付株式を有する株主が交付を受けた金銭等に相当する金銭を支払う義務を負わない。株主との合意による自己株式取得等は、取締役等の主導の下で行われるため、財源規制に違反した場合は取締役等に462条の責任を負わせるべきである。一方で、取得条項付株式の取得は取得事由の定め方によっては取締役の意思にかかわらず行われるため、取締役等に462条の責任を負わせるのは適当ではないのである。なお、取得請求権付株式の取得も株主の請求に基づくものであるため、取得条項付株式と同様に取締役等は462条の責任は負わない。"},
  {id:"K-03-05-056",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:14,rank:"A",src:"",
   q:"株式会社において、株主との合意により自己株式の取得をした事業年度末に欠損が生じた場合、自己株式の取得に関する業務執行者は、その職務を行うについて注意を怠らなかったことを証明した場合を除き、当該株式会社に対し、連帯して、当該欠損額（当該欠損額が当該取得により株主に対して交付した金銭等の帳簿価額の総額を超える場合にあっては、当該帳簿価額の総額）を支払う義務を負う。",ans:"正しい",
   exp:"465条１項２号３号。当該責任は、立証責任が転換された過失責任である。"},
  {id:"K-03-05-057",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:15,rank:"B",src:"",
   q:"株式会社において、その発行する取得条項付株式を取得した事業年度末に欠損が生じた場合であっても、自己株式の取得に関する業務執行者は、当該株式会社に対し、欠損填補責任を負わない。",ans:"誤り",
   exp:"465条１項５号。株式会社において、その発行する取得条項付株式を取得した事業年度末に欠損が生じた場合は、自己株式の取得に関する業務執行者等は、当該株式会社に対し、当該欠損額と当該取得により株主に対して交付した金銭等の帳簿価額の総額とのいずれか少ない額を支払う義務を負う。これは、取得請求権付株式の取得においても同様である（456条１項４号）。"},
  {id:"K-03-05-058",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:16,rank:"C",src:"",
   q:"発行する全部の株式を譲渡制限株式とする定款の変更において、反対株主の株式買取請求に応じて自己株式を取得する場合、当該請求をした株主に対して支払った金銭の額が、支払日における分配可能額を超えるときは、当該株式の取得に関する職務を行った業務執行者は、その職務を行うについて注意を怠らなかったことを証明した場合を除き、連帯して、その超過額を支払う義務を負う。",ans:"正しい",
   exp:"464条１項。株式会社が、反対株主の株式買取請求（組織再編行為等に係るものを除く）の規定（116条１項、182条の４第１項）による請求に応じて株式を取得する場合において、当該請求をした株主に対して支払った金銭の額が、支払日における分配可能額を超えるときは、当該株式の取得に関する職務を行った業務執行者は、株式会社に対し、連帯して、その超過額を支払う義務を負う。ただし、その者がその職務を行うについて注意を怠らなかったことを証明した場合は、当該義務を免れることができる。すなわち、当該責任は、立証責任が転換された過失責任である。"},
  {id:"K-03-05-059",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (6) 財源規制",num:17,rank:"C",src:"",
   q:"発行済の種類株式について全部取得条項を設ける定款の変更において、反対株主の株式買取請求に応じて自己株式を取得する場合、当該請求をした株主に対して支払った金銭の額が、支払日における分配可能額を超えるときの業務執行者の責任は、総株主の同意によっても免除することができない。",ans:"誤り",
   exp:"464条２項。当該責任は、総株主の同意によって免除することが可能である。"},
  {id:"K-03-05-060",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:1,rank:"A",src:"平28Ⅱ問題10 ウ類・平22Ⅰ問題９ア類",
   q:"株式会社は、自己株式については、議決権を有しない。",ans:"正しい",
   exp:"308条２項。株式会社が自己株式について議決権を有するとなると、会社支配の公正の観点から望ましくないためである。なお、種類株主総会においても同様である（325条）。"},
  {id:"K-03-05-061",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:2,rank:"B",src:"令５Ⅱ問題６イ",
   q:"株式会社は、自己株式について、剰余金の配当をすることができない。",ans:"正しい",
   exp:"453条かっこ書。株式会社は、自己株式については、剰余金配当請求権を有しない。なぜなら、株式会社が自己株式について剰余金の配当を受けた場合、いったん計上した利益を翌事業年度の営業外収益に受取配当金として再度計上する結果となり、投資家に対して収益力に関する誤解を与えるおそれがあるためである。"},
  {id:"K-03-05-062",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:3,rank:"B",src:"",
   q:"株式会社は、自己株式について、残余財産の分配をすることができない。",ans:"正しい",
   exp:"504条３項かっこ書。株式会社は、自己株式については、残余財産分配請求権を有しない。これを認めると、清算が終了しないからである。"},
  {id:"K-03-05-063",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:4,rank:"A",src:"平31Ⅰ問題６ウ・平21 問題６イ類",
   q:"株式会社は、自己株式についても、株式無償割当てを行うことができる。",ans:"誤り",
   exp:"186条２項。株式会社は、自己株式については、株式無償割当てを受ける権利を有しない。これは、株式会社が自己株式を原始取得するのは妥当ではないからである。なお、同様の趣旨から、自己株式については、募集株式の割当てを受ける権利（202条２項）、募集新株予約権の割当てを受ける権利（241条２項）、新株予約権無償割当てを受ける権利（278条２項）を有しない。"},
  {id:"K-03-05-064",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:5,rank:"A",src:"令５Ⅱ問題６ア",
   q:"株式会社は、自己株式について、新株予約権無償割当てをすることができない。",ans:"正しい",
   exp:"278条２項。問題４の解説参照。"},
  {id:"K-03-05-065",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (7) 自己株式の法的地位",num:6,rank:"A",src:"令５Ⅱ問題５ウ類・平31Ⅰ問題６イ",
   q:"自己株式は、株式の分割の対象となる。",ans:"正しい",
   exp:"184条参照。株式の分割の効果は、自己株式にも及ぶと解する。自己株式にも効果が及ばないと、自己株式の価値を維持することができないためである。同様に、株式の併合の効果は、自己株式にも及ぶと解する（182条参照）。株式の併合の場合は、他の株主との関係において不公平となってしまうためである。"},
  {id:"K-03-05-066",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:1,rank:"A",src:"平20 問題３エ",
   q:"子会社は、いかなる場合であっても、親会社株式を取得することができない。",ans:"誤り",
   exp:"135条１項。子会社は、原則として、親会社株式を取得することができない。親会社と子会社の間には経済的一体性および支配従属関係が存在するため、子会社による親会社株式の自由な取得を認めてしまうと自己株式取得に関する厳格な手続（155条等）や財源規制（461条等）の潜脱を許すことになるおそれがあり、親会社が自己株式を取得する場合と同様の弊害が生じてしまうおそれがある。また、自己株式の場合は所定の手続を経れば取得を認めているのに対して、子会社による親会社株式取得が原則禁止とされているのは、自己株式取得と同様の規制をすることが困難であるためである。ただし、以下に掲げる場合は、例外的に親会社株式を取得することができる（135条２項）。(ⅰ) 他の会社（外国会社を含む）の事業の全部を譲り受ける場合において当該他の会社の有する親会社株式を譲り受ける場合 (ⅱ) 合併後消滅する会社から親会社株式を承継する場合 (ⅲ) 吸収分割により他の会社から親会社株式を承継する場合 (ⅳ) 新設分割により他の会社から親会社株式を承継する場合 (ⅴ) 無償取得等、その他法務省令で定める場合（会社法施行規則23条）"},
  {id:"K-03-05-067",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:2,rank:"A",src:"",
   q:"子会社は、市場取引または公開買付けによって親会社株式を取得することができる。",ans:"誤り",
   exp:"135条２項各号参照。問題１の解説参照。子会社は、市場取引または公開買付けによって親会社株式を取得することは認められない。"},
  {id:"K-03-05-068",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:3,rank:"A",src:"",
   q:"子会社は、無償であっても、親会社株式を取得することができない。",ans:"誤り",
   exp:"135条２項５号、会社法施行規則23条５号。問題１の解説参照。無償による取得は、親会社株式取得による弊害がないため、認められている。"},
  {id:"K-03-05-069",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:4,rank:"A",src:"平24Ⅰ問題４ア",
   q:"子会社が、他の会社の事業の一部を譲り受ける場合において当該他の会社の有する親会社株式を有償で譲り受ける場合には、親会社株式を取得できる。",ans:"誤り",
   exp:"135条２項各号参照。問題１の解説参照。子会社が他の会社の事業の一部を譲り受ける際に、当該他の会社から親会社株式を取得することは、やむを得ない取得に該当しないため、認められない。なお、子会社が他の会社の事業の全部を譲り受ける際に、当該他の会社から親会社株式を取得することは、やむを得ない取得に該当するため、認められている（135条２項１号）。"},
  {id:"K-03-05-070",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:5,rank:"A",src:"平24Ⅰ問題４イ",
   q:"子会社が、吸収合併により合併後消滅する会社から親会社株式を承継する場合には、親会社株式を取得できる。",ans:"正しい",
   exp:"135条２項２号。問題１の解説参照。当該取得はやむを得ない取得であるため、例外的に認められている。その他、他の会社の事業の全部を譲り受ける場合において、当該他の会社の有する親会社株式を譲り受ける場合や、吸収分割または新設分割により他の会社から親会社株式を承継する場合も同様に認められる（135条２項１号３号４号）。"},
  {id:"K-03-05-071",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:6,rank:"A",src:"平31Ⅱ問題５ア・平24Ⅰ問題４ウ",
   q:"子会社が、市場価格のある親会社株式を、当該株式１株を取得するのと引換えに交付する金銭等の額が当該株式１株の市場価格として法務省令で定める方法により算定されるものを超えない額で取得する場合には、親会社株式を取得できる。",ans:"誤り",
   exp:"135条２項各号参照。問題１の解説参照。子会社が時価よりも安い価額で親会社株式を取得する場合であっても、親会社株式の取得の弊害が少なくなるわけではないため、この場合、取得は認められていない。"},
  {id:"K-03-05-072",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:7,rank:"C",src:"平24Ⅰ問題４エ",
   q:"子会社が、その権利の実行に当たり目的を達成するために親会社株式を取得することが必要かつ不可欠である場合、親会社株式を取得できる。",ans:"正しい",
   exp:"135条２項５号、会社法施行規則23条14号。必要かつ不可欠である場合の典型例は、子会社の債務者が親会社株式以外の財産を有しない場合である。"},
  {id:"K-03-05-073",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:8,rank:"C",src:"",
   q:"吸収合併消滅会社の株主に対して交付する金銭等の全部または一部が存続株式会社の親会社株式である場合には、当該存続株式会社は、吸収合併に際して消滅会社の株主に対して交付する当該親会社株式の総数を超えない範囲において当該親会社株式を取得することができる。",ans:"正しい",
   exp:"800条１項。これは、三角合併をする場合の親会社株式の取得を許容した規定である。なお、吸収分割および株式交換でも同様である。"},
  {id:"K-03-05-074",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:9,rank:"B",src:"平31Ⅱ問題５エ類",
   q:"子会社は、親会社株式を取得した後遅滞なく、当該親会社株式を処分しなければならない。",ans:"誤り",
   exp:"135条３項。子会社は、相当の時期にその有する親会社株式を処分しなければならない。しかし、親会社株式について流通性がない場合にはその処分が困難なことがあるし、市場価格があっても大量に取得した場合には市場に与える影響の大きさからその売却が困難となる場合がありえることから、親会社株式を親会社自身が簡易な手続で取得することが認められている（163条）。なお、組織再編行為を行う子会社が親会社株式を交付するために取得する場合（800条１項）は、当該組織再編行為の効力発生日までの間は、親会社株式を保有し続けることができる（同条２項本文）。"},
  {id:"K-03-05-075",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:10,rank:"A",src:"令７Ⅰ問題５エ・平31Ⅱ問題５イ類・平22Ⅰ問題９イ",
   q:"子会社は、適法に保有している親会社株式についても議決権を行使できる。",ans:"誤り",
   exp:"308条１項かっこ書。子会社は、その有する親会社株式について議決権を有しない。親会社の支配の公正を歪めるおそれがあるからである。"},
  {id:"K-03-05-076",subject:"企業法",chapter:"第3章 株式",sub:"5. 自己株式の取得 (8) 子会社による親会社株式の取得",num:11,rank:"C",src:"平31Ⅱ問題５ウ",
   q:"子会社は、その有する親会社株式につき、剰余金の配当を受けることができない。",ans:"誤り",
   exp:"親会社株式において、自益権（剰余金配当請求権等）については、すべて認められると解されている。なぜなら、子会社の少数株主や債権者を保護する必要があるためである。"},
  {id:"K-03-06-001",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:1,rank:"B",src:"",
   q:"株式会社は、その株式に係る株券を発行する場合は、定款にその旨を定めなければならない。",ans:"正しい",
   exp:"214条。会社法は株券の不発行を原則とし、株券を発行する旨を定款に定めないかぎり、株券を発行することができない。"},
  {id:"K-03-06-002",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:2,rank:"B",src:"令４Ⅱ問題６ア",
   q:"種類株式発行会社は、ある種類の株式についてのみ株券を発行する旨を定款で定めることができる。",ans:"誤り",
   exp:"214条かっこ書。ある種類株式にのみ株券を発行することはできない。"},
  {id:"K-03-06-003",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:3,rank:"C",src:"",
   q:"公開会社である株券発行会社が株式を発行した場合は、直ちに、当該株式に係る株券を発行しなければならない。",ans:"誤り",
   exp:"215条１項。株券発行会社は、株式を発行した日以後遅滞なく、当該株式に係る株券を発行しなければならない。"},
  {id:"K-03-06-004",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:4,rank:"C",src:"",
   q:"公開会社でない株券発行会社は、株式を発行した場合であっても、株主から請求がある時までは株券を発行しないことができる。",ans:"正しい",
   exp:"215条４項。"},
  {id:"K-03-06-005",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:5,rank:"A",src:"令４Ⅱ問題６イ・平24Ⅰ問題５ア類",
   q:"種類株式発行会社が発行する株券には、当該株券に係る株式の種類およびその内容を記載し、代表取締役（指名委員会等設置会社では代表執行役）がこれに署名し、または記名押印しなければならない。",ans:"正しい",
   exp:"216条４号。株券には、① 株券発行会社の商号、② 当該株券に係る株式の数、③ 譲渡による当該株券に係る株式の取得について株式会社の承認を要することを定めたときは、その旨、④ 種類株式発行会社にあっては、当該株券に係る株式の種類およびその内容、およびその番号を記載し、株券発行会社の代表取締役（指名委員会等設置会社では代表執行役）がこれに署名し、または記名押印しなければならない（216条）。"},
  {id:"K-03-06-006",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:6,rank:"A",src:"平24Ⅰ問題５イ・平24Ⅰ問題５エ",
   q:"株券には、会社成立の年月日、株券発行年月日、および株主の氏名を記載しなければならない。",ans:"誤り",
   exp:"216条各号参照。会社成立の年月日、株券発行年月日、および株主の氏名または名称を株券に記載することは求められていない。"},
  {id:"K-03-06-007",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:7,rank:"B",src:"令６Ⅰ問題７エ類・令２Ⅰ問題４ウ",
   q:"最高裁判所の判例によれば、株券発行会社が、会社法が定める株券としての形式を具備した文書を作成すれば、株主に当該文書を交付しなくても、当該文書は株券としての効力を生じる。",ans:"誤り",
   exp:"最判昭40年11月16日。判例によると、株券は、株券発行会社が株券を株主に交付したときに効力が発生する。"},
  {id:"K-03-06-008",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (1) 総則",num:8,rank:"B",src:"",
   q:"株券の占有者は、当該株券に係る株式についての権利を適法に有する。",ans:"誤り",
   exp:"131条１項。株券の占有者は、当該株券に係る株式についての権利を適法に有するものと推定する。これを、株券の資格授与的効力（推定的効力）という。株券を所持する者が必ず実質的な株主であるとは限らない。しかし、株券発行会社において、株式の譲渡は株券の交付によって行われる（128条１項本文）ので、株券の占有者は実質的な株主である可能性が高い。したがって、会社法はこの可能性の大きさから株券の占有者を適法な権利者として推定して、その者に形式的な資格を与えているのである。"},
  {id:"K-03-06-009",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (2) 善意取得",num:1,rank:"B",src:"令２Ⅰ問題４ア類・平20 問題３ウ類",
   q:"株券の交付を受けた者は、譲渡人が無権利者であることについて悪意である場合でも、当該株券に係る株式についての権利を取得する。",ans:"誤り",
   exp:"131条２項。株券の交付を受けた者は、悪意または重大な過失がないかぎり、当該株券が表章する株式についての権利を取得する。これを善意取得という。譲渡人が無権利者であれば、株式の譲渡は、本来無効であるが、それでは株式の流通の安全を図ることができないので、会社法は善意取得制度を設けている。"},
  {id:"K-03-06-010",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (3) 株券を発行する旨の定款の定めの廃止",num:1,rank:"C",src:"",
   q:"株券発行会社は、その株式（種類株式発行会社では全部の種類の株式）に係る株券を発行する旨の定款の定めを廃止する定款の変更をしようとするときは、その旨および効力発生日等を、効力発生日の２週間前までに、公告し、かつ、株主および登録株式質権者には、各別にこれを通知しなければならない。",ans:"正しい",
   exp:"218条１項。公告および通知が要求されるのは、名義書換が未了の株主に名義書換等を促すためである。"},
  {id:"K-03-06-011",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (3) 株券を発行する旨の定款の定めの廃止",num:2,rank:"C",src:"令６Ⅰ問題７イ",
   q:"株式会社が、その株式に係る株券を発行する旨の定款の定めを廃止する定款変更をしたときは、当該株式会社の株主は、当該定款変更がその効力を生じた日から遅滞なく自己の有する株券を当該株式会社に提出しなければならない。",ans:"誤り",
   exp:"219条１項各号参照。株券を発行する旨の定款の定めを廃止する定款変更の効力発生日をもって株券は無効となるが（218条２項）、当該株券の提出は会社法上義務づけられていない。"},
  {id:"K-03-06-012",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (4) 株券の提出等",num:1,rank:"B",src:"平22Ⅰ問題５イ",
   q:"株券発行会社が株式の併合をするには、株券を全く発行していない場合を除き、株券の提出に関する手続をとらなければならない。",ans:"正しい",
   exp:"219条１項柱書本文、２号。①～⑨の株式に係る株券は、株券提出日に無効となる（同条３項）。株券発行会社が以下の行為をする場合には、当該行為の効力が生ずる日（⑤ 特別支配株主による株式等売渡請求における対象会社の承認をする場合には、特別支配株主が売渡株式等を取得する日）（株券提出日）までに株券を提出しなければならない旨を当該日の１か月前までに、公告し、かつ、当該株式の株主およびその登録株式質権者には、各別にこれを通知しなければならない。ただし、当該株式の全部について株券を発行していない場合は、この限りでない（同条項ただし書）。① 譲渡制限についての定款の定めを設ける定款の変更をする場合全部の株式（種類株式発行会社では当該事項についての定めを設ける種類の株式） ② 株式の併合をする場合全部の株式（種類株式発行会社では併合する種類株式） ③ 全部取得条項付種類株式の取得をする場合当該全部取得条項付種類株式 ④ 取得条項付株式の取得をする場合当該取得条項付株式 ⑤ 特別支配株主による株式等売渡請求における対象会社の承認をする場合売渡株式 ⑥ 組織変更をする場合全部の株式 ⑦ 合併（合併により当該株式会社が消滅する場合に限る）をする場合全部の株式 ⑧ 株式交換をする場合全部の株式 ⑨ 株式移転をする場合全部の株式"},
  {id:"K-03-06-013",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (4) 株券の提出等",num:2,rank:"B",src:"平25Ⅱ問題17 ア",
   q:"株券発行会社が株式移転をする場合には、当該株券発行会社の株式に係るすべての株券は、当該株式移転の効力が生ずる日に無効となる。",ans:"正しい",
   exp:"219条３項。上記問題１の解説中における①～⑨の株式に係る株券は、株券提出日に無効となる（同条３項）。すなわち、株式移転をする場合には、その効力が生ずる日＝株券提出日となるため、効力発生日に株券は無効となる。"},
  {id:"K-03-06-014",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (4) 株券の提出等",num:3,rank:"B",src:"令５Ⅰ問題６エ",
   q:"最高裁判所の判例によれば、譲渡制限株式でない株式に係る株券の提出に関する公告等の手続がとられ、株券提出期間が経過したことにより無効となった株券（以下、「旧株券」という。）を所持する者は、株券提出期間経過前に譲渡により株主となっていた場合には、株式会社に対し、旧株券を呈示し、株券提出期間経過前に当該旧株券の交付を受けて株式を譲り受けたことを証明して、株主名簿の名義書換を請求することができる。",ans:"正しい",
   exp:"最判昭60年３月７日。最高裁判所の判例によれば、旧株券は、株券提出期間が経過した後は株券としては無効のものとなると解されるが、株券提出期間内に旧株券を提出しなかった株主も株主たる地位を失うものではなく、名義書換との関係においては、会社は、これを請求する株主が株主名簿に記載されていないことを理由に株主であることを否定して名義書換を拒否することはできないから、株券提出期間経過前に株主になっていた者は、期間経過によりその所持する旧株券が株券としては無効となった後であっても、会社に対し、旧株券を提示し、株券提出期間経過前に旧株券の交付を受けて株式を譲り受けたことを証明して、名義書換を請求することができる。"},
  {id:"K-03-06-015",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (5) 株券不所持制度",num:1,rank:"B",src:"令４Ⅱ問題６ウ",
   q:"公開会社である株券発行会社の株主は、当該株券発行会社に対して、自己の有する株式に係る株券の所持を希望しない旨を申し出ることはできない。",ans:"誤り",
   exp:"217条１項。公開会社か否かに関係なく、株券発行会社の株主は、当該株券発行会社に対して、自己の有する株式に係る株券の所持を希望しない旨を申し出ることができる。これを、株券不所持制度という。"},
  {id:"K-03-06-016",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (5) 株券不所持制度",num:2,rank:"B",src:"令６Ⅰ問題７ア",
   q:"株主が、株式会社に対し、株券の所持を希望しない旨を申し出た場合には、当該株主が所持していた株券は、当該株主が当該株券を当該株式会社に提出した時に無効となる。",ans:"誤り",
   exp:"217条５項。株券不所持の申出は、その申出に係る株式の数（種類株式発行会社では株式の種類及び種類ごとの数）を明らかにしてしなければならない。この場合において、当該株式に係る株券が発行されているときは、当該株主は、当該株券を株券発行会社に提出しなければならない（217条２項）。また、株券不所持の申出を受けた株券発行会社は、遅滞なく、その株式に係る株券を発行しない旨を株主名簿に記載し、または記録しなければならず（217条３項）、この時点において、当該株券は無効となる。"},
  {id:"K-03-06-017",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (5) 株券不所持制度",num:3,rank:"B",src:"",
   q:"株券発行会社に自己の有する株式に係る株券の所持を希望しない旨を申し出た株主は、いつでも、当該株券発行会社に対して株券の発行を請求することができる。",ans:"正しい",
   exp:"217条６項前段。株券発行会社においては、株式を譲渡する際には株券の交付が必要となる（128条１項）。したがって、株券不所持制度を申し出ている株主が株式を譲渡しようとする場合には、会社から株券の発行を受ける必要があるのである。なお、当該請求が株券の再発行である場合には、当該株券の発行費用は株主の負担となるが、株式発行の効力発生以降、株券が未発行である時点で株券不所持の申出をした株主が初めて株券発行請求を行う場合は、当該発行費用は会社負担となる（217条６項後段）。これは、株券発行会社である以上、当該株式にかかる最初の株券発行については、会社が費用を負担するべきだからである。"},
  {id:"K-03-06-018",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:1,rank:"B",src:"",
   q:"株券を喪失した者は、株券発行会社に対し、当該株券についての株券喪失登録を請求することができる。",ans:"正しい",
   exp:"223条。"},
  {id:"K-03-06-019",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:2,rank:"C",src:"",
   q:"株券発行会社が株主名簿管理人を置く場合、株券喪失登録簿に関する事務は当該株主名簿管理人が行う。",ans:"正しい",
   exp:"222条。株主名簿と株券喪失登録簿とを一元管理するためである。"},
  {id:"K-03-06-020",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:3,rank:"C",src:"",
   q:"株券喪失登録がなされた場合に、株券喪失登録者が株主名簿の名義人と異なるときは、株券発行会社は、遅滞なく、当該名義人に対して、当該株券について株券喪失登録をした旨およびその他の法定事項を通知しなければならない。",ans:"正しい",
   exp:"224条１項。株券喪失登録者が株主名簿の名義人と異なる場合、当該名義人が真実の権利者である可能性がある。その場合、その名義人が知らないうちに無権利者が株券喪失登録請求を行い株券が無効とされ、新株券が交付されてしまうことのないよう、異議を述べる機会を付与しているのである。"},
  {id:"K-03-06-021",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:4,rank:"C",src:"令４Ⅱ問題６エ類",
   q:"株式について権利を行使するために株券が株券発行会社に提出された場合において、当該株券について株券喪失登録がされているときは、株券発行会社は、直ちに、当該株券についての株券喪失登録を抹消しなければならない。",ans:"誤り",
   exp:"224条２項。株式について権利を行使するために株券が株券発行会社に提出された場合において、当該株券について株券喪失登録がされているときは、株券発行会社は、遅滞なく、当該株券を提出した者に対し、当該株券について株券喪失登録がされている旨を通知しなければならない。したがって、登録が抹消されるわけではないので、本肢は誤りである。"},
  {id:"K-03-06-022",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:5,rank:"C",src:"",
   q:"株券喪失登録がなされた株券を所持する者は、いつでも、株券発行会社に対して、株券喪失登録の抹消を申請することができる。",ans:"誤り",
   exp:"225条１項参照。株券喪失登録がなされた株券を所持する者は、株券喪失登録の日の翌日から１年以内であれば、株券発行会社に対して、株券喪失登録の抹消を申請することができる。その際、抹消を申請する者は、株券を会社に提出しなければならない（225条２項）。"},
  {id:"K-03-06-023",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:6,rank:"B",src:"令６Ⅰ問題７ウ類・令２Ⅰ問題４エ",
   q:"株券喪失登録がなされた株券は、当該株券喪失登録が抹消されない限り、株券喪失登録日の翌日から起算して１年を経過した後に、裁判所の決定によって無効となる。",ans:"誤り",
   exp:"228条１項。株券喪失登録（抹消されたものを除く）がされた株券は、株券喪失登録日の翌日から起算して１年を経過した日に無効となるが、その際に裁判所の決定は不要である。なお、当該規定により株券が無効となった場合、株券発行会社は、当該株券についての株券喪失登録者に対し、株券を再発行しなければならない（228条２項）。"},
  {id:"K-03-06-024",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:7,rank:"B",src:"",
   q:"株券喪失登録がなされると、株券発行会社は、株券喪失登録日の翌日から起算して１年を経過した日までの間は、喪失登録がされた株券に係る株式について、株主名簿の名義書換をすることができない。",ans:"誤り",
   exp:"230条１項。株券喪失登録がなされると、株券発行会社は、① 株券喪失登録が抹消された日、② 株券喪失登録日の翌日から起算して１年を経過した日のいずれか早い日までの間は、喪失登録がされた株券にかかる株式について、株主名簿の名義書換をすることができない。なぜなら、自由に名義書換ができるとなると、株券の流通が継続し、株券喪失登録者にとって喪失株券所持者の把握に支障をきたすおそれがあるためである。"},
  {id:"K-03-06-025",subject:"企業法",chapter:"第3章 株式",sub:"6. 株券 (6) 株券喪失登録制度",num:8,rank:"B",src:"",
   q:"株券喪失登録者は、登録抹消日までの間は、当該株式について議決権を行使することができない。",ans:"誤り",
   exp:"230条３項。株券喪失登録者が株主名簿の名義人でない場合は、登録抹消日までの間は、当該株式について議決権行使は認められない。"},
  {id:"K-03-07-001",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:1,rank:"B",src:"平21 問題４ア",
   q:"株式会社は、株主名簿に、株主が株式を取得した日を記載または記録しなければならない。",ans:"正しい",
   exp:"121条。株式会社は、株主名簿を作成し、会社法に規定する株主名簿記載事項を記載し、または記録しなければならない。なお、株主名簿記載事項として、① 株主の氏名または名称および住所、② 株主の有する株式の数、③ 株主が株式を取得した日、④ 株式会社が株券発行会社である場合には、株式（株券が発行されているものに限る）に係る株券の番号を記載または記録する必要がある（121条各号）。"},
  {id:"K-03-07-002",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:2,rank:"B",src:"令４Ⅰ問題５ア",
   q:"株式会社は、株券が発行されている株式については、当該株式に係る株券の番号を株主名簿に記載し、または記録しなければならない。",ans:"正しい",
   exp:"121条。問題１の解説参照。"},
  {id:"K-03-07-003",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:3,rank:"A",src:"令４Ⅰ問題５イ類",
   q:"株式会社は、株主名簿管理人を置き、当該株式会社に代わって株主名簿の作成および備置きその他の株主名簿に関する事務を行うことを委託しなければならない。",ans:"誤り",
   exp:"123条。会社法は、株主名簿管理人の設置を強制せず、設置するか否かを株式会社が自由に決定できることとしている。また、株主名簿管理人を設置する場合には、定款にその旨を定めなければならない。"},
  {id:"K-03-07-004",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:4,rank:"A",src:"平25Ⅰ問題６ウ",
   q:"株式会社は、株主総会の特別決議によって、株主名簿管理人を置く旨の定款の定めを廃止することができる。",ans:"正しい",
   exp:"123条、466条、309条２項11号。株主名簿管理人の設置は定款の相対的記載事項である。株主名簿管理人を置く旨の定款の定めを廃止する場合は、通常の定款変更の方法である株主総会の特別決議を要する。"},
  {id:"K-03-07-005",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:5,rank:"A",src:"平30Ⅱ問題６ア類・平25Ⅰ問題６ア類",
   q:"株券発行会社の株主は、当該株券発行会社に対し、自己についての株主名簿記載事項を記載した書面の交付を請求することができる。",ans:"誤り",
   exp:"122条１項４項。株券不発行会社の株主には当該請求が認められるが、株券発行会社の株主には当該請求は認められない。株券不発行会社において当該請求が認められている理由としては、株券不発行会社においては株券が発行されないため、第三者に対して自己の権利の証明を可能にする必要があるからである。"},
  {id:"K-03-07-006",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:6,rank:"A",src:"平25Ⅰ問題６イ",
   q:"株式会社は、株主名簿管理人がある場合には、株主名簿をその本店および株主名簿管理人の営業所に備え置かなければならない。",ans:"誤り",
   exp:"125条１項かっこ書き。株式会社は、株主名簿をその本店（株主名簿管理人がある場合はその営業所）に備え置かなければならない。"},
  {id:"K-03-07-007",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:7,rank:"A",src:"令３問題５ウ類・平25Ⅰ問題６エ・平21年問題４イウ類",
   q:"株主は、書面をもって作成されている株主名簿の閲覧または謄写の請求をすることができるが、債権者は、当該請求をすることができない。",ans:"誤り",
   exp:"125条２項。株主および債権者は、株式会社の営業時間内は、いつでも、株主名簿の書面または電磁的記録に記録された事項を表示したものの、閲覧または謄写を請求することができる。この場合においては、当該請求の理由を明らかにしなければならない。"},
  {id:"K-03-07-008",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:8,rank:"A",src:"令４Ⅰ問題５ウ",
   q:"株式会社は、債権者が書面をもって作成されている株主名簿の閲覧または謄写の請求をすることができない旨を定款で定めることができる。",ans:"誤り",
   exp:"125条２項。株主および債権者による株主名簿の閲覧請求権を定款によって排除することは認められていない。"},
  {id:"K-03-07-009",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:9,rank:"A",src:"平21年問題４エ類",
   q:"株式会社の親会社社員は、その権利を行使するため必要があるときは、裁判所の許可を得て、当該株式会社の株主名簿の閲覧または謄写請求を、当該請求の理由を明らかにしたうえですることができる。",ans:"正しい",
   exp:"125条４項。"},
  {id:"K-03-07-010",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:10,rank:"A",src:"",
   q:"株式会社は、株主から株主名簿の閲覧請求があったときは、いかなる場合であってもこれを拒むことができない。",ans:"誤り",
   exp:"125条３項。株式会社は、法定の拒否事項がある場合は、株主名簿の閲覧または謄写請求を拒むことができる。これは、債権者および親会社社員からの請求における裁判所の許可についても同様である（125条３項５項）。この法定事項とは、① 請求者がその権利の確保または行使に関する調査以外の目的で請求を行ったとき、② 請求者が当該株式会社の業務の遂行を妨げ、または株主の共同の利益を害する目的で請求を行ったとき、③ 請求者が株主名簿の閲覧または謄写によって知り得た事実を利益を得て第三者に通報するため請求を行ったとき、④ 請求者が、過去２年以内において、株主名簿の閲覧または謄写によって知り得た事実を利益を得て第三者に通報したことがあるものであるときである（125条３項各号参照）。"},
  {id:"K-03-07-011",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:11,rank:"B",src:"令５Ⅰ問題６ア類",
   q:"株式会社は、株主から株主名簿の閲覧の請求があった場合であっても、請求者が当該株式会社の業務と実質的に競争関係にある事業を営み、またはこれに従事するものであるときは、当該請求を拒むことができる。",ans:"誤り",
   exp:"125条３項各号参照。「請求者が当該株式会社の業務と実質的に競争関係にある事業を営み、またはこれに従事するものであること」は請求の拒否事由とされていない。"},
  {id:"K-03-07-012",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:12,rank:"C",src:"",
   q:"株式会社が株主に対してする通知または催告は、株主名簿に記載された当該株主の住所（当該株主が別に通知または催告を受ける場所または連絡先を当該株式会社に通知した場合にあっては、その場所または連絡先）にあてて発すれば足りる。",ans:"正しい",
   exp:"126条１項。"},
  {id:"K-03-07-013",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (1) 総則",num:13,rank:"C",src:"",
   q:"株式会社が株主に対してする通知または催告は、当該通知または催告が通常到達すべきであった時に到達したものとみなす。",ans:"正しい",
   exp:"126条２項。多数の変動する株主の存在を考慮して、集団的法律関係を簡易迅速かつ画一的に処理するためである。"},
  {id:"K-03-07-014",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (2) 所在不明株主に対する通知の省略等",num:1,rank:"C",src:"令５Ⅰ問題６ウ",
   q:"株式会社が株主に対してする通知または催告が５年以上継続して到達しない場合には、株式会社は、当該株主に対する通知または催告をすることを要しない。",ans:"正しい",
   exp:"196条１項。株主管理コストを削減する趣旨である。"},
  {id:"K-03-07-015",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (2) 所在不明株主に対する通知の省略等",num:2,rank:"C",src:"",
   q:"株式会社が株主に対してする通知または催告が５年以上継続して到達しない場合には、株式会社は、当該株主の有する株式を競売し、かつ、その代金を当該株主に交付することができる。",ans:"誤り",
   exp:"197条１項。株式会社が株主に対してする通知または催告が５年以上継続して到達していない場合で、かつ、当該株主が継続して５年間剰余金の配当を受領しなかった場合、株式会社は、当該株主の有する株式を競売し、かつ、その代金を当該株主に交付することができる。"},
  {id:"K-03-07-016",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (2) 所在不明株主に対する通知の省略等",num:3,rank:"C",src:"",
   q:"取締役会設置会社が所在不明株主の株式を買い取る場合は、買い取る株式の数および対価として交付すべき金銭の総額を株主総会の特別決議で定めなければならない。",ans:"誤り",
   exp:"197条３項４項。取締役会設置会社が所在不明株主の株式を買い取る場合は、買い取る株式の数および対価として交付すべき金銭の総額を取締役会の決議で定めなければならない。"},
  {id:"K-03-07-017",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (2) 所在不明株主に対する通知の省略等",num:4,rank:"C",src:"",
   q:"所在不明株主の株式の買取りによる自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"正しい",
   exp:"461条１項６号。"},
  {id:"K-03-07-018",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:1,rank:"A",src:"",
   q:"株式会社は、基準日を定めて、当該基準日において株主名簿に記載されている株主をその権利行使することができる者と定めることができる。",ans:"正しい",
   exp:"124条１項。"},
  {id:"K-03-07-019",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:2,rank:"A",src:"平22Ⅰ問題６エ",
   q:"株式会社は、基準日および基準日株主が行使することができる権利の内容について、定款または株主総会決議によって定めなければならない。",ans:"誤り",
   exp:"124条１項。基準日の設定は任意であり、定める場合であっても定款または株主総会の決議は不要とされている。"},
  {id:"K-03-07-020",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:3,rank:"A",src:"令８Ⅰ問題６ウ類・平22Ⅰ問題６ア類",
   q:"基準日株主が行使することができる権利は、基準日から１か月以内に行使するものでなければならないとされている。",ans:"誤り",
   exp:"124条２項かっこ書。基準日株主が行使することができる権利は、基準日から３か月以内に行使するものでなければならないとされている。"},
  {id:"K-03-07-021",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:4,rank:"A",src:"平22Ⅰ問題６イ",
   q:"基準日株主が行使することができる権利が剰余金配当請求権である場合には、当該剰余金の配当を決定する株主総会前に全部の株式を譲渡した基準日株主は、配当を受け取ることができない。",ans:"誤り",
   exp:"124条１項。この場合、基準日株主が剰余金配当請求権を行使できることとなるため、当該剰余金の配当を決定する株主総会前に全部の株式を譲渡した基準日株主は、配当を受け取ることができる。"},
  {id:"K-03-07-022",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:5,rank:"B",src:"",
   q:"基準日を定めた場合は、定款に基準日およびその事項についての定めがある場合を除き、基準日の２週間前までに、当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない。",ans:"正しい",
   exp:"124条３項。当該規定の趣旨は、株式取得者に名義書換を請求する機会を与え、権利行使の機会を逸しないようにすることにある。"},
  {id:"K-03-07-023",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:6,rank:"A",src:"令７Ⅰ問題１ウ",
   q:"株式会社は、基準日を定めたときは、当該基準日を登記しなければならない。",ans:"誤り",
   exp:"911条３項各号参照。株式会社は、基準日を定めたときは、当該基準日の２週間前までに、当該基準日および基準日株主が行使することができる権利の内容を公告しなければならない（124条３項本文）。ただし、定款に当該基準日および基準日株主が行使することができる権利の内容についての定めがあるときは、この限りではない（同条項ただし書）。しかし、基準日についての定款の定めがある場合であっても、株式会社の登記事項とはされていない（911条３項各号参照）。"},
  {id:"K-03-07-024",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:7,rank:"A",src:"平22Ⅰ問題６ウ類",
   q:"株式会社は、基準日株主の権利を害することがないならば、基準日後に株式を取得した者を、当該基準日株主が行使することができる権利を行使することができる者と定めることができる。",ans:"誤り",
   exp:"124条４項。基準日株主が行使することができる権利が株主総会または種類株主総会における議決権である場合は、会社は当該基準日後に株式を取得した者の全部または一部を当該権利を行使することができる者として定めることができる。ただし、当該株式の基準日株主の権利を害することができない。当該規定は、基準日後に会社が募集株式の発行や組織再編行為を行った場合を想定して、新株主に例外的に権利行使を許すための規定である。"},
  {id:"K-03-07-025",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (3) 基準日制度",num:8,rank:"A",src:"令５Ⅰ問題６イ",
   q:"株式会社は、基準日において株主名簿に記載されている株主を株主総会における議決権を行使することができる者と定めた場合には、当該基準日後に実施された同一の募集株式の発行により株式を取得した者の一部に、当該株主総会における議決権の行使を認めることができる。",ans:"誤り",
   exp:"124条４項。基準日株主が行使することができる権利が株主総会または種類株主総会における議決権である場合には、株式会社は、当該基準日後に株式を取得した者の全部または一部を当該権利を行使することができる者と定めることができる。ただし、当該株式の基準日株主の権利を害することができない。基準日後に株式会社が募集株式の発行や組織再編行為を行った場合において、新株主に例外的に権利行使を許すために設けられた規定である。この規定を適用するにあたり、株主平等原則（109条１項）に反しないかを検討する必要があり、同一の募集株式の発行により株式を取得した者の一部に議決権の行使を認めることは、そのような取扱いをする合理的な必要性がない限り、株主平等原則違反の問題が生じるおそれがあるため認められない。"},
  {id:"K-03-07-026",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:1,rank:"C",src:"",
   q:"株式会社が株式を発行した場合は、株主の請求によらずとも、当該株式の株主に係る株主名簿記載事項を株主名簿に記載または記録しなければならない。",ans:"正しい",
   exp:"132条１項１号。この他、自己株式を取得した場合や自己株式を処分した場合、株式の併合、株式の分割をした場合も同様に、株主の請求を受けることなく、株主名簿記載事項を株主名簿に記載または記録しなければならない（132条１項２号３号２項３項）。"},
  {id:"K-03-07-027",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:2,rank:"B",src:"",
   q:"株券発行会社において、株式取得者は、株式会社に対して、取得した株式に係る株券を提示することで、単独で株主名簿の名義書換を請求することができる。",ans:"正しい",
   exp:"133条２項。株式取得者による名義書換請求は、利害関係人の利益を害するおそれがないものとして法務省令で定める場合を除き、株主名簿上の名義株主（その相続人その他一般承継人を含む）と共同して名義書換の請求を行わなければならない。したがって、株券発行会社においては、株券を提示して株式取得者が単独で名義書換をすることができるが、株券不発行会社においては、原則として、株式取得者による単独での名義書換は認められない。"},
  {id:"K-03-07-028",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:3,rank:"B",src:"令４Ⅰ問題５エ・令２Ⅱ問題５ウ",
   q:"相続その他の一般承継により譲渡制限株式を取得した者は、当該株式を取得したことについて株式会社の承認を得なければ、当該株式会社に対して株主名簿の名義書換を請求することができない。",ans:"誤り",
   exp:"134条４号。株式取得者が取得した株式が譲渡制限株式である場合には、当該株式取得者は、株式会社に対し、名義書換を請求することができない（134条柱書本文）。譲渡制限株式の趣旨を没却させないためである。ただし、① 当該株式取得者が当該譲渡制限株式を取得することについて、株式会社から譲渡承認（136条）を受けている場合、② 当該株式取得者が当該譲渡制限株式を取得したことについて、株式会社から取得承認（137条１項）を受けている場合、③ 当該株式取得者が、指定買取人（140条４項）である場合、④ 当該株式取得者が、相続その他の一般承継により譲渡制限株式を取得した者である場合は、名義書換を請求することができる。④の場合に名義書換請求が認められるのは、譲渡制限株式の制限は、売買等の特定承継にのみ適用され、相続等の一般承継には適用されないためである。"},
  {id:"K-03-07-029",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:4,rank:"B",src:"平28Ⅱ問題６エ",
   q:"最高裁判所の判例によれば、株券発行会社であるか否かを問わず、株式会社が株式譲受人による名義書換請求を不当に拒絶した場合には、当該株式会社は当該株式譲受人を株主として取り扱わなければならない。",ans:"正しい",
   exp:"最判昭42年９月28日、最判昭41年７月28日。最高裁判所の判例によれば、株式会社が正当な理由がないのに株主名簿の名義書換に応じない場合、株式譲受人は名義書換をすることなく当該株式会社に対して権利行使をすることができるとしている。"},
  {id:"K-03-07-030",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:5,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式譲受人が名義書換を失念した場合であっても、株主割当ての方法による募集株式の発行等に係る募集株式の割当てを受ける権利は、株式譲受人に帰属するとしている。",ans:"誤り",
   exp:"最判昭35年９月15日。最高裁判所の判例によれば、募集株式の割当てを受ける権利は、名簿上の株主である株式譲渡人に帰属し、株式譲受人は株式譲渡人に対して何ら請求することができないとしている。"},
  {id:"K-03-07-031",subject:"企業法",chapter:"第3章 株式",sub:"7. 株主名簿 (4) 名義書換制度（株式等振替制度を除く）",num:6,rank:"B",src:"",
   q:"最高裁判所の判例によれば、株式譲受人が名義書換を失念した場合において、株主名簿上の株主である譲渡人に株式の分割がなされた場合に交付される株式は、株式譲受人に帰属する。",ans:"正しい",
   exp:"最判平19年３月８日。最高裁判所の判例によれば、譲受人が株主名簿の名義書換を失念したため、名簿上の株主である譲渡人に株式の分割がなされた場合に交付される株式は、譲受人に帰属するとしている。また、株式の引渡しを請求した時に、当該株式が第三者に売却されていた場合において、譲受人は譲渡人に対して、売却代金相当額について不当利得返還請求権を認容した。"},
  {id:"K-03-08-001",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (1) 総則",num:1,rank:"B",src:"",
   q:"すべての株式会社は、その発行する株式を振替株式とすることができる。",ans:"誤り",
   exp:"振替法128条１項。振替株式とは、株券を発行する旨の定款の定めがない会社の株式（譲渡制限株式を除く）で振替機関が取り扱うものであるため、本肢は誤りである。"},
  {id:"K-03-08-002",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (1) 総則",num:2,rank:"B",src:"",
   q:"上場会社の発行する新株予約権は、株式等振替制度の対象とならない。",ans:"誤り",
   exp:"振替法２条１項13号。株式等振替制度は、上場会社等の発行する新株予約権も対象とする。その他、新株予約権付社債なども対象となる（２条１項各号参照）。"},
  {id:"K-03-08-003",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (1) 総則",num:3,rank:"A",src:"平29Ⅱ問題５エ・平24Ⅰ問題７ア",
   q:"譲渡制限株式を振替株式とすることができない。",ans:"正しい",
   exp:"振替法128条１項かっこ書。振替株式とは、株券を発行する旨の定款の定めがない会社の株式（譲渡制限株式を除く）で振替機関が取り扱うものをいう。したがって、譲渡制限株式を振替株式とすることはできない。なお、上場会社は株式等振替制度の適用を受けるため、株券を発行することができない。"},
  {id:"K-03-08-004",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (2) 株式等振替制度における株式の権利の帰属",num:1,rank:"B",src:"",
   q:"振替株式についての権利の帰属は、振替口座簿の記載または記録によって定まる。",ans:"正しい",
   exp:"振替法128条１項。すなわち、振替機関等に開設された口座の残高記録により、株式が誰に帰属するのかを決定するのである。"},
  {id:"K-03-08-005",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (2) 株式等振替制度における株式の権利の帰属",num:2,rank:"B",src:"平24Ⅰ問題７ウ",
   q:"加入者は、その口座（口座管理機関の口座にあっては自己口座に限る）に記載または記録された振替株式についての権利を適法に有するものとみなされる。",ans:"誤り",
   exp:"振替法143条。加入者は、その口座における記載または記録がされた振替株式についての権利を適法に有するものと推定する。このように、振替口座簿の記載には資格授与的効力が認められる。"},
  {id:"K-03-08-006",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (3) 振替株式の譲渡方法",num:1,rank:"B",src:"令２Ⅱ問題６ア・平24Ⅰ問題７イ",
   q:"振替株式の譲渡は、振替の申請により、譲受人がその口座（機関口座ではないものとする）における保有欄に当該譲渡に係る数の増加の記載または記録を受けなければ、その効力を生じない。",ans:"正しい",
   exp:"振替法140条。振替株式については、意思表示だけで有効に譲渡することはできず、振替口座簿への記載または記録により株式を譲渡する。"},
  {id:"K-03-08-007",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (3) 振替株式の譲渡方法",num:2,rank:"B",src:"平24Ⅰ問題７エ",
   q:"振替株式を取得した者は、いつでも、当該振替株式の発行者に対し、当該振替株式に係る株主名簿記載事項を株主名簿に記載し、または記録することを請求することができる。",ans:"誤り",
   exp:"振替法161条１項。振替株式については、会社法133条の規定は適用されない。したがって、株主の請求による株主名簿記載事項の記載または記録は認められないため、本肢は誤りである。"},
  {id:"K-03-08-008",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (4) 振替株式の善意取得",num:1,rank:"C",src:"",
   q:"振替の申請によりその口座（口座管理機関の口座にあっては、自己口座に限る）において特定の銘柄の振替株式についての増加の記載または記録を受けた加入者は、悪意または重大な過失がない限り、当該銘柄の振替株式についての当該増加の記載または記録に係る権利を取得する。",ans:"正しい",
   exp:"振替法144条。振替株式には善意取得が認められる。"},
  {id:"K-03-08-009",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:1,rank:"B",src:"",
   q:"株式会社が基準日を定めた場合、振替機関は、当該株式会社に対して、当該基準日の株主に関する事項を速やかに通知しなければならない。",ans:"正しい",
   exp:"振替法151条１項１号。総株主通知である。"},
  {id:"K-03-08-010",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:2,rank:"B",src:"",
   q:"総株主通知を受けた株式会社は、通知された事項を株主名簿に記載しなければならない。この場合には、基準日や効力発生日等の一定の日に株主名簿の名義書換がなされたものとみなされる。",ans:"正しい",
   exp:"振替法152条１項。"},
  {id:"K-03-08-011",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:3,rank:"B",src:"",
   q:"株式会社は、振替機関に対して、会社の定める一定の日の株主についての総株主通知をすることを請求するためには、裁判所の許可を得なければならない。",ans:"誤り",
   exp:"振替法151条８項。株式会社は、正当な理由があるときは、振替機関に対し費用を支払って、会社の定める一定の日の株主につき総株主通知をするよう請求することができる。したがって、裁判所の許可は必要ない。ここでいう正当な理由とは、株主優待制度の対象となる株主を確定する等が挙げられる。"},
  {id:"K-03-08-012",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:4,rank:"B",src:"令２Ⅱ問題６イ",
   q:"振替株式の株主は、株主名簿に自己の氏名または名称および住所が記載され、または記録されていなければ、当該振替株式についての少数株主権等を行使することができない。",ans:"誤り",
   exp:"少数株主権等とは、基準日を定めて基準日株主に行使の機会を与える権利以外の株主権をいう。ここでいう「基準日を定めて基準日株主に行使の機会を与える権利」とは、集団的権利行使の形で行使される株主権のことである。つまり、少数株主権等は、集団的権利行使以外の形で個別に行使される株主権を指す。具体的には、共益権であれば、株主名簿閲覧請求権（125条）、責任追及等の訴え（株主代表訴訟）の提起権（847条）、株主総会招集請求権（297条）等、自益権であれば、株式買取請求権（116条）等である。「少数」株主権等とあるが、集団的権利行使以外の形で個別に行使される株主権であれば、単独株主権も少数株主権等に該当する。株主が少数株主権等を行使する場合には、必ず個別株主通知が必要になる（振替法154条３項）。すなわち、株主名簿に記載のある名簿上の株主でも、少数株主権等を行使するためには、個別株主通知をしなければならないのである。ここで、個別株主通知制度により少数株主権等を行使する場合には、会社法130条１項（株主名簿の名義書換が会社に対する対抗要件であるという規定）は適用されない（振替法154条１項）。なぜなら、個別株主通知制度は、振替口座簿の記載を基準に少数株主権等の行使を認める制度であるからである。"},
  {id:"K-03-08-013",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:5,rank:"B",src:"",
   q:"株式等振替制度において、株主名簿の閲覧請求権を行使することができる者は株主名簿上の名義人である。",ans:"誤り",
   exp:"振替法154条１項。振替機関は、単独株主権および少数株主権（少数株主権等）を行使しようとする株主からの申出により、当該株主に関する事項を会社に対して通知する（振替法154条３項）。これを個別株主通知という。株主が少数株主権等を行使する場合には、必ず個別株主通知が必要になる。すなわち、株主名簿に記載のある名簿上の株主でも、少数株主権等を行使するためには、個別株主通知をしなければならず、個別株主通知を経た株主は、株主名簿の記載等にかかわりなく、株主名簿閲覧請求権等の少数株主権等を行使することができる。なお、個別株主通知制度は、株主名簿の名義を書換える制度ではない。"},
  {id:"K-03-08-014",subject:"企業法",chapter:"第3章 株式",sub:"8. 株式等振替制度 (5) 会社に対する権利行使方法",num:6,rank:"B",src:"令２Ⅱ問題６ウ・平26Ⅱ問題４エ",
   q:"最高裁判所の判例の趣旨によれば、振替株式の株主が裁判所に対し全部取得条項付種類株式の取得価格決定の申立てをする場合には、その審理が開始されるまでに、個別株主通知がされていることを要する。",ans:"誤り",
   exp:"最決平22年12月７日。判例は、振替株式発行会社が全部取得条項付種類株式の取得価格決定申立事件の審理において、申立人が株主であることを争った場合には、その審理終結までの間に個別株主通知がなされることを要するものと解している。"},
  {id:"K-03-09-001",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:1,rank:"B",src:"",
   q:"株券発行会社の株式の質入れは、当該株式に係る株券を交付するとともに、株主名簿に質権者に関する事項を記載または記録しなければその効力を生じない。",ans:"誤り",
   exp:"146条２項。株式の質入れには、略式質と登録質がある。ここで、登録質の場合には、株券の交付に加えて、株主名簿に質権者に関する事項を記載しなければならないが、略式質の場合には、株主名簿に質権者に関する事項の記載は必要ない。"},
  {id:"K-03-09-002",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:2,rank:"B",src:"平25Ⅱ問題５イ",
   q:"株券発行会社でない株式会社における株式（振替株式を除く）の質入れは、その質権者の氏名または名称および住所を株主名簿に記載し、または記録しなければ、当該株式会社その他の第三者に対抗することができない。",ans:"正しい",
   exp:"147条１項。"},
  {id:"K-03-09-003",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:3,rank:"B",src:"平30Ⅱ問題６エ類・平25Ⅱ問題５エ類",
   q:"株券発行会社の株式の質権者は、継続して当該株式に係る株券を占有しなければ、その質権をもって第三者に対抗することができないが、株券発行会社に対しては、株券を継続して占有せずとも、株主名簿に当該質権者に関する事項が記載されていることによって対抗することができる。",ans:"誤り",
   exp:"147条２項。株券発行会社の株式の質権者は、継続して当該株式に係る株券を占有しなければ、その質権をもって株券発行会社その他の第三者に対抗することができない。会社または第三者に対抗するためには、質権者は株券を継続して占有しなければならない（147条２項）。ここで、会社に対する対抗要件が株主名簿への記載・記録ではなく株券の継続占有とされているのは、登録質が会社および第三者に対しての対抗要件を備えるためには、略式質としての対抗要件をも備える必要があるからである。"},
  {id:"K-03-09-004",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:4,rank:"B",src:"平25Ⅱ問題５ウ",
   q:"株式の質権者は、株式会社に対し、質権者の氏名または名称および住所を株主名簿に記載し、または記録するよう請求することができる。",ans:"誤り",
   exp:"148条柱書。質権を株主名簿に記載する請求権を有するのは、株式に質権を設定した者に限られている。したがって、質権者は当該請求権を有していない。"},
  {id:"K-03-09-005",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:5,rank:"B",src:"平26Ⅱ問題４ア",
   q:"振替株式の質入れは、振替の申請により、質権者がその口座における質権欄に当該質入れに係る数の増加の記載または記録を受けなければ、その効力を生じない。",ans:"正しい",
   exp:"振替法141条。"},
  {id:"K-03-09-006",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:6,rank:"B",src:"",
   q:"株主がその有する譲渡制限株式を質入れする場合は、当該株式を発行している株式会社の承認を得なければならない。",ans:"誤り",
   exp:"株主がその有する譲渡制限株式を質入れする場合であっても、当該株式を発行している株式会社の承認を得る必要はない。"},
  {id:"K-03-09-007",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:7,rank:"C",src:"",
   q:"株券発行会社でない株式会社において、登録株式質権者は、当該株式会社に対し、自己についての株主名簿記載事項を記載した書面の交付を請求することができる。",ans:"正しい",
   exp:"149条１項。株券不発行会社において当該請求が認められている理由としては、株券発行会社においては株券が発行されないため、第三者に対して自己の権利の証明を可能にする必要があるからである。なお、株券発行会社では、当該請求は認められない（149条４項）。"},
  {id:"K-03-09-008",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:8,rank:"B",src:"平25Ⅱ問題17 イ",
   q:"株式会社が株式移転をした場合には、当該株式会社の株式を目的とする質権は、当該株式移転によって当該株式の株主が受けることのできる金銭その他の財産について存在する。",ans:"正しい",
   exp:"151条１項13号。物上代位的効力である。質権者は、質権設定者（債務者である株主）が債務を履行しなかった場合は、株式移転によって株主が受ける金銭等の財産について優先的に弁済を受けることができるのである。"},
  {id:"K-03-09-009",subject:"企業法",chapter:"第3章 株式",sub:"9. 株式担保",num:9,rank:"B",src:"令６Ⅱ問題５エ",
   q:"特別支配株主が株式売渡請求により売渡株式の取得をした場合には、当該売渡株式を目的とする質権は、当該取得によって当該売渡株式の株主が受けることのできる金銭について存在する。",ans:"正しい",
   exp:"151条２項。"},
  {id:"K-03-10-001",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (1) 総論",num:1,rank:"B",src:"",
   q:"特別支配株主とは、株式会社の総株主の議決権の３分の２（定款で加重可）以上を当該株式会社以外の者および当該者が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人が有している場合における当該者をいう。",ans:"誤り",
   exp:"179条１項本文かっこ書。特別支配株主とは、株式会社の総株主の議決権の10 分の９（定款で加重可）以上を当該株式会社以外の者および当該者が発行済株式の全部を有する株式会社その他これに準ずるものとして法務省令で定める法人（特別支配株主完全子法人）が有している場合における当該者をいう。すなわち、特別支配株主とは、対象会社の総株主の議決権の10 分の９（定款で加重可）以上を直接的または間接的に保有する者をいう。この10 分の９という議決権保有割合の要件は、略式組織再編行為等により株主総会決議を省略するための要件（468条１項、784条１項等）にならったものである。なぜなら、特別支配株主の株式等売渡請求は、対象会社の株主総会の決議を要することなくキャッシュ・アウトを行うことができるという点で、略式組織再編行為等の制度を利用する場合と共通するためである。"},
  {id:"K-03-10-002",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (1) 総論",num:2,rank:"C",src:"",
   q:"特別支配株主は、会社でなければならない。",ans:"誤り",
   exp:"株式等売渡請求による売渡株式等の取得は、特別支配株主と売渡株主との間の売買取引であるため、合併等の組織再編行為等とは異なり、その主体を会社に限る必要はない。そこで、権利主体として株式等の売買取引を行う者であれば、会社以外の者（会社以外の法人や自然人）も特別支配株主となり得る。"},
  {id:"K-03-10-003",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (2) 株式売渡請求・新株予約権売渡請求",num:1,rank:"B",src:"",
   q:"株式会社の特別支配株主は、特別支配株主完全子法人に対しても株式売渡請求をしなければならない。",ans:"誤り",
   exp:"179条１項。株式売渡請求は、対象会社の株主（当該株式会社および特別支配株主を除く）の全員を相手方として、その有する対象会社の株式の全部を請求の対象としなければならない。ただし、特別支配株主完全子法人に対しては、その請求をしないことができる。特別支配株主完全子会社の有する株式は、すでに特別支配株主の完全な支配下にあるといえるため、これを常に株式売渡請求の対象とすることを強制する必要はない。そこで、特別支配株主は、株式売渡請求をしないことを選択することができる。"},
  {id:"K-03-10-004",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (2) 株式売渡請求・新株予約権売渡請求",num:2,rank:"B",src:"",
   q:"特別支配株主は、株式売渡請求をするときは、併せて、対象会社の新株予約権の新株予約権者（対象会社および当該特別支配株主を除く）の全員に対し、その有する対象会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求しなければならない。",ans:"誤り",
   exp:"179条２項。特別支配株主は、株式売渡請求をするときは、併せて、対象会社の新株予約権の新株予約権者（対象会社および当該特別支配株主を除く）の全員に対し、その有する対象会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求することができる。対象会社が新株予約権を発行している場合には、株式売渡請求によって特別支配株主が発行済株式の全部を有することとなっても、その後に新株予約権が行使されると、当該新株予約権者が株主となり、株式売渡請求の意義が損なわれるおそれがあるためである。"},
  {id:"K-03-10-005",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (2) 株式売渡請求・新株予約権売渡請求",num:3,rank:"B",src:"令６Ⅱ問題５イ",
   q:"特別支配株主は、株式の売渡請求に併せて新株予約権の売渡請求を行う場合には、新株予約権者（対象会社および当該特別支配株主を除き、特別支配株主完全子法人は存在しないものとする。）の全員に対して、その有する当該対象会社の新株予約権の全部を自己に売り渡すことを請求することを要しない。",ans:"誤り",
   exp:"179条２項。新株予約権売渡請求は、新株予約権者（対象会社および特別支配株主を除く）の全員を相手方として、その有する対象会社の新株予約権の全部を請求の対象としなければならない。ただし、特別支配株主完全子法人に対しては、その請求をしないことができる（179条２項ただし書）。"},
  {id:"K-03-10-006",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (2) 株式売渡請求・新株予約権売渡請求",num:4,rank:"B",src:"",
   q:"株式会社の特別支配株主は、株式売渡請求をしない場合であっても、当該株式会社の新株予約権の新株予約権者（当該株式会社および特別支配株主を除く）の全員に対し、その有する当該株式会社の新株予約権の全部を当該特別支配株主に売り渡すことを請求することができる。",ans:"誤り",
   exp:"179条２項。新株予約権売渡請求は、株式売渡請求と併せてする場合に限って認められる。"},
  {id:"K-03-10-007",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (2) 株式売渡請求・新株予約権売渡請求",num:5,rank:"B",src:"令２Ⅰ問題５ア",
   q:"特別支配株主が売渡株式を取得するときに、売渡株主に対して交付する当該売渡株式の対価は、金銭に限られない。",ans:"誤り",
   exp:"179条の２第１項２号。特別支配株主の株式等売渡請求における売渡株式の対価は、金銭に限られる。"},
  {id:"K-03-10-008",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:1,rank:"C",src:"",
   q:"特別支配株主は、株式等売渡請求をしようとするときは、対象会社に対し、一定の事項を通知し、その承認を受けなければならない。",ans:"正しい",
   exp:"179条の３第１項。株式等売渡請求については、対象会社の承認を受けなければならない。株式等売渡請求では、キャッシュ・アウトの対価その他の条件は、対象会社ではなく、特別支配株主が定めることになるが、特別支配株主が不当な条件を定めるおそれがあるため、売渡株主等の利益への配慮という観点からは、特別支配株主による一方的な条件提示のみによってキャッシュ・アウトを認めるのは適切ではない。そこで、対象会社の承認を株式等売渡請求の要件とすることによって手続的な制約を課し、対象会社に特別支配株主の提示した株式等売渡請求の条件が適切であるかを検討させることとしたのである。対象会社は、株式等売渡請求についての承認をするか否かの決定をしたときは、特別支配株主に対し、当該決定の内容を通知しなければならない（179条の３第４項）。"},
  {id:"K-03-10-009",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:2,rank:"C",src:"",
   q:"対象会社は、特別支配株主が株式売渡請求に併せて新株予約権売渡請求をしようとするときは、新株予約権売渡請求のみを承認することができる。",ans:"誤り",
   exp:"179条の３第２項。対象会社は、特別支配株主が株式売渡請求に併せて新株予約権売渡請求をしようとするときは、新株予約権売渡請求のみを承認することはできない。"},
  {id:"K-03-10-010",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:3,rank:"A",src:"令２Ⅰ問題５イ・平30Ⅰ問題６ウ",
   q:"取締役会設置会社の特別支配株主が株式売渡請求をしようとするときは、当該取締役会設置会社の株主総会の特別決議による承認を受けなければならない。",ans:"誤り",
   exp:"179条の３第３項。取締役会設置会社が株式等売渡請求についての承認をするか否かの決定をするには、取締役会の決議によらなければならない。特別支配株主の株式等売渡請求は、キャッシュ・アウトを行おうとする株主が大多数の議決権を保有している場合に、対象会社の株主総会の決議を経ることなく、機動的にキャッシュ・アウトを行うことができるようにするための制度である。"},
  {id:"K-03-10-011",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:4,rank:"C",src:"",
   q:"売渡新株予約権者は、対象会社に対して、特別支配株主の氏名または名称および住所等を記載した書面の閲覧を請求することができない。",ans:"誤り",
   exp:"179条の５第２項本文。売渡株主等（売渡株主および売渡新株予約権者）は、対象会社に対して、その営業時間内は、いつでも、事前開示事項の内容を記載または記録した書面または電磁的記録の閲覧もしくは謄本または抄本の交付を請求することができる。事前開示手続を設けた趣旨は、売渡株主等の救済措置（株式等売渡請求の差止請求（179条の７）、裁判所に対する売買価格決定の申立て（179条の８）、売渡株式等の取得の無効の訴え（846条の２））を前提として、当該売渡株主等に対して、株式等売渡請求に関する情報を提供することにある。"},
  {id:"K-03-10-012",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:5,rank:"B",src:"",
   q:"特別支配株主は、取得日の前日までの間は、いつでも、売渡株式等の全部について、株式等売渡請求を撤回することができる。",ans:"誤り",
   exp:"179条の６第１項。特別支配株主は、株式等売渡請求についての承認を受けた後は、取得日の前日までに対象会社の承諾を得た場合に限り、売渡株式等の全部について株式等売渡請求を撤回することができる。取締役会設置会社が当該承諾をするか否かの決定をするには、取締役会の決議によらなければならない（179条の６第２項）。"},
  {id:"K-03-10-013",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (3) 特別支配株主の株式等売渡請求の手続",num:6,rank:"C",src:"令６Ⅱ問題５ア",
   q:"特別支配株主が取得日において取得した売渡株式が譲渡制限株式である場合には、対象会社は、当該特別支配株主が当該売渡株式を取得したことについて、当該譲渡制限株式の取得に係る承認をしたものとみなされる。",ans:"正しい",
   exp:"179条の９第２項。特別支配株主が取得した売渡株式等が譲渡制限株式または譲渡制限新株予約権であるときは、対象会社は、当該特別支配株主が当該売渡株式等を取得したことについて、譲渡承認（137条１項、263条１項）をする旨の決定をしたものとみなす。"},
  {id:"K-03-10-014",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:1,rank:"B",src:"令２Ⅰ問題５ウ類",
   q:"売渡株式の対価として交付される金銭の額またはその算定方法、もしくは、売渡株主に対するその金銭の割当てに関する事項が対象会社の財産の状況その他の事情に照らして著しく不当である場合において、売渡株主が不利益を受けるおそれがあるときは、売渡株主は、特別支配株主に対し、株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。",ans:"正しい",
   exp:"179条の７第１項３号。① 株式売渡請求が法令に違反する場合、② 対象会社が売渡株主に対する通知（179条の４第１項１号）、または、事前開示手続（179条の５）の規定に違反した場合、③ 売渡株式の対価として交付される金銭の額またはその算定方法（179条の２第１項２号）、もしくは、売渡株主に対するその金銭の割当てに関する事項（同条項３号）が対象会社の財産の状況その他の事情に照らして著しく不当である場合のいずれかに該当する場合において、売渡株主が不利益を受けるおそれがあるときは、売渡株主は、特別支配株主に対し、株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。"},
  {id:"K-03-10-015",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:2,rank:"B",src:"令３問題17 イ類",
   q:"株式売渡請求が対象会社の定款に違反する場合において、売渡株主が不利益を受けるおそれがあるときは、売渡株主は、特別支配株主に対し、株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。",ans:"誤り",
   exp:"179条の７第１項各号参照。差止事由を規定している179条の７第１項１号の「株式等売渡請求が法令に違反する場合」は、定款違反を差止事由とせず、法令違反のみを差止事由としている。これは、株式等売渡請求は対象会社が取引当事者とならないことから、当該請求が対象会社の定款に違反するということは考えられないためである。"},
  {id:"K-03-10-016",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:3,rank:"B",src:"令６Ⅱ問題５ウ",
   q:"特別支配株主は、株式の売渡請求に併せて新株予約権の売渡請求を行う場合には、新株予約権売渡請求における新株予約権の取得対価として交付する金銭の額が著しく不当であり、売渡新株予約権者（対象会社および当該特別支配株主を除く。）が不利益を受けるおそれのあるときであっても、当該売渡新株予約権者は、当該特別支配株主に対し、売渡新株予約権の取得をやめることを請求することができない。",ans:"誤り",
   exp:"179条の７第２項３号。次に掲げる場合において、売渡新株予約権者が不利益を受けるおそれがあるときは、売渡新株予約権者は、特別支配株主に対し、株式等売渡請求に係る売渡株式等の全部の取得をやめることを請求することができる。(ⅰ) 新株予約権売渡請求が法令に違反する場合 (ⅱ) 対象会社が売渡新株予約権者に対する通知（179条の４第１項１号）、または、事前開示手続（179条の５）の規定に違反した場合 (ⅲ) 売渡新株予約権の対価として交付される金銭の額またはその算定方法（179条の２第１項４号ロ）、もしくは、売渡新株予約権者に対するその金銭の割当てに関する事項（同条項号ハ）が対象会社の財産の状況その他の事情に照らして著しく不当である場合"},
  {id:"K-03-10-017",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:4,rank:"B",src:"",
   q:"新株予約権売渡請求が法令に違反する場合において、売渡新株予約権者が不利益を受けるおそれがあるときは、売渡新株予約権者は、特別支配株主に対し、新株予約権売渡請求に係る売渡新株予約権のみについてその全部の取得をやめることを請求することができる。",ans:"誤り",
   exp:"179条の７第２項。売渡株主による差止請求および売渡新株予約権者による差止請求に共通して、差止請求の対象は、「売渡株式等の全部」とされている（179条の７第１項２項）。したがって、売渡株主による差止請求の効果は、差止請求を行う売渡株主の有する売渡株式のみならず、他の売渡株主の有する売渡株式も含めた売渡株式の取得の全体におよび、また、株式売渡請求と併せて新株予約権売渡請求がされている場合は、新株予約権売渡請求による売渡新株予約権の取得にも及ぶこととしている。また、同様に売渡新株予約権者による差止請求の効果も、株式等売渡請求による売渡株式等の取得の全体に及ぶこととされているため、特別支配株主がその意図に反して株式売渡請求による売渡株式の取得のみを行うことを強いられることがないよう配慮されている。"},
  {id:"K-03-10-018",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:5,rank:"B",src:"",
   q:"株式等売渡請求があった場合には、売渡株主等は、取得日の20日前の日から取得日の前日までの間に、裁判所に対し、その有する売渡株式等の売買価格の決定の申立てをすることができる。",ans:"正しい",
   exp:"179条の８第１項。裁判所に対する売買価格の決定の申立ての規定の趣旨は、売渡株主等に売渡株式等の対価の金額を争う機会を認めることにある。"},
  {id:"K-03-10-019",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:6,rank:"B",src:"令２Ⅰ問題５エ類",
   q:"公開会社でない株式会社において、株式等売渡請求に係る売渡株式等の全部の取得の無効は、取得日から６か月以内に限り、訴えを持ってのみ主張することができる。",ans:"誤り",
   exp:"846条の２第１項。株式等売渡請求に係る売渡株式等の全部の取得の無効は、取得日から６か月以内（非公開会社では１年以内）に限り、主張することができる。"},
  {id:"K-03-10-020",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:7,rank:"B",src:"",
   q:"売渡株式等の取得の無効の訴えの被告は、対象会社である。",ans:"誤り",
   exp:"846条の３。売渡株式等の取得の無効の訴えについては、特別支配株主を被告とする。対象会社は、売渡株式等の取得に係る取引の当事者ではないため、被告にはならない。"},
  {id:"K-03-10-021",subject:"企業法",chapter:"第3章 株式",sub:"10. 特別支配株主による株式等売渡請求 (4) 売渡株主等の救済措置",num:8,rank:"A",src:"",
   q:"売渡株式等の取得の無効の訴えに係る請求を認容する判決が確定したときは、当該判決において無効とされた売渡株式等の全部の取得は、将来に向かってその効力を失う。",ans:"正しい",
   exp:"846条の８。法的安定性を確保するために無効判決の遡及効は阻止され、売渡株式等の取得の無効は将来に向かってその効力を失う（将来効）。また、法律関係の画一的確定の観点から、売渡株式の取得の無効判決には対世的効力が認められている（846条の７）。"},
  {id:"K-03-11-001",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (1) 株式の消却",num:1,rank:"A",src:"",
   q:"取締役会設置会社でない株式会社において、自己株式の消却の決定は、株主総会の普通決議によらなければならない。",ans:"誤り",
   exp:"178条１項２項。取締役会設置会社でない株式会社における自己株式の消却の決定については、株主総会の決議は求められていない。"},
  {id:"K-03-11-002",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (1) 株式の消却",num:2,rank:"A",src:"",
   q:"（令７Ⅱ問題５ア・平30Ⅰ問題６イ類・平28Ⅱ問題７エ・平25Ⅱ問題６エ類・平25Ⅰ問題５ア類）取締役会設置会社が自己株式を消却する場合、消却する自己株式の数の決定は、取締役会の決議によらなければならない。",ans:"正しい",
   exp:"178条１項２項。取締役会設置会社においては、自己株式の消却に関する事項の決定は、取締役会の決議によらなければならない。"},
  {id:"K-03-11-003",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (1) 株式の消却",num:3,rank:"C",src:"令５Ⅰ問題５ウ",
   q:"株式会社が自己株式を消却した場合には、資本金の額は当該自己株式の帳簿価額に相当する額だけ減少する。",ans:"誤り",
   exp:"株式会社が自己株式を消却した場合には、当該自己株式の帳簿価額をその他資本剰余金から減額することになるため（会社計算規則24条２項３項）、資本金の額は減少しない。"},
  {id:"K-03-11-004",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (1) 株式の消却",num:4,rank:"B",src:"令３問題４イ類・平25Ⅰ問題４エ",
   q:"公開会社において、株式の消却によって発行済株式総数が発行可能株式総数の４分の１を下ることとなる場合には、定款を変更して発行可能株式総数の定めを発行済株式総数の４倍以下の数にする必要はない。",ans:"正しい",
   exp:"178条１項２項。株式の消却がなされた場合、発行済株式総数は減少するが、発行可能株式総数は当然には変動しない。ここで、株式の併合の場合と異なり、株式の消却の場面では、公開会社における発行可能株式総数に係る規律は維持されていないため、公開会社であっても、株式の消却の結果、発行可能株式総数が発行済株式総数の４倍を超えても構わない。"},
  {id:"K-03-11-005",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (1) 株式の消却",num:5,rank:"B",src:"令５Ⅱ問題６エ",
   q:"株式会社が自己株式を消却した場合には、発行可能株式総数は減少する。",ans:"誤り",
   exp:"株式の消却がなされた場合、発行済株式総数は減少するが、発行可能株式総数は当然には変動しない。"},
  {id:"K-03-11-006",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:1,rank:"A",src:"平29Ⅰ問題５ア類・平21 問題６エ類",
   q:"株式会社は、株式の併合をしようとするときは、その都度、株主総会の普通決議によって、併合の割合等を決定しなければならない。",ans:"誤り",
   exp:"180条２項、309条２項４号。株式会社は、株式の併合をしようとするときは、その都度、株主総会の特別決議によって、併合の割合等を決定しなければならない。株式の併合を決定する決議において株主総会の特別決議が要求されているのは、株式の併合は、併合前に比べて株式の単位が大きくなるため、株主は従前の株式単位で株式を処分することができないという不利益を被ることになるからである。また、併合の割合によっては、１株に満たない端数が生じ、その結果として株主の地位が失われるということも考えられ、株主に重大な影響を及ぼすため、厳格な手続が要求されている。"},
  {id:"K-03-11-007",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:2,rank:"A",src:"",
   q:"種類株式発行会社において、ある種類株式についてのみ株式の併合をすることは認められない。",ans:"誤り",
   exp:"180条２項３号。種類株式発行会社において、ある種類株式についてのみ株式の併合をすることは認められる。"},
  {id:"K-03-11-008",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:3,rank:"A",src:"平22Ⅰ問題５ウ",
   q:"取締役は、株式の併合を決定する株主総会において、株式の併合をすることを必要とする理由を説明しなければならない。",ans:"正しい",
   exp:"180条４項。当該説明は、株主の判断に有用な情報を与えることを目的とする。"},
  {id:"K-03-11-009",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:4,rank:"B",src:"平30Ⅱ問題７エ",
   q:"株式会社が株式の併合を行う場合、当該株式会社の資本金の額は当該併合の比率に応じて減少する。",ans:"誤り",
   exp:"株式の併合がなされても資本金の額に変動はない。"},
  {id:"K-03-11-010",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:5,rank:"B",src:"平30Ⅰ問題６エ類",
   q:"公開会社であっても、株式の併合の効力発生日における発行可能株式総数は、効力発生日における発行済株式総数の４倍を超えることができる。",ans:"誤り",
   exp:"180条３項。公開会社において、株式の併合の効力発生日における発行可能株式総数は、効力発生日における発行済株式総数の４倍を超えることができない。これを許容してしまうと、発行可能株式総数に係る規律（37条３項本文、113条３項１号）を設けた趣旨が達せられなくなるためである。なお、株式の併合をした株式会社は、効力発生日に、株主総会の決議で定められた発行可能株式総数（180条２項４号）に係る定款の変更をしたものとみなす（182条２項）。"},
  {id:"K-03-11-011",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:6,rank:"A",src:"令３問題４ウ類・平30Ⅱ問題７ア・平23Ⅱ問題７ア",
   q:"種類株式発行会社でない株式会社が２株を１株に併合する株式の併合を行った場合、当該株式会社は、発行可能株式総数を２分の１に減少する旨の定款変更をしたものとみなされる。",ans:"誤り",
   exp:"このような規定はない。株式の併合がなされた場合、発行済株式総数は減少するが、発行可能株式総数は当然には変動しない。公開会社において、株式の併合の効力発生日における発行可能株式総数は、効力発生日における発行済株式総数の４倍を超えることができないこととされている（180条３項）。これを許容してしまうと、発行可能株式総数に係る規律（37条３項本文、113条３項１号）を設けた趣旨が達せられなくなるためである。そこで、株式会社は、株式の併合をしようとするときは、その都度、株主総会の特別決議によって、効力発生日における発行可能株式総数を定めなければならない（180条２項４号、309条２項４号）。そして、株式の併合をした株式会社は、効力発生日に、株主総会において決議された定めに従い、発行可能株式総数にかかる定款変更をしたものとみなされる（182条２項）。"},
  {id:"K-03-11-012",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:7,rank:"B",src:"",
   q:"株式会社は、株主総会の決議において、株式の併合に係る基準日を決定しなければならない。",ans:"誤り",
   exp:"株式の併合に係る基準日の設定は義務づけられていない。"},
  {id:"K-03-11-013",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:8,rank:"A",src:"平22Ⅰ問題５エ",
   q:"親子会社関係がある場合、子会社が株式の併合をするには、当該子会社において、株主総会の特別決議のほか、親会社以外の株主が有する議決権の過半数の賛成が必要である。",ans:"誤り",
   exp:"180条２項、309条２項４号。このような規定はない。子会社が株式の併合をするには、当該子会社において、株主総会の特別決議をすれば足りる。"},
  {id:"K-03-11-014",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:9,rank:"C",src:"平26Ⅱ問題４イ",
   q:"振替機関は、株式の併合がその効力を生ずる日が到来したときは、発行者に対し、当該株式の併合が効力を生ずる日の株主に関する法定の事項を通知しなければならない。",ans:"正しい",
   exp:"振替法151条１項２号。振替機関は、株式の併合がその効力を生ずる日が到来したときは、発行者に対し、総株主通知をしなければならない。これに基づいて、振替株式発行会社において株主名簿の名義書換が行われることになる。"},
  {id:"K-03-11-015",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:10,rank:"B",src:"令３問題17 ウ類・平30Ⅱ問題７イ類",
   q:"単元株式数を定めていない株式会社において、株式の併合が法令または定款に違反する場合、株主が不利益を受けるおそれがあるときであっても、株主は株式会社に対し、当該株式の併合をやめることを請求することができない。",ans:"誤り",
   exp:"182条の３。株式の併合により端数となる株式の株主を保護する規制（182条の２～182条の６）は、その趣旨に鑑み、端数が生じることによる株主への影響が大きいと考えられる、①単元株式数を定めていない株式会社による株式の併合、および、② 単元株式数を定めている株式会社による株式の併合であって、当該単元株式数（種類株式発行会社では、併合する種類株式の単元株式数）に併合の割合を乗じて得た数に１に満たない端数が生じるものに限って適用することとされている（182条の２第１項柱書かっこ書）。したがって、単元株式数を定めていない株式会社において、株式の併合が法令または定款に違反する場合、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該株式の併合をやめることを請求することができる。"},
  {id:"K-03-11-016",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (2) 株式の併合",num:11,rank:"B",src:"平30Ⅱ問題７ウ類・平22Ⅰ問題５ア類",
   q:"単元株式数を定めていない株式会社が株式の併合をする場合には、反対株主は、当該株式会社に対し、自己の有する株式の全部を公正な価格で買い取ることを請求することができる。",ans:"誤り",
   exp:"182条の４第１項。株式会社が株式の併合をすることにより株式の数に１株に満たない端数が生ずる場合には、反対株主は、当該株式会社に対し、自己の有する株式のうち１株に満たない端数となるものの全部を公正な価格で買い取ることを請求することができる。株式の併合によって生じる１株に満たない端数については、その端数の合計数に相当する株式の売却等で得られた代金を端数に応じて株主に交付することとされているが（235条１項）、多くの端数を売却する場合、端数の対価として適切な代金が交付されないおそれがある。そこで、会社法は、株式の併合によって生じる端数について、株主に対して適正な対価が交付されることを確保するため、反対株主に株式買取請求権を与えたのである。"},
  {id:"K-03-11-017",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:1,rank:"A",src:"平29Ⅰ問題５イ類・平22Ⅰ問題４ウ類",
   q:"取締役会設置会社において、株式の分割をしようとするときは、その都度、取締役会の決議によって、分割の割合等を決定しなければならない。",ans:"正しい",
   exp:"183条２項。株式の分割は株式の併合と異なり、株式の単位が小さくなるため株式の処分がしやすくなる。また、株式の分割によって端数が生じても、株式の併合のように従来株主であった者の株主の地位が失われるということはない。したがって、基本的には株主に不利益はないため、株主総会の特別決議は要求されていないのである。"},
  {id:"K-03-11-018",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:2,rank:"A",src:"平25Ⅰ問題５イ類",
   q:"取締役会設置会社でない株式会社において、株式の分割をしようとするときは、株主総会の特別決議によって、分割の割合等を決定しなければならない。",ans:"誤り",
   exp:"183条２項。取締役会設置会社でない株式会社において、株式の分割をしようとするときは、株主総会の普通決議によって、分割の割合等を決定しなければならない。株式の併合と異なり株主総会の特別決議が要求されない理由については、問題１の解説を参照すること。"},
  {id:"K-03-11-019",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:3,rank:"A",src:"令５Ⅱ問題５イ類・平22Ⅰ問題４ア",
   q:"株主は、株式の分割により、分割する株式と異なる種類の株式を取得することはできない。",ans:"正しい",
   exp:"株式分割は株式の細分化であるので、株主が、株式分割によって分割する株式と異なる種類の株式を取得することはない。"},
  {id:"K-03-11-020",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:4,rank:"A",src:"平31Ⅰ問題６イ",
   q:"自己株式は、株式の分割の対象となる。",ans:"正しい",
   exp:"自己株式の価値を維持することができなくなってしまうため、株式の分割の効果は自己株式にまで及ぶ。"},
  {id:"K-03-11-021",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:5,rank:"B",src:"",
   q:"株式の分割によって発行済株式の数が増加しても、資本金の額は増加しない。",ans:"正しい",
   exp:"株式の分割によって、発行済株式総数は増加するが、会社財産に変動がないため、１株あたりの純資産額は減少するが、資本金の額に変動はない。"},
  {id:"K-03-11-022",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:6,rank:"B",src:"",
   q:"株式会社は、株式の分割に係る基準日を決定し、当該基準日の２週間前までに当該基準日および株式の分割に係る事項を公告しなければならない。",ans:"正しい",
   exp:"183条２項１号、124条３項。株式の分割においては、基準日の設定が義務づけられている。基準日において株主名簿に記載・記録されている株主は、効力発生日に基準日に有する株式の数に株式分割割合を乗じて得た数の株式を取得する（184条１項）。"},
  {id:"K-03-11-023",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:7,rank:"A",src:"平22Ⅰ問題４イ・平21 問題６ア類",
   q:"種類株式発行会社が株式の分割をする場合、分割する株式の種類ごとに分割の割合を定めなければならない。",ans:"正しい",
   exp:"183条２項３号。なお、現に複数の種類の株式を発行している種類株式発行会社であっても、その一部の種類の株式のみ分割することができる。"},
  {id:"K-03-11-024",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:8,rank:"B",src:"",
   q:"株券発行会社が株式の分割をする場合、株式の分割に係る株券を効力発生日までに提出しなければならない旨を効力発生日の１か月前までに公告し、かつ、当該株式の株主およびその登録株式質権者に対し通知しなければならない。",ans:"誤り",
   exp:"株式の分割の場合には、株券を追加的に発行するだけでよいため、株式の併合の場合（219条１項本文２号）のような株券提出手続は設けられていない。なお、株券発行会社は、株式分割の効力発生後遅滞なく、株券を発行しなければならないとされている（215条３項）。"},
  {id:"K-03-11-025",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:9,rank:"B",src:"平23Ⅱ問題７ウ",
   q:"種類株式発行会社でない株式会社が株式の分割をする場合、当該株式の分割に係る基準日において株主名簿に記載され、または記録されている株主は、当該株式の分割がその効力を生ずる日に、基準日に有する株式の数に分割の割合を乗じて得た数の株式を取得する。",ans:"正しい",
   exp:"184条１項。"},
  {id:"K-03-11-026",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:10,rank:"A",src:"令３問題４エ類・平22Ⅰ問題４エ類",
   q:"株式の分割によって発行済株式総数が発行可能株式総数を超えることになる場合には、発行可能株式総数を増加させる定款の変更があったものとみなされる。",ans:"誤り",
   exp:"184条２項。株式会社（現に２以上の種類株式を発行している株式会社を除く）は、株主総会の特別決議によることなく、株式の分割の効力発生日における発行可能株式総数を、その日の前日の発行可能株式総数に株式の分割割合を乗じて得た数の範囲内で増加する定款の変更をすることができる。株主総会の決議によらない発行可能株式総数に関する定款の変更が認められているのは、発行可能株式総数の変更について株主総会の決議が必要であるとすると、取締役会設置会社において株式の分割自体を取締役会の決議で行うことができることとした趣旨が活かされないためである。ただし、現に２以上の種類株式を発行している会社については、発行可能株式総数の変更は既存株主に損害を及ぼす可能性があるため（322条１項１号ハ参照）、株主総会で株主の意思を確認する必要があると考えられることから、当該手続による定款変更は認められない。"},
  {id:"K-03-11-027",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (3) 株式の分割",num:11,rank:"C",src:"平26Ⅱ問題４ウ",
   q:"振替株式の発行者は、その振替株式について株式の分割をしようとする場合には、当該分割がその効力を生ずる日の２週間前までに、当該分割に係る振替株式の株主または登録株式質権者に対し、当該分割に関する法定の事項を通知しなければならない。",ans:"誤り",
   exp:"振替法137条１項。特定の銘柄の振替株式について、株式の分割をしようとする場合には、当該振替株式の発行者は、株式の分割がその効力を生ずる日の２週間前までに、振替機関に対し、当該分割に関する法定の事項を通知しなければならない。"},
  {id:"K-03-11-028",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:1,rank:"A",src:"令５Ⅱ問題５イ類・平28Ⅰ問題５イ・平21 問題６ウ類",
   q:"種類株式発行会社である株式会社が行う株式無償割当てにおいて、ある種類の株式を有する株主に割り当てることができるのは、当該種類の株式に限られる。",ans:"誤り",
   exp:"186条１項１号３号。種類株式発行会社が株式無償割当てをする場合、ある種類の種類株主に対して、他の種類株式を割り当てることが認められる。これに対して、株式の分割の場合は、同一種類の株式が増加するのみである。また、株主割当ての方法による募集株式の発行等の場合は、種類株主の有する種類の株式と同一のものしか割り当てることができない（202条１項１号かっこ書）。"},
  {id:"K-03-11-029",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:2,rank:"A",src:"令７Ⅱ問題５イ・令５Ⅱ問題５ウ類・平31Ⅰ問題６ウ類・平21 問題６イ",
   q:"株式会社が株式無償割当てをしようとするときは、当該株式会社が有する自己株式についても株式を割り当てなければならない。",ans:"誤り",
   exp:"186条２項。株式無償割当ての場合、自己株式に株式が割り当てられることはない。これに対して、株式の分割の場合は、自己株式の数も増加する。"},
  {id:"K-03-11-030",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:3,rank:"A",src:"",
   q:"株式会社が株式無償割当てをする場合、自己株式を交付することができる。",ans:"正しい",
   exp:"これに対して、株式の分割の場合は、自己株式の交付は認められない。"},
  {id:"K-03-11-031",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:4,rank:"B",src:"平31Ⅰ問題６エ",
   q:"株式の分割または株式無償割当てによって発行済株式の数が増加しても、資本金の額は増加しない。",ans:"正しい",
   exp:"株式の分割または株式無償割当てによって、発行済株式総数は増加するが、会社財産に変動がないため、資本金の額に変動はない。"},
  {id:"K-03-11-032",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:5,rank:"A",src:"平29Ⅰ問題５ウ類・平25Ⅰ問題５ウ",
   q:"取締役会設置会社において、株式無償割当てをしようとするときは、定款に別段の定めがある場合を除き、その都度、取締役会の決議によって、株主に割り当てる株式の数等を決定しなければならない。",ans:"正しい",
   exp:"186条３項かっこ書。株式会社は、株式無償割当てをしようとするときは、その都度、株主に割り当てる株式の数などの法定の事項を株主総会の普通決議（取締役会設置会社では取締役会の決議）によって定めなければならない。なお、株式無償割当ての決定機関については、定款で別段の定めを置くことが認められているが（186条３項ただし書）、株式の分割の場合にはこれが認められないため、対比しておさえるようにしてほしい。"},
  {id:"K-03-11-033",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:6,rank:"B",src:"令５Ⅱ問題５エ類",
   q:"株式会社が株式無償割当てをする場合、株式無償割当てに係る基準日を決定しなければならない。",ans:"誤り",
   exp:"株式無償割当てについては、株式の分割の場合（183条２項１号）と異なり、基準日の設定が義務づけられていない。"},
  {id:"K-03-11-034",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:7,rank:"B",src:"",
   q:"株式会社は株式無償割当ての効力発生日後遅滞なく、株主（種類株式発行会社では割当てを受ける種類の種類株主）およびその登録株式質権者に対し、当該株主が割当てを受けた株式の数（種類株式発行会社では株式の種類および種類ごとの数）を通知しなければならない。",ans:"正しい",
   exp:"187条２項。株式無償割当てについては、株式の分割の場合と異なり、効力発生日後の通知義務が課されている。"},
  {id:"K-03-11-035",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (4) 株式無償割当て",num:8,rank:"A",src:"平23Ⅱ問題７エ",
   q:"種類株式発行会社でない株式会社が１株に対して２株を割り当てる旨の株式無償割当てをする場合、当該株式会社は、株主総会の決議によらないで、株式無償割当てがその効力を生ずる日における発行可能株式総数を、その日の前日の発行可能株式総数に３を乗じて得た数の範囲内で増加する定款の変更をすることができる。",ans:"誤り",
   exp:"184条２項。株式会社（現に２以上の種類株式を発行しているものを除く）は、通常の定款変更の方法である株主総会の特別決議（466条、309条２項11号）によることなく、効力発生日の発行可能株式総数を、その日の前日の発行可能株式総数に株式分割の割合を乗じて得た数の範囲内で増加する定款の変更をすることができる（184条２項）。しかし、株式無償割当てに関しては同様の規定は設けられていない。"},
  {id:"K-03-11-036",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (5) １株に満たない端数の処理",num:1,rank:"B",src:"令５Ⅱ問題５ア・平31Ⅰ問題６ア",
   q:"株式の分割によって１株に満たない端数が生じることはあるが、株式無償割当てによって１株に満たない端数が生じることはない。",ans:"誤り",
   exp:"235条１項、234条１項３号。たとえば、２株を３株にする割合での株式の分割をする場合、１株のみ保有している株主は1.5 株となり、端数が生じることとなる。同様に、２株につき１株追加で無償割当てをする場合、１株のみ保有している株主に対しては0.5 株割り当てられることとなり、端数が生じることとなる。"},
  {id:"K-03-11-037",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (5) １株に満たない端数の処理",num:2,rank:"C",src:"",
   q:"株式会社が株式無償割当てをするに際して、株主に交付しなければならない当該株式会社の株式の数に１株に満たない端数がある場合は、当該株式会社は、その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式を買い取らなければならない。",ans:"誤り",
   exp:"234条１項柱書、235条１項。株式会社が株式無償割当て等（234条１項各号、株式の分割、株式の併合）をするに際して、株主に交付しなければならない当該株式会社の株式の数に１株に満たない端数がある場合は、その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式を競売し、かつ、その端数に応じてその競売により得られた代金を当該株主に交付しなければならない。しかし、株式会社は、競売に代えて、市場価格のある株式については、市場価格として法務省令で定める方法により算定される額をもって、市場価格のない株式については、裁判所の許可を得て競売以外の方法により株式を売却することができる。この場合による裁判所許可の申立ては、取締役が２人以上あるときは、その全員の同意によってしなければならない（234条２項、235条２項）。さらに、株式会社が、当該端数に相当する株式の全部または一部を買い取ることができる（234条４項、235条２項）。"},
  {id:"K-03-11-038",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (5) １株に満たない端数の処理",num:3,rank:"C",src:"",
   q:"取締役会設置会社が株式の分割をすることにより株式の数に１株に満たない端数が生じる場合において、その端数の合計数（当該合計数に１に満たない端数がある場合はこれを切り捨てるものとする）に相当する数の株式の全部または一部を買い取る決定は、株主総会の決議によらなければならない。",ans:"誤り",
   exp:"234条５項、235条２項。当該決定は、取締役会設置会社では取締役会の決議によらなければならない（234条５項、235条２項）。なお、当該取得には、財源規制がある（461条１条７号）。"},
  {id:"K-03-11-039",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (5) １株に満たない端数の処理",num:4,rank:"A",src:"令６Ⅱ問題14 ウ",
   q:"１株に満たない端数の処理手続における自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"正しい",
   exp:"461条１項７号。"},
  {id:"K-03-11-040",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:1,rank:"A",src:"平29Ⅰ問題５エ",
   q:"株式会社が、単元株制度を採用するには、定款にその旨を定めなければならない。",ans:"正しい",
   exp:"188条１項。単元株制度を採用するためには、定款にその旨を定めなければならない。すなわち、単元株式数の定めは、定款の相対的記載事項である。"},
  {id:"K-03-11-041",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:2,rank:"A",src:"平23Ⅰ問題７エ類",
   q:"種類株式発行会社において、株式の種類ごとに単元株式数を定めることは認められない。",ans:"誤り",
   exp:"188条３項。種類株式発行会社においては、単元株式数は、株式の種類ごとに定めなければならない。"},
  {id:"K-03-11-042",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:3,rank:"A",src:"平23Ⅰ問題７ア類",
   q:"１単元の株式の数は、1,000 以下であれば自由に設定することができる。",ans:"誤り",
   exp:"188条２項、会社法施行規則34条。１単元の株式の数は、1,000 および発行済株式総数の200 分の１に当たる数を超えることができない。したがって、1,000 以下であっても、発行済株式総数の200 分の１に当たる数を超えている場合は、当該数を単元株式数として設定することは認められないため、本肢は誤りである。"},
  {id:"K-03-11-043",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:4,rank:"A",src:"令７Ⅱ問題６ウ・令４Ⅱ問題５イ・平23Ⅰ問題７イ",
   q:"株式会社が単元株式数を定める場合には、取締役は、当該単元株式数を定める定款の変更を目的とする株主総会において、当該単元株式数を定めることを必要とする理由を説明しなければならない。",ans:"正しい",
   exp:"466条、309条２項11号、190条。単元株制度の採用や単元株式数の増加がなされると、議決権を有していた株主が、単元未満株主となることで議決権を失う可能性が生じ、株主に重大な不利益が発生するおそれがある。そのため、定款の相対的記載事項とされており、採用するためには株主総会の特別決議が要求されているのである。また、株主総会における取締役の理由説明義務については、株式の併合の場合（180条４項）と同様の趣旨である。"},
  {id:"K-03-11-044",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:5,rank:"A",src:"平31Ⅱ問題６ア類・平25Ⅰ問題５エ類・平23Ⅰ問題７ウ",
   q:"株式会社が、定款を変更して単元株式数を減少し、または単元株式数についての定款の定めを廃止する場合には、株主総会の特別決議を要する。",ans:"誤り",
   exp:"195条１項。単元株制度を廃止または単元株式数を減少する場合は、取締役の決定（取締役会設置会社では取締役会の決定）により定款を変更することができる。なぜなら、当該定款変更により株主にとって不利益が生じるおそれはないからである。当該定款変更をした場合は、株式会社は、定款の変更の効力が生じた日以後遅滞なく、その株主（種類株式発行会社にあっては、単元株式数を変更した種類の種類株主）に対し、当該定款の変更をした旨を通知または公告しなければならない（195条２項３項）。"},
  {id:"K-03-11-045",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:6,rank:"B",src:"令４Ⅱ問題５ア",
   q:"株式会社は、株式の分割を行うと同時に単元株式数を増加し、または単元株式数についての定款の定めを設ける場合は、株主総会の決議によらないで定款の変更をすることができる。",ans:"誤り",
   exp:"191条。株式会社は、株式の分割を行うと同時に単元株式数を増加し、または単元株式数についての定款の定めを設ける場合であって、その結果として株主の有する議決権の数が定款の変更前において有する議決権の数を下回らない場合は、株主総会の決議によらないで定款の変更をすることができる。この場合は、株主に不利益が生じるおそれがないためである。"},
  {id:"K-03-11-046",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:7,rank:"A",src:"平23Ⅰ問題４イ類",
   q:"単元未満株主は、その有する単元未満株式について、株主総会および種類株主総会において議決権を行使することができない。",ans:"正しい",
   exp:"189条１項。したがって、議決権を基準とした少数株主権や単独株主権も有しないと解される。"},
  {id:"K-03-11-047",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:8,rank:"A",src:"令７Ⅱ問題６エ・平24Ⅱ問題６ウ",
   q:"株式会社は、単元未満株主が株式無償割当てを受ける権利の全部または一部を行使することができない旨を定款で定めることができる。",ans:"誤り",
   exp:"189条２項３号。株式会社は、単元未満株主が株式無償割当てを受ける権利の全部または一部を行使することができない旨を定款で定めることは認められない。"},
  {id:"K-03-11-048",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:9,rank:"A",src:"平24Ⅱ問題６イ",
   q:"株式会社は、単元未満株主が剰余金の配当を受ける権利の全部または一部を行使することができない旨を定款で定めることができる。",ans:"誤り",
   exp:"189条２項６号、会社法施行規則35条１項７号ニ。株式会社は、単元未満株主が剰余金の配当を受ける権利の全部または一部を行使することができない旨を定款で定めることは認められない。"},
  {id:"K-03-11-049",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:10,rank:"B",src:"令７Ⅱ問題ア類・平31Ⅱ問題６イ類",
   q:"株式会社は、単元未満株主が株主代表訴訟を提起することができない旨を定款で定めることができる。",ans:"正しい",
   exp:"189条２項各号、会社法施行規則35条１項各号参照。"},
  {id:"K-03-11-050",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:11,rank:"C",src:"平24Ⅱ問題６ア類",
   q:"株券発行会社でない株式会社は、単元未満株式を譲渡により取得した者が株主名簿の名義書換請求権を行使することができない旨を定款で定めることができる。",ans:"正しい",
   exp:"189条２項各号、会社法施行規則35条１項各号参照。"},
  {id:"K-03-11-051",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:12,rank:"B",src:"令７Ⅱ問題６イ類・平30Ⅱ問題６イ類・平24Ⅱ問題６エ類",
   q:"株券発行会社は、単元未満株式に係る株券を発行してはならない。",ans:"誤り",
   exp:"189条３項。株券発行会社は、単元未満株式に係る株券を発行しないことができる旨を定款で定めることができる。単元未満株式に係る株券を発行しないことにより、株式会社は、わずかの数の株式について株券を発行するコストを節減するとともに、株券発行会社では株券がなければ株式譲渡ができないことになるため（128条１項本文）、単元未満株式の譲渡そのものを阻止し、譲渡に伴う名義書換のコストを節減することができるのである。"},
  {id:"K-03-11-052",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:13,rank:"B",src:"令４Ⅱ問題５ウ類・平31Ⅱ問題６エ",
   q:"単元未満株主が単元未満株式の買取請求をすることができる旨の定款の定めがない限り、単元未満株主は、株式会社に対して、自己の有する単元未満株式を買い取ることを請求することができない。",ans:"誤り",
   exp:"192条１項。単元未満株主の投下資本回収の手段を保障するために、単元未満株主には、単元未満株式の買取請求権が認められている。単元未満株式の買取請求権は、単元未満株主に投下資本の回収手段を確保させるために不可欠の制度であるため、定款に定めることは求められていない。また、定款によっても単元未満株式買取請求権を制限することはできない。"},
  {id:"K-03-11-053",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:14,rank:"B",src:"",
   q:"単元未満株式の売渡請求は、株式会社の定款に当該請求をすることができる旨の定めがある場合に限り、請求することができる。",ans:"正しい",
   exp:"194条１項。単元未満株式の売渡請求権は、単元未満株主の保護に不可欠の制度であるとまでは言えず、また、採用すれば会社は手間などのコストを負担しなければならなくなるため、会社が単元未満株主の保護と当該コストを比べた上で、定款によって採用するかどうかを選択することができるとしたのである。"},
  {id:"K-03-11-054",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:15,rank:"A",src:"令６Ⅱ問題14",
   q:"単元未満株式の株式買取請求権による自己株式の取得により株主に対して交付する金銭等の帳簿価額の総額は、その効力が発生する日における分配可能額を超えてはならない。",ans:"誤り",
   exp:"461条１項参照。単元未満株式の株式買取請求権による取得は、一般的に買取代金がさほど高額にならないし、株主の投下資本回収を保障する必要性が高いので、財源規制は課せられていない。"},
  {id:"K-03-11-055",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:16,rank:"B",src:"平31Ⅱ問題６ウ",
   q:"単元未満株主が単元未満株式売渡請求をすることができる旨の定款の定めがない限り、単元未満株主は、株式会社に対して、自己の有する単元未満株式の数と併せて単元株式数となる数の株式を売り渡すことを請求することができない。",ans:"正しい",
   exp:"194条１項。単元未満株主が単元未満株式売渡請求をすることができる旨の定款の定めがない限り、単元未満株主は、株式会社に対して、自己の有する単元未満株式の数と併せて単元株式数となる数の株式を売り渡すことを請求することができない。"},
  {id:"K-03-11-056",subject:"企業法",chapter:"第3章 株式",sub:"11. 株式の消却・併合・分割・単元株等 (6) 単元株制度",num:17,rank:"C",src:"",
   q:"単元未満株式の売渡請求を受けた株式会社は、当該単元未満株式売渡請求を受けたときに売り渡す単元未満株式の数に相当する数の株式を有しない場合を除いて、自己株式を当該単元未満株主に売り渡さなければならない。",ans:"正しい",
   exp:"194条３項。"},
  {id:"K-04-01-001",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:1,rank:"B",src:"平27Ⅱ問題３ア",
   q:"株式会社を設立するには、発起人が定款を作成し、定款が書面をもって作成されているときは、その全員がこれに署名し、または記名押印をしなければならない。",ans:"正しい",
   exp:"26条１項。設立手続の最初の重要な行為として、発起人は定款を作成しなければならない。"},
  {id:"K-04-01-002",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:2,rank:"B",src:"",
   q:"電磁的記録をもって定款を作成することは認められない。",ans:"誤り",
   exp:"26条２項。定款は、電磁的記録をもって作成することもできる。この場合において、当該電磁的記録に記録された情報については、法務省令で定める署名または記名押印に代わる措置をとらなければならない。"},
  {id:"K-04-01-003",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:3,rank:"A",src:"令２Ⅰ問題３ア類・平29Ⅰ問題４ア・平23Ⅰ問題３ア類",
   q:"株式会社の定款は、書面をもって作成されているときには、発起人の全員が署名し、または記名押印することにより効力を生じる。",ans:"誤り",
   exp:"30条１項。定款は、公証人の認証を受けなければその効力を生じない。公証人の認証は、定款が真正に作成され、かつ内容が適法であることを確保するために行われる。公証人の認証により、定款の内容を明確にして後日の紛争と不正行為を防止することができ、認証を欠く定款は無効となる。"},
  {id:"K-04-01-004",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:4,rank:"A",src:"令２Ⅱ問題４ア・平30Ⅰ問題４ウ・平25Ⅱ問題３ア",
   q:"株式会社の目的および商号は、定款に記載し、または記録しなければならない。",ans:"正しい",
   exp:"27条１号２号株式会社の目的および商号は、絶対的記載事項である。"},
  {id:"K-04-01-005",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:5,rank:"A",src:"令２Ⅱ問題４イ類・平25Ⅱ問題13 ア",
   q:"株式会社の資本金の額は、定款に記載または記録しなければならず、登記もしなければならない。",ans:"誤り",
   exp:"911条３項５号、27条各号参照。資本金の額は登記事項であるが、定款の絶対的記載事項ではない。なお、設立に際して出資される財産の価額またはその最低額が、絶対的記載事項とされている（27条４号）。"},
  {id:"K-04-01-006",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:6,rank:"A",src:"平30Ⅰ問題４ア・平24Ⅱ問題３ア・平24Ⅰ問題３ア",
   q:"設立に際して出資される財産の価額またはその最低額は、定款に記載または記録しなければならない。",ans:"正しい",
   exp:"27条４号設立時における会社の資産規模を明示させるために、設立に際して出資される財産の価額またはその最低額は定款の絶対的記載事項とされている。"},
  {id:"K-04-01-007",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:7,rank:"A",src:"平24Ⅱ問題３イ",
   q:"設立に際して発行する株式の数は、定款に記載または記録しなければならない。",ans:"誤り",
   exp:"27条各号参照。設立に際して発行する株式の数は、定款の絶対的記載事項ではない。"},
  {id:"K-04-01-008",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:8,rank:"A",src:"平24Ⅱ問題３ウ",
   q:"発起人の氏名または名称および住所は、定款に記載または記録しなければならない。",ans:"正しい",
   exp:"27条５号。なお、発起人の氏名または名称および住所は、登記事項ではない（911条３項各号参照）。"},
  {id:"K-04-01-009",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:9,rank:"A",src:"令２Ⅱ問題４ウ類・平25Ⅱ問題３イ",
   q:"株式会社の支店の所在地は、定款に記載または記録しなければならない。",ans:"誤り",
   exp:"27条各号参照。株式会社の本店の所在地は、定款の絶対的記載事項であるが、株式会社の支店の所在地は、定款の絶対的記載事項ではない。"},
  {id:"K-04-01-010",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:10,rank:"A",src:"平31Ⅰ問題４エ・平26Ⅰ問題３ウ・平24Ⅱ問題３エ",
   q:"株式会社の公告方法は、定款に記載または記録しなければならない。",ans:"誤り",
   exp:"27条各号参照。会社は、公告方法として、① 官報に掲載する方法、② 時事に関する事項を掲載する日刊新聞紙に掲載する方法、③ 電子公告のいずれかを定款で定めることができる（939条１項）。ここで、定款に定めがない場合の公告方法は、① 官報に掲載する方法によることとなるが、公告方法は、定款の絶対的記載事項ではない。"},
  {id:"K-04-01-011",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:11,rank:"A",src:"平30Ⅰ問題４イ類",
   q:"取締役の氏名および員数は、定款に記載または記録しなければならない。",ans:"誤り",
   exp:"27条各号参照。取締役の氏名および員数は絶対的記載事項ではなく、任意的記載事項である。"},
  {id:"K-04-01-012",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:12,rank:"A",src:"令２Ⅱ問題４エ",
   q:"株式会社の設立時発行株式の数は、定款に記載または記録しなければならない。",ans:"誤り",
   exp:"27条各号参照。株式会社の設立時発行株式の数は、定款の絶対的記載事項ではない。なお、発行済株式総数は、絶対的登記事項とされている（911条３項９号）。"},
  {id:"K-04-01-013",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:13,rank:"A",src:"平29Ⅰ問題４イ類",
   q:"株式会社の定款には、会社法の規定により定款の定めがなければその効力を生じない事項、および、その他の事項で会社法の規定に違反しないものを記載することができる。",ans:"正しい",
   exp:"29条。定款には、絶対的記載事項のほかに、相対的記載事項および任意的記載事項を記載することができる。ここで、相対的記載事項とは、記載を欠いても定款全体の効力に影響はないが、定款に記載してはじめてその効力が認められ、記載を欠くときはその効力が認められない事項である。また、任意的記載事項とは、定款の記載の有無は、その事項や定款自体の効力に影響を与えない事項である。"},
  {id:"K-04-01-014",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:14,rank:"A",src:"平31Ⅰ問題４ウ",
   q:"株式会社の存続期間は、定款に記載しまたは記録することができる。",ans:"正しい",
   exp:"29条。なお、定款で存続期間を定めた場合、その満了によって株式会社は解散する（471条１号）。"},
  {id:"K-04-01-015",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:15,rank:"C",src:"",
   q:"会社成立前において、発起人は、定款を発起人の代表者の住所に備え置かなければならない。",ans:"誤り",
   exp:"31条１項。会社成立前において、発起人は、定款を発起人が定めた場所に備え置かなければならない。なお、会社成立後にあっては、その本店および支店に備え置かなければならない。"},
  {id:"K-04-01-016",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:16,rank:"B",src:"平26Ⅰ問題３イ",
   q:"株式会社の成立前において、発起人および設立時募集株式の引受人は、発起人が定めた時間内は、いつでも、発起人の定めた費用を支払うことにより、書面をもって作成された定款の謄本の交付を請求することができる。",ans:"正しい",
   exp:"31条２項２号、102条１項。"},
  {id:"K-04-01-017",subject:"企業法",chapter:"第4章 設立",sub:"1. 定款",num:17,rank:"B",src:"令７Ⅰ問題３イ",
   q:"株式会社の成立後において、当該株式会社の親会社債権者がその権利を行使するため必要があるときは、当該親会社債権者は、裁判所の許可を得て、当該株式会社の定めた費用を支払うことにより、書面をもって作成されている当該株式会社の定款の謄本の交付の請求をすることができる。",ans:"誤り",
   exp:"31条３項。株式会社の成立後において、当該株式会社の親会社社員がその権利を行使するため必要があるときは、当該親会社社員は、裁判所の許可を得て、当該株式会社の定款の閲覧もしくは謄本または抄本の交付を請求することができる。"},
  {id:"K-04-02-001",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:1,rank:"A",src:"",
   q:"変態設立事項は、定款に記載または記録しなければその効力を生じない。",ans:"正しい",
   exp:"28条柱書。変態設立事項は、相対的記載事項であるので、定款に記載または記録しなければその効力を生じない。"},
  {id:"K-04-02-002",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:2,rank:"A",src:"令６Ⅰ問題４ウ",
   q:"発起設立の場合において、定款について公証人の認証を受けた後、発起人から、金銭の出資に代えて自己が所有する不動産を出資したい旨の申出があったときに、発起人の全員の同意をもって当該定款を変更して、当該発起人の出資の目的を金銭ではなく当該不動産にすることはできない。",ans:"正しい",
   exp:"28条１号、30条１項。現物出資は変態設立事項として規定されており、変態設立事項は公証人の認証を受ける原始定款に記載し、または記録しなければ、その効力を生じない。そのため、公証人の認証を受けた後は、原則として定款の変更は制限されるため、発起人の全員の同意があっても、現物出資に関する事項を新たに定款に定めることはできない（30条２項参照）。"},
  {id:"K-04-02-003",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:3,rank:"A",src:"",
   q:"（令８Ⅰ問題４イ類・令７Ⅰ問題３ウ・令２Ⅱ問題３イ類・平29Ⅰ問題３ア・平24Ⅰ問題２ア）募集設立において、発起人および設立時募集株式の引受人は、その引き受けた設立時募集株式につき、金銭以外の財産を出資することができる。",ans:"誤り",
   exp:"34条１項、63条１項対比。株式会社の設立時において、現物出資は重い責任が課せられている発起人のみに認められている出資方法であるため、設立時募集株式引受人は、金銭出資のみが認められており、現物出資は認められていない。"},
  {id:"K-04-02-004",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:4,rank:"A",src:"平24Ⅰ問題２ウ",
   q:"現物出資は、当該現物出資をする者の氏名または名称、出資の目的である財産およびその価額ならびにその者に対して割り当てる設立時発行株式の数を定款に記載し、または記録しなければ、その効力を生じない。",ans:"正しい",
   exp:"28条１号。現物出資等の変態設立事項は、相対的記載事項である。"},
  {id:"K-04-02-005",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:5,rank:"A",src:"",
   q:"財産引受けにより財産の譲渡をすることができるのは、発起人のみである。",ans:"誤り",
   exp:"財産引受けを行うことができる者に制限はない。"},
  {id:"K-04-02-006",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:6,rank:"A",src:"令２Ⅰ問題３イ類・平29Ⅰ問題３ウ・平25Ⅱ問題３ウ",
   q:"株式会社の成立により発起人が受ける報酬は、定款に法定の事項を記載し、または記録しなければ、その効力を生じない。",ans:"正しい",
   exp:"28条３号。株式会社の成立により発起人が受ける報酬は、変態設立事項であるため、定款の相対的記載事項である。"},
  {id:"K-04-02-007",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:7,rank:"A",src:"平30Ⅱ問題３イ・平25Ⅱ問題３エ",
   q:"定款の認証手数料は、株式会社の負担する設立に関する費用とされ、原則として裁判所選任の検査役の調査を受けなければならない。",ans:"誤り",
   exp:"28条４号かっこ書。① 定款の認証手数料、② 定款に係る印紙税、③ 払込取扱機関に支払うべき手数料および報酬、④ 検査役の報酬、⑤ 設立登記のための登録免許税は、会社設立に必要不可欠な費用であり、また、その金額算定には客観性があることから、発起人の恣意性が介入するおそれがないので、変態設立事項の規制の対象外とされている。"},
  {id:"K-04-02-008",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:8,rank:"A",src:"令７Ⅰ問題３ア・平30Ⅰ問題４エ",
   q:"会社が当該会社の設立登記の登録免許税を負担するためには、定款に当該事項についての記載または記録がなければならない。",ans:"誤り",
   exp:"28条4号かっこ書、会社法施行規則５条４号。上記問題７の解説参照。設立登記の登録免許税は、定款に記載または記録がなくても会社が負担することになる。"},
  {id:"K-04-02-009",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:9,rank:"A",src:"平26Ⅰ問題３エ",
   q:"定款に記載し、または記録した現物出資に関する事項を調査するために裁判所により選任された検査役の報酬は、当該定款に記載し、または記録しなければ、その効力を生じない。",ans:"誤り",
   exp:"28条4号かっこ書、会社法施行規則５条３号。上記問題７の解説参照。検査役の報酬は、定款に記載または記録がなくても会社が負担することになる。"},
  {id:"K-04-02-010",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:10,rank:"B",src:"",
   q:"設立費用として定款で定めた価額の総額が、500万円を超えない場合、検査役の調査が免除される。",ans:"誤り",
   exp:"33条10項１号参照。現物出資および財産引受の目的たる財産について定款に記載・記録された価額の総額が、500万円を超えない場合は、検査役の調査が免除される。しかし、設立費用には、このような少額財産の免除の特例はないので、本肢は誤りである。なお、当該少額財産の特例の要件は、個々の現物出資財産の価格ではなくて、現物出資財産等の価格の総額が500万円を超えない場合であることに注意すること。"},
  {id:"K-04-02-011",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:11,rank:"B",src:"令６Ⅰ問題６イ類",
   q:"現物出資または財産引受けの目的たる財産が市場価格のある有価証券である場合、検査役の調査が免除される。",ans:"誤り",
   exp:"33条10項２号。現物出資または財産引受の目的たる財産が市場価格のある有価証券で、かつ、定款で定めた価額が当該有価証券の市場価格として法務省令で定める方法により算定されるものを超えない場合、検査役の調査が免除される。"},
  {id:"K-04-02-012",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:12,rank:"B",src:"令６Ⅰ問題６ウ類・平24Ⅰ問題２エ類",
   q:"現物出資または財産引受けの目的たる財産が不動産である場合において、当該財産の定款で定めた価額が相当であることにつき、不動産鑑定士の証明を受けた場合、検査役の調査が免除となる。",ans:"誤り",
   exp:"33条10項３号かっこ書。現物出資または財産引受けの目的たる財産の価額として定款で定めた価額が相当であることについて、弁護士、弁護士法人、公認会計士、監査法人、税理士または税理士法人の証明（目的物たる財産が不動産であるときは、当該証明および不動産鑑定士の鑑定評価）を受けた場合、検査役の調査が免除となる（33条10項３号）。"},
  {id:"K-04-02-013",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:13,rank:"B",src:"",
   q:"現物出資財産について定款に記載され、または記録された価額が相当であることについて専門家の証明（目的物たる財産が不動産であるときは、当該証明および不動産鑑定士の鑑定評価）を受けることで裁判所選任の検査役の調査が免除となる場合において、設立時取締役となる者は、当該専門家としての資格を有しない。",ans:"正しい",
   exp:"33条11項３号。① 発起人、② 財産引受財産の譲渡人、③ 設立時取締役または設立時監査役、④ 業務の停止の処分を受け、その停止の期間を経過しない者、⑤ 弁護士法人、監査法人または税理士法人であって、その社員の半数以上が①～③のいずれかに該当するものは、現物出資財産等について定款に記載され、または記録された価額が相当であることについての専門家の証明をすることができない。"},
  {id:"K-04-02-014",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:14,rank:"B",src:"令８Ⅰ問題３ウ",
   q:"公認会計士である者が発起人となる場合であって、当該発起人が金銭以外の財産を出資しようとするときは、当該発起人は、当該財産について、定款に記載され、または記録された価額が相当であることの証明をすることができる。",ans:"誤り",
   exp:"33条11項１号。証明の公正性を確保するため、発起人は公認会計士であったとしても専門家の証明をすることができないとされている。"},
  {id:"K-04-02-015",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:15,rank:"B",src:"令６Ⅱ問題３イ",
   q:"その社員の半数以上が設立しようとする株式会社の設立時取締役又は設立時監査役である監査法人は、当該設立しようとする株式会社の現物出資財産等について定款に記載され、又は記録された価額が相当であることについて証明をすることはできない。",ans:"正しい",
   exp:"33条11項５号。監査法人であって、その社員の半数以上が設立しようとする株式会社の設立時取締役または設立時監査役である場合、現物出資または財産引受財産について専門家の証明をすることができない。証明の公正性を確保するためである。"},
  {id:"K-04-02-016",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:16,rank:"B",src:"",
   q:"現物出資財産について定款に記載された価額が相当であることについて証明をした者がいる場合には、発起人はその者の氏名または名称を定款に記載しなければならない。",ans:"誤り",
   exp:"現物出資財産等についての専門家の証明（33条10項３号）がある場合であっても、当該専門家の氏名等の定款への記載は求められていない。"},
  {id:"K-04-02-017",subject:"企業法",chapter:"第4章 設立",sub:"2. 変態設立事項",num:17,rank:"C",src:"",
   q:"株式会社（発起設立および募集設立の方法により設立したものに限る）の成立後２年以内に、その成立する前から存在する財産で、その事業のために継続して使用するものを、当該株式会社の純資産額として法務省令で定める方法により算定される額の５分の１を超える対価で取得する契約を締結する場合には、株主総会の特別決議のほか、裁判所選任の検査役の調査が必要となる。",ans:"誤り",
   exp:"467条１項柱書、309条２項11号。事後設立を行う場合は、株主総会の特別決議が必要である。ただし、事後設立は変態設立事項ではないので、検査役の調査は不要である。事後設立は、財産引受けの規制を潜脱する手段として利用されるおそれがある。そのため、株主総会の特別決議を要求して、財産引受けの規制潜脱を防いでいるのである。また、純資産額の５分の１という基準が設けられているのは、少額な取引まで規制してしまうと、会社の事業活動に支障が生じてしまうからである。"},
  {id:"K-04-03-001",subject:"企業法",chapter:"第4章 設立",sub:"3. 発起人",num:1,rank:"B",src:"令８Ⅰ問題３ア・令５Ⅱ問題３ア",
   q:"発起人は、設立しようとする株式会社が公開会社である場合には、３人以上でなければならない。",ans:"誤り",
   exp:"発起人の人数については制限がない。すなわち、発起人の人数は、１人でも複数人でもよい。そのため、株式会社については、発起人１人による会社設立が認められる。"},
  {id:"K-04-03-002",subject:"企業法",chapter:"第4章 設立",sub:"3. 発起人",num:2,rank:"A",src:"令８Ⅰ問題３イ・令２Ⅱ問題３ア・平28Ⅱ問題４エ・平23Ⅰ問題２イ",
   q:"発起人は、自然人でなければならないため、会社は発起人となることができない。４．発起人の権限の範囲",ans:"誤り",
   exp:"発起人の資格については制限がない。すなわち、自然人だけでなく、法人も発起人となることができる。４．発起人の権限の範囲"},
  {id:"K-04-03-003",subject:"企業法",chapter:"第4章 設立",sub:"3. 発起人",num:1,rank:"C",src:"",
   q:"最高裁判所の判例によれば、会社成立後未払いの設立費用債務は、全額成立後の会社に帰属し、発起人に帰属することはないとされる。",ans:"誤り",
   exp:"大判昭２年７月４日。会社成立後未払いの設立費用債務は、定款に記載され、かつ検査役の調査を通った金額の範囲内で成立後の会社に帰属し、これらの要件を満たさない部分は発起人に帰属するとしている。"},
  {id:"K-04-03-004",subject:"企業法",chapter:"第4章 設立",sub:"3. 発起人",num:2,rank:"B",src:"令５Ⅰ問題３ウ類・平28Ⅱ問題４イ",
   q:"最高裁判所の判例によれば、発起人が株式会社の成立後に特定の財産を譲り受けることを約する契約を締結した場合、定款に法定の事項の記載がなければ、当該契約は無効であるが、成立後の当該株式会社は当該契約を追認することができる。",ans:"誤り",
   exp:"最判昭和42年９月26日。定款に記載のない財産引受けを、成立後の会社が追認することはできない。"},
  {id:"K-04-03-005",subject:"企業法",chapter:"第4章 設立",sub:"3. 発起人",num:3,rank:"B",src:"令７Ⅱ問題３イ類・平31Ⅱ問題３イ",
   q:"最高裁判所の判例によれば、定款に記載のない財産引受けが行われた場合、株式会社のみがその無効を主張でき、財産の譲渡人である相手方は主張できない。",ans:"誤り",
   exp:"最判昭28年12月３日。最高裁判所の判例によれば、定款に記載のない財産引受けは、何人との関係においても無効であり、その無効は会社側だけでなく譲渡人からも主張することができるとしている。"},
  {id:"K-04-05-001",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:1,rank:"A",src:"",
   q:"（令８Ⅰ問題３エ類・令７Ⅱ問題３ウ類・令６Ⅱ問題３ア・平29Ⅱ問題３ア・平29Ⅱ問題３ウ・平26Ⅰ問題４エ）発起設立において、発起人は、株式会社の設立に際して発起人が割当てを受ける設立時発行株式の数および発起人が設立時発行株式と引換えに払い込む金銭の額（定款に定めがある場合を除く）を定めようとするときは、その全員の同意を得なければならない。",ans:"正しい",
   exp:"32条１項１号２号。設立時発行株式に関する事項は重要な事項であるため、発起人全員の同意によって定めなければならない。"},
  {id:"K-04-05-002",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:2,rank:"A",src:"平27Ⅱ問題３イ・平23Ⅱ問題３ア類",
   q:"成立後の株式会社の資本金および準備金の額に関する事項が定款に定められていない場合には、発起人は、株式会社の成立の時までに、当該事項を定款に記載しなければならない。",ans:"誤り",
   exp:"32条１項３号。成立後の株式会社の資本金および準備金の額に関する事項は、定款の絶対的記載事項とはされていない。なお、当該事項（定款に定めがある場合を除く）について定めようとするときは、発起人全員の同意を得なければならない。"},
  {id:"K-04-05-003",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:3,rank:"A",src:"令５Ⅰ問題４ア",
   q:"発起人が、株式会社の設立に際して、成立後の株式会社の資本金および資本準備金の額に関する事項を定めようとする場合は、当該事項について定款に定めがあるときを除き、発起人の全員の同意を得なければならない。",ans:"正しい",
   exp:"32条１項３号。発起人が、株式会社の設立に際して、① 発起人が割当てを受ける設立時発行株式の数、② 発起人が割当てを受ける設立時発行株式と引換えに払い込む金銭の額、③成立後の株式会社の資本金および資本準備金の額に関する事項を定めようとするときは、当該事項について定款に定めがある場合を除き、発起人の全員の同意を得なければならない。"},
  {id:"K-04-05-004",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:4,rank:"A",src:"平28Ⅰ問題３ア・平24Ⅱ問題16 ア類",
   q:"発起設立において、発起人は、発行可能株式総数を定款で定めていない場合には、株式会社の成立の時までに、発起人の議決権の３分の２以上に当たる多数をもって、定款を変更して発行可能株式総数の定めを設けなければならない。",ans:"誤り",
   exp:"37条１項。発起設立において、発起人は、発行可能株式総数を定款で定めていない場合には、株式会社の成立の時までに、その全員の同意によって、定款を変更して発行可能株式総数の定めを設けなければならない。また、発起人は、発行可能株式総数を定款で定めている場合には、株式会社の成立の時までに、その全員の同意によって、発行可能株式総数についての定款の変更をすることができる（37条２項）。"},
  {id:"K-04-05-005",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:5,rank:"A",src:"令５Ⅱ問題３イ類・平31Ⅰ問題４ア・平26Ⅰ問題４イ・平22Ⅱ問題３エ類",
   q:"発起設立において、発起人は、発行可能株式総数を定款で定めている場合には、株式会社の成立の時までに、その過半数の同意によって、当該発行可能株式総数についての定款の変更をすることができる。",ans:"誤り",
   exp:"37条２項。発起人は、発行可能株式総数を定款で定めている場合には、株式会社の成立の時までに、その全員の同意によって、発行可能株式総数についての定款の変更をすることができる。"},
  {id:"K-04-05-006",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:6,rank:"B",src:"平24Ⅰ問題３イ",
   q:"募集設立において、発行可能株式総数を定款に定めていないときは、株式会社の成立の時までに、創立総会の決議によって、定款を変更して発行可能株式総数の定めを設けなければならない。",ans:"正しい",
   exp:"98条。"},
  {id:"K-04-05-007",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:7,rank:"A",src:"令４Ⅰ問題３ア・平29Ⅰ問題３エ類・平23Ⅰ問題３イ",
   q:"発起設立と募集設立のいずれの場合においても、発起人は、設立時発行株式を１株以上引き受けなければならない。",ans:"正しい",
   exp:"25条２項参照。発起設立、募集設立問わず、各発起人は、設立時発行株式を１株以上引き受けなければならない。"},
  {id:"K-04-05-008",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:8,rank:"C",src:"",
   q:"株式会社の設立において、設立時発行株式を引き受ける者を募集する場合には、公証人による定款の認証を受ける前までに、発起人の全員の同意を得なければならない。",ans:"誤り",
   exp:"57条。発起人は、発起人の全員の同意により、設立時発行株式を引き受ける者を募集することを決定することができる。ただし、公証人の認証を受ける前という制限はないため、本肢は誤りである。すなわち、発起設立の方法で株式会社の設立手続を開始した後に、発起人全員の同意を得て募集設立の手続をとることもできる。"},
  {id:"K-04-05-009",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:9,rank:"C",src:"",
   q:"発起人は、設立時発行株式を引き受ける者の募集をするときは、その都度、その過半数の同意によって、設立時募集株式の数等の法定の事項を定めなければならない。",ans:"誤り",
   exp:"58条１項２項。発起人は、設立時発行株式を引き受ける者の募集をするときは、その都度、その全員の同意によって、設立時募集株式について次に掲げる事項を定めなければならない。① 設立時募集株式の数（設立しようとする株式会社が種類株式発行会社である場合にあっては、その種類および種類ごとの数） ② 設立時募集株式の払込金額 ③ 設立時募集株式と引換えにする金銭の払込期日または払込期間 ④ 一定の日までに設立の登記がなされない場合において、設立時募集株式の引受けの取消しをすることができることとするときは、その旨およびその一定の日"},
