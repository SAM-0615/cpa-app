<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPA一問一答">
<meta name="theme-color" content="#ffffff">
<title>CPA 短答一問一答</title>
<style>
:root{
  --bg:#f8f9fa; --surface:#ffffff; --line:#e5e7eb; --line-dark:#d1d5db;
  --text:#111827; --sub:#4b5563; --muted:#9ca3af;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-weak:#eff6ff;
  --red:#dc2626; --red-weak:#fef2f2; --red-border:#fecaca;
  --amber:#d97706; --amber-weak:#fffbeb; --amber-border:#fde68a;
  --green:#16a34a; --green-weak:#f0fdf4; --green-border:#bbf7d0;
  --marker:#fef08a; /* 蛍光ペンの黄色 */
  --gray:#e5e7eb;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
svg{display:block}

/* Header */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.appbar-in{max-width:960px;margin:0 auto;height:52px;display:flex;align-items:center;padding:0 12px;gap:8px}
.appbar h1{font-size:17px;font-weight:700;flex:1;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.iconbtn:active{background:var(--bg)}
.iconbtn svg{width:22px;height:22px;fill:currentColor}

.content{max-width:960px;margin:0 auto;padding:16px 16px calc(90px + var(--safe-b))}
.section-label{font-size:13px;font-weight:700;color:var(--sub);margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}

/* Summary Banner */
.stats-banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat-box{border-right:1px solid var(--line)}
.stat-box:last-child{border-right:none}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:600}
.stat-val{font-size:22px;font-weight:800;color:var(--text);margin-top:2px;letter-spacing:-0.02em}
.stat-val small{font-size:12px;font-weight:600;margin-left:2px;color:var(--sub)}

/* Subject Grid */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-height:148px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:active{background:#f9fafb}
@media(hover:hover){.tile:hover{border-color:var(--line-dark);box-shadow:0 2px 8px rgba(0,0,0,0.04)}}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start}
.tile-title{font-size:18px;font-weight:800;letter-spacing:-0.01em;color:var(--text)}
.badge-mistake{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:2px}
.tile-foot{margin-top:auto;padding-top:14px}
.tile-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin-bottom:6px}
.tile-row b{font-weight:700;color:var(--text)}
.tile-empty{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted)}

/* Progress Bars */
.bar{width:100%;background:var(--gray);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:10px;color:var(--sub)}
.legend b{color:var(--text);margin-left:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;flex-shrink:0}
.d-comp{background:var(--green)} .d-vague{background:var(--amber)} .d-mis{background:var(--red)} .d-un{background:var(--muted)}

/* Quick Actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;transition:all .15s}
.qbtn b{font-size:24px;font-weight:800;line-height:1}
.qbtn.red{border-color:var(--red-border);background:var(--red-weak);color:var(--red)}
.qbtn.amber{border-color:var(--amber-border);background:var(--amber-weak);color:var(--amber)}
.qbtn:disabled{opacity:.4;cursor:default}
.qbtn:active:not(:disabled){filter:brightness(.96)}

/* List Groups & Accordions */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:active:not(:disabled){background:var(--bg)}
.row-main{flex:1;min-width:0}
.row-title{font-size:14.5px;font-weight:700;margin-bottom:4px}
.row-sub{font-size:12px;color:var(--sub)}
.row svg{width:20px;height:20px;fill:var(--muted);flex-shrink:0}
.row.all .row-title{color:var(--primary)}

/* Collapsible Sub-sections */
.sec-group{border-bottom:1px solid var(--line)}
.sec-group:last-child{border-bottom:none}
.sec-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fafbfc;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--text);border-bottom:1px solid transparent}
.sec-header.open{border-bottom-color:var(--line);background:#f3f4f6}
.sec-header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.sec-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sec-play-btn{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--primary);background:var(--primary-weak);border:1px solid rgba(37,99,235,0.25);border-radius:6px;padding:4px 8px;}
.sec-play-btn:active{background:#dbeafe;}
.sec-badge{font-size:11px;font-weight:600;color:var(--sub);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.sec-arrow{width:18px;height:18px;fill:var(--muted);transition:transform .15s}
.sec-header.open .sec-arrow{transform:rotate(180deg)}
.sec-items{display:none}
.sec-items.open{display:block}

.qitem{display:flex;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;background:var(--surface)}
.qitem:last-child{border-bottom:none}
.qitem:active{background:var(--bg)}
.qitem .dot{margin-top:6px}
.qi-main{flex:1;min-width:0}
.qi-meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.badge-mis-count{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;}
.qi-text{font-size:14px;line-height:1.6;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.star{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;color:var(--muted)}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.star.on{color:#f59e0b}
.star.on svg{fill:#f59e0b}

/* Primary Button */
.primary-btn{width:100%;background:var(--primary);color:#fff;border-radius:10px;padding:14px;font-size:15px;font-weight:700;text-align:center;transition:background .15s}
.primary-btn:hover{background:var(--primary-hover)}
.primary-btn:disabled{background:var(--line-dark);cursor:default}
.ghost-btn{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-weight:700;text-align:center;color:var(--sub);background:var(--surface)}

/* Bottom Tabbar (3タブ) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;height:56px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:currentColor}
.tab.active{color:var(--primary)}

/* Filter Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:60;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;padding:12px 18px calc(18px + var(--safe-b));max-width:560px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
@media(min-width:720px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px;padding-bottom:20px}}
.grabber{width:36px;height:4px;border-radius:999px;background:var(--line-dark);margin:0 auto 12px}
@media(min-width:720px){.grabber{display:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px;font-weight:800}
.sheet-head button{font-size:13px;color:var(--primary);font-weight:700}
.opt{padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:none}
.opt-label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--sub);background:var(--surface);display:flex;align-items:center;gap:6px}
.fchip small{font-size:11px;color:var(--muted)}
.fchip.on{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px;border-radius:6px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.06)}

/* Quiz Mode */
#overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#overlay.show{display:block}
.qz-bar{position:sticky;top:0;background:var(--surface);z-index:5;padding-top:var(--safe-t);border-bottom:1px solid var(--line)}
.qz-bar-in{max-width:800px;margin:0 auto;height:52px;display:flex;align-items:center;padding:0 8px}
.qz-title{flex:1;font-size:15px;font-weight:700;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-progress{height:3px;background:var(--gray)}
.qz-progress i{display:block;height:100%;background:var(--primary);transition:width .2s}
.qz-body{max-width:800px;margin:0 auto;padding:16px 16px 120px}
.qz-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.qz-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.qz-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rank-badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.qz-question{font-size:16.5px;line-height:1.8;font-weight:500;color:var(--text);margin-bottom:20px}
.choices{display:grid;gap:10px}
@media(min-width:640px){.choices{grid-template-columns:1fr 1fr 1fr}}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;transition:all .12s}
.choice:active:not(:disabled){background:var(--bg)}
.choice.correct{border-color:var(--green);background:var(--green-weak);color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-weak);color:var(--red)}

.judge{margin-top:16px;padding:14px;border-radius:10px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.judge.ok{background:var(--green-weak);color:var(--green);border:1px solid var(--green-border)}
.judge.ng{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border)}
.exp{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.exp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.exp-title{font-size:13px;font-weight:800;color:var(--sub)}
.btn-marker-action{background:var(--primary-weak);color:var(--primary);border:1px solid rgba(37,99,235,0.2);padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
.btn-marker-action:active{background:#dbeafe;}
.exp-text{font-size:14.5px;line-height:1.85;color:#374151;user-select:text;-webkit-user-select:text;}
.hl-mark{background-color:var(--marker);padding:1px 2px;border-radius:3px;font-weight:600;color:#000;}

.rate-box{margin-top:20px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.rate-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:10px;text-align:center}
.rate-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{border-radius:8px;padding:12px 6px;text-align:center;font-size:14px;font-weight:700;border:1px solid transparent}
.rb.red{background:var(--red-weak);border-color:var(--red-border);color:var(--red)}
.rb.amber{background:var(--amber-weak);border-color:var(--amber-border);color:var(--amber)}
.rb.green{background:var(--green-weak);border-color:var(--green-border);color:var(--green)}

/* 要点ノート用スタイル */
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;}
.note-card:active{background:#fafbfc;}
.note-meta{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.note-text{font-size:14px;line-height:1.7;color:var(--text);border-left:3px solid #eab308;padding-left:10px;background:#fefce8;padding:8px 10px;border-radius:0 8px 8px 0;font-weight:600;}
.btn-del-note{color:var(--muted);padding:4px;}
.btn-del-note:hover{color:var(--red);}

/* AIボタン & 問題別メモ用スタイル */
.exp-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn-ai-action{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px;transition:all .15s;}
.btn-ai-action:active{background:#e5e7eb;}
.memo-section{margin-top:14px;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;}
.memo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.memo-title{font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:4px;}
.memo-textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;line-height:1.6;color:var(--text);background:var(--surface);resize:vertical;min-height:64px;box-sizing:border-box;font-family:inherit;}
.memo-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-weak);}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:var(--sub);border:1px solid var(--line);}
.sync-badge.online{background:var(--green-weak);color:var(--green);border-color:var(--green-border);}
.sync-badge.syncing{background:var(--primary-weak);color:var(--primary);border-color:rgba(37,99,235,0.3);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* iPad / iOS Safari 最適化テキスト選択 & フローティングマーカー */
.exp-text, .qz-question{
  user-select:text;-webkit-user-select:text;
  -webkit-touch-callout:default;
}
.exp-text{
  font-size:15px;line-height:1.9;color:#374151;
}
.note-target-badge{
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
}
.note-target-badge.q{background:#e0e7ff;color:#3730a3;}
.note-target-badge.exp{background:#fef3c7;color:#92400e;}
.floating-marker-bubble{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:none;align-items:center;gap:8px;z-index:99;cursor:pointer;
  animation:pop .2s ease-out;
}
.floating-marker-bubble:active{transform:translateX(-50%) scale(0.96);}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 非同期トースト通知（OKを押さなくていい控えめな通知） */
.toast-notify{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(17,24,39,0.92);color:#fff;padding:8px 16px;border-radius:999px;
  font-size:12.5px;font-weight:700;display:none;align-items:center;gap:6px;
  z-index:100;backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,0.2);
  pointer-events:none;animation:toastIn .2s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
<!-- Firebase SDK (無料版・端末間自動同期用) -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="screen"></div>
<nav class="tabbar">
  <div class="tabbar-in">
    <button class="tab" data-tab="home" onclick="tabTo('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>ホーム</span></button>
    <button class="tab" data-tab="notes" onclick="tabTo('notes')"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span>要点ノート</span></button>
    <button class="tab" data-tab="record" onclick="tabTo('record')"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg><span>学習記録</span></button>
  </div>
</nav>
<div id="sheet"></div>
<div id="overlay"></div>

<!-- iPad / スマホ用 フローティングマーカー保存ポップアップ -->
<div id="floatingMarkerBtn" class="floating-marker-bubble" onclick="addHighlightFromCurrentSelection()">
  <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  <span>選択範囲をマーカー保存</span>
</div>

<!-- 自動消滅する控えめトースト通知 -->
<div id="toastNotification" class="toast-notify">
  <span id="toastText">マーカーを登録しました</span>
</div>

<script>
// 問題データ
const QUESTIONS = [

  {id:"K-02-07-01",subject:"企業法",chapter:"2. 機関",sub:"(7) 代表執行役",num:1,rank:"A",src:"平21 問題10エ",

// Storage Keys
const LS_STATUS = "cpa_v6_status";
const LS_MISTAKES = "cpa_v6_mistakes";
const LS_LOG = "cpa_v6_log";
const LS_STAR = "cpa_v6_star";
const LS_NOTES = "cpa_v6_notes"; // [ { id: "QID", qid: "...", text: "マーカー文字列", sub: "...", ch: "...", qnum: 1 } ]
const LS_MEMOS = "cpa_v6_memos"; // { [qid]: "問題ごとのメモ内容" }

let statusMap = JSON.parse(localStorage.getItem(LS_STATUS) || "{}");
let mistakeCountMap = JSON.parse(localStorage.getItem(LS_MISTAKES) || "{}");
let logArr = JSON.parse(localStorage.getItem(LS_LOG) || "[]");
let starMap = JSON.parse(localStorage.getItem(LS_STAR) || "{}");
let notesList = JSON.parse(localStorage.getItem(LS_NOTES) || "[]");
let memoMap = JSON.parse(localStorage.getItem(LS_MEMOS) || "{}");

// --- Firebase クラウド自動同期（二重安全設計） ---
let db = null;
let syncStatus = "offline"; // "online" | "syncing" | "offline"
let isRemoteUpdating = false;

const firebaseConfig = {
  apiKey: "AIzaSyAcqnz1HwQCzukOYdG_j7xAtscE9QuZHsg",
  authDomain: "cpa-app-fca0c.firebaseapp.com",
  projectId: "cpa-app-fca0c",
  storageBucket: "cpa-app-fca0c.firebasestorage.app",
  messagingSenderId: "512754805085",
  appId: "1:512754805085:web:cf52a25588f5c6cba120b4",
  measurementId: "G-4LCKRYWK00"
};

function initFirebase(){
  try {
    if(window.firebase && !firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      syncStatus = "online";
      listenCloudData();
    }
  } catch(e) {
    console.warn("Firebase Init Error (Local fallback active):", e);
    syncStatus = "offline";
  }
}

// クラウドからの変更をリアルタイム監視（他端末での操作を瞬時に反映）
function listenCloudData(){
  if(!db) return;
  db.collection("userdata").doc("main_profile").onSnapshot((doc) => {
    if(!doc.exists) return;
    const data = doc.data();
    if(!data) return;

    isRemoteUpdating = true;
    try {
      if(data.statusMap) { statusMap = data.statusMap; localStorage.setItem(LS_STATUS, JSON.stringify(statusMap)); }
      if(data.mistakeCountMap) { mistakeCountMap = data.mistakeCountMap; localStorage.setItem(LS_MISTAKES, JSON.stringify(mistakeCountMap)); }
      if(data.logArr) { logArr = data.logArr; localStorage.setItem(LS_LOG, JSON.stringify(logArr)); }
      if(data.starMap) { starMap = data.starMap; localStorage.setItem(LS_STAR, JSON.stringify(starMap)); }
      if(data.notesList) { notesList = data.notesList; localStorage.setItem(LS_NOTES, JSON.stringify(notesList)); }
      if(data.memoMap) { memoMap = data.memoMap; localStorage.setItem(LS_MEMOS, JSON.stringify(memoMap)); }
      syncStatus = "online";
      render();
    } finally {
      isRemoteUpdating = false;
    }
  }, (err) => {
    console.warn("Firestore snapshot error:", err);
    syncStatus = "offline";
  });
}

// 端末側の変更をクラウドへアップロード（デバウンス付き）
let saveCloudTimer = null;
function triggerCloudSave(){
  if(isRemoteUpdating || !db) return;
  syncStatus = "syncing";
  renderSyncBadge();

  clearTimeout(saveCloudTimer);
  saveCloudTimer = setTimeout(() => {
    db.collection("userdata").doc("main_profile").set({
      statusMap,
      mistakeCountMap,
      logArr,
      starMap,
      notesList,
      memoMap,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(() => {
      syncStatus = "online";
      renderSyncBadge();
    }).catch((err) => {
      console.warn("Firestore save error:", err);
      syncStatus = "offline";
      renderSyncBadge();
    });
  }, 400);
}

function renderSyncBadge(){
  const el = document.getElementById("syncBadgeEl");
  if(!el) return;
  if(syncStatus === "online"){
    el.className = "sync-badge online";
    el.innerHTML = '<span class="sync-dot"></span>クラウド同期中';
  } else if(syncStatus === "syncing"){
    el.className = "sync-badge syncing";
    el.innerHTML = '<span class="sync-dot"></span>同期中...';
  } else {
    el.className = "sync-badge";
    el.innerHTML = '<span class="sync-dot" style="background:var(--muted)"></span>ローカル保存中';
  }
}

const st = id => statusMap[id] || "未着手";
const misCnt = id => mistakeCountMap[id] || 0;
const qsOf = subj => QUESTIONS.filter(q => q.subject === subj);

function stats(list){
  const s = {total:list.length, comp:0, vague:0, mis:0, un:0};
  list.forEach(q => {
    const x = st(q.id);
    if(x === "コンプリート") s.comp++;
    else if(x === "曖昧") s.vague++;
    else if(x === "間違えた") s.mis++;
    else s.un++;
  });
  s.pct = s.total ? Math.round(s.comp / s.total * 100) : 0;
  return s;
}

function bar(s, h=5){
  if(!s.total) return `<div class="bar" style="height:${h}px"></div>`;
  const w = n => (n / s.total * 100).toFixed(1) + "%";
  return `<div class="bar" style="height:${h}px">
    <i style="width:${w(s.comp)};background:var(--green)"></i>
    <i style="width:${w(s.vague)};background:var(--amber)"></i>
    <i style="width:${w(s.mis)};background:var(--red)"></i>
  </div>`;
}

// Navigation
const state = { tab:"home", stack:[{v:"subjects"}], sheet:null, session:null };

function tabTo(t){
  state.tab = t;
  if(t === "home") state.stack = [{v:"subjects"}];
  render(); window.scrollTo(0,0);
}
function nav(v){ state.stack.push(v); render(); window.scrollTo(0,0); }
function back(){ if(state.stack.length > 1) state.stack.pop(); render(); window.scrollTo(0,0); }

function render(){
  const root = document.getElementById("screen");
  if(state.tab === "home"){
    const top = state.stack[state.stack.length - 1];
    if(top.v === "subjects") root.innerHTML = vSubjects();
    else if(top.v === "subject") root.innerHTML = vSubject(top.si);
    else if(top.v === "chapter") root.innerHTML = vChapter(top.si, top.ci);
  } else if(state.tab === "notes"){
    root.innerHTML = vNotes();
  } else {
    root.innerHTML = vRecord();
  }
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
}

// 5. 出題設定モーダル
let quizSettings = { status:["未着手","間違えた","曖昧","コンプリート"], rank:["A","B","C"], mistakeOnly:false, order:"seq", section:"すべて" };

function openSheet(si, ci, sectionName = "すべて"){
  quizSettings.section = sectionName;
  state.sheet = { si, ci };
  renderSheet();
}
function closeSheet(){
  state.sheet = null;
  document.getElementById("sheet").innerHTML = "";
  document.body.classList.remove("lock");
}

function renderSheet(){
  const { si, ci } = state.sheet;
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  let pool = qsOf(s.key).filter(q => !targetChapter || q.chapter === targetChapter);

  // 利用可能な節一覧
  const availableSections = Array.from(new Set(pool.map(q => q.sub)));

  document.body.classList.add("lock");
  document.getElementById("sheet").innerHTML = `
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <b>出題設定</b>
      <button onclick="closeSheet()">キャンセル</button>
    </div>
    <div class="opt">
      <div class="opt-label">出題範囲</div>
      <div style="font-size:14px;font-weight:700;">${s.key} ${targetChapter ? '› ' + targetChapter : '（全範囲）'} (${pool.length}問)</div>
    </div>
    ${availableSections.length > 1 ? `
    <div class="opt">
      <div class="opt-label">節・論点（絞り込み）</div>
      <div class="chips">
        <button class="fchip ${quizSettings.section === 'すべて' ? 'on' : ''}" onclick="setQuizSection('すべて')">すべての節</button>
        ${availableSections.map(secName => `
          <button class="fchip ${quizSettings.section === secName ? 'on' : ''}" onclick="setQuizSection('${secName}')">${secName}</button>
        `).join("")}
      </div>
    </div>
    ` : ""}
    <div class="opt">
      <div class="opt-label">記憶度（絞り込み）</div>
      <div class="chips">
        ${["未着手","間違えた","曖昧","コンプリート"].map(stName => `
          <button class="fchip ${quizSettings.status.includes(stName) ? 'on' : ''}" onclick="toggleSetting('status','${stName}')">${stName}</button>
        `).join("")}
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">ランク（重要度）</div>
      <div class="chips">
        ${["A","B","C"].map(r => `
          <button class="fchip ${quizSettings.rank.includes(r) ? 'on' : ''}" onclick="toggleSetting('rank','${r}')">ランク${r}</button>
        `).join("")}
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">苦手特訓</div>
      <div class="chips">
        <button class="fchip ${quizSettings.mistakeOnly ? 'on' : ''}" onclick="toggleMistakeOnly()">過去に間違えたことがある問題のみ</button>
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">出題順序</div>
      <div class="seg">
        <button class="${quizSettings.order === 'seq' ? 'on' : ''}" onclick="setOrder('seq')">順番通り</button>
        <button class="${quizSettings.order === 'rand' ? 'on' : ''}" onclick="setOrder('rand')">ランダム</button>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button class="primary-btn" onclick="startFilteredQuiz(${si}, ${ci})">解答を開始する</button>
    </div>
  </div>`;
}

function toggleSetting(type, val){
  const arr = quizSettings[type];
  const idx = arr.indexOf(val);
  if(idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  renderSheet();
}
function toggleMistakeOnly(){
  quizSettings.mistakeOnly = !quizSettings.mistakeOnly;
  renderSheet();
}
function setQuizSection(sec){
  quizSettings.section = sec;
  renderSheet();
}
function setOrder(ord){
  quizSettings.order = ord;
  renderSheet();
}

function startFilteredQuiz(si, ci){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  let pool = qsOf(s.key).filter(q => !targetChapter || q.chapter === targetChapter);

  // 節・論点フィルター
  if(quizSettings.section && quizSettings.section !== "すべて"){
    pool = pool.filter(q => q.sub === quizSettings.section);
  }

  pool = pool.filter(q => {
    if(!quizSettings.status.includes(st(q.id))) return false;
    if(!quizSettings.rank.includes(q.rank)) return false;
    if(quizSettings.mistakeOnly && misCnt(q.id) === 0) return false;
    return true;
  });

  if(quizSettings.order === 'rand'){
    pool.sort(() => Math.random() - 0.5);
  }
  closeSheet();
  if(!pool.length){
    alert("条件に一致する問題がありませんでした");
    return;
  }
  launchQuiz(pool, `${s.key} ${targetChapter || ''} ${quizSettings.section !== 'すべて' ? '› ' + quizSettings.section : ''}`);
}

function startSectionQuiz(si, ci, subTitle){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  const pool = qsOf(s.key).filter(q => (!targetChapter || q.chapter === targetChapter) && q.sub === subTitle);
  launchQuiz(pool, `${subTitle}（全${pool.length}問）`);
}

function quickStart(si, ci, statusName){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  const pool = qsOf(s.key).filter(q => (!targetChapter || q.chapter === targetChapter) && st(q.id) === statusName);
  launchQuiz(pool, `${statusName}問題演習`);
}

function startSingleQuiz(id){
  const q = QUESTIONS.find(x => x.id === id);
  launchQuiz([q], "個別演習");
}

// 6. 演習画面
function launchQuiz(list, title){
  state.session = { list, title, idx:0, answered:false };
  document.getElementById("overlay").classList.add("show");
  document.body.classList.add("lock");
  renderQuizCard();
}

function renderQuizCard(){
  const S = state.session;
  const q = S.list[S.idx];
  const ov = document.getElementById("overlay");
  const mCount = misCnt(q.id);

  ov.innerHTML = `
  <div class="qz-bar">
    <div class="qz-bar-in">
      <button class="iconbtn" onclick="exitQuiz()"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      <div class="qz-title">${S.title} (${S.idx+1}/${S.list.length})</div>
    </div>
    <div class="qz-progress"><i style="width:${((S.idx+1)/S.list.length)*100}%"></i></div>
  </div>
  <div class="qz-body">
    <div class="qz-card">
      <div class="qz-meta">${q.chapter} › ${q.sub}</div>
      <div class="qz-header">
        <span style="font-size:14px;font-weight:800;">問題 ${q.num}</span>
        <span class="rank-badge">ランク ${q.rank}</span>
        ${mCount > 0 ? `<span class="badge-mis-count">通算誤答 ${mCount}回</span>` : ""}
      </div>
      <div class="qz-question" id="qzQuestionContainer">${getHighlightedQuestionHtml(q)}</div>

      <div class="choices">
        <button class="choice" id="btnTrue" onclick="answer('正しい')">○ 正しい</button>
        <button class="choice" id="btnFalse" onclick="answer('誤り')">× 誤り</button>
        <button class="choice" id="btnUnk" onclick="answer('不明')">? わからない</button>
      </div>

      <div id="quizFeedback" style="display:none;"></div>
    </div>
  </div>`;
}

function getHighlightedQuestionHtml(q){
  let qText = q.q;
  const qNotes = notesList.filter(n => n.qid === q.id && n.target === "question");
  qNotes.forEach(n => {
    if(qText.includes(n.text)){
      qText = qText.split(n.text).join(`<mark class="hl-mark">${n.text}</mark>`);
    }
  });
  return qText;
}

function getHighlightedExpHtml(q){
  let expText = q.exp;
  // この問題に付けられた解説マーカーをハイライト反映
  const qNotes = notesList.filter(n => n.qid === q.id && n.target !== "question");
  qNotes.forEach(n => {
    if(expText.includes(n.text)){
      expText = expText.split(n.text).join(`<mark class="hl-mark">${n.text}</mark>`);
    }
  });
  return expText;
}

function answer(userAns){
  const S = state.session;
  if(S.answered) return;
  S.answered = true;
  const q = S.list[S.idx];
  const isCorrect = userAns === q.ans;

  if(!isCorrect){
    mistakeCountMap[q.id] = (mistakeCountMap[q.id] || 0) + 1;
    localStorage.setItem(LS_MISTAKES, JSON.stringify(mistakeCountMap));
  }

  logArr.push({ t: new Date().toISOString(), id: q.id, correct: isCorrect });
  localStorage.setItem(LS_LOG, JSON.stringify(logArr));

  document.getElementById("btnTrue").disabled = true;
  document.getElementById("btnFalse").disabled = true;
  document.getElementById("btnUnk").disabled = true;

  if(q.ans === "正しい") document.getElementById("btnTrue").classList.add("correct");
  else document.getElementById("btnFalse").classList.add("correct");

  if(!isCorrect && userAns === "正しい") document.getElementById("btnTrue").classList.add("wrong");
  if(!isCorrect && userAns === "誤り") document.getElementById("btnFalse").classList.add("wrong");

  const fb = document.getElementById("quizFeedback");
  fb.style.display = "block";
  const curMemo = memoMap[q.id] || "";

  fb.innerHTML = `
    <div class="judge ${isCorrect ? 'ok' : 'ng'}">
      <span>${isCorrect ? '正解！' : '不正解'}</span>
      <span style="font-size:13px;">正答：${q.ans === '正しい' ? '○ 正しい' : '× 誤り'}</span>
    </div>
    <div class="exp">
      <div class="exp-head">
        <div class="exp-title">解説</div>
        <div class="exp-actions">
          <button class="btn-marker-action" onclick="addHighlightFromSelection('${q.id}')">
            <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            選択マーカー保存
          </button>
          <button class="btn-ai-action" onclick="askAiQuestion('${q.id}')" title="Geminiで質問">
            ✨ Geminiに質問
          </button>
        </div>
      </div>
      <div class="exp-text" id="expTextContainer">${getHighlightedExpHtml(q)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">※ 解説を指でなぞって「選択マーカー保存」を押すと要点ノートに追加されます</div>

      <!-- 問題別メモ入力欄 -->
      <div class="memo-section">
        <div class="memo-head">
          <span class="memo-title">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Myメモ（AI回答のコピペや自分なりの覚え方）
          </span>
          <span class="memo-saved-tag" id="memoSavedTag_${q.id}">✓ 保存済</span>
        </div>
        <textarea class="memo-textarea" id="memoInput_${q.id}" placeholder="AIの回答や、自分が間違えた理由・覚え方をここにメモしておけます..." oninput="autoSaveMemo('${q.id}')">${curMemo}</textarea>
      </div>
    </div>
    <div class="rate-box">
      <div class="rate-title">習熟度を記録して次へ</div>
      <div class="rate-btns">
        <button class="rb red" onclick="submitRating('間違えた')">✕ 間違えた</button>
        <button class="rb amber" onclick="submitRating('曖昧')">△ 曖昧</button>
        <button class="rb green" onclick="submitRating('コンプリート')">○ 覚えた！</button>
      </div>
    </div>
  `;
}

function autoSaveMemo(qid){
  const el = document.getElementById("memoInput_" + qid);
  if(!el) return;
  memoMap[qid] = el.value;
  localStorage.setItem(LS_MEMOS, JSON.stringify(memoMap));
  triggerCloudSave();
  const tag = document.getElementById("memoSavedTag_" + qid);
  if(tag){
    tag.style.display = "inline";
    setTimeout(() => { if(tag) tag.style.display = "none"; }, 1500);
  }
}

function askAiQuestion(qid){
  const q = QUESTIONS.find(x => x.id === qid);
  if(!q) return;

  const promptText = `公認会計士試験（短答式）の「${q.subject}」を学習しています。
以下の問題と解説について、なぜこのような規定・考え方になっているのか（制度趣旨や背景、実務上の具体例）を、初心者にわかりやすく3行〜5行で噛み砕いて教えてください。

【論点】${q.chapter} › ${q.sub}
【問題${q.num}】
${q.q}
【解答】${q.ans}
【解説】
${q.exp}

※ ポイントを整理して解説してください。`;

  // クリップボードにコピーしてGeminiを開く
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(promptText).then(() => {
      openGeminiService(promptText);
    }).catch(() => {
      fallbackCopyAndOpenGemini(promptText);
    });
  } else {
    fallbackCopyAndOpenGemini(promptText);
  }
}

function fallbackCopyAndOpenGemini(text){
  const t = document.createElement("textarea");
  t.value = text;
  document.body.appendChild(t);
  t.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  openGeminiService(text);
}

function openGeminiService(promptText){
  // 自動で外部サイトに飛ばず、クリップボードへのコピー完了のみ通知する
  showToast("📋 Gemini用プロンプトをコピーしました！");
}

// iPad / iOS Safari 最適化セレクション管理
let lastCapturedSelectionText = "";
let lastCapturedQid = null;
let lastCapturedTarget = "exp"; // "exp" | "question"

document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : "";
  const bubble = document.getElementById("floatingMarkerBtn");

  if(text.length >= 2 && state.session && state.session.answered){
    const q = state.session.list[state.session.idx];
    const expBox = document.getElementById("expTextContainer");
    const qBox = document.getElementById("qzQuestionContainer");

    // 解説文の中の選択かチェック
    if(expBox && expBox.contains(sel.anchorNode)){
      lastCapturedSelectionText = text;
      lastCapturedQid = q.id;
      lastCapturedTarget = "exp";
      if(bubble) bubble.style.display = "flex";
      return;
    }
    // 問題文の中の選択かチェック（回答後のみ）
    if(qBox && qBox.contains(sel.anchorNode)){
      lastCapturedSelectionText = text;
      lastCapturedQid = q.id;
      lastCapturedTarget = "question";
      if(bubble) bubble.style.display = "flex";
      return;
    }
  }

  // 選択解除時（タップ等でバブルが消えるのは少し遅延）
  setTimeout(() => {
    const curSel = window.getSelection();
    if(!curSel || curSel.toString().trim().length < 2){
      if(bubble) bubble.style.display = "none";
    }
  }, 300);
});

function addHighlightFromCurrentSelection(){
  if(!lastCapturedQid || !lastCapturedSelectionText){
    showToast("マーカーを引きたい文字を選択してください");
    return;
  }
  executeAddHighlight(lastCapturedQid, lastCapturedSelectionText, lastCapturedTarget);
}

function addHighlightFromSelection(qid){
  const sel = window.getSelection();
  let text = sel ? sel.toString().trim() : "";
  if(!text && lastCapturedQid === qid && lastCapturedSelectionText){
    text = lastCapturedSelectionText;
  }
  if(!text || text.length < 2){
    showToast("文字を選択してください");
    return;
  }
  executeAddHighlight(qid, text, lastCapturedTarget || "exp");
}

function executeAddHighlight(qid, selectedText, target = "exp"){
  const q = QUESTIONS.find(x => x.id === qid);
  if(!q) return;

  // 重複チェック
  if(notesList.some(n => n.qid === qid && n.text === selectedText && n.target === target)){
    showToast("既にマーカー登録されています");
    return;
  }

  notesList.unshift({
    qid: q.id,
    subject: q.subject,
    chapter: q.chapter,
    sub: q.sub,
    qnum: q.num,
    target: target, // "exp" または "question"
    text: selectedText
  });
  localStorage.setItem(LS_NOTES, JSON.stringify(notesList));
  triggerCloudSave();

  // 画面の解説および問題文をハイライト再描画
  const expBox = document.getElementById("expTextContainer");
  if(expBox) expBox.innerHTML = getHighlightedExpHtml(q);
  const qBox = document.getElementById("qzQuestionContainer");
  if(qBox) qBox.innerHTML = getHighlightedQuestionHtml(q);

  const bubble = document.getElementById("floatingMarkerBtn");
  if(bubble) bubble.style.display = "none";
  window.getSelection().removeAllRanges();
  lastCapturedSelectionText = "";

  showToast(target === "question" ? "🖊 問題文のマーカーを登録しました" : "🖊 解説のマーカーを登録しました");
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toastNotification");
  const txt = document.getElementById("toastText");
  if(!el || !txt) return;
  txt.innerText = msg;
  el.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.display = "none";
  }, 1200); // 1.2秒後に自動でふわっと消える
}

function submitRating(rating){
  const S = state.session;
  const q = S.list[S.idx];
  statusMap[q.id] = rating;
  localStorage.setItem(LS_STATUS, JSON.stringify(statusMap));
  triggerCloudSave();

  if(S.idx < S.list.length - 1){
    S.idx++;
    S.answered = false;
    renderQuizCard();
    window.scrollTo(0,0);
  } else {
    alert("すべての問題を解き終えました！");
    exitQuiz();
  }
}

function exitQuiz(){
  state.session = null;
  document.getElementById("overlay").classList.remove("show");
  document.body.classList.remove("lock");
  render();
}

// 7. 学習記録
function vRecord(){
  const all = stats(QUESTIONS);
  const correctCount = logArr.filter(l => l.correct).length;
  const rate = logArr.length ? Math.round(correctCount / logArr.length * 100) : 0;

  const mistakeRanking = QUESTIONS.filter(q => misCnt(q.id) > 0)
    .sort((a,b) => misCnt(b.id) - misCnt(a.id))
    .slice(0, 5);

  return `
  <header class="appbar"><div class="appbar-in"><h1>学習記録</h1></div></header>
  <div class="content">
    <div class="stats-banner" style="grid-template-columns:1fr 1fr;">
      <div class="stat-box"><div class="stat-label">総解答回数</div><div class="stat-val">${logArr.length}<small>回</small></div></div>
      <div class="stat-box"><div class="stat-label">累計正答率</div><div class="stat-val">${rate}<small>%</small></div></div>
    </div>

    <div class="section-label">習熟度サマリー</div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;">
        <span>全科目のコンプリート率</span><span>${all.comp}/${all.total}問 (${all.pct}%)</span>
      </div>
      ${bar(all, 10)}
      <div class="legend" style="margin-top:14px;">
        <span><i class="dot d-comp"></i>コンプリート <b>${all.comp}</b>問</span>
        <span><i class="dot d-mis"></i>間違えた <b>${all.mis}</b>問</span>
        <span><i class="dot d-vague"></i>曖昧 <b>${all.vague}</b>問</span>
        <span><i class="dot d-un"></i>未着手 <b>${all.un}</b>問</span>
      </div>
    </div>

    <div class="section-label">間違えた回数が多い問題（ワースト）</div>
    <div class="list">
      ${mistakeRanking.length ? mistakeRanking.map(q => `
        <div class="qitem" onclick="startSingleQuiz('${q.id}')">
          <span class="badge-mis-count" style="font-size:12px;padding:3px 8px;">✕ ${misCnt(q.id)}回誤答</span>
          <div class="qi-main">
            <div class="qi-meta">${q.subject} · ${q.chapter} · 問題${q.num}</div>
            <div class="qi-text">${q.q}</div>
          </div>
        </div>
      `).join("") : `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">まだ間違えた記録はありません</div>`}
    </div>

    <div class="section-label">データ管理（保存・復元）</div>
    <div class="card" style="display:flex; flex-direction:column; gap:8px;">
      <button class="ghost-btn" onclick="exportData()">学習データをファイルにバックアップ</button>
      <button class="ghost-btn" style="color:var(--red);" onclick="resetData()">学習記録を初期化</button>
    </div>
  </div>`;
}

function exportData(){
  const blob = new Blob([JSON.stringify({ statusMap, mistakeCountMap, logArr, starMap, notesList, memoMap })], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `cpa_study_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function resetData(){
  if(confirm("解答履歴・マーカー・メモ・間違えた回数の記録をすべてリセットしますか？")){
    statusMap = {}; mistakeCountMap = {}; logArr = []; starMap = {}; notesList = []; memoMap = {};
    localStorage.removeItem(LS_STATUS);
    localStorage.removeItem(LS_MISTAKES);
    localStorage.removeItem(LS_LOG);
    localStorage.removeItem(LS_STAR);
    localStorage.removeItem(LS_NOTES);
    localStorage.removeItem(LS_MEMOS);
    triggerCloudSave();
    render();
  }
}

// 起動
render();
initFirebase();
</script>
