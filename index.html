<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPA一問一答">
<meta name="theme-color" content="#ffffff">
<title>CPA 短答一問一答</title>
<style>
:root{
  --bg:#f8f9fa; --surface:#ffffff; --line:#e5e7eb; --line-dark:#d1d5db;
  --text:#111827; --sub:#4b5563; --muted:#9ca3af;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-weak:#eff6ff;
  --red:#dc2626; --red-weak:#fef2f2; --red-border:#fecaca;
  --amber:#d97706; --amber-weak:#fffbeb; --amber-border:#fde68a;
  --green:#16a34a; --green-weak:#f0fdf4; --green-border:#bbf7d0;
  --marker:#fef08a; /* 蛍光ペンの黄色 */
  --gray:#e5e7eb;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
svg{display:block}

/* Header */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.appbar-in{max-width:960px;margin:0 auto;height:52px;display:flex;align-items:center;padding:0 12px;gap:8px}
.appbar h1{font-size:17px;font-weight:700;flex:1;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.iconbtn:active{background:var(--bg)}
.iconbtn svg{width:22px;height:22px;fill:currentColor}

.content{max-width:960px;margin:0 auto;padding:16px 16px calc(90px + var(--safe-b))}
.section-label{font-size:13px;font-weight:700;color:var(--sub);margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}

/* Summary Banner */
.stats-banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat-box{border-right:1px solid var(--line)}
.stat-box:last-child{border-right:none}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:600}
.stat-val{font-size:22px;font-weight:800;color:var(--text);margin-top:2px;letter-spacing:-0.02em}
.stat-val small{font-size:12px;font-weight:600;margin-left:2px;color:var(--sub)}

/* Subject Grid */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr);gap:14px}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-height:148px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:active{background:#f9fafb}
@media(hover:hover){.tile:hover{border-color:var(--line-dark);box-shadow:0 2px 8px rgba(0,0,0,0.04)}}
.tile-head{display:flex;justify-content:space-between;align-items:flex-start}
.tile-title{font-size:18px;font-weight:800;letter-spacing:-0.01em;color:var(--text)}
.badge-mistake{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:2px}
.tile-foot{margin-top:auto;padding-top:14px}
.tile-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);margin-bottom:6px}
.tile-row b{font-weight:700;color:var(--text)}
.tile-empty{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted)}

/* Progress Bars */
.bar{width:100%;background:var(--gray);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:10px;color:var(--sub)}
.legend b{color:var(--text);margin-left:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;flex-shrink:0}
.d-comp{background:var(--green)} .d-vague{background:var(--amber)} .d-mis{background:var(--red)} .d-un{background:var(--muted)}

/* Quick Actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;transition:all .15s}
.qbtn b{font-size:24px;font-weight:800;line-height:1}
.qbtn.red{border-color:var(--red-border);background:var(--red-weak);color:var(--red)}
.qbtn.amber{border-color:var(--amber-border);background:var(--amber-weak);color:var(--amber)}
.qbtn:disabled{opacity:.4;cursor:default}
.qbtn:active:not(:disabled){filter:brightness(.96)}

/* List Groups & Accordions */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:active:not(:disabled){background:var(--bg)}
.row-main{flex:1;min-width:0}
.row-title{font-size:14.5px;font-weight:700;margin-bottom:4px}
.row-sub{font-size:12px;color:var(--sub)}
.row svg{width:20px;height:20px;fill:var(--muted);flex-shrink:0}
.row.all .row-title{color:var(--primary)}

/* Collapsible Sub-sections */
.sec-group{border-bottom:1px solid var(--line)}
.sec-group:last-child{border-bottom:none}
.sec-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fafbfc;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--text);border-bottom:1px solid transparent}
.sec-header.open{border-bottom-color:var(--line);background:#f3f4f6}
.sec-header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.sec-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sec-play-btn{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--primary);background:var(--primary-weak);border:1px solid rgba(37,99,235,0.25);border-radius:6px;padding:4px 8px;}
.sec-play-btn:active{background:#dbeafe;}
.sec-badge{font-size:11px;font-weight:600;color:var(--sub);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.sec-arrow{width:18px;height:18px;fill:var(--muted);transition:transform .15s}
.sec-header.open .sec-arrow{transform:rotate(180deg)}
.sec-items{display:none}
.sec-items.open{display:block}

.qitem{display:flex;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;background:var(--surface)}
.qitem:last-child{border-bottom:none}
.qitem:active{background:var(--bg)}
.qitem .dot{margin-top:6px}
.qi-main{flex:1;min-width:0}
.qi-meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.badge-mis-count{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;}
.badge-has-memo{background:#eff6ff;color:var(--primary);border:1px solid #bfdbfe;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;}
.qi-text{font-size:14px;line-height:1.6;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.star{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;color:var(--muted)}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.star.on{color:#f59e0b}
.star.on svg{fill:#f59e0b}

/* Primary Button */
.primary-btn{width:100%;background:var(--primary);color:#fff;border-radius:10px;padding:14px;font-size:15px;font-weight:700;text-align:center;transition:background .15s}
.primary-btn:hover{background:var(--primary-hover)}
.primary-btn:disabled{background:var(--line-dark);cursor:default}
.ghost-btn{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-weight:700;text-align:center;color:var(--sub);background:var(--surface)}

/* Bottom Tabbar (3タブ) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;height:56px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:currentColor}
.tab.active{color:var(--primary)}

/* Filter Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:60;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:16px 16px 0 0;max-height:90vh;overflow-y:auto;padding:12px 18px calc(18px + var(--safe-b));max-width:560px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
@media(min-width:720px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px;padding-bottom:20px}}
.grabber{width:36px;height:4px;border-radius:999px;background:var(--line-dark);margin:0 auto 12px}
@media(min-width:720px){.grabber{display:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px;font-weight:800}
.sheet-head button{font-size:13px;color:var(--primary);font-weight:700}
.opt{padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:none}
.opt-label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--sub);background:var(--surface);display:flex;align-items:center;gap:6px}
.fchip small{font-size:11px;color:var(--muted)}
.fchip.on{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px;border-radius:6px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.06)}

/* Quiz Mode */
#overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#overlay.show{display:block}
.qz-bar{position:sticky;top:0;background:var(--surface);z-index:5;padding-top:var(--safe-t);border-bottom:1px solid var(--line)}
.qz-bar-in{max-width:800px;margin:0 auto;height:52px;display:flex;align-items:center;padding:0 8px}
.qz-title{flex:1;font-size:15px;font-weight:700;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-progress{height:3px;background:var(--gray)}
.qz-progress i{display:block;height:100%;background:var(--primary);transition:width .2s}
.qz-body{max-width:800px;margin:0 auto;padding:16px 16px 120px}
.qz-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.qz-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.qz-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rank-badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.qz-question{font-size:16.5px;line-height:1.8;font-weight:500;color:var(--text);margin-bottom:20px}
.choices{display:grid;gap:10px}
@media(min-width:640px){.choices{grid-template-columns:1fr 1fr 1fr}}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;transition:all .12s}
.choice:active:not(:disabled){background:var(--bg)}
.choice.correct{border-color:var(--green);background:var(--green-weak);color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-weak);color:var(--red)}

.judge{margin-top:16px;padding:14px;border-radius:10px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.judge.ok{background:var(--green-weak);color:var(--green);border:1px solid var(--green-border)}
.judge.ng{background:var(--red-weak);color:var(--red);border:1px solid var(--red-border)}
.exp{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.exp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.exp-title{font-size:13px;font-weight:800;color:var(--sub)}
.btn-marker-action{background:var(--primary-weak);color:var(--primary);border:1px solid rgba(37,99,235,0.2);padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px;}
.btn-marker-action:active{background:#dbeafe;}
.exp-text{font-size:14.5px;line-height:1.85;color:#374151;user-select:text;-webkit-user-select:text;}
.hl-mark{background-color:var(--marker);padding:1px 2px;border-radius:3px;font-weight:600;color:#000;}

.rate-box{margin-top:20px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.rate-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:10px;text-align:center}
.rate-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{border-radius:8px;padding:12px 6px;text-align:center;font-size:14px;font-weight:700;border:1px solid transparent}
.rb.red{background:var(--red-weak);border-color:var(--red-border);color:var(--red)}
.rb.amber{background:var(--amber-weak);border-color:var(--amber-border);color:var(--amber)}
.rb.green{background:var(--green-weak);border-color:var(--green-border);color:var(--green)}

/* 要点ノート用スタイル */
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;}
.note-card:active{background:#fafbfc;}
.note-meta{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.note-text{font-size:14px;line-height:1.7;color:var(--text);border-left:3px solid #eab308;padding-left:10px;background:#fefce8;padding:8px 10px;border-radius:0 8px 8px 0;font-weight:600;}
.btn-del-note{color:var(--muted);padding:4px;}
.btn-del-note:hover{color:var(--red);}

/* AIボタン & 問題別メモ用スタイル */
.exp-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.btn-ai-action{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:4px;transition:all .15s;}
.btn-ai-action:active{background:#e5e7eb;}
.memo-section{margin-top:14px;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;}
.memo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.memo-title{font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:4px;}
.memo-textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;line-height:1.6;color:var(--text);background:var(--surface);resize:vertical;min-height:64px;box-sizing:border-box;font-family:inherit;}
.memo-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-weak);}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:var(--sub);border:1px solid var(--line);}
.sync-badge.online{background:var(--green-weak);color:var(--green);border-color:var(--green-border);}
.sync-badge.syncing{background:var(--primary-weak);color:var(--primary);border-color:rgba(37,99,235,0.3);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* iPad / iOS Safari 最適化テキスト選択 & フローティングマーカー */
.exp-text, .qz-question{
  user-select:text;-webkit-user-select:text;
  -webkit-touch-callout:default;
}
.exp-text{
  font-size:15px;line-height:1.9;color:#374151;
}
.note-target-badge{
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
}
.note-target-badge.q{background:#e0e7ff;color:#3730a3;}
.note-target-badge.exp{background:#fef3c7;color:#92400e;}
.floating-marker-bubble{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:none;align-items:center;gap:8px;z-index:99;cursor:pointer;
  animation:pop .2s ease-out;
}
.floating-marker-bubble:active{transform:translateX(-50%) scale(0.96);}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 非同期トースト通知（OKを押さなくていい控えめな通知） */
.toast-notify{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(17,24,39,0.92);color:#fff;padding:8px 16px;border-radius:999px;
  font-size:12.5px;font-weight:700;display:none;align-items:center;gap:6px;
  z-index:100;backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,0.2);
  pointer-events:none;animation:toastIn .2s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
<!-- Firebase SDK (無料版・端末間自動同期用) -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="screen"></div>
<nav class="tabbar">
  <div class="tabbar-in">
    <button class="tab" data-tab="home" onclick="tabTo('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>ホーム</span></button>
    <button class="tab" data-tab="notes" onclick="tabTo('notes')"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span>要点ノート</span></button>
    <button class="tab" data-tab="record" onclick="tabTo('record')"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg><span>学習記録</span></button>
  </div>
</nav>
<div id="sheet"></div>
<div id="overlay"></div>

<!-- iPad / スマホ用 フローティングマーカー保存ポップアップ -->
<div id="floatingMarkerBtn" class="floating-marker-bubble" onclick="addHighlightFromCurrentSelection()">
  <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  <span>選択範囲をマーカー保存</span>
</div>

<!-- 自動消滅する控えめトースト通知 -->
<div id="toastNotification" class="toast-notify">
  <span id="toastText">マーカーを登録しました</span>
</div>

<script>

  {id:"K-01-01-007",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:7,rank:"A",src:"平29Ⅱ問題５ア・平23Ⅰ問題５イ類",

   exp:"２条５号。公開会社とは、その発行する全部または一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社をいう。すなわち、その発行する一部の株式の内容として譲渡による当該株式の取得について株式会社の承認を要する旨の定款の定めを設けていない株式会社も公開会社であるため、譲渡制限株式でない種類の株式と譲渡制限株式をともに発行する種類株式発行会社は、公開会社である。例えば、定款で２種類の株式（Ａ種類株式・Ｂ種類株式）を定めている種類株式発行会社において、Ａ種類株式については譲渡制限があるが、Ｂ種類株式については譲渡制限がない場合、当該株式会社は公開会社となる。"},
  {id:"K-01-01-008",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:8,rank:"A",src:"平25Ⅰ問題２ウ",

  {id:"K-01-01-009",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:9,rank:"A",src:"平31Ⅱ問題８イ",

  {id:"K-01-01-010",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:10,rank:"A",src:"平25Ⅰ問題２イ類",

  {id:"K-01-01-012",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:12,rank:"C",src:"",

  {id:"K-01-01-013",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:13,rank:"C",src:"",

  {id:"K-01-01-014",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:14,rank:"C",src:"",
   q:"判例によると、定款所定の目的の範囲内の行為とは、定款に記載された目的自体だけでなく、目的遂行に直接的または間接的に必要な行為も包含され、目的遂行のために必要な行為か否かは、当該行為の客観的性質に即して、抽象的に判断されなければならないとされる。",ans:"正しい",
   exp:"最判昭45年６月24日。取引の安全の観点から、定款所定の目的を広く解釈し、定款に記載された目的自体だけでなく、目的遂行に直接的または間接的に必要な行為も包含され、目的遂行のために必要な行為か否かは、当該行為の客観的性質に即して、抽象的に判断される。結果として、目的外行為と判断される取引行為はほとんどなく、実質的には定款所定の目的による制限はないと考えられる。"},
  {id:"K-01-01-015",subject:"企業法",chapter:"第1章 会社法総論",sub:"会社法総論",num:15,rank:"C",src:"",
   q:"判例によると、会社による政治資金の寄付は、客観的、抽象的に観察して会社の社会的役割を果たすためになされたものと認められるものであっても、会社の定款所定の目的の範囲内の行為であるとは認められない。",ans:"誤り",
   exp:"最判昭45年６月24日。行為の客観的性質に即して判断すると、定款所定の目的たる行為の遂行に間接的ながら必要ないし有益な行為と考えられるため、会社の定款所定の目的の範囲内の行為であると認められる。"},
  {id:"K-02-01-001",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:1,rank:"A",src:"令２Ⅰ問題７ア・平27Ⅰ問題６ア",
   q:"株式会社は、２人以上の取締役を置かなければならない。",ans:"誤り",
   exp:"326条１項。すべての株式会社は株主総会および取締役を置かなければならない（295条、326条１項）ため、株式会社には、１人または２人以上の取締役を置かなければならない。なお、取締役会設置会社においては、取締役は、３人以上でなければならない（331条５項）。"},
  {id:"K-02-01-002",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:2,rank:"A",src:"",
   q:"会社法の規定により取締役会を設置しなければならない株式会社は、定款において取締役会を置く旨を定める必要はない。",ans:"誤り",
   exp:"326条２項。株式会社において必ず設置が義務づけられている株主総会および取締役以外の機関を置く場合には、定款にその旨を定める必要がある。株式会社の機関設計は、株主総会を含む各機関の権限に大きな影響を与えるため（295条、362条等）、株主にとって重要な関心事となる。そのため、会社法では、機関設計の選択に株主の意思が反映されるように定款にその旨を定めることを要求しているのである。"},
  {id:"K-02-01-003",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:3,rank:"A",src:"",
   q:"大会社は、取締役会を置かなければならない。",ans:"誤り",
   exp:"327条１項各号参照。327条１項各号に掲げられている株式会社（公開会社、監査役会設置会社、監査等委員会設置会社および指名委員会等設置会社）に該当しなければ、取締役会の設置義務は課せられない。したがって、大会社であっても、監査役会設置会社、監査等委員会設置会社または指名委員会等設置会社以外の非公開会社は、取締役会の設置義務は課されていない。"},
  {id:"K-02-01-004",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:4,rank:"A",src:"",
   q:"（令７Ⅰ問題８ウ・平30Ⅱ問題９エ・平27Ⅰ問題６イ・平25Ⅰ問題８ア類・平20 問題７イ）監査役会設置会社は、取締役会を置かなければならない。",ans:"正しい",
   exp:"327条１項２号。業務執行について取締役会を置かないという簡易な機関設計を採用したにも関わらず、監査について監査役会という複雑な仕組みを置く需要は想定しにくいためである。"},
  {id:"K-02-01-005",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:5,rank:"A",src:"平31Ⅱ問題８ア・平25Ⅱ問題７ウ類・平25Ⅰ問題８エ",
   q:"指名委員会等設置会社および監査等委員会設置会社は、常に、取締役会設置会社である。",ans:"正しい",
   exp:"327条１項３号４号。指名委員会等設置会社の委員の選定および解職の権限は取締役会にあるなど、各委員会に関する会社法の規定は取締役会の存在を前提としているからである（400条２項、401条１項等）。また、監査等委員会設置会社は、取締役会の業務執行者に対する監督機能の強化を目的とする機関設計の株式会社制度であるためである。"},
  {id:"K-02-01-006",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:6,rank:"A",src:"平31Ⅱ問題８エ・平25Ⅰ問題８イ",
   q:"会計参与設置会社は、常に、取締役会設置会社である。",ans:"誤り",
   exp:"327条１項各号に掲げられている株式会社（公開会社、監査役会設置会社、監査等委員会設置会社および指名委員会等設置会社）に該当しなければ、取締役会の設置義務は課せられないため、本肢は誤りである。なお、会計参与は、いずれの機関設計においても任意に設置可能な機関である。"},
  {id:"K-02-01-007",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:7,rank:"A",src:"令７Ⅰ問題８イ類・平25Ⅱ問題７ア類・平22Ⅱ問題８イ・平21 問題８ア類",
   q:"取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、必ず監査役を置かなければならない。",ans:"誤り",
   exp:"327条２項ただし書。取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役を置かなければならない（327条２項本文）。取締役会設置会社においては、株主総会の権限が制限され（295条２項、362条２項２号参照）、株主の代わりに取締役を監督する仕組みが必要となるが、取締役会では、取締役同士の密接な結び付きにより監督機能を十分に果たすことができないからである。ただし、非公開会社である会計参与設置会社においては、取締役会設置会社であっても監査役を置かなくてよい。非公開会社の場合、株主が頻繁に変動することは想定しにくく、株主による監督をある程度期待することができ、公認会計士や税理士といった資格を有する会計参与が取締役と共同して作成した計算書類等について、重ねて監査役の監査を要求する必要は少ないからである。ただし、大会社は、会計監査人の設置義務を負い（328条）、会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役の設置義務を負う（327条３項）ことになるため、注意してほしい。"},
  {id:"K-02-01-008",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:8,rank:"A",src:"平30Ⅱ問題９ア・平22Ⅰ問題８イ",
   q:"公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役を置かないことができる。",ans:"誤り",
   exp:"327条１項１号、２項。非公開会社である会計参与設置会社においては、取締役会設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）であっても監査役を置かなくてよいが（327条２項ただし書）、公開会社である場合はこの例外規定が適用されないことから、公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役を置かなければならない。"},
  {id:"K-02-01-009",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:9,rank:"A",src:"平30Ⅱ問題９イ類",
   q:"会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役会を置かなければならない。",ans:"誤り",
   exp:"327条３項。会計監査人設置会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役を置かなければならない。なぜなら、会計監査人と監査役は会計監査業務の面で密接に関係するためである（398条参照）。また、業務執行機関からの会計監査人の独立性を確保するためには、監査役が必要不可欠だからである（344条、399条等）。しかし、監査役会の設置までは求められていないため、本肢は誤りである。"},
  {id:"K-02-01-010",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:10,rank:"A",src:"平25Ⅰ問題８ウ",
   q:"会計監査人設置会社は、常に、取締役会設置会社である。",ans:"誤り",
   exp:"327条１項各号に掲げられている株式会社（公開会社、監査役会設置会社、監査等委員会設置会社および指名委員会等設置会社）に該当しなければ、取締役会の設置義務は課せられないため、本肢は誤りである。"},
  {id:"K-02-01-011",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:11,rank:"A",src:"",
   q:"（令２Ⅰ問題７ウ・平30Ⅰ問題８ア・平29Ⅰ問題８ウ類・平28Ⅰ問題７イ・平21 問題８イ類）監査等委員会設置会社および指名委員会等設置会社は、定款の定めによっても、監査役を置くことができない。",ans:"正しい",
   exp:"327条４項。監査等委員会設置会社は監査等委員会に、指名委員会等設置会社は監査委員会に取締役等の職務執行の監査権限を付与しており（399条の２第３項１号、404条２項１号）、監査役が存在すると監査権限が重複してしまうからである。"},
  {id:"K-02-01-012",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:12,rank:"A",src:"平22Ⅱ問題８ウ類・平21 問題８ウ類",
   q:"公開会社は、会計監査人を置かなければならない。",ans:"誤り",
   exp:"会計監査人の設置が義務づけられているのは、監査等委員会設置会社、指名委員会等設置会社または大会社である（327条５項、328条）。したがって、本肢は誤りである。"},
  {id:"K-02-01-013",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:13,rank:"A",src:"",
   q:"（令７Ⅰ問題8 ウ・平31Ⅱ問題８ウ・平31Ⅰ問題８ア・平30Ⅱ問題９ウ類・平28Ⅰ問題７ア類・平20 問題14 ア）監査等委員会設置会社および指名委員会等設置会社は、常に、会計監査人設置会社である。",ans:"正しい",
   exp:"327条５項。指名委員会等は、内部統制システムを利用して会社の業務執行に対する監督等を行うものであるところ、会計監査人が置かれないと、企業の財務報告の信頼性を確保する仕組みの構築が難しく、監督等を十分に行うことができないと考えられるからである。なお、監査等委員会についても同様である。"},
  {id:"K-02-01-014",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:14,rank:"A",src:"令６Ⅱ問題８ア類・令２Ⅱ問題８イ・平27Ⅰ問題６エ類・平25Ⅱ問題７イ類",
   q:"会計参与を置く大会社（公開会社、監査役会設置会社、監査等委員会設置会社および指名委員会等設置会社を除く）は、会計監査人を置かないことができる。",ans:"誤り",
   exp:"328条。大会社は会計監査人を置かなければならない。大会社は規模が大きいことから、多数の株主や債権者等の利害関係者の存在が想定されるため、当該利害関係人の保護を図る趣旨で、会社の計算書類等の適正性の確保が必要となるのである。会計参与を任意で設置した場合でも、大会社は会計監査人の設置義務を免れることができないことから、本肢は誤りである。"},
  {id:"K-02-01-015",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:15,rank:"A",src:"",
   q:"（令８Ⅰ問題８ウ類・令３問題10 ア類・平27Ⅰ問題６ウ・平22Ⅰ問題８エ類・平20 問題７ウ）大会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役会を置かなければならない。",ans:"誤り",
   exp:"328条１項。公開大会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、監査役会を置かなければならない。公開大会社は、多数の株主や債権者等の利害関係者が存在すること、および、株主が頻繁に変動することが想定されるため、監査役会の設置を義務づけることで、監査体制の強化を図っているのである。"},
  {id:"K-02-01-016",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:16,rank:"A",src:"平29Ⅰ問題８ア・平22Ⅰ問題８ア",
   q:"公開会社でない株式会社は、指名委員会等を置いて指名委員会等設置会社となることができない。",ans:"誤り",
   exp:"326条２項。公開会社であるか否か、大会社であるか否かに関係なく、指名委員会等（指名委員会、監査委員会および報酬委員会）を設置して、指名委員会等設置会社となることができる。なお、同様に、株式会社は、公開会社であるか否か、大会社であるか否かに関係なく、監査等委員会を設置して、監査等委員会設置会社となることができる。"},
  {id:"K-02-01-017",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:17,rank:"A",src:"平29Ⅰ問題８エ",
   q:"指名委員会等設置会社は、監査等委員会を置いてはならない。",ans:"正しい",
   exp:"327条６項。監査等委員会は、指名委員会等と機能が重複するからである。"},
  {id:"K-02-01-018",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:18,rank:"A",src:"令２Ⅰ問題７イ",
   q:"会計監査人設置会社は、定款の定めによって会計参与を置くことができる。",ans:"正しい",
   exp:"326条２項。会計参与は、いずれの機関設計においても任意に設置可能である。"},
  {id:"K-02-01-019",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:19,rank:"A",src:"平30Ⅰ問題８イ類・平25Ⅱ問題７エ類・平20 問題７エ",
   q:"監査等委員会設置会社および指名委員会等設置会社は、会計参与を置いてはならない。",ans:"誤り",
   exp:"326条２項。会計参与は、いずれの機関設計においても任意に設置可能である。"},
  {id:"K-02-01-020",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:20,rank:"A",src:"平29Ⅰ問題８イ",
   q:"公開会社でない大会社は、会計参与を置いてはならない。",ans:"誤り",
   exp:"326条２項。会計参与は、いずれの機関設計においても任意に設置可能である。"},
  {id:"K-02-01-021",subject:"企業法",chapter:"第2章 機関",sub:"1. 機関設計",num:21,rank:"A",src:"平30Ⅰ問題８エ",
   q:"公開会社でない監査役設置会社は、定款の定めによっても、会計参与を置くことができない。",ans:"誤り",
   exp:"326条２項。会計参与は、いずれの機関設計においても任意に設置可能である。"},
  {id:"K-02-02-001",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (1) 株主総会の権限",num:1,rank:"A",src:"令４Ⅱ問題７ア類・平31Ⅰ問題10 ア類",
   q:"取締役会設置会社以外の株式会社の株主総会は、会社法に規定する事項および定款で定めた事項に限り、決議することができる。",ans:"誤り",
   exp:"295条１項。取締役会非設置会社の株主総会は、会社法に規定する事項および株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議することができる（295条１項）。すなわち、取締役会非設置会社においては、株主総会を万能の意思決定機関としているのである。"},
  {id:"K-02-02-002",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (1) 株主総会の権限",num:2,rank:"A",src:"令８Ⅰ問題８ア・平28Ⅱ問題９ア類・平27Ⅰ問題７ア・平23Ⅱ問題８ア",
   q:"取締役会設置会社においては、株主総会は、会社法に規定する事項および株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議することができる。",ans:"誤り",
   exp:"295条２項。取締役会設置会社では、株主総会は、会社法に規定する事項および定款で定めた事項に限り、決議をすることができる。すなわち基本的重要事項を決定する権限を有する。これは、取締役会による会社経営の適切かつ適時性のある意思決定を確保するためである。"},
  {id:"K-02-02-003",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (1) 株主総会の権限",num:3,rank:"A",src:"平27Ⅰ問題７イ",
   q:"会社法の規定により株主総会の決議を必要とする事項について、取締役、執行役、取締役会その他の株主総会以外の機関が決定することができることを内容とする定款の定めは、その効力を有しない。",ans:"正しい",
   exp:"295条３項。会社法で定められた株主総会の決議事項は、定款をもってしても、他の機関にその決定を委ねることができない。これらは、株主の利益に重大な影響があるために株主総会の権限とされたものだからである。"},
  {id:"K-02-02-004",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (1) 株主総会の権限",num:4,rank:"B",src:"令７Ⅱ問題10 ア・令４Ⅰ問題９ア類・平31Ⅰ問題９ア",
   q:"最高裁判所の判例によれば、公開会社でない取締役会設置会社において、取締役会の決議によるほか、株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは無効である。",ans:"誤り",
   exp:"最決平29年２月21日。公開会社でない取締役会設置会社において、取締役会の決議によるほか、株主総会の決議によっても代表取締役を定めることができる旨の定款の定めは有効である。取締役会設置会社の株主総会は、会社法が規定する事項および定款が定める事項、すなわち、基本的重要事項に限り決議することができる（295条２項）。ここで、会社法において定款で定める事項の内容を制限する明文の規定はない。会社法は取締役会をもって代表取締役の職務執行を監督する機関と位置付けていると解されるが、取締役会設置会社である非公開会社において、取締役会の決議によるほか株主総会の決議によっても代表取締役を定めることができることとしても、代表取締役の選定および解職に関する取締役会の権限（362条２項３号）が否定されるものではなく、取締役会の監督権限の実効性を失わせるとはいえない。"},
  {id:"K-02-02-005",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:1,rank:"A",src:"令３問題７ウ類・平28Ⅱ問題９ウ類",
   q:"公開会社においては、総株主の議決権の100 分の１以上の議決権、または、発行済株式（自己株式を除く）の100 分の１以上の数の株式を６か月前から引き続き有する株主に限り、取締役に対して、一定の事項（当該株主が議決権を行使することができる事項に限る）を株主総会の目的とすることを請求することができる。",ans:"誤り",
   exp:"303条２項前段。取締役会設置会社においては、総株主の議決権の100 分の１（定款で緩和可）以上の議決権、または、300個（定款で緩和可）以上の議決権を有する株主に限り、取締役に対して、一定の事項を株主総会の目的とすることを請求することができる。さらに、公開会社においては、６か月の保有期間要件が求められる。議題提案権は議決権に関する共益権であるため、議決権基準のみ設けられており、株式数基準は設けられていない。ここで、議決権割合の要件と個数要件が併存している趣旨は、大規模会社においては個数基準を満たす方が容易であり、より広い層の株主が株主提案権を行使することができるようにすることにある。"},
  {id:"K-02-02-006",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:2,rank:"A",src:"",
   q:"取締役会設置会社において、株主が取締役に対して一定の事項（当該株主が議決権を行使することができる事項に限る）を株主総会の目的とすることを請求する場合、その請求は、株主総会の日の８週間前まで（定款に別段の定めはないものとする）にしなければならない。",ans:"正しい",
   exp:"303条２項後段。取締役会設置会社において株主が議題提案権を行使するには、株主総会の日の８週間前までに請求する必要がある。当該要件が定められている理由としては、公開会社では株主総会の日の２週間前（非公開会社では１週間前）までに招集通知を発しなければならないため、株主の提案した議題を当該招集通知に記載する準備の機会を会社に与えるためである。"},
  {id:"K-02-02-007",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:3,rank:"A",src:"平31Ⅰ問題10 ウ類・平24Ⅰ問題８エ",
   q:"取締役会設置会社以外の株式会社において、１個以上の議決権を有する株主は、取締役に対し、当該株主が議決権を行使することができる事項を株主総会の目的とすることを請求することができる。",ans:"正しい",
   exp:"303条１項。取締役会非設置会社における議題提案権は、単独株主権である。また、８週間前に請求しなければならないという要件もない。"},
  {id:"K-02-02-008",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:4,rank:"A",src:"令２Ⅱ問題９イ類・平27Ⅱ問題６ウ類",
   q:"公開会社においては、総株主の議決権の100 分の１以上の議決権、または、300個以上の議決権を６か月前から引き続き有する株主に限り、株主総会の目的である事項（当該株主が議決権を行使することができる事項）につき議案を提出することができる。",ans:"誤り",
   exp:"304条本文。議案提案権は、取締役会を設置しているか否かを問わず、すべての株式会社において単独株主権とされている。株主総会の会場で、ある議題について議案を提出することは、会議の一般原則から可能であり、その意味で304条本文は確認的な規定である。"},
  {id:"K-02-02-009",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:5,rank:"A",src:"平27Ⅱ問題６エ類",
   q:"株主は、株主総会において、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき議案を提出することができるが、当該議案が実質的に同一の議案につき株主総会において総株主（当該議案について議決権を行使することができない株主を除く）の議決権の10 分の１以上（定款に別段の定めはないものとする）の賛成を得られなかった日から３年を経過していない場合は、当該議案の提案は認められない。",ans:"正しい",
   exp:"304条ただし書。株主総会の円滑な運営の観点から、その議案が法令もしくは定款に違反する場合または実質的に同一の議案につき株主総会において総株主（その議案について議決権を行使することができない株主を除く）の議決権の10 分の１以上の賛成を得られなかった日から３年を経過していない場合には、議案提案権を行使することができない。"},
  {id:"K-02-02-010",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:6,rank:"B",src:"平30Ⅰ問題９ウ",
   q:"株主は、株主総会において、当該株主総会の目的である事項について自らが議決権を行使することができない場合には、当該事項について議案を提出することができない。",ans:"正しい",
   exp:"304条本文かっこ書。"},
  {id:"K-02-02-011",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:7,rank:"A",src:"平28Ⅱ問題９エ類",
   q:"取締役会設置会社以外の株式会社において、株主は、取締役に対し、株主総会の日の２週間前まで（定款に別段の定めはないものとする）に、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき当該株主が提出しようとする議案の要領を株主に通知することを請求することができる。",ans:"誤り",
   exp:"305条１項本文。議案通知請求権は事前に議案の要領を株主に通知することを請求するものであるという性質から、取締役会を設置しているか否かを問わず、すべての株式会社において、株主総会の日から８週間（定款で短縮可）前までに請求することが要求されている。なお、当該議案通知請求権を行使することができる株主の要件は、議題提案権（303条）と同様である（305条１項２項）。また、通知請求することができない議案の内容は、議案提案権（304条ただし書）と同様である（305条４項）。"},
  {id:"K-02-02-012",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:8,rank:"B",src:"平27Ⅱ問題６イ",
   q:"一定の事項を株主総会の会議の目的とすることを株式会社に適法に請求した株主が当該株主総会に出席しなかった場合には、当該株主総会において、当該事項を会議の目的とすることができない。",ans:"誤り",
   exp:"このような規定はない。"},
  {id:"K-02-02-013",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:9,rank:"B",src:"",
   q:"取締役会設置会社以外の株式会社において、株主が、取締役に対し、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）につき当該株主が提出しようとする議案の要領を株主に通知することを請求する場合において、当該株式会社は、10 を超える数に相当することとなる数の議案については当該株主の請求を拒むことができる。",ans:"誤り",
   exp:"305条４項前段。取締役会設置会社の株主が、議案通知請求権を行使する場合において、当該株主が提出しようとする議案の数が10 を超えるときは、会社は10 を超える数に相当することとなる数の議案については、当該株主の請求を拒むことができる。この場合において、当該株主が提出しようとする以下の議案の数については、当該議案の数にかかわらず、これを１個の議案とみなす（305条４項）。(ⅰ) 役員等の選任に関する議案、(ⅱ) 役員等の解任に関する議案、(ⅲ) 会計監査人を再任しないことに関する議案、(ⅳ) 定款の変更に関する２以上の議案（当該２以上の議案について異なる議決がされたとすれば当該議決の内容が相互に矛盾する可能性がある場合に限る）"},
  {id:"K-02-02-014",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:10,rank:"B",src:"令５Ⅰ問題９ア",
   q:"取締役会設置会社において、株主が、10 を超える数の議案について、その要領を株主総会の招集通知に記載するように請求した場合には、取締役は、当該株主の意向にかかわらず、10 を超える数に相当することとなる数の議案を定め、その記載を拒むことができる。",ans:"誤り",
   exp:"305条５項。取締役会設置会社の株主が、議案通知請求権を行使する場合において、当該株主が提出しようとする議案の数が10 を超えるときは、会社は10 を超える数に相当することとなる数の議案については、当該株主の請求を拒むことができる（305条４項柱書前段）。なお、10 を超える数に相当することとなる数の議案（請求を拒む議案）については、原則として取締役が定めるが、当該請求をした株主が、あらかじめ提出しようとする２以上の議案の全部または一部につき議案相互間の優先順位を定めている場合には、取締役は、当該優先順位に従い、これを定める。"},
  {id:"K-02-02-015",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:11,rank:"B",src:"令５Ⅰ問題９イ",
   q:"取締役会設置会社において、10 を超える数に相当する議案であることを理由に、その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合において、指名委員会等を設置する旨の定款の定めを廃止する議案および監査等委員会を設置する旨の定款の定めを設ける議案は、１個の議案とみなされる。",ans:"正しい",
   exp:"305条４項４号。取締役会設置会社における議案通知請求権において、10 を超える数に相当する議案であることを理由に、その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合、定款の変更に関する２以上の議案について、異なる議決がされたとすれば当該議決の内容が相互に矛盾する可能性がある場合には、それらの議案はまとめて１個の議案とみなされる。ここで、「指名委員会等を設置する旨の定款の定めを廃止する議案」と「監査等委員会を設置する旨の定款の定めを設ける議案」が提案された場合、前者の議案が否決、後者の議案が可決されると相互に矛盾が生じてしまう。指名委員会等設置会社は、監査等委員会を置いてはならないためである（327条６項）。したがって、これらの議案は、１個の議案とみなされる。"},
  {id:"K-02-02-016",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:12,rank:"B",src:"令５Ⅰ問題９ウ",
   q:"取締役会設置会社において、10 を超える数に相当する議案であることを理由に、その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合において、２人の会計監査人を再任しないことに関する議案は、２個の議案とみなされる。",ans:"誤り",
   exp:"305条４項３号。取締役会設置会社における議案通知請求権において、10 を超える数に相当する議案であることを理由に、その要領を株主総会の招集通知に記載することを取締役が拒むことができるかを判断する場合、会計監査人を再任しないことに関する議案が複数提案される場合は、まとめて１個の議案とみなされる。"},
  {id:"K-02-02-017",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (2) 株主提案権",num:13,rank:"B",src:"令５Ⅰ問題９エ",
   q:"株主が提出しようとする議案と実質的に同一の議案が株主総会において総株主の議決権の10 分の１以上（定款に別段の定めはないものとする）の賛成を得られなかった日から３年を経過していない場合には、取締役は、その要領を株主総会の招集通知に記載することの請求を拒むことができる。",ans:"正しい",
   exp:"305条６項。"},
  {id:"K-02-02-018",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:1,rank:"A",src:"",
   q:"株式会社は、毎事業年度の終了後一定の時期に株主総会を招集しなければならない。",ans:"正しい",
   exp:"296条１項。定時株主総会についての記述である。なお、株主総会は、必要がある場合には、いつでも、招集することができる（臨時株主総会）（296条２項）。"},
  {id:"K-02-02-019",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:2,rank:"B",src:"平27Ⅰ問題７エ",
   q:"公開会社が定時株主総会の招集の通知を書面でする場合において、当該定時株主総会の日が前事業年度に係る定時株主総会の日に応当する日と著しく離れた日であるときは、その日時を決定した理由を当該書面に記載しなければならない。",ans:"正しい",
   exp:"298条１項５号、会社法施行規則63条１号イ。また、株式会社が公開会社である場合において、定時株主総会の日と同一日において定時株主総会を開催する他の公開会社が著しく多い場合には、当該日に開催する理由が特にある場合に限って、その日時を決定した理由を定めなければならない（会社法施行規則63条１号ロ）。"},
  {id:"K-02-02-020",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:3,rank:"C",src:"",
   q:"株主総会の場所は、本店の所在地またはこれに隣接する地としなければならない。",ans:"誤り",
   exp:"298条１項１号。株主総会の場所に制限は設けられていない。ただし、株主総会の場所が過去に開催した株主総会のいずれの場所とも著しく離れた場所であるときは、当該場所が定款で定められている場合、または、当該場所で開催することについて株主総会に出席しない株主全員の同意がある場合を除いて、当該場所に決定した理由を定めなければならない（会社法施行規則63条２号）。"},
  {id:"K-02-02-021",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:4,rank:"A",src:"令８Ⅰ問題８エ・平26Ⅰ問題７ア",
   q:"取締役会設置会社においては、株主が株主総会を招集するときを除き、株主総会の招集事項の決定は、取締役会の決議によらなければならない。",ans:"正しい",
   exp:"298条４項。取締役会設置会社においては、株主が株主総会を招集するときを除き、株主総会の招集事項の決定は、取締役会の決議によらなければならない。なお、一定の要件を満たす監査等委員会設置会社、または、指名委員会等設置会社においても、当該決定は取締役または執行役に委任することができないものとされている（399条の13 第５項４号、416条４項４号）。"},
  {id:"K-02-02-022",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:5,rank:"A",src:"",
   q:"株主総会は、必ず、取締役によって招集される。",ans:"誤り",
   exp:"296条３項。株主総会は、原則として取締役が招集するが、一定の要件を満たせば、株主による招集（297条４項）も認められている。"},
  {id:"K-02-02-023",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:6,rank:"A",src:"平29Ⅰ問題７ア類",
   q:"公開会社において、総株主の議決権の100 分の３以上の議決権を６か月前から引き続き有する株主は、裁判所の許可を得ずに、株主総会を招集することができる。",ans:"誤り",
   exp:"297条１項４項。公開会社において、総株主の議決権の100 分の３以上の議決権を６か月前から引き続き有する株主は、取締役に対して、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）および招集の理由を示して、株主総会の招集を請求することができる。当該請求をした株主は、一定の場合、裁判所の許可を得て、株主総会を招集することができる。なお、非公開会社においては、６か月の保有期間要件は不要である（297条２項）。"},
  {id:"K-02-02-024",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:7,rank:"A",src:"令６Ⅰ問題９ア類・令４Ⅱ問題７イ",
   q:"取締役会設置会社以外の株式会社において、総株主の議決権の100 分の３以上の議決権を有する株主は、取締役に対し、株主総会の目的である事項および招集の理由を示して、株主総会の招集を請求することができる。",ans:"正しい",
   exp:"297条１項２項。総株主の議決権の100 分の３以上の議決権を６か月前から継続して保有する株主は、取締役に対して、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る）および招集の理由を示して、株主総会の招集を請求することができる。なお、非公開会社では、６か月の保有期間要件は不要であり、取締役会非設置会社は非公開会社に該当するため（327条１項１号参照）、本肢は正しい。"},
  {id:"K-02-02-025",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (3) 株主総会の招集",num:8,rank:"A",src:"平29Ⅱ問題９ウ・平24Ⅱ問題８ア類",
   q:"取締役に株主総会の招集を請求した株主は、当該請求の後遅滞なく招集の手続が行われない場合、または、当該請求があった日から８週間以内の日（定款に別段の定めはないものとする）を株主総会の日とする株主総会の招集の通知が発せられない場合は、裁判所の許可を得て、株主総会を招集することができる。",ans:"正しい",
   exp:"297条４項。① 株主総会の招集請求の後、遅滞なく招集の手続が行われない場合、または、② 株主総会の招集請求があった日から８週間（定款で短縮可）以内の日を株主総会の日とする株主総会の招集の通知が発せられない場合には、株主総会の招集請求をした株主は、裁判所の許可を得て、株主総会を招集することができる。この場合においては、当該株主が招集事項の決定や招集の通知を行うこととなる（298条１項柱書かっこ書）。"},
  {id:"K-02-02-026",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:1,rank:"A",src:"",
   q:"取締役会設置会社における取締役が株主総会を招集するには、取締役は、株主総会の日の２週間前までに、株主に対してその通知を発しなければならない。",ans:"誤り",
   exp:"299条１項。取締役会設置会社であっても、公開会社か否かによって、招集通知の期限は異なる。招集通知の期限は、公開会社である取締役会設置会社では株主総会の日の２週間前、非公開会社である取締役会設置会社では株主総会の日の１週間前とされている。なお、非公開会社であっても、書面投票または電子投票による議決権行使を認める場合は、株主総会の日の２週間前までに招集通知を発しなければならない（299条１項かっこ書）。"},
  {id:"K-02-02-027",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:2,rank:"A",src:"平27Ⅰ問題７ウ",
   q:"公開会社でない株式会社が、株主総会の招集通知を当該株主総会の日の1 週間前までに発するものとするには、その旨を定款で定めなければならない。",ans:"誤り",
   exp:"299条１項かっこ書。非公開会社が株主総会を招集するには、取締役（株主による招集の場合には当該株主）は、株主総会の日の１週間前までに、株主に対して招集通知を発しなければならない。非公開会社の株主は少数かつ頻繁に変動せず、株主間の関係が緊密であることが想定されるため、公開会社の場合と比べて株主の準備期間を短縮しても問題ないと考えられたからである。よって、定款で定めなくても招集通知の期限は株主総会の日の１週間までである。"},
  {id:"K-02-02-028",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:3,rank:"A",src:"平29Ⅱ問題９ア類・平24Ⅰ問題８ア類・平21 問題９エ類",
   q:"取締役会設置会社以外の株式会社においては、書面投票制度または電子投票制度を採用した場合を除いて、株主総会の招集通知の期限を、定款によって株主総会の日の前日とすることができる。",ans:"正しい",
   exp:"299条１項かっこ書。取締役会設置会社以外の株式会社においては、書面投票制度または電子投票制度を採用した場合を除いて、招集通知の期限として１週間を下回る期間を定款で定めることができる。"},
  {id:"K-02-02-029",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:4,rank:"A",src:"令６Ⅰ問題９ウ",
   q:"電子投票制度を採用した株主総会を取締役が招集するには、取締役は、株主総会の日の２週間前までに、株主に対してその通知を発しなければならない。",ans:"正しい",
   exp:"299条１項。株主総会に出席しない株主に株主総会参考書類等だけの情報によって議決権行使をさせる場合においては、十分な考慮期間を設けることが望ましいと考えられるからである。なお、書面投票制度を採用した株式会社も同様である。"},
  {id:"K-02-02-030",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:5,rank:"A",src:"令７Ⅰ問題９イ・令４Ⅱ問題５エ類・平29Ⅱ問題９イ",
   q:"株主総会の招集通知は、その株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主に対しても、これを送付しなければならない。",ans:"誤り",
   exp:"298条２項かっこ書、299条１項。株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主は、招集通知の対象とはならない。"},
  {id:"K-02-02-031",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:6,rank:"A",src:"令３問題８ウ類",
   q:"株式会社が書面投票制度を採用する場合、株主総会の招集通知は、書面または株主の許可を得て電磁的方法でしなければならない。",ans:"正しい",
   exp:"299条２項１号３項。書面投票による議決権行使を認める旨を定めた場合は、株主総会参考書類および議決権行使書面の交付等（301条、302条）を行うことになるため、招集通知を書面または電磁的方法で行うこととしても追加的な費用は少ないと考えられるからである。また、電子投票による議決権行使を認める旨を定めた場合も同様である。"},
  {id:"K-02-02-032",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:7,rank:"A",src:"平30Ⅰ問題９ア類・平28Ⅱ問題９イ類・平24Ⅰ問題８イ類",
   q:"取締役会設置会社が書面投票制度と電子投票制度のいずれも採用しない場合は、株主総会の招集通知の方法に制限はなく、口頭や電話によって通知することも認められる。",ans:"誤り",
   exp:"299条２項３項。株式会社が書面投票制度と電子投票制度のいずれも採用しない場合であっても、株式会社が取締役会設置会社である場合は、株主総会の招集通知は、書面または株主の許可を得て電磁的方法によってしなければならない。株式会社が取締役会設置会社である場合には、株主総会に関する基本的な情報については書面または電磁的方法で受領することが株主の利益の保護を図るために重要であると考えられたためである。"},
  {id:"K-02-02-033",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:8,rank:"A",src:"平31Ⅰ問題10 イ",
   q:"取締役会設置会社以外の株式会社において、株主総会に出席しない株主が書面または電磁的方法によって議決権を行使することができる旨を定めていないときは、当該株主総会の招集の通知を書面または電磁的方法以外の方法ですることができる。",ans:"正しい",
   exp:"299条２項３項。① 書面投票・電子投票による議決権行使を認めることを定めた場合、および、② 株式会社が取締役会設置会社である場合は、株主に対する招集の通知は、書面または電磁的方法でしなければならないが、①・②に該当しない場合には、口頭や電話等の通知方法でもよい。"},
  {id:"K-02-02-034",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:9,rank:"A",src:"",
   q:"株主総会の招集通知を書面または株主の許可を得て電磁的方法でしなければならない場合は、株主総会の招集事項を当該招集通知に記載し、または記録しなければならない。",ans:"正しい",
   exp:"299条４項。"},
  {id:"K-02-02-035",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:10,rank:"A",src:"平27Ⅱ問題６ア",
   q:"公開会社（指名委員会等設置会社を除く）における株主が一定の事項を株主総会の会議の目的とすることを株式会社に適法に請求した場合には、当該株式会社の代表取締役は、当該事項を会議の目的として、当該株主総会の招集通知に記載し、または記録しなければならない。",ans:"正しい",
   exp:"299条４項。公開会社は、取締役会を置かなければならず（327条１項１号）、取締役会設置会社においては、株主総会の招集通知は、書面または電磁的方法でしなければならない（299条２項３項前段）。ここで、招集通知を書面または電磁的方法でしなければならない株式会社は、招集通知に株主総会の招集事項（298条１項各号）を記載または記録しなければならない（299条４項）。なお、株主総会の招集権者は条文上「取締役」とされているが（296条３項）、取締役会設置会社の場合には、代表取締役（指名委員会等設置会社では代表執行役）であると解するのが多数説である。そのため、実際の本試験では問題文の通り主語が「代表取締役」とされていたが、監査審査会の公表による解答では「正しい」とされた。"},
  {id:"K-02-02-036",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:11,rank:"A",src:"平26Ⅱ問題10 エ",
   q:"会計参与設置会社である取締役会設置会社においては、取締役は、定時株主総会の招集の通知に際して、株主に対し、会計参与報告を提供しなければならない。",ans:"誤り",
   exp:"437条。取締役会設置会社においては、取締役は、定時株主総会の招集の通知に際して、法務省令で定めるところにより、株主に対し、取締役会の承認を受けた計算書類および事業報告（監査役等または会計監査人の監査を受けなければならない場合は、監査報告または会計監査報告を含む）を提供しなければならない。しかし、会計参与報告は、監査報告および会計監査報告と異なり、取締役会設置会社においても定時株主総会の招集の通知に添付されない。"},
  {id:"K-02-02-037",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:12,rank:"B",src:"平31Ⅰ問題９イ",
   q:"最高裁判所の判例によれば、ある株主に対する招集通知の欠如は、全ての株主に対する関係において取締役の職務上の義務違反を構成する。",ans:"正しい",
   exp:"最判平９年９月９日。"},
  {id:"K-02-02-038",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:13,rank:"A",src:"令６Ⅰ問題９エ類・令２Ⅱ問題９ア類・平24Ⅱ問題８イ",
   q:"株主総会に出席しない株主が書面によって議決権を行使することができる旨を定めた場合には、株式会社は、株主（株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主を除く）の全員の同意があれば、当該株主総会の招集の手続を省略することができる。",ans:"誤り",
   exp:"300条ただし書。株主総会の招集手続についての規律は、株主に株主総会への出席の機会と十分な準備期間を与えることを目的としているので、議決権を行使することができる株主の全員が同意しているのならば、招集手続の省略を認めても問題はない。ただし、書面投票制度または電子投票制度を採用している場合は、招集手続を省略することはできない。なぜなら、株主総会参考書類および議決権行使書面の交付等（301条、302条）が必要となるためである。"},
  {id:"K-02-02-039",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (4) 株主総会の招集通知",num:14,rank:"B",src:"令６Ⅱ問題10 イ・令４Ⅰ問題９エ類・平30Ⅰ問題９イ",
   q:"最高裁判所の判例によれば、招集権者による招集の手続を欠く場合で、株主全員が出席して決議をしたときは、株主の一部がその開催に同意していない場合であっても、当該決議は有効に成立する。",ans:"誤り",
   exp:"最判昭60年12月20日。最高裁判所の判例によれば、招集権者による株主総会の招集の手続を欠く場合であっても、株主全員がその開催に同意して出席した株主総会においてなされた決議は有効に成立するとされる（全員出席総会）。"},
  {id:"K-02-02-040",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (5) 議決権",num:1,rank:"A",src:"平22Ⅱ問題４エ",
   q:"公開会社では、１株につき２個の議決権を与える旨を定款で定めることができる。",ans:"誤り",
   exp:"308条１項本文。各株主は、原則として１株につき１個の議決権を有する。これを１株１議決権の原則という。株式会社では、株主平等原則に基づき、株主の負担する経済的リスク、すなわち出資額に応じた株主総会決議への影響力を保障するために、１株１議決権の原則が採用されている。なお、株主総会における議決権は重要な意義を有するため、１株１議決権の原則は強行法規とされており、定款によって１株につき２個の議決権を与える旨を定めることはできない。"},
  {id:"K-02-02-041",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (5) 議決権",num:2,rank:"A",src:"平28Ⅱ問題10 ウ類・平22Ⅰ問題９ア類",
   q:"株式会社は、自己株式については、議決権を有しない。",ans:"正しい",
   exp:"308条２項。株式会社が自己株式について議決権を有するとなると、会社支配の公正の観点から望ましくないためである。なお、種類株主総会においても同様である（325条）。"},
  {id:"K-02-02-042",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (5) 議決権",num:3,rank:"A",src:"令８Ⅰ問題９ア類・令４Ⅰ問題８エ類・平28Ⅱ問題10 ア類",
   q:"種類株式発行会社であるＡ社は、Ｂ社の総株主の議決権の４分の１以上を有しており、Ｂ社は、Ａ社の株主でもある。この場合、Ｂ社は、Ａ社の株主総会において議決権を有しないが、種類株主総会においては議決権を有する。",ans:"誤り",
   exp:"308条１項、325条。株式の相互保有には、資本の空洞化や議決権行使の歪曲化のおそれがあるため、これを防ぐ趣旨から、相互保有株式については、株主総会および種類株主総会において議決権を有しない。"},
  {id:"K-02-02-043",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (5) 議決権",num:4,rank:"B",src:"令８Ⅰ問題９エ類・令２Ⅰ問題８エ",
   q:"退任取締役に対し退職慰労金を支給する旨の株主総会の決議について、当該退任取締役が株主である場合、当該株主は議決権を行使することができる。",ans:"正しい",
   exp:"会社法は、株主総会の決議について特別利害関係を有する株主であっても、原則として議決権の行使を許容している（例外は自己株式の売主である（140条３項、160条４項、175条２項））。株主は株式会社の実質的所有者であるため、自己の利益を確保するために議決権を行使することが認められているのである。特別利害関係を有する株主とは、株主としての資格と関係のない個人的な利害関係を有する株主のことをいう。例えば、株式会社の取締役でもあり株主でもあるＡの取締役としての報酬等を定める決議について、Ａは特別利害関係を有する株主に該当する。報酬等が不当に高額であれば、株式会社ひいてはＡ以外の株主にとって不利益となるが、Ａにとっては有利になるからである。しかし、このような特別利害関係を有する株主が議決権を行使したことにより著しく不当な決議が行われた場合については、決議取消事由となる（831条１項３号）。"},
  {id:"K-02-02-044",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:1,rank:"A",src:"平23Ⅰ問題８ウ類",
   q:"株主総会において、株主は、定款に議決権の代理行使を認める旨の定めがある場合に限って、代理人によりその議決権を行使することができる。",ans:"誤り",
   exp:"310条１項前段。株式会社においては、株主が広い範囲にわたって散在していると想定されるため、株主が自ら株主総会に出席して議決権を行使することが困難な場合がある。そこで、株主の議決権行使を容易にし、その行使の機会を保障する必要があるため、議決権の代理行使が認められている。したがって、定款の定めがなくても、当然に議決権の代理行使が認められる。"},
  {id:"K-02-02-045",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:2,rank:"A",src:"平28Ⅱ問題10 エ・平22Ⅰ問題10 イ類",
   q:"株式会社は、定款の定めにより、株主総会において、株主が代理人によってその議決権を行使することを禁ずることができる。",ans:"誤り",
   exp:"株主に議決権の行使の機会を保障する必要があるため、定款により議決権の代理行使を禁止することは認められない。"},
  {id:"K-02-02-046",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:3,rank:"A",src:"令４Ⅱ問題８ア類・平29Ⅰ問題９ア類",
   q:"株主総会における議決権の代理権の授与は、代理権を授与してから１年間に限ってその効力を有する。",ans:"誤り",
   exp:"310条２項。代理権の授与は、株主総会ごとにしなければならない。代理権の授与を株主総会ごとにしなければならないのは、株式会社の取締役等が長期間にわたり代理権の授与を受けることによって、会社支配の手段として濫用することを防止するためである。"},
  {id:"K-02-02-047",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:4,rank:"B",src:"平29Ⅰ問題９エ",
   q:"株主が代理人によってその議決権を行使する場合においては、当該株主または代理人は、株式会社に対し、代理権を証明する書面を提出し、または、当該株式会社の承諾を得て当該書面に記載すべき事項を電磁的方法により提供しなければならない。",ans:"正しい",
   exp:"310条１項３項。"},
  {id:"K-02-02-048",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:5,rank:"B",src:"平24Ⅱ問題８ウ",
   q:"議決権行使の代理権を証明する書面が株式会社に提出されたときは、当該株式会社は、株主総会の日から３か月間、当該書面を本店に備え置かなければならない。",ans:"正しい",
   exp:"310条６項。"},
  {id:"K-02-02-049",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:6,rank:"A",src:"令４Ⅰ問題８イ類・平29Ⅰ問題９イ類・平23Ⅱ問題８ウ",
   q:"株式会社は、株主総会に出席することができる代理人の数を制限することができる。",ans:"正しい",
   exp:"310条５項。１人の株主が多数の代理人を株主総会に出席させることで、株主総会の運営が混乱させられるのを防止するためである。"},
  {id:"K-02-02-050",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:7,rank:"B",src:"令４Ⅰ問題９ウ・平29Ⅰ問題９ウ類",
   q:"最高裁判所の判例によれば、議決権を行使する代理人の資格を株主に制限する旨の定款の規定は、株主総会が、株主以外の第三者によって攪乱されることを防止し、会社の利益を保護する趣旨に出たものと認められ、合理的な理由による相当程度の制限ということができるから、有効である。",ans:"正しい",
   exp:"最判昭43年11月１日。判例によると、議決権の代理行使の規定の趣旨は、代理人資格を制限すべき合理的理由がある場合に、定款規定によって相当程度の制限を加えることまで禁止するものではないとしている。したがって、代理人資格を株主に限定する定款の定めは有効である。"},
  {id:"K-02-02-051",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:8,rank:"C",src:"令４Ⅱ問題８エ類",
   q:"最高裁判所の判例によれば、株式会社が代理人資格を株主に限定する旨を定款に定めた場合において、当該株式会社の法人株主が株主ではない使用人に議決権を代理行使させることは当該定款に違反するとしている。",ans:"誤り",
   exp:"最判昭51年12月24日。判例によると、法人株主（例えば、Ａ会社がＢ会社の株式を所有している場合）が株主ではない当該法人の使用人を代理人とした場合は、代理人資格を株主に限定する定款規定が適用されない。なぜなら、法人の使用人は組織の一員として議決権を行使するため、議決権の代理行使を認めても株主総会のかく乱を防止するという定款規定の趣旨に反しないためである。また、実質的な視点からしても、これを認めないと法人株主の議決権行使が困難となってしまうからである。"},
  {id:"K-02-02-052",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:9,rank:"A",src:"令３問題８イ類・平22Ⅰ問題10 ア",
   q:"株主（株主総会の目的である事項の全部につき議決権を行使することができない株主を除く）の数が1,000人未満の取締役会設置会社は、株主総会に出席しない株主に対して、書面によって議決権を行使する機会を与える必要はない。",ans:"正しい",
   exp:"298条２項。書面投票制度を採用するか否かは、原則として、株式会社が任意に決定することができるが、株主（株主総会において決議することができる事項（取締役会設置会社においては株主総会の目的である事項）の全部につき議決権を行使することができない株主を除く）の数が1,000人以上である株式会社は、書面投票制度の採用が強制される（298条２項本文、３項）。このように株主の数が多い株式会社は、株主の分散度が高く、自ら株主総会に出席できない株主が多いことを考慮したものである。ただし、当該株式会社が金融商品取引法２条16項に規定する金融商品取引所に上場されている株式を発行している株式会社であって法務省令（会社法施行規則64条）で定めるものである場合には、書面投票制度の採用は強制されない。これは、上場会社に対して認められてきた従来の規制を維持したものである。すなわち、上場会社であって、金融商品取引法の委任状勧誘規則に従い議決権を行使することができる株主の全部に対して委任状勧誘をした場合は、株主数が1,000人以上であっても、書面投票制度の採用が強制されないのである。"},
  {id:"K-02-02-053",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:10,rank:"A",src:"",
   q:"取締役会設置会社において、株主による株主総会の招集に際して、当該株主総会に出席しない株主が書面によって議決権を行使することができる旨を定める場合は、取締役会の決議によらなければならない。",ans:"誤り",
   exp:"298条１項３号、４項。株主総会の招集に際して、取締役（取締役会設置会社では取締役会、株主による招集の場合には当該株主）は、書面投票制度を採用するか否かを任意に決定することができる。"},
  {id:"K-02-02-054",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:11,rank:"C",src:"平31Ⅱ問題９エ類",
   q:"取締役は、書面投票制度を採用する場合は、株主総会の招集通知に際し、株主に対して株主総会参考書類および議決権行使書面を、必ず書面によって交付しなければならない。",ans:"誤り",
   exp:"301条。電磁的方法により株主総会の招集通知を発することについて承諾した株主（299条３項）に対して電磁的方法による招集通知を発するときは、株主総会参考書類および議決権行使書面の交付に代えて、これらの書類に記載すべき事項を電磁的方法により提供することができる（301条２項本文）。ただし、電磁的方法により株主総会の招集通知を発することについて承諾した株主であっても、株主総会参考書類および議決権行使書面については書類の交付を希望する場合があり得るため、当該株主から請求があったときは、これらの書類を当該株主に交付しなければならない（同条２項ただし書）。"},
  {id:"K-02-02-055",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:12,rank:"C",src:"平31Ⅱ問題９ウ",
   q:"各議案についての賛否を記載する欄に記載がない議決権行使書面が株式会社に提出された場合は、当該株式会社は、当該議案について棄権したものと取り扱わなければならず、これと異なる取扱いを定めることはできない。",ans:"誤り",
   exp:"会社法施行規則63条３号ニ、66条１項２号。各議案についての賛否を記載する欄に記載がない議決権行使書面が株式会社に提出された場合、当該株式会社は、当該議案について賛成、反対または棄権のいずれかの意思の表示があったものとする取扱いの内容を定めることができるため、本肢は誤りである。"},
  {id:"K-02-02-056",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:13,rank:"B",src:"",
   q:"書面によって行使した議決権の数は、株主総会に出席した株主の議決権の数に算入してはならない。",ans:"誤り",
   exp:"311条２項。書面投票により行使した議決権の数は、出席した株主の議決権の数に算入する。すなわち、株主総会の定足数の計算に組み入れられることになる。"},
  {id:"K-02-02-057",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:14,rank:"B",src:"平31Ⅱ問題９ア",
   q:"株式会社は、株主総会の日から３か月間、当該株式会社に提出された議決権行使書面をその本店に備え置かなければならない。",ans:"正しい",
   exp:"311条３項。"},
  {id:"K-02-02-058",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:15,rank:"C",src:"平23Ⅰ問題８イ",
   q:"株主総会決議事項のすべてについて議決権のない株式の種類株主は、株主総会の議決権行使書面の閲覧または謄写の請求をすることができる。",ans:"誤り",
   exp:"311条４項、310条７項。株主総会決議事項のすべてについて議決権のない株式の種類株主は、議決権行使書面の閲覧・謄写の請求をすることができない。株主（株主総会決議事項のすべてについて議決権のない株式の種類株主を除く）は、株式会社の営業時間内は、いつでも、議決権行使書面の閲覧または謄写を請求することができる。"},
  {id:"K-02-02-059",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:16,rank:"B",src:"令５Ⅱ問題８エ類・平31Ⅱ問題９イ",
   q:"債権者は、株式会社の営業時間内は、いつでも、株主総会における議決権行使書面の閲覧または謄写の請求をすることができる。",ans:"誤り",
   exp:"311条４項。株主（株主総会決議事項のすべてについて議決権のない株式の種類株主を除く）は、株式会社の営業時間内は、いつでも、議決権行使書面の閲覧または謄写を請求することができる。ここで、債権者には当該閲覧謄写請求権は認められていないため、本肢は誤りである。"},
  {id:"K-02-02-060",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:17,rank:"B",src:"",
   q:"株式会社は、その本店に備え置いた議決権行使書面の閲覧を請求する株主が、閲覧によって知り得た事実を利益を得て第三者に通報するためその閲覧請求を行ったときであっても、当該請求を拒むことができない。",ans:"誤り",
   exp:"311条５項３号。株式会社は、株主から議決権行使書面の閲覧または謄写の請求があったときは、法定の拒否事由（311条５項各号）がある場合を除き、これを拒むことができない（同条５項）。ここで、株主が閲覧によって知り得た事実を利益を得て第三者に通報するためその閲覧請求を行ったときは、当該拒否事由に該当するため、当該株主の請求を拒むことができることになる。以下、議決権行使書面(311条５項・312条６項)および代理権行使書面(310条８項) の閲覧・謄写に係る拒否事由である。① 請求者がその権利の確保または行使に関する調査以外の目的で請求を行ったとき ② 請求者が当該株式会社の業務の遂行を妨げ、または株主の共同の利益を害する目的で請求を行ったとき ③ 請求者が閲覧または謄写によって知り得た事実を利益を得て第三者に通報するため請求を行ったとき ④ 請求者が、過去２年以内において、閲覧または謄写によって知り得た事実を利益を得て第三者に通報したことがあるものであるとき"},
  {id:"K-02-02-061",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:18,rank:"B",src:"令６Ⅱ問題９イ",
   q:"取締役会設置会社において、取締役は、株主（株主総会の目的である事項の全部につき議決権を行使することができない株主を除く）の数が1,000人以上である場合には、株主総会に出席しない株主が電磁的方法によって議決権を行使することができる旨を定めなければならない。",ans:"誤り",
   exp:"298条１項４号２項。電子投票制度は、いかなる場合であっても、その採用が強制されることはない。採用が強制される場合があるのは、書面投票制度である。"},
  {id:"K-02-02-062",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:19,rank:"C",src:"",
   q:"取締役は、電子投票に関する事項を定めた場合は、株主総会参考書類に記載すべき事項を電磁的方法により提供しなければならない。",ans:"誤り",
   exp:"302条１項。取締役は、電子投票制度を採用する場合は、株主総会の招集の通知に際して、法務省令で定めることにより、株主に対し、株主総会参考書類を交付しなければならない（302条１項）。したがって、原則は、書面による交付である。もっとも、電磁的方法により株主総会の招集通知を発することについて承諾した株主（299条３項）に対して電磁的方法による招集通知を発するときは、株主総会参考書類の交付に代えて、当該株主総会参考書類に記載すべき事項を電磁的方法により提供することができる（302条２項本文）。ただし、電磁的方法により株主総会の招集通知を発することについて承諾した株主であっても、株主総会参考書類については書類の交付を希望する場合があり得るため、当該株主から請求があったときは、株主総会参考書類を当該株主に交付しなければならない（同条２項ただし書）。"},
  {id:"K-02-02-063",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:20,rank:"C",src:"",
   q:"取締役は、電子投票に関する事項を定めた場合は、株主総会の招集通知に際し、すべての株主に対して、議決権行使書面に記載すべき事項を電磁的方法により提供しなければならない。",ans:"誤り",
   exp:"302条３項。取締役は、電子投票制度を採用する場合は、電磁的方法により株主総会の招集通知を発することについて承諾した株主（299条３項）に対する電磁的方法による招集通知に際して、法務省令で定めるところにより、株主に対し、議決権行使書面に記載すべき事項を当該電磁的方法により提供しなければならない（302条３項）。したがって、電磁的方法による招集通知を承諾した株主以外の株主に対しては、原則として、議決権行使書面に記載すべき事項を電磁的方法によって提供する必要はない。ただし、電磁的方法により株主総会の招集通知を発することについて承諾していない株主から、株主総会の日の１週間前までに議決権行使書面に記載すべき事項の電磁的方法による提供の請求があったときは、法務省令で定めるところにより、直ちに、当該株主に対し、当該事項を電磁的方法により提供しなければならない(同条４項)。"},
  {id:"K-02-02-064",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:21,rank:"B",src:"平30Ⅰ問題10 ア・平22Ⅰ問題10 エ",
   q:"取締役が電磁的方法によって株主総会の招集通知を発することについて承諾した株主のみが、電磁的方法による議決権の行使をすることができる。",ans:"誤り",
   exp:"312条１項。電磁的方法による議決権の行使が認められる場合、電磁的方法により株主総会の招集通知を発することについて承諾した株主（299条３項）であるか否かに関係なく、株主は、株式会社の承諾を得たうえで、電磁的方法により議決権を行使することができる。この場合において、株主が電磁的方法により株主総会の招集通知を発することについて承諾した者である場合には、株式会社は、正当な理由がなければ、当該承諾をすることを拒んではならない（312条２項）。"},
  {id:"K-02-02-065",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:22,rank:"B",src:"令３問題８エ",
   q:"株主総会において、電磁的方法による議決権の行使は、政令で定めるところにより、株式会社の承諾を得て、法務省令で定める時までに議決権行使書面に記載すべき事項を、電磁的方法により当該株式会社に提供して行う。",ans:"正しい",
   exp:"312条１項。電子投票は、株式会社の承諾を得て、法務省令（会社法施行規則70条）で定める時までに議決権行使書面に記載すべき事項を、電磁的方法により当該株式会社に提出して行う。この場合において、株主が電磁的方法により株主総会の招集通知を発することについて承諾した者である場合には、株式会社は、正当な理由がなければ、当該承諾をすることを拒んではならない（312条２項）。"},
  {id:"K-02-02-066",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:23,rank:"B",src:"",
   q:"電子投票によって行使した議決権の数は、株主総会に出席した株主の議決権の数に算入してはならない。",ans:"誤り",
   exp:"312条３項。電子投票により行使した議決権の数は、出席した株主の議決権の数に算入する。すなわち、株主総会の定足数の計算に組み入れられることになる。"},
  {id:"K-02-02-067",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:24,rank:"B",src:"",
   q:"株主総会において、株主は、その有する議決権を統一しないで行使することができない。",ans:"誤り",
   exp:"313条１項。株主は、その有する議決権を統一しないで行使することができる。株主名簿上の株主と実質上の株主が異なる場合であって、さらに実質上の株主が複数存在するような場合は、当該実質上の株主の意向を反映させるために、議決権の不統一行使を認める必要があるためである。"},
  {id:"K-02-02-068",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:25,rank:"B",src:"令３問題８ア",
   q:"株主は、電磁的方法により、議決権の不統一行使をすることができない。",ans:"誤り",
   exp:"313条１項参照。株主は、その有する議決権を統一しないで行使することができる。この場合において、行使方法に制限はないことから、電磁的方法によって行使することもできる。"},
  {id:"K-02-02-069",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:26,rank:"B",src:"",
   q:"株式会社は、株主が他人のために株式を有する者でないときは、当該株主がその有する議決権を統一しないで行使することを拒むことができる。",ans:"正しい",
   exp:"313条３項。株主が他人のために株式を有する者でないときは、313条１項の趣旨に合致しないため議決権の不統一行使を認める必要はないし、不必要な不統一行使は、株式会社の事務処理を煩雑なものとするからである。"},
  {id:"K-02-02-070",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (6) 議決権の行使",num:27,rank:"A",src:"令４Ⅱ問題７エ類・令４Ⅰ問題８ウ類・平28Ⅱ問題10 イ・平22Ⅰ問題10 ウ",
   q:"取締役会設置会社以外の会社では、他人のために株式を有する株主は、事前の通知をしなくても議決権の不統一行使ができる。",ans:"正しい",
   exp:"313条２項参照。取締役会設置会社においては、議決権を不統一行使しようとする株主は、株主総会の日の３日前までに、取締役会設置会社に対して、議決権の不統一行使をする旨およびその理由を通知しなければならない。取締役会設置会社については、不統一行使を認めるか否かについて事前に判断する機会を与えるためである。これに対して、取締役会非設置会社については、事前の通知は必要とされていない。"},
  {id:"K-02-02-071",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:1,rank:"A",src:"",
   q:"公開会社は、取締役が株主総会の招集の手続を行うときは、株主総会参考書類等の内容である情報について、電子提供措置をとる旨を定款で定めなければならない。",ans:"誤り",
   exp:"振替法159条の２第１項。振替株式を発行する会社（上場会社）は、電子提供措置をとる旨を定款で定めなければならない。すなわち、上場会社は、電子提供措置の利用が義務付けられている。一方で、上場会社以外の株式会社は、取締役が株主総会（種類株主総会を含む）の招集の手続を行うときは、株主総会参考書類等の内容である情報について、電子提供措置をとる旨を定款で定めることができる（325条の２）と規定されているため、任意で電子提供措置の利用をすることができる。"},
  {id:"K-02-02-072",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:2,rank:"B",src:"",
   q:"株主総会参考書類等の内容である情報について、電子提供措置をとる旨を定款で定める場合は、当該定款には電子データを掲載するウェブサイトのアドレスを定めなければならない。",ans:"誤り",
   exp:"325条の２。電子提供措置をとる旨を定款で定める場合は、当該定款には、電子提供措置をとる旨を定めれば足りる。したがって、電子データを掲載するウェブサイトのアドレス等を定める必要はない。また、当該定款の定めは、登記しなければならない（911条３項12号の２）。"},
  {id:"K-02-02-073",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:3,rank:"A",src:"令５Ⅱ問題９ア類",
   q:"株主総会参考書類等の内容である情報について、電子提供措置をとる旨の定款の定めがある取締役会設置会社の取締役は、株主総会の日の３週間前の日または招集通知を発した日のいずれか早い日から株主総会の日後３か月間を経過する日までの間、株主総会の招集事項等の電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない。",ans:"正しい",
   exp:"325条の３第１項。電子提供措置をとる旨の定款の定めがある株式会社の取締役は、株主総会の招集通知を書面または電磁的方法でしなければならない場合は、株主総会の日の３週間前の日または招集通知を発した日のいずれか早い日（電子提供措置開始日）から株主総会の日から３か月間（電子提供措置期間）、次に掲げる事項（電子提供措置事項）に係る情報について継続して電子提供措置をとらなければならない（325条の３第１項）。"},
  {id:"K-02-02-074",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:4,rank:"A",src:"令５Ⅱ問題９イ類",
   q:"株主総会の開催にあたり、電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない株式会社であっても、株主に対し議決権行使書面を交付するときは、電子提供措置事項に係る情報のすべてについて、電子提供措置をとることを要しない。",ans:"誤り",
   exp:"325条の３第２項。取締役が招集通知に際して株主に対し議決権行使書面を交付するときは、議決権行使書面に記載すべき事項に係る情報については、電子提供措置をとることを要しない（325条の３第２項）。書面と電子提供措置の双方で、同じ情報を提供する必要はないためである。しかし、議決権行使書面に記載すべき事項に係る情報以外については、電子提供措置をとる必要があるため、本肢は誤りである。"},
  {id:"K-02-02-075",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:5,rank:"A",src:"",
   q:"金融商品取引法第24条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならない会社が、定時株主総会に関し、電子提供措置開始日までに、電子提供措置事項（議決権行使書面に記載すべき事項を除く。）を記載した有価証券報告書をEDINET を使用して提出している場合には、当該電子提供措置事項について電子提供措置をとることを要さない。",ans:"正しい",
   exp:"325条の３第３項。この場合は、EDINET を通じてインターネット上において、電子提供措置事項が広く公衆に開示されるため、重ねて電子提供措置をとる必要性が乏しいためである。"},
  {id:"K-02-02-076",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:6,rank:"A",src:"令５Ⅱ問題９ウ類",
   q:"公開会社でない株式会社が、株主総会の開催にあたり、電子提供措置事項に係る情報について継続して電子提供措置をとらなければならない場合は、当該株主総会の日の２週間前までに、株主に対して招集通知を発しなければならない。",ans:"正しい",
   exp:"325条の４第１項。電子提供措置をとらなければいけない場合は、公開会社であるか否かにかかわらず、株主総会の日の２週間前までに、株主に対して招集通知を発しなければならない。"},
  {id:"K-02-02-077",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:7,rank:"A",src:"",
   q:"電子提供措置をとる旨の定款の定めがある取締役会設置会社は、定時株主総会の招集通知に際して、株主に対し、計算書類および事業報告を交付することを要しない。",ans:"正しい",
   exp:"325条の４第３項。そもそも、電子提供制度は、招集通知に際して、株主総会参考書類等（株主総会参考書類・議決権行使書面・計算書類・事業報告・連結計算書類）の交付・提供を要しないものとする制度であるためである。"},
  {id:"K-02-02-078",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:8,rank:"A",src:"令５Ⅱ問題９エ類",
   q:"電子提供措置をとる旨の定款の定めがある株式会社の株主（基準日を定めた場合には、当該基準日までに請求した者に限る）は、総株主の議決権の100 分の1 以上の議決権を保有する場合に限り、株式会社に対し、電子提供措置事項を記載した書面の交付を請求することができる。",ans:"誤り",
   exp:"325条の５第1項。電子提供措置をとる旨の定款の定めがある株式会社の株主（基準日を定めた場合には、当該基準日までに請求した者に限る）は、株式会社に対し、電子提供措置事項を記載した書面の交付を請求することができる（325条の５第１項）。すなわち、株主の書面交付請求権は単独株主権である。取締役は、当該請求をした株主に対しては、株主総会の招集通知とともに、電子提供措置事項を記載した書面を交付しなければならない（同条２項）。"},
  {id:"K-02-02-079",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (7) 株主総会参考資料の電子提供制度",num:9,rank:"B",src:"令６Ⅱ問題９エ類",
   q:"電子提供措置をとる旨の定款の定めがある株式会社の株主が、株式会社に対して行う電子提供措置事項を記載した書面の交付請求は、株主総会ごとにしなければならない。",ans:"誤り",
   exp:"325条の５第４項５項。書面交付請求をした株主がある場合において、その書面交付請求の日（当該株主が異議を述べた場合にあっては、当該異議を述べた日）から１年を経過したときは、株式会社は、当該株主に対し、書面の交付を終了する旨を通知し、かつ、これに異議のある場合には催告期間（１か月を下ることはできない）内に異議を述べるべき旨を催告することができる。そして、株主がした書面交付請求は、催告期間内に異議を述べなかった場合は、催告期間を経過したときにその効力を失う。すなわち、株主により一度された書面交付請求は、その後のすべての株主総会および種類株主総会について効力を有することとなる。しかし、過去に書面交付請求をした株主が、書面の交付を必要としなくなった場合であっても、書面交付請求を撤回しないおそれがあり、そのような株主が累積すると、会社の事務処理の負担が過大になる可能性があるためである。"},
  {id:"K-02-02-080",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:1,rank:"A",src:"令５Ⅰ問題８エ・平30Ⅱ問題10 ア・平26Ⅱ問題７ア",
   q:"株式会社は、株主総会の議長を定款で定めなければならない。",ans:"誤り",
   exp:"株主総会の議長を定款で定めることは求められていない。"},
  {id:"K-02-02-081",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:2,rank:"B",src:"令４Ⅱ問題９ア・平30Ⅰ問題10 ウ・平23Ⅱ問題８エ",
   q:"株主総会の議長は、その命令に従わない者その他当該株主総会の秩序を乱す者を退場させることができる。",ans:"正しい",
   exp:"315条２項。株主総会の議長は、当該株主総会の秩序を維持し、議事を整理する権限を有し（315条１項）、その命令に従わない者その他当該株主総会の秩序を乱す者を退場させることができる（同条２項）。"},
  {id:"K-02-02-082",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:3,rank:"A",src:"令７Ⅱ問題８ア類・令６Ⅱ問題９ア類・令３問題７イ類・平30Ⅰ問題10 イ",
   q:"取締役、会計参与、監査役および執行役は、株主総会において株主から特定の事項について説明を求められた場合に、その事項が株主総会の目的である事項に関しないものであることを理由として、説明を拒否することはできない。",ans:"誤り",
   exp:"314条ただし書。取締役、会計参与、監査役および執行役は、株主総会において、株主から特定の事項について説明が求められた場合には、当該事項について必要な説明をしなければならない（314条本文）。株主総会において、株主が質問権を有することは当然であるが、それを取締役等の説明義務を明文化することにより保障し、もって株主総会の活性化を図ることが当該規定の趣旨である。ただし、① 株主から説明を求められた事項が、株主総会の目的である事項に関しないものである場合、② その説明をすることにより株主の共同の利益を著しく害する場合、③ その他正当な理由がある場合として法務省令（会社法施行規則71条）で定める場合には、取締役等は説明を拒むことができる（314条ただし書）。"},
  {id:"K-02-02-083",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:4,rank:"A",src:"平28Ⅱ問題８ア",
   q:"取締役は、株主総会において株主から説明を求められた場合には、株主が当該株主総会において実質的に同一の事項について繰り返して説明を求めていることを理由に、説明を拒否することはできない。",ans:"誤り",
   exp:"314条ただし書、会社法施行規則71条３号。上記問題３の解説参照。会社法施行規則71条において、以下の事項を正当な理由がある場合と定めている。"},
  {id:"K-02-02-084",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:5,rank:"B",src:"",
   q:"取締役は、株主総会において株主から特定の事項について説明を求められた場合であっても、当該株主が説明を求めた事項について説明をするために調査をすることが必要である場合は、当該株主が当該株主総会の日より相当の期間前に当該事項を株式会社に対して通知していたとしても、当該事項について必要な説明を拒むことができる。",ans:"誤り",
   exp:"314条ただし書、会社法施行規則71条１号。説明を拒むことができる正当な理由がある場合として、会社法施行規則71条１号においては、株主が説明を求めた事項について説明をするために調査をすることが必要である場合が定められているが、このような場合であっても、① 当該株主が株主総会の日より相当の期間前に当該事項を株式会社に対して通知した場合、または、② 当該事項について説明をするために必要な調査が著しく容易である場合は説明を拒むことができない。"},
  {id:"K-02-02-085",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:6,rank:"A",src:"令５Ⅰ問題８イ類・平28Ⅰ問題８ア",
   q:"株主が、株主総会の目的である事項に関し、取締役に対する質問事項を事前に会社に通知した場合で、当該株主総会において当該事項に係る質問が行われないときは、当該事項について取締役に説明義務は生じない。",ans:"正しい",
   exp:"314条本文。取締役、会計参与、監査役および執行役は、株主総会において、株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない。なお、当該説明義務は、株主総会において株主から特定の事項について説明を求められた場合に初めて生じるものであるため、本問は正しい。"},
  {id:"K-02-02-086",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:7,rank:"A",src:"平28Ⅰ問題８イ類・平23Ⅰ問題８ア・平21 問題14 ウ・平20 問題10 ア",
   q:"株式会社は、株主総会に係る招集の手続および決議の方法を調査させるため、当該株主総会に先立ち、裁判所に対し、検査役の選任の申立てをすることができる。",ans:"正しい",
   exp:"306条１項。株主総会の手続が適法になされたという証拠を保全することで、事後的な紛争に備えることができるようにするという観点から、総会検査役の選任請求権は、株式会社にも認められている。"},
  {id:"K-02-02-087",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:8,rank:"A",src:"令５Ⅰ問題８ア類",
   q:"公開会社において、６か月前から継続して株式を有するすべての株主は、裁判所に対して総会検査役の選任の申立てをすることができる。",ans:"誤り",
   exp:"306条１項２項。総会検査役の選任請求権は少数株主権である。総株主の議決権の100 分の１（定款で緩和可）以上の議決権を６か月（定款で短縮可）前から継続して保有する株主は、裁判所に対し、総会検査役の選任の申立てをすることができる。なお、非公開会社である場合は、６か月の保有期間要件は不要である。"},
  {id:"K-02-02-088",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:9,rank:"C",src:"平20 問題10 イ",
   q:"株主総会の決議事項の全部につき議決権を行使することができない株主は、裁判所に対して、総会検査役の選任の申立てをすることができない。",ans:"正しい",
   exp:"306条１項２項。総会検査役の選任の申立てをすることができる少数株主の要件にある「総株主」から、取締役会設置会社の場合は、株主総会の目的である事項の全部につき議決権を行使することができない株主が除かれ、取締役会非設置会社の場合は、株主総会において決議をすることができる事項の全部につき議決権を行使することができない株主が除かれる。"},
  {id:"K-02-02-089",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:10,rank:"C",src:"令２Ⅰ問題８イ",
   q:"法定の要件を満たす株主の申立てに基づき、株主総会に係る招集の手続および決議の方法を調査させるための検査役が裁判所により選任された場合に、当該検査役は、必要な調査を行い、当該調査の結果を記載した書面を当該株主に提供して、報告をしなければならない。",ans:"誤り",
   exp:"306条５項。総会検査役は、必要な調査を行い、当該調査の結果を記載し、または記録した書面または電磁的記録を裁判所に提供して報告をしなければならない。"},
  {id:"K-02-02-090",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:11,rank:"C",src:"平20 問題10 ウ類",
   q:"裁判所は、総会検査役の報告があった場合において、必要があると認められるときは、取締役に対して、一定の期間内に株主総会を招集すること、および、総会検査役の調査の結果を株主に通知することの双方を命じなければならない。",ans:"誤り",
   exp:"307条１項。裁判所は、総会検査役の報告があった場合において、必要があると認められるときは、取締役に対して、一定の期間内に株主総会を招集すること、総会検査役の調査の結果を株主に通知することの全部または一部を命じなければならない。また、裁判所が一定の期間内に株主総会を招集することを命じた場合には、取締役は、総会検査役の報告の内容を当該株主総会において開示しなければならない（307条２項）。そして、取締役（監査役設置会社にあっては取締役および監査役）は、総会検査役の報告内容を調査し、その結果を当該株主総会に報告しなければならない（307条３項）。"},
  {id:"K-02-02-091",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:12,rank:"A",src:"令７Ⅱ問題８エ・平23Ⅰ問題８エ・平20 問題10 エ類",
   q:"株主総会においては、その決議によって、取締役、会計参与、監査役、監査役会および会計監査人が当該株主総会に提出し、または提供した資料を調査する者を選任することができる。",ans:"正しい",
   exp:"316条１項。"},
  {id:"K-02-02-092",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:13,rank:"A",src:"令４Ⅱ問題９イ・令２Ⅱ問題９ウ類・平28Ⅱ問題８イ",
   q:"裁判所の許可を得て株主により招集された株主総会においては、その決議によって、株式会社の業務および財産の状況を調査する者を選任することができる。",ans:"正しい",
   exp:"316条２項。少数株主の請求（297条）により招集された株主総会においては、その決議によって、株式会社の業務および財産の状況を調査する者を選任することができる（316条２項）。なお、少数株主の請求により招集された株主総会には、少数株主の請求により取締役が招集した株主総会（297条１項）と、少数株主が裁判所の許可を得て自ら招集した株主総会（297条４項）との両者が含まれる。"},
  {id:"K-02-02-093",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:14,rank:"B",src:"",
   q:"株主総会の議事については、議事録を作成し、取締役は当該議事録に署名しなければならない。",ans:"誤り",
   exp:"株主総会の議事録には、取締役の署名義務は課されていない。"},
  {id:"K-02-02-094",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:15,rank:"A",src:"平28Ⅱ問題８ウ",
   q:"株式会社は、株主総会の日から10年間、当該株主総会の議事録をその本店に備え置かなければならない。",ans:"正しい",
   exp:"318条２項。株式会社は、株主総会の日から10年間、議事録をその本店に備え置かなければならない。また、株式会社は、株主総会の日から５年間、当該株主総会の議事録の写しをその支店に備え置かなければならない（318条３項本文）。ただし、当該議事録が電磁的記録をもって作成されている場合であって、支店における株主等の閲覧謄写請求に応じることを可能にするための措置として法務省令で定めるものをとっているときは、当該備置義務は免除される（318条３項ただし書）。"},
  {id:"K-02-02-095",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:16,rank:"A",src:"令７Ⅱ問題９エ類",
   q:"債権者は、株主総会の議事録の閲覧を請求することができない。",ans:"誤り",
   exp:"318条４項。株主および債権者は、株式会社の営業時間内は、いつでも、株主総会の議事録の閲覧謄写請求をすることができる。また、株式会社の親会社社員も、その権利を行使するため必要があるときは、裁判所の許可を得て、当該議事録の閲覧謄写請求をすることができる（318条５項）。"},
  {id:"K-02-02-096",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:17,rank:"A",src:"令４Ⅱ問題９エ類・平31Ⅱ問題10 イ",
   q:"株式会社の親会社社員は、株式会社の営業時間内はいつでも、株主総会の議事録の閲覧または謄写の請求をすることができる。",ans:"誤り",
   exp:"318条５項。株式会社の親会社社員は、その権利を行使するため必要があるときは、裁判所の許可を得て、当該議事録の閲覧謄写請求をすることができる。"},
  {id:"K-02-02-097",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:18,rank:"A",src:"平28Ⅱ問題８エ類・平26Ⅱ問題７イ",
   q:"株式会社の子会社の株主は、その権利を行使するため必要があるときは、裁判所の許可を得て、当該株式会社の株主総会の議事録の閲覧または謄写の請求をすることができる。",ans:"誤り",
   exp:"318条５項参照。株式会社の子会社の株主には、当該株式会社の株主総会の議事録の閲覧謄写請求権は与えられていない。これに対して、株式会社の親会社社員は、その権利を行使するために必要があるときは、裁判所の許可を得て、当該議事録の閲覧または謄写を請求することができる（318条５項）。"},
  {id:"K-02-02-098",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (8) 株主総会の議事運営",num:19,rank:"A",src:"令４Ⅱ問題９ウ類・平29Ⅱ問題９エ・平26Ⅰ問題７エ・平21 問題９イ",
   q:"株主総会の延期または続行について決議があった場合には、取締役は、延期または続行される株主総会について、株主に対してその招集の通知を発しなければならない。",ans:"誤り",
   exp:"317条。延期とは、株主総会の議事に入らずに、株主総会の日を後日に変更することをいう。続行とは、株主総会の議事に入ったものの議事が終わらずに、後日に再開し継続することをいう。株主総会においては、その延期または続行について決議することができる。当該決議があった場合は、株主総会の招集の決定（298条）および株主総会の招集通知（299条）の規定は適用されない。"},
  {id:"K-02-02-099",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:1,rank:"A",src:"令６Ⅱ問題７ウ類",
   q:"株式会社は、何人に対しても、株主の権利の行使に関し、当該株式会社またはその子会社の計算において財産上の利益の供与をしてはならない。",ans:"正しい",
   exp:"120条１項。利益供与の禁止の趣旨は、会社財産の浪費を防止することにある。また、株式会社が金品等を総会屋に供与するのを禁止することで、総会屋を排除し、会社運営の健全化を図ることができるのである。利益供与の相手方は、株主に対するものに限定されず、株主以外の者に対する利益供与も禁止の対象となる。また、子会社の計算においてするものも禁止の対象としているのは、親会社の取締役が子会社の取締役と通謀して、子会社の計算で利益供与をすることも考えられるためであり、これにより、総会屋排除の趣旨を貫徹しようとするものである。"},
  {id:"K-02-02-100",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:2,rank:"A",src:"",
   q:"（令６Ⅱ問題７イ類・令３問題５ア類・平31Ⅰ問題５ア類・平23Ⅰ問題４エ・平21 問題５ウ類）株式会社が特定の株主に対して無償で財産上の利益を供与したときは、当該株式会社は、株主の権利の行使に関し、財産上の利益の供与をしたものとみなす。",ans:"誤り",
   exp:"120条２項前段。株式会社が特定の株主に対して無償で財産上の利益の供与をしたときは、当該株式会社は、株主の権利の行使に関し、財産上の利益の供与をしたものと推定する。例えば、総会屋に対して無償で金品を供与した場合には、当該推定規定が働く。"},
  {id:"K-02-02-101",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:3,rank:"A",src:"平26Ⅱ問題５ア類",
   q:"株式会社が特定の株主に対して有償で財産上の利益の供与をした場合、当該株式会社は、株主の権利行使に関して財産上の利益の供与をしたものと推定されることはない。",ans:"誤り",
   exp:"120条２項後段。株式会社が特定の株主に対して有償で財産上の利益の供与をした場合において、当該株式会社またはその子会社の受けた利益が当該財産上の利益に比べて著しく少ないときは、当該株式会社は、株主の権利の行使に関し、財産上の利益の供与をしたものと推定する。例えば、総会屋の発行する情報誌に広告を掲載して広告料を支払った場合において、当該情報誌の読者が極めて限られているにもかかわらず、全国紙並みの広告料を支払った場合は、当該推定規定が働く。"},
  {id:"K-02-02-102",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:4,rank:"A",src:"平30Ⅰ問題５エ類・平27Ⅱ問題４イ・平26Ⅱ問題５イ",
   q:"株式会社が株主の権利の行使に関する財産上の利益の供与を当該株式会社の子会社の計算においてしたときは、当該利益の供与を受けた者は、これを当該株式会社に返還しなければならない。",ans:"誤り",
   exp:"120条３項。株式会社は、何人に対しても、株主の権利の行使に関し、当該株式会社またはその子会社の計算において、財産上の利益の供与をしてはならない（120条１項）。株式会社が利益供与の禁止規定に違反して財産上の利益の供与をしたときは、当該利益の供与を受けた者は、これを当該株式会社またはその子会社に返還しなければならない（120条３項）。本問では、子会社の計算において、利益の供与がなされているため、株式会社ではなくその子会社に対して返還がなされる。なお、株式会社が利益供与を受けた者に対して利益の返還を請求することは通常期待できないため、利益供与を受けた者への利益返還請求について、責任追及等の訴えの対象とされている（847条１項）。"},
  {id:"K-02-02-103",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:5,rank:"A",src:"",
   q:"株式会社が利益供与の規定に違反して財産上の利益の供与をしたときは、当該利益の供与を受けた者は、これを当該株式会社またはその子会社に返還しなければならないが、当該利益の供与を受けた者が、禁止された利益供与であることに善意である場合は、当該返還義務を負わない。",ans:"誤り",
   exp:"120条３項前段。当該返還義務は、当該利益の供与を受けた者が善意の場合であっても、免除されることはない。なお、当該利益の供与を受けた者は、当該株式会社またはその子会社に対して当該利益と引換えに給付したものがあるときは、その返還を受けることができる（120条３項後段）。"},
  {id:"K-02-02-104",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:6,rank:"A",src:"令６Ⅱ問題７エ・平31Ⅰ問題５イ・平21 問題５イ",
   q:"株主は、株式会社に対し、株主の権利の行使に関する財産上の利益の供与を受けた者から当該利益の返還を求める旨の責任追及等の訴えの提起を請求することはできない。",ans:"誤り",
   exp:"847条１項３項。株式会社が利益供与を受けた者に対して利益の返還を請求することは通常期待できないため、利益供与を受けた者への利益返還請求は、責任追及等の訴えの対象とされている。"},
  {id:"K-02-02-105",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:7,rank:"A",src:"",
   q:"株式会社が利益供与の規定に違反して財産上の利益の供与をしたときは、当該利益の供与をすることに関与した取締役（利益を供与した取締役を除く）は、当該株式会社に対して、連帯して、供与した利益の価額に相当する額を支払う義務を負い、その者がその職務を行うについて注意を怠らなかったことを証明した場合であっても、当該義務を免れることができない。",ans:"誤り",
   exp:"120条４項。利益の供与をすることに関与した取締役として法務省令で定める者（利益を供与した取締役を除く）は、株式会社に対して、連帯して、供与した利益の価額に相当する額を支払う義務を負う。ただし、その者がその職務を行うについて注意を怠らなかったことを証明した場合は、責任を負わない。すなわち、当該責任は立証責任が転換されている過失責任である。これに対して、利益の供与をした取締役は、無過失責任である（120条４項ただし書かっこ書）。無過失責任とされている理由は、反社会的な利益供与を排除するために、政策的にその注意義務を加重する必要があったためである。"},
  {id:"K-02-02-106",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:8,rank:"A",src:"平26Ⅱ問題５ウ・平21 問題５ア類",
   q:"株式会社が株主の権利の行使に関する財産上の利益の供与をした場合において、当該利益の供与をした取締役は、その職務を行うについて注意を怠らなかったことを証明したときは、当該株式会社に対して供与した利益の価額に相当する額を支払う義務を負わない。",ans:"誤り",
   exp:"120条４項ただし書かっこ書。上記問題７の解説参照。"},
  {id:"K-02-02-107",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:9,rank:"B",src:"平31Ⅰ問題５ウ",
   q:"株式会社が、株主の権利の行使に関し、その子会社の計算において、財産上の利益の供与をしたときは、当該利益の供与をすることに関与した取締役（利益を供与した取締役を除く）は、その職務を行うについて注意を怠らなかったことを証明しない限り、当該子会社に対して、連帯して、供与した利益の価額に相当する額を支払う義務を負う。",ans:"誤り",
   exp:"120条４項。株式会社が利益供与の禁止規定に違反して財産上の利益の供与をしたときは、当該利益供与をすることに関与した取締役（指名委員会等設置会社では執行役を含む）として法務省令で定める者は、当該株式会社に対して、連帯して、供与した利益の価額に相当する額を支払う義務を負う。すなわち、当該支払義務は、利益の供与を行った株式会社に対して生じるものであり、子会社に対して、その義務が生じるわけではない。したがって、Ａ社が子会社であるＢ社の計算で利益供与をした場合、Ａ社の取締役はＡ社に対して利益相当額の支払責任を負うことになるが、子会社であるＢ社に対して利益相当額の支払責任を負うことはない。また、Ｂ社の取締役が利益相当額の支払責任を負うこともない。"},
  {id:"K-02-02-108",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:10,rank:"A",src:"平31Ⅰ問題５エ・平26Ⅱ問題５エ・平21 問題５エ",
   q:"株主の権利の行使に関してなされた株式会社による財産上の利益の供与に関与した取締役が、供与した利益の価額に相当する額を当該株式会社に対して支払う義務は、総株主の同意がなければ、免除することができない。",ans:"正しい",
   exp:"120条５項。なお、利益の供与をすることに関与した取締役として法務省令で定める者（利益を供与した取締役を除く）の責任は、立証責任が転換されている過失責任であるため（120条４項）、職務を行うについて注意を怠らなかったことを証明した場合は、そもそも責任自体が発生しないこととなる。そのため、総株主の同意で免除するということは論点とならない（責任の免除は、責任が発生していることが前提の話である）。"},
  {id:"K-02-02-109",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (9) 利益供与の禁止",num:11,rank:"B",src:"令６Ⅱ問題７ア",
   q:"最高裁判所の判例によれば、株式会社から見て好ましくない株主が議決権を行使することを回避する目的で、当該株式会社が、自己の計算において、第三者に対して当該株主から株式を譲り受けるための対価を供与した場合には、株主の権利の行使に関する利益の供与に該当する。",ans:"正しい",
   exp:"最判平18年４月10日。最高裁判所の判例によれば、株式譲渡それ自体は株主の権利の行使とはいえないとしながら、株式会社から見て好ましくないと判断される株主が議決権等の株主の権利を行使することを回避する目的で、当該株主から株式を譲り受けるための対価を何人かに供与する行為は、株主の権利の行使に関し利益を供与する行為であるとしている。"},
  {id:"K-02-02-110",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:1,rank:"B",src:"令７Ⅱ問題10 ウ類・令４Ⅰ問題９イ・平31Ⅰ問題９エ",
   q:"株主総会決議は、定款に別段の定めがない限り、議案に対する賛成の議決権数が決議の成立に必要な数に達したことを明白にするため、挙手、起立、投票等の採決の手続を採らなければならない。",ans:"誤り",
   exp:"東京地判平14年２月21日。決議の方法については、定款に別段の定めがない限り、議案の賛否について判定できる方法であれば、いかなる方法によるかは総会の円滑な運営の職責を有する議長の合理的裁量に委ねられているとしている。"},
  {id:"K-02-02-111",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:2,rank:"A",src:"令４Ⅱ問題７ウ類・平31Ⅰ問題10 エ類・平24Ⅰ問題８ウ",
   q:"取締役会設置会社以外の株式会社において、株主総会は、招集通知に記載された株主総会の目的である事項以外の事項についても決議をすることができる。",ans:"正しい",
   exp:"309条５項本文の反対解釈。309条５項本文の反対解釈として、取締役会非設置会社では、招集通知に記載された株主総会の目的である事項以外の事項についても決議をすることができる。すなわち、株主総会を万能の意思決定機関としているのである。"},
  {id:"K-02-02-112",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:3,rank:"B",src:"令７Ⅰ問題９エ類",
   q:"取締役会設置会社において、招集事項の決定で定められた株主総会の目的である事項以外の事項についても決議することができる場合がある。",ans:"正しい",
   exp:"309条５項。取締役会設置会社においては、株主総会は、招集事項として定めた株主総会の目的である事項（議題）以外の事項については、決議することができない（309条５項本文）。株式会社は所有と経営が制度的に分離されているため、株主に対し、事前に議題についての十分な検討の機会を与える必要があるからである。ただし、例外として、株主総会に提出された資料を調査する者の選任（316条１項）、株式会社の業務および財産の状況を調査する者の選任（同条２項）または定時株主総会において会計監査人の出席を求めること（398条２項）は、事前に議題とされていなくても決議することができる（309条５項ただし書）。これらの事項は、株式会社から事前に議題として設定される可能性が考えられず、他方で株主総会の議事の中で緊急に必要となることが想定される事項だからである。"},
  {id:"K-02-02-113",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:4,rank:"B",src:"令６Ⅰ問題10 エ",
   q:"公開会社である会計監査人設置会社の株主総会は、株主総会の目的である事項として会計監査人により株主総会に提出された資料を調査する者の選任を定めていない場合には、当該調査をする者を選任することができない。",ans:"誤り",
   exp:"309条５項ただし書。取締役会設置会社における株主総会は、招集にあたり定められた議題以外の事項について決議することができないとされているが（309条５項本文）、例外として、株主総会に提出された資料を調査する者の選任（316条１項）、株式会社の業務および財産の状況を調査する者の選任（同条２項）または定時株主総会において会計監査人の出席を求めること（398条２項）は、事前に議題とされていなくても決議することができる。"},
  {id:"K-02-02-114",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:5,rank:"A",src:"",
   q:"株主総会の普通決議は、議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の過半数をもって行うが、定款によって、定足数を完全に排除することが認められる（役員の選任・解任の決議および公開会社における支配株主の異動をもたらす募集株式の発行等の決議を除く）。",ans:"正しい",
   exp:"309条１項。株主総会の普通決議は、定款によって別段の定めを設けることができる。すなわち、定款によって定足数を加重することもできれば、完全に排除することも認められる。これに対して、決議要件については、加重のみが認められ、緩和することは認められないと解される。すなわち、決議要件を出席した当該株主の議決権の半数以下とすることは許されないと解される。"},
  {id:"K-02-02-115",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:6,rank:"A",src:"平20 問題９イ",
   q:"取締役を選任または解任する株主総会決議の定足数については、定款の定めによっても、議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない。",ans:"正しい",
   exp:"341条。役員（取締役、会計参与および監査役）を選任または解任する株主総会の決議は、定款の定めによっても、定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることができない。また、決議要件については引上げしかできない旨を明文で規定している（役員の選解任決議の特則）。また、公開会社における支配株主の異動を伴う募集株式の発行等や募集新株予約権の発行において、株主からの反対通知があったことにより特定引受人に対する割当て等の承認をする場合の決議についても同様の要件とされている。"},
  {id:"K-02-02-116",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:7,rank:"C",src:"令２Ⅰ問題８ア",
   q:"株式会社は、定款で定めることにより、株主総会の普通決議の要件を、出席した株主の議決権の過半数より引き下げることができる。",ans:"誤り",
   exp:"309条１項。株主総会の普通決議について、定款の定めによっても、決議要件を出席した株主の議決権の過半数より引き下げることは許されないと解される。これは、会社の意思を決定するという株主総会の決議の性質から当然のことであって、仮に出席株主の議決権の半数以下でも足りるとすると、内容が相反する複数の決議が成立しかねないからである。"},
  {id:"K-02-02-117",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:8,rank:"A",src:"平30Ⅱ問題10 イ類・平28Ⅰ問題８ウ類",
   q:"株主総会の特別決議は、当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の３分の２以上に当たる多数をもって行うが、定款によって、決議要件を出席した株主の議決権の過半数とすることが認められる。",ans:"誤り",
   exp:"309条２項。株主総会の特別決議は、定足数については加重することもできれば、緩和することが認められるが（ただし、３分の１未満にすることはできない）、決議要件については、加重のみが認められ、緩和することは認められていない。"},
  {id:"K-02-02-118",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:9,rank:"A",src:"令６Ⅱ問題10 ア類・令６Ⅰ問題10 ウ類",
   q:"株主総会の特別決議における定足数は、定款の定めによっても、当該株主総会において議決権を行使することができる株主の議決権の３分の１未満の割合とすることができない。",ans:"正しい",
   exp:"309条２項。株主総会の特別決議は、定足数の要件の緩和をすることが認められるが、３分の１未満にすることはできない。"},
  {id:"K-02-02-119",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:10,rank:"A",src:"",
   q:"株主総会の特別決議は、当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の３分の２以上に当たる多数をもって行うが、定款によって、当該決議要件に加えて、一定の数以上の株主の賛成を要する旨を定めることが認められる。",ans:"正しい",
   exp:"309条２項柱書後段。すなわち、定款により頭数要件を加えるなど、会社法によって定められた要件を加重することが認められている。"},
  {id:"K-02-02-120",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:11,rank:"A",src:"令６Ⅱ問題10 エ類・平30Ⅰ問題９エ類・平20 問題９ウ",
   q:"発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は、当該株主総会において議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の３分の２以上に当たる多数をもって行う。ただし、定款に別段の定めはないものとする。",ans:"誤り",
   exp:"107条２項１号、309条３項１号。発行する全部の株式を譲渡制限株式とする旨の定款の定めを設ける定款の変更を行う株主総会（種類株式発行会社の株主総会を除く）は、309条３項の特殊決議によって行わなければならない。すなわち、当該株主総会において議決権を行使することができる株主の半数以上（定款で加重可、頭数要件）であって、かつ、議決権を行使することができる株主の議決権の３分の２（定款で加重可）以上に当たる多数をもって行わなければならない。"},
  {id:"K-02-02-121",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (10) 株主総会の決議",num:12,rank:"A",src:"",
   q:"公開会社でない株式会社が、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権に関する事項について、株主ごとに異なる取扱いを行う旨を定款で定める定款変更の株主総会の決議は、当該株主総会において議決権を行使することができる株主の半数以上であって、当該株主の議決権の３分の２以上に当たる多数をもって行う。ただし、定款に別段の定めはないものとする。",ans:"誤り",
   exp:"109条２項、309条４項。非公開会社が、剰余金の配当を受ける権利、残余財産の分配を受ける権利、株主総会における議決権について、株主ごとに異なる取扱いを行う旨を定款で定めるための定款変更の株主総会の決議は、総株主の半数以上（定款で加重可）であって、総株主の議決権の４分の３（定款で加重可）以上に当たる多数をもって行わなければならない。当該定款変更は、株主の基本的な権利について株主ごとに異なる取扱いをする旨の定款の定めを新設するものであり、株主平等原則の例外であることから、株主にとって大変重大な影響を及ぼす。そのため、309条３項の特殊決議よりもさらに厳重な要件が課せられている。"},
  {id:"K-02-02-122",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (11) 株主総会の決議・報告の省略",num:1,rank:"A",src:"令６Ⅰ問題９イ・平30Ⅰ問題10 エ・平26Ⅱ問題７ウ・平21 問題９ア",
   q:"取締役または株主が株主総会の目的である事項について提案をした場合において、当該提案につき株主（当該事項について議決権を行使することができるものに限る。）の全員が書面または電磁的記録により同意の意思表示をしたときは、当該提案を可決する旨の株主総会の決議があったものとみなされる。",ans:"正しい",
   exp:"319条１項。議決権を行使することができる株主の全員の意見が一致しているような場合には、あえて株主総会を開催することで費用と時間をかける必要はなく、株主総会の決議の省略を認めることが合理的だからである。なお、取締役会の決議の省略制度（370条）と異なり、株主総会の決議の省略制度はその旨が可能な定款の定めを置く必要がない。このような決議を省略する制度を書面決議という。"},
  {id:"K-02-02-123",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (11) 株主総会の決議・報告の省略",num:2,rank:"B",src:"令７Ⅱ問題９ア",
   q:"株式会社の株主が提案をした株主総会の目的である事項について、当該提案につき議決権を行使することができる株主の全員が書面により同意の意思表示をした場合には、当該株式会社の親会社社員は、その権利を行使するため必要があるときは、裁判所の許可を得て、当該書面の閲覧または謄写の請求をすることができる",ans:"正しい",
   exp:"319条４項。株式会社は、株主総会の決議があったとみなされた日から10年間、株主全員の同意の書面または電磁的記録をその本店に備え置かなければならない（319条２項）。株主および債権者は、株式会社の営業時間内は、いつでも、当該書面または電磁的記録の閲覧または謄写を請求することができる（同条３項）。また、株式会社の親会社社員は、その権利を行使するために必要があるときは、裁判所の許可を得て、当該書面または電磁的記録の閲覧または謄写を請求することができる(同条４項)。"},
  {id:"K-02-02-124",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (11) 株主総会の決議・報告の省略",num:3,rank:"B",src:"",
   q:"株主総会の決議の省略の規定により定時株主総会の目的である事項のすべてについての提案を可決する旨の株主総会の決議があったものとみなされた場合には、その時に当該定時株主総会が終結したものとみなす。",ans:"正しい",
   exp:"319条５項。定時株主総会のみなし終結の規定が設けられている趣旨は、役員等の任期（332条１項等）の終結時点を明確にするためである。"},
  {id:"K-02-02-125",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (11) 株主総会の決議・報告の省略",num:4,rank:"A",src:"平31Ⅱ問題10 ウ・平26Ⅱ問題７エ・平21 問題９ウ",
   q:"取締役が株主の全員に対して株主総会に報告すべき事項を通知した場合において、当該事項を株主総会に報告することを要しないことにつき株主の全員が書面または電磁的記録により同意の意思表示をしたときは、当該事項の株主総会への報告があったものとみなされる。",ans:"正しい",
   exp:"320条。株主総会の決議の省略規定（319条１項）により決議ですら省略が認められているのであれば、報告について省略を認めても問題はないため、株主総会への報告の省略規定が設けられている。"},
  {id:"K-02-02-126",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:1,rank:"A",src:"平30Ⅱ問題18 ウ・平27Ⅱ問題15 エ類・平23Ⅱ問題18 イ",
   q:"株式買取請求をした株主は、いつでも自由に、その請求を撤回することができる。",ans:"誤り",
   exp:"116条７項、182条の４第６項、469条７項、785条７項、797条７項、806条７項。株式買取請求をした株主は、株式会社の承諾を得た場合に限り、その株式買取請求を撤回することができる。"},
  {id:"K-02-02-127",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:2,rank:"C",src:"",
   q:"振替株式の株主は、その有する振替株式について、株式買取請求をしようとするときは、当該振替株式について買取口座を振替先口座とする振替の申請をしなければならない。",ans:"正しい",
   exp:"振替法155条３項。振替株式の株主は、その有する振替株式について、株式買取請求をしようとするときは、当該振替株式について買取口座を振替先口座とする振替の申請をしなければならない。これによって、反対株主は、株式買取請求に係る株式を自由に売却することができなくなるため、株式会社の承諾を得ることなく株式買取請求を撤回することを、事実上においても防止することができるのである。"},
  {id:"K-02-02-128",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:3,rank:"B",src:"",
   q:"株券が発行されている株式について、株式買取請求をしようとするときは、当該株式の株主（株券喪失登録の請求をした者を除く）は、株式会社に対し、当該株式に係る株券を提出しなければならない。",ans:"正しい",
   exp:"116条６項、182条の４第５項、469条６項、785条６項、797条６項、806条６項。株券発行会社における株式の譲渡は、当該株式に係る株券を交付しなければ、その効力を生じないとされており（128条１項本文）、株券提供後はその株券の交付ができなくなる。その結果、株式の譲渡を自由にできなくなり、株式会社の承諾を得ることなく株式買取請求を撤回することを、事実上においても防止することができるのである。"},
  {id:"K-02-02-129",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:4,rank:"B",src:"",
   q:"株券発行会社でない株式会社（振替株式の発行者を除く）において、株式買取請求に係る株式を当該株式会社以外の者から取得した者（当該株式会社を除く）は、当該株式会社に対し、当該株式に係る株主名簿記載事項を株主名簿に記載し、または記録することを請求することができない。",ans:"正しい",
   exp:"116条９項、182条の４第７項、469条９項、785条９項、797条９項、806条９項。株券不発行会社の株式は意思表示により譲渡をすることができるが、当該株式の譲渡は、株主名簿の名義書換をしなければ、株式会社その他の第三者に対抗することができないことから（130条１項）、株式会社が名義書換請求に応じなければ株式の譲受人を株主として扱う必要がなくなる。そこで、株式買取請求に係る株式については、133条の規定の適用を除外することによって、株式買取請求に係る株式の譲渡を間接的に制限し、株式会社の承諾を得ることなく株式買取請求を撤回することを、事実上においても防止しているのである。"},
  {id:"K-02-02-130",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:5,rank:"B",src:"平31Ⅰ問題17 ウ類",
   q:"吸収合併存続株式会社の株主による株式買取請求があった場合において、当該株式買取請求に係る株式の買取りは、当該株式の代金の支払の時に、その効力を生ずる。",ans:"誤り",
   exp:"117条６項、182条の５第６項、470条６項、786条６項、798条６項、807条６項。反対株主の株式買取請求に係る株式の買取りは、効力発生日（新設型再編の場合は、設立会社の成立の日）に、その効力を生ずる。"},
  {id:"K-02-02-131",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:6,rank:"B",src:"平23Ⅱ問題18 ア",
   q:"新設合併における反対株主による株式買取請求に係る株式の買取りは、新設合併設立株式会社の成立の日に、その効力を生ずる。",ans:"正しい",
   exp:"807条６項。"},
