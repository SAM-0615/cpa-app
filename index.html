  {id:"K-04-05-010",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:10,rank:"C",src:"令６Ⅰ問題４ア",
   q:"募集設立の場合において、設立時募集株式の数を超える引受けの申込みがあるときは、発起人は、各申込者に対し、申込みに係る数に応じて、設立時募集株式を割り当てなければならない。",ans:"誤り",
   exp:"60条１項。発起人は、申込者の中から設立時募集株式の割当てを受ける者を定め、かつ、その者に割り当てる設立時募集株式の数を定めなければならない。この場合において、発起人は、当該申込者に割り当てる設立時募集株式の数を、当該申込者が引き受けようとする設立時募集株式の数よりも減少することができる。すなわち、設立時募集株式の割当ては、発起人が自由に決定することができる。これを、割当て自由の原則という。"},
  {id:"K-04-05-011",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:11,rank:"A",src:"",
   q:"心裡留保の相手方が悪意または有過失の場合の無効や、虚偽表示による無効は、発起人による設立時発行株式の引受けに係る意思表示については適用されない。",ans:"正しい",
   exp:"51条１項。これは、多数の利害関係者が存在する会社設立の基礎の安定を図る必要があるためである。なお、募集設立における設立時募集株式引受人に関しても、同様の規定が置かれている（102条５項）。"},
  {id:"K-04-05-012",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:12,rank:"A",src:"令７Ⅰ問題３エ・平26Ⅱ問題３エ・平23Ⅱ問題３エ・平22Ⅰ問題３エ",
   q:"発起人は、株式会社の成立後は、錯誤、詐欺または強迫を理由として設立時発行株式の引受けの取消しをすることができない。",ans:"正しい",
   exp:"51条２項。発起人は、株式会社の成立後は、錯誤（民法95条）、詐欺または強迫（民法96条）を理由として設立時発行株式の引受けの取消しをすることができない。これは、会社が一旦成立してしまった後は、発起人の株式引受けに至った個人的理由よりは、会社の利益を優先すべきであると考えられるためである。"},
  {id:"K-04-05-013",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:13,rank:"A",src:"令４Ⅱ問題３エ類・平31Ⅰ問題３エ類・平28Ⅰ問題４ウ類",
   q:"設立時募集株式の引受人は、創立総会において議決権を行使した後であっても、株式会社の成立前であれば、錯誤を理由とした設立時発行株式の引受けの取消しをすることができる。",ans:"誤り",
   exp:"102条６項。設立時募集株式の引受人は、株式会社の成立後、または、創立総会等においてその議決権を行使した後は、錯誤を理由として設立時発行株式の引受けの取消しをすることができない。すなわち、株式会社の成立前であっても、創立総会等において議決権を行使した後は、錯誤を理由として設立時発行株式の引受けの取消しをすることができない。また、詐欺または強迫を理由として、設立時発行株式の引受けの取消しをすることも同様に認められない。"},
  {id:"K-04-05-014",subject:"企業法",chapter:"第4章 設立",sub:"5. 社員の確定",num:14,rank:"C",src:"令４Ⅰ問題４ア",
   q:"設立時募集株式の引受人は、創立総会で議決権を行使した後は、引受けの当時、制限行為能力者であったことを理由として設立時発行株式の引受けの取消しを主張することができない。",ans:"誤り",
   exp:"102条６項。設立時募集株式の引受人は、株式会社の成立後または創立総会もしくは種類創立総会においてその議決権を行使した後は、錯誤、詐欺または強迫を理由として設立時発行株式の引受けの取消しをすることができない。これに対して、制限行為能力者の保護は、取引の安全に優先するのが原則であることから、行為能力の制限を理由とする引受けの取消しは制限されていない。"},
  {id:"K-04-06-001",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:1,rank:"A",src:"平28Ⅱ問題４ア",
   q:"発起人は、株式会社の成立の時までに、その引き受けた設立時発行株式につき、その出資に係る金銭の全額を払い込み、またはその出資に係る金銭以外の財産の全部を給付しなければならない。",ans:"誤り",
   exp:"34条１項本文。発起人は、設立時発行株式の引受後遅滞なく、払込金額の全額を払込み、または現物出資財産の全部を給付することを要する。"},
  {id:"K-04-06-002",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:2,rank:"A",src:"令６Ⅱ問題４ア・令２Ⅰ問題３ウ・平26Ⅰ問題４ウ・平24Ⅰ問題２イ",
   q:"現物出資をする者は、設立時発行株式の引受け後遅滞なく、その現物出資に係る財産の全部を給付しなければならないが、発起人全員の同意があるときは、登記等の権利の設定または移転を第三者に対抗するために必要な行為は、株式会社の設立後にすることを妨げない。",ans:"正しい",
   exp:"34条１項ただし書。不動産のように登記を必要とし、あるいは、特許権のように登録を必要とするものについて、発起人の全員の同意がある場合には、会社成立後にこれらをすることができる。これは、会社成立前の登記や登録においては、会社名義を使用することができず、会社成立後に登記や登録を再び行うことの手続の重複を避けるためである。"},
  {id:"K-04-06-003",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:3,rank:"A",src:"",
   q:"発起人および設立時募集株式引受人が、その出資にかかる金銭の払込みをする場合は、発起人が定めた払込取扱機関においてすることを要する。",ans:"正しい",
   exp:"34条２項、63条１項。これは、第三者機関において金銭の払込みをなすことにより、払込みの確実性を確保するためである。"},
  {id:"K-04-06-004",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:4,rank:"B",src:"",
   q:"発起人は、労務を出資の目的とすることはできない。",ans:"正しい",
   exp:"34条２項、63条１項。株式会社の社員たる株主は有限責任を負うにすぎないから（104条）、出資の価額について評価可能である必要があるため、評価不可能な労務出資および信用出資は認められない。"},
  {id:"K-04-06-005",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:5,rank:"A",src:"令６Ⅰ問題３イ類・平29Ⅰ問題４エ",
   q:"発起人が、出資の履行をしていない発起人に対して、一定の期日までに当該出資の履行をしなければならない旨の通知を法定の期間に行った場合において、当該通知を受けた発起人は、当該期日までに当該出資の履行をしないときには、当該出資の履行をすることにより設立時発行株式の株主となる権利を失う。",ans:"正しい",
   exp:"36条１項３項。発起人を当然に失権させてしまうと設立手続に支障が生じるため、設立の迅速性を確保するために発起人については失権手続が設けられている。そして、一定の期日までに当該出資の履行をしなければならない旨の通知を受けた発起人が期日までに出資を履行しないときは、当該発起人は設立時発行株式の株主となる権利を失う。なお、当該通知は、期日の２週間前までにしなければならない（36条２項）。"},
  {id:"K-04-06-006",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:6,rank:"B",src:"平22Ⅰ問題３ウ",
   q:"発起人および設立時取締役は、会社成立後もなお払込みがない株式につき、連帯して払込みをなす責任を負う。",ans:"誤り",
   exp:"このような規定はない。最終的に払込みのない株式の引受人は、株主となる権利を失うことになるが、発起人等が失権した権利の払込みをなす責任を負うことはない。"},
  {id:"K-04-06-007",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:7,rank:"B",src:"令８Ⅰ問題４エ類・令４Ⅱ問題３ア類・令２Ⅱ問題３ウ",
   q:"設立時募集株式の引受人は、設立時募集株式の払込金額の払込みをしないときは、当該払込みをすることにより設立時募集株式の株主となる権利を失う。",ans:"正しい",
   exp:"63条３項。設立時募集株式引受人には、発起人のような失権手続は設けられていない。"},
  {id:"K-04-06-008",subject:"企業法",chapter:"第4章 設立",sub:"6. 会社財産の確定",num:8,rank:"A",src:"令４Ⅰ問題３イ・平25Ⅰ問題３エ類・平23Ⅰ問題３ウ",
   q:"発起設立と募集設立のいずれの場合においても、払込みの取扱いをした銀行等は、発起人から請求を受けたときは、払い込まれた金額に相当する金銭の保管に関する証明書を交付しなければならない。",ans:"誤り",
   exp:"34条２項、64条１項。募集設立の場合、発起人は、払込取扱機関に対し、払込金保管証明書の交付を請求することができる。募集設立においては、払込金保管証明書がないと設立登記の申請をすることができないため、必ず交付を受ける必要がある。この払込金保管証明制度は、募集設立の場合のみ採用されている。なぜなら、募集設立の場合には、設立時募集株式引受人が存在するので、財産の保管状況を明らかにすることにより、その保護を図る必要があるからである。なお、払込取扱機関に保管証明書の交付が求められるのは、募集設立の場合のみである。"},
  {id:"K-04-07-001",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:1,rank:"A",src:"",
   q:"（令４Ⅰ問題３ウ類・平29Ⅱ問題３イ類・平25Ⅱ問題４ア類・平23Ⅱ問題３イ類・平22Ⅱ問題３ア類）発起設立において、設立時取締役の選任は、発起人全員の同意によって決定する。",ans:"誤り",
   exp:"40条１項。発起設立において、設立時役員等の選任は、発起人が発起人としての資格においてではなく、「設立中の会社」の構成員である株式引受人としての地位においてなすものである。したがって、発起設立において、設立時取締役の選任は、発起人の議決権の過半数によって決定される。その際、各発起人は、出資の履行をした設立時発行株式１株につき１個の議決権（単元株式数を定款で定めている場合は、１単元につき１個の議決権）を有する（40条２項）。なお、設立時取締役（設立しようとする株式会社が監査等委員会設置会社である場合は、設立時監査等委員である設立時取締役またはそれ以外の設立時取締役）、設立時会計参与、設立時監査役または設立時会計監査人を合わせて設立時役員等といい、これらの者も同様の要件で選任される。"},
  {id:"K-04-07-002",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:2,rank:"A",src:"平30Ⅰ問題３ア・平26Ⅱ問題３ア",
   q:"設立時取締役は、発起人の中から選任しなければならない。",ans:"誤り",
   exp:"発起人の中から設立時取締役を選任しなければならないという規定は存在しない。"},
  {id:"K-04-07-003",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:3,rank:"B",src:"",
   q:"設立しようとする株式会社が監査等委員会設置会社である場合は、設立時取締役の選任は、設立時監査等委員である設立時取締役とそれ以外の設立時取締役とを区別してしなければならない。",ans:"正しい",
   exp:"38条２項。設立時監査等委員の独立性を確保するためである。なお、募集設立の場合も同様である（88条２項）。"},
  {id:"K-04-07-004",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:4,rank:"A",src:"令５Ⅱ問題４ア類・平31Ⅱ問題３ア類・平25Ⅰ問題３ア類",
   q:"発起設立において、公証人の認証を受けた定款で設立時監査役として定められた者は、会社が成立をしたときに、設立時監査役に選任されたものとみなされる。",ans:"誤り",
   exp:"38条４項。発起設立における設立時役員等は、発起人による選任の方法（38条１項）のほかに、原始定款により選任することができる。そして、定款で設立時役員等として定められた者は、出資の履行が完了したときに、設立時役員等に選任されたものとみなされる。"},
  {id:"K-04-07-005",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:5,rank:"A",src:"平29Ⅱ問題４イ類・平25Ⅱ問題４ウ・平23Ⅱ問題３イ類",
   q:"募集設立の場合における設立時取締役の選任は、創立総会において議決権を行使することができる設立時株主の議決権の過半数であって、出席した当該設立時株主の議決権の過半数を要件とする創立総会の決議によって行われなければならない。",ans:"誤り",
   exp:"88条、73条１項。募集設立の場合、設立時取締役の選任は、創立総会の決議によって行わなければならない。ここで、創立総会の決議は、当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって、出席した当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。したがって、本肢は誤りである。"},
  {id:"K-04-07-006",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:6,rank:"A",src:"令６Ⅱ問題４ウ類・平25Ⅰ問題３イ",
   q:"発起設立において発起人は、公証人の認証を受けた定款で定められて選任されたものとみなされた設立時取締役を、株式会社の成立の時までの間、解任することができない。",ans:"誤り",
   exp:"42条。発起設立において、発起人は、株式会社の成立の時までの間、その選任した設立時役員等を解任することができる。なお、公証人の認証を受けた定款で定められて選任されたものとみなされた設立時取締役であっても、当該解任することができる設立時役員等に含まれるため、本肢は誤りである。"},
  {id:"K-04-07-007",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:7,rank:"A",src:"",
   q:"（令５Ⅰ問題４ウ類・平29Ⅱ問題３エ・平26Ⅱ問題３ウ類・平25Ⅱ問題４イ類・平22Ⅱ問題３イ）発起設立において、設立時監査役の解任は、発起人の議決権の過半数をもって決定する。",ans:"誤り",
   exp:"43条１項。発起設立において、設立時監査役の解任は、発起人の議決権の３分の２以上に当たる多数をもって決定する。会社成立後の監査役の解任決議は、その地位の強化を図る趣旨から、特別決議事項とされており（339条１項、341条、309条２項７号、343条４項）、これとの整合性を図った規定である。また、設立時監査等委員である設立時取締役の解任も同様に、発起人の議決権の３分の２以上に当たる多数をもって決定する。なお、設立時監査等委員以外の設立時取締役、設立時会計参与、設立時会計監査人の解任は、発起人の議決権の過半数をもって決定する。"},
  {id:"K-04-07-008",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:8,rank:"A",src:"平28Ⅰ問題３ウ",
   q:"発起設立において、設立時会計監査人の解任は、発起人の議決権の過半数をもって決定する。",ans:"正しい",
   exp:"43条１項。"},
  {id:"K-04-07-009",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:9,rank:"A",src:"平25Ⅱ問題４エ",
   q:"募集設立において、創立総会の決議によって選任された設立時取締役は、株式会社の成立の時までの間、創立総会の決議によって解任することができる。",ans:"正しい",
   exp:"91条。"},
  {id:"K-04-07-010",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:10,rank:"B",src:"平28Ⅰ問題４イ類・平22Ⅱ問題３ウ類",
   q:"設立しようとする株式会社が指名委員会等設置会社以外の取締役会設置会社である場合には、設立時取締役（設立しようとする株式会社が監査等委員会設置会社である場合には、設立時監査等委員である設立時取締役を除く）の中から設立時代表取締役を選定しなければならず、当該選定は、発起設立の場合は発起人の議決権の過半数をもって、募集設立の場合は創立総会の決議によって行う。",ans:"誤り",
   exp:"47条１項３項。設立時代表取締役の選定は、設立時取締役の過半数をもって決定する。これは、発起設立、募集設立に共通した規定となっている。なお、解職についても同様に、設立時取締役の過半数をもって決定する（47条２項３項）。"},
  {id:"K-04-07-011",subject:"企業法",chapter:"第4章 設立",sub:"7. 機関の具備",num:11,rank:"B",src:"令７Ⅱ問題４ア類",
   q:"設立しようとする株式会社が指名委員会等設置会社である場合については、設立時取締役は、設立時委員および設立時執行役を選定および選任しなければならず、当該選定および選任は、設立時取締役の過半数をもって決定する。",ans:"正しい",
   exp:"48条１項３項。また、設立時取締役は、設立時執行役の中から設立時代表執行役を選定しなければならない。ただし、設立時執行役が１人であるときは、その者が設立時代表執行役に選定されたものとする（48条１項３号ただし書）。なお、解任および解職についても同様に、設立時取締役の過半数をもって決定する（48条２項３項）。"},
  {id:"K-04-08-001",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:1,rank:"A",src:"平31Ⅱ問題３ウ",
   q:"定款に現物出資の記載がある場合、設立時取締役は、原則として、裁判所に対し、検査役の選任の申立てをしなければならない。",ans:"誤り",
   exp:"33条１項。変態設立事項は「危険なる約束」ともいわれ、これを発起人に自由に認めると、発起人の権限濫用により会社の財産的基礎を害するおそれがある。したがって、発起人は、定款に変態設立事項についての記載または記録があるときは、公証人の定款認証後遅滞なく、変態設立事項（28条各号）を調査させるため、原則として、裁判所に対し、検査役の選任の申立てをしなければならない。"},
  {id:"K-04-08-002",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:2,rank:"C",src:"平30Ⅱ問題３ウ",
   q:"現物出資に関する事項を調査するために裁判所により選任された検査役は、必要な調査を行い、当該調査の結果を記載した書面等を裁判所に提供して報告をしなければならない。",ans:"正しい",
   exp:"33条４項また、裁判所は、当該報告について、その内容を明瞭にし、またはその根拠を確認するため必要があると認めるときは、検査役に対し、さらに調査結果の報告を求めることができる（33条５項）。"},
  {id:"K-04-08-003",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:3,rank:"A",src:"平26Ⅰ問題３ア類",
   q:"裁判所選任の検査役は、必要な調査を行った結果、変態設立事項を不当と認めたときは、これを変更する決定をしなければならない。",ans:"誤り",
   exp:"33条７項。変態設立事項についての変更の決定をするのは、検査役ではなく、裁判所である。まず、裁判所選任の検査役は、必要な調査を行い、当該調査の結果を記載した書面を裁判所に提供して報告する（33条４項）。そして、裁判所は、当該報告を受けて、変態設立事項を不当と認めたときは、これを変更する決定をしなければならない（33条７項）。"},
  {id:"K-04-08-004",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:4,rank:"B",src:"令５Ⅱ問題４イ類",
   q:"発起人は、裁判所の決定により変態設立事項の全部または一部が変更された場合には、当該決定の確定後１週間以内に限り、裁判所の許可を得て、その設立時発行株式の引受けに係る意思表示を取り消すことができる。",ans:"誤り",
   exp:"33条８項。発起人は、裁判所の決定により変態設立事項の全部または一部が変更された場合には、当該決定の確定後１週間以内に限り、その設立時発行株式の引受けに係る意思表示を取り消すことができるが、その際に、裁判所の許可を得る必要はない。"},
  {id:"K-04-08-005",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:5,rank:"B",src:"",
   q:"発起設立において、裁判所の決定により変態設立事項の全部または一部が変更された場合、発起人は、その全員の同意によって、裁判所の決定の確定後１週間以内に限り、当該決定により変更された事項についての定めを廃止する定款の変更をすることができる。",ans:"正しい",
   exp:"33条９項。なお、募集設立の場合は、設立時募集株式の払込期日または払込期間の初日のうち最も早い日以後は、発起人全員の同意による定款の変更（33条９項、37条１項２項）が禁止されている（95条）。"},
  {id:"K-04-08-006",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:6,rank:"A",src:"",
   q:"発起設立において、公証人の認証を受けた定款は、株式会社の成立前は変更することができない。",ans:"誤り",
   exp:"30条２項。発起設立の場合、公証人の認証を受けた定款は、株式会社の成立前は、① 変態設立事項について検査役から報告を受けた裁判所が不当と認めた場合（33条７項）、② 裁判所に変更された事項について、発起人の全員の同意により廃止する場合（33条９項）、③ 発行可能株式総数を定款に定めていないときに、発起人の全員の同意により発行可能株式総数を定める場合（37条１項）、④ 発行可能株式総数を定款に定めているときに、発起人の全員の同意により発行可能株式総数を変更する場合（37条２項）にのみ、発起人の全員の同意をもって、定款を変更することが認められる。"},
  {id:"K-04-08-007",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:7,rank:"A",src:"平26Ⅱ問題３イ",
   q:"発起設立においては、発起人全員の同意によって、公証人の認証を受けた定款を変更して、新たな変態設立事項を定めることができる。",ans:"誤り",
   exp:"30条２項。上記問題６の解説参照。①～④の事項に該当しないため、発起人の全員の同意によっても、定款を変更することはできない。"},
  {id:"K-04-08-008",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:8,rank:"A",src:"令３問題３エ・平29Ⅱ問題４ウ・平27Ⅱ問題３エ",
   q:"募集設立の場合、公証人の認証を受けた定款は、創立総会の決議により変更することができる。",ans:"正しい",
   exp:"96条。募集設立の場合、発起設立において定款の変更が認められる場合に加え、創立総会の決議によって定款を変更することができる。"},
  {id:"K-04-08-009",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:9,rank:"A",src:"平27Ⅰ問題３ア",
   q:"募集設立の場合において、公証人による定款の認証を受けた後に、創立総会の決議により定款を変更した場合には、改めて公証人の認証を受ける必要がある。",ans:"誤り",
   exp:"募集設立の場合において、創立総会の決議により定款を変更した場合であっても、改めて公証人の認証を受ける必要はない。"},
  {id:"K-04-08-010",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:10,rank:"C",src:"平31Ⅰ問題４イ",
   q:"募集設立の場合において、設立時募集株式と引換えにする金銭の出資の払込みの期日以後の定款の変更は、創立総会の決議によらなければならない。",ans:"正しい",
   exp:"95条、96条。募集設立の場合、発起設立において定款の変更が認められる場合に加え、創立総会の決議によって定款を変更することができる。また、設立時募集株式の払込期日または払込期間の初日のうち最も早い日以後は、発起人全員の同意による定款の変更（33条９項、37条１項２項）が禁止されている。"},
  {id:"K-04-08-011",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:11,rank:"A",src:"令７Ⅰ問題４エ・平28Ⅰ問題４ア",
   q:"募集設立の創立総会において、現物出資に関する定款所定の事項を変更する決議をした場合には、当該創立総会においてその変更に反対した設立時株主は、当該決議後２週間以内に限り、その設立時発行株式の引受けに係る意思表示を取り消すことができる。",ans:"正しい",
   exp:"97条。"},
  {id:"K-04-08-012",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:12,rank:"A",src:"",
   q:"発行可能株式総数は、定款の絶対的記載事項であるため、公証人の認証を受ける定款には、発行可能株式総数が記載されていなければならない。",ans:"誤り",
   exp:"37条１項、27条各号参照。発行可能株式総数は、絶対的記載事項であるという記述は正しい（37条１項）。ただし、発行可能株式総数は、公証人の認証の対象となる原始定款に定められている必要はない（27条各号参照）。発行可能株式総数については、設立過程における株式の引受状況を勘案して、柔軟に定めることができるようにされているのである。"},
  {id:"K-04-08-013",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:13,rank:"A",src:"",
   q:"定款に記載された価額の総額が500万円を超えないことにより裁判所選任の検査役の調査が不要となる現物出資財産が存在する場合、発起人は、定款に記載された当該財産の価額が相当であることを調査しなければならない。",ans:"誤り",
   exp:"46条１項１号、93条１項１号。設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては、設立時取締役および設立時監査役）は、その選任後遅滞なく、① 現物出資または財産引受の対象財産が、検査役の調査の省略が認められる少額免除または市場価格のある有価証券にあたる場合に、定款に記載された財産の価額が相当であること、② 現物出資および財産引受の対象たる財産について、弁護士等の証明により検査役の調査が免除される場合に、その証明が相当であること、③ 発起人による出資の履行が完了していること（募集設立においては発起人による出資の履行および設立時募集株式引受人による払込みが完了していること）、④ 株式会社の設立の手続が法令・定款に違反していないことを調査しなければならない（46条１項、93条１項）。"},
  {id:"K-04-08-014",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:14,rank:"A",src:"平28Ⅱ問題３イ・平25Ⅰ問題３ウ",
   q:"発起設立において設立時取締役は、その選任後遅滞なく、設立の手続が法令または定款に違反していないことを調査しなければならない。",ans:"正しい",
   exp:"46条１項４号、93条１項４号。設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては、設立時取締役および設立時監査役）は、その選任後、遅滞なく、株式会社の設立の手続が法令または定款に違反していないことを調査しなければならない。"},
  {id:"K-04-08-015",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:15,rank:"A",src:"令４Ⅰ問題３エ",
   q:"発起設立と募集設立のいずれの場合においても、設立時取締役は、その選任後遅滞なく、出資の履行が完了していることを調査しなければならない。",ans:"正しい",
   exp:"46条１項３号、93条１項３号。設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては、設立時取締役および設立時監査役）は、その選任後、遅滞なく、発起人による出資の履行（募集設立においては発起人による出資の履行および設立時募集株式引受人による払込みが完了していること）を調査しなければならない。"},
  {id:"K-04-08-016",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:16,rank:"A",src:"令６Ⅱ問題３ウ類・平30Ⅰ問題３イ",
   q:"設立時取締役および設立時監査役は、発起人が法令もしくは定款に違反する行為をし、またはこれらの行為をするおそれがある場合には、会社法に基づき、当該発起人に対し、当該行為をやめることを請求することができる。",ans:"誤り",
   exp:"発起設立において、設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては、設立時取締役および設立時監査役）は、その選任後、遅滞なく、株式会社の設立の手続が法令または定款に違反していないことを調査しなければならず（46条１項４号）、法令または定款に違反する事項や不当な事項があると認めるときは、発起人にその旨を通知しなければならない（同条２項）。しかし、本肢のような規定はない。"},
  {id:"K-04-08-017",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:17,rank:"B",src:"",
   q:"発起設立において、設立時取締役は、選任後の調査により、法令または定款に違反する事項や不当な事項があると認めるときは、発起人にその旨を通知しなければならない。",ans:"正しい",
   exp:"46条２項。なお、設立時監査役にも同様の報告義務が課されている。"},
  {id:"K-04-08-018",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:18,rank:"B",src:"",
   q:"募集設立において、設立時取締役は、出資の履行等の調査結果を、発起人に報告しなければならない。",ans:"誤り",
   exp:"93条２項。募集設立において、設立時取締役は、選任後の調査の結果を、創立総会に報告しなければならない。なお、設立時監査役にも同様の報告義務が課されている。"},
  {id:"K-04-08-019",subject:"企業法",chapter:"第4章 設立",sub:"8. 設立過程の調査",num:19,rank:"C",src:"",
   q:"設立時取締役の全員が発起人である場合に限り、創立総会の決議によって、設立時取締役が調査すべき事項を調査する者を選任することができる。",ans:"誤り",
   exp:"94条１項。募集設立において、設立時取締役（設立しようとする株式会社が監査役設置会社である場合にあっては、設立時取締役および設立時監査役）の全部または一部が発起人である場合には、創立総会の決議によって、設立時取締役が調査すべき事項を調査する者を選任することができる。これは、発起人間の馴れ合いによる調査を防ぐためである。そして、選任された者は、必要な調査を行い、当該調査の結果を創立総会に報告しなければならない（94条２項）。"},
  {id:"K-04-09-001",subject:"企業法",chapter:"第4章 設立",sub:"9. 設立の登記",num:1,rank:"A",src:"",
   q:"株式会社は、その本店の所在地において設立の登記をすることによって成立する。",ans:"正しい",
   exp:"49条。設立の登記がなされることによって、株式会社が成立し、法人格を取得することとなる。"},
  {id:"K-04-09-002",subject:"企業法",chapter:"第4章 設立",sub:"9. 設立の登記",num:2,rank:"A",src:"平28Ⅰ問題３エ類・平23Ⅰ問題３エ",
   q:"発起人および設立時募集株式の引受人は、出資の履行をした日に、設立時発行株式の株主となる。",ans:"誤り",
   exp:"50条１項、102条２項。株式会社は、その本店の所在地において設立の登記をすることによって成立する（49条）。そして、発起人および設立時募集株式の引受人は、株式会社の成立の時に、出資の履行をした設立時発行株式の株主となる。"},
  {id:"K-04-09-003",subject:"企業法",chapter:"第4章 設立",sub:"9. 設立の登記",num:3,rank:"A",src:"令４Ⅱ問題３イ類・平30Ⅱ問題４ア類・平26Ⅰ問題４ア類・平23Ⅱ問題３ウ",
   q:"発起人が出資の履行をすることにより設立時発行株式の株主となる権利の譲渡は、成立後の株式会社に対して、その効力を生じない。",ans:"誤り",
   exp:"35条。発起人が出資の履行をすることにより設立時発行株式の株主となる権利の譲渡は、成立後の株式会社に対抗することができない。これは、会社側の事務処理が煩雑になることを防止する趣旨である。なお、出資の履行後における権利株の譲渡も、同様に成立後の株式会社に対抗できないとされる（50条２項）。当該規定と同様の規定が、設立時募集株式の引受人に対しても設けられている（63条２項）。"},
  {id:"K-04-10-001",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:1,rank:"C",src:"平29Ⅱ問題４エ",
   q:"創立総会は、会社法に規定する事項および株式会社の設立その他株式会社に関する一切の事項について決議をすることができる。",ans:"誤り",
   exp:"66条。創立総会は、募集設立にだけ適用される規定（57条～103条）および株式会社の設立の廃止、創立総会の終結その他株式会社の設立に関する事項に限り、決議することができる。"},
  {id:"K-04-10-002",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:2,rank:"B",src:"令５Ⅱ問題４ウ類・平31Ⅰ問題３ア類",
   q:"創立総会は、創立総会の目的である事項とされていなければ、株式会社の設立の廃止について決議をすることができない。",ans:"誤り",
   exp:"73条４項ただし書。創立総会は、原則として、創立総会の目的である事項以外の事項については決議することができない。ただし、定款の変更または株式会社の設立の廃止については、創立総会の目的である事項とされていなくても、決議することができる。なぜなら、これらの事項は、設立時株主にとって重大な影響を与えるものであり、創立総会において常に議決を認める必要があるからである。"},
  {id:"K-04-10-003",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:3,rank:"B",src:"",
   q:"募集設立において、発起人は、設立時募集株式と引換えにする金銭の払込期日または払込期間の末日のうち最も遅い日以後、遅滞なく、創立総会を招集しなければならない。",ans:"正しい",
   exp:"65条１項。なお、発起人は必要があると認めるときは、いつでも、創立総会を招集することができる（65条２項）。"},
  {id:"K-04-10-004",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:4,rank:"B",src:"平29Ⅱ問題４ア",
   q:"設立時株主は、必要があると認めるときは、いつでも、創立総会を招集することができる。",ans:"誤り",
   exp:"65条参照。創立総会の招集権者は、設立中の会社の執行機関である発起人であり、問題文のような規定は存在しない。臨時創立総会（65条２項）の招集権者も発起人である。"},
  {id:"K-04-10-005",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:5,rank:"B",src:"令６Ⅰ問題４イ",
   q:"募集設立の場合において、設立時株主は、設立時取締役に対し、発行可能株式総数の変更を創立総会の目的とすることを請求することができる。",ans:"誤り",
   exp:"設立中の会社の執行機関は発起人であり、問題文のような規定は存在しない。そのため、設立時株主に創立総会の招集権や議題提案権等は認められていない。"},
  {id:"K-04-10-006",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:6,rank:"B",src:"令３問題３イ・平27Ⅰ問題３イ",
   q:"創立総会で設立の廃止を決議する場合には、その引き受けた設立時発行株式が議決権制限株式である設立時株主も、議決権を行使することができる。",ans:"正しい",
   exp:"72条３項。株式会社の設立に際し議決権制限株式（108条１項３号）を発行する場合においては、設立時株主は、株主総会の場合に準じて、創立総会においても議決権が制限される（72条２項）。ただし、この場合であっても、株式会社の設立の廃止については、設立時株主は、その引き受けた設立時発行株式について議決権を行使することができる。株式会社の設立廃止は、すべての設立時株主にとって極めて重要な事項だからである。"},
  {id:"K-04-10-007",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:7,rank:"B",src:"令６Ⅱ問題４エ類・平31Ⅰ問題３イ・平24Ⅰ問題３エ類",
   q:"創立総会の決議は、当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって、出席した当該設立時株主の議決権の過半数をもって行う。",ans:"誤り",
   exp:"73条１項。創立総会の普通決議は、当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって、出席した当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。これは、会社の設立に関して重要な事項を決定する創立総会の地位に鑑みて、その決議の慎重を期する趣旨から、このような厳格な要件となっている。"},
  {id:"K-04-10-008",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:8,rank:"B",src:"令３問題３ア類・平27Ⅰ問題３エ",
   q:"設立しようとする株式会社が種類株式発行会社である場合を除き、その発行する全部の株式を譲渡制限株式とする定款の変更についての創立総会の決議は、当該創立総会において議決権を行使することができる設立時株主の半数以上であって、当該設立時株主の議決権の３分の２以上に当たる多数をもって行う。",ans:"正しい",
   exp:"73条２項。"},
  {id:"K-04-10-009",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:9,rank:"B",src:"",
   q:"設立しようとする株式会社が種類株式発行会社である場合を除き、その発行する全部の株式を取得条項付株式とする定款の変更についての創立総会の決議は、当該創立総会において議決権を行使することができる設立時株主の半数以上であって、当該設立時株主の議決権の４分の３以上に当たる多数をもって行う。",ans:"誤り",
   exp:"73条３項。設立しようとする株式会社が種類株式発行会社である場合を除き、その発行する全部の株式を取得条項付株式とする定款の変更をしようとする場合には、設立時株主全員の同意を得なければならない。"},
  {id:"K-04-10-010",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:10,rank:"A",src:"",
   q:"発起人は、創立総会において、設立時株主から特定の事項について説明を求められた場合であっても、当該事項が創立総会の目的である事項に関しないものである場合は、当該事項について必要な説明を拒むことができる。",ans:"正しい",
   exp:"78条。発起人は、創立総会において、設立時株主から特定の事項について説明を求められた場合には、当該事項について必要な説明をしなければならない。ただし、当該事項が創立総会の目的である事項に関しないものである場合、その説明をすることにより設立時株主の共同の利益を著しく害する場合として法務省令で定める場合は、当該事項の説明を拒むことができる。"},
  {id:"K-04-10-011",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:11,rank:"A",src:"令３問題３ウ・平30Ⅱ問題４イ・平27Ⅰ問題３ウ",
   q:"創立総会において、設立時株主は、その有する議決権について、不統一行使する旨を発起人に請求することができない。",ans:"誤り",
   exp:"77条１項。創立総会の議決権の行使に関する規定は、株主総会に関する規定との対応が図られており、代理人による議決権行使（74条）、書面投票制度・電子投票制度（75条、76条）、議決権の不統一行使（77条）が認められている。"},
  {id:"K-04-10-012",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:12,rank:"A",src:"令７Ⅰ問題４イ",
   q:"創立総会においてその延期について決議があった場合には、発起人は、後日開催される創立総会について招集通知を発しなければならない。",ans:"誤り",
   exp:"80条、68条。創立総会においてその延期または続行について決議があった場合の規定は、株主総会に関する規定との対応が図られている。したがって、改めて創立総会の招集通知を発する必要はない。"},
  {id:"K-04-10-013",subject:"企業法",chapter:"第4章 設立",sub:"10. 創立総会",num:13,rank:"A",src:"平31Ⅰ問題３ウ",
   q:"設立時株主が創立総会の決議の取消しを求める訴えは、当該決議の日から３か月以内に提起しなければならない。",ans:"正しい",
   exp:"831条１項柱書かっこ書。創立総会の決議の瑕疵に関する規定は、株主総会に関する規定との対応が図られている。すなわち、株主等、設立時株主、設立時取締役または設立時監査役は、創立総会の決議取消しの訴えを、当該創立総会の決議の日から３か月以内に限り、提起することができる。"},
  {id:"K-04-11-001",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:1,rank:"A",src:"平30Ⅱ問題４ウ類",
   q:"株式会社の株主は、当該株式会社の設立取消しの訴えを提起することはできない。",ans:"正しい",
   exp:"832条参照。設立取消しの訴えは、持分会社にのみ認められている。"},
  {id:"K-04-11-002",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:2,rank:"A",src:"",
   q:"会社の設立無効の訴えは、会社の成立の日から２年以内に、訴えをもってのみ主張することができる。",ans:"正しい",
   exp:"828条１項１号。法的安定性を確保するため、会社法は、設立無効の主張期間、主張権者、主張方法を制限することにより、無効の主張を可及的に制限している。"},
  {id:"K-04-11-003",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:3,rank:"A",src:"平29Ⅰ問題７ウ",
   q:"会社設立の無効の訴えを提起する権利は、少数株主権である。",ans:"誤り",
   exp:"828条２項１号。会社設立の無効の訴えを提起する権利は、単独株主権である。"},
  {id:"K-04-11-004",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:4,rank:"A",src:"令５Ⅱ問題３ウ",
   q:"発起人は、株式会社の成立後に株主の地位を失った場合であっても、株式会社の成立の日から２年以内に、当該株式会社の設立の無効の訴えを提起することができる。",ans:"誤り",
   exp:"828条２項１号。会社設立の無効の訴えの主張権者については、設立の無効を主張できるのは、設立する株式会社の株主等に限られる。ここで、条文の「設立する株式会社の株主」とは、提訴時に当該会社の株主であることを意味する。よって、株主の地位を失った場合は訴えを提起できない。"},
  {id:"K-04-11-005",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:5,rank:"A",src:"令７Ⅱ問題４エ類・平28Ⅱ問題３エ・平24Ⅱ問題４イ・平22Ⅰ問題３ア類",
   q:"株式会社の債権者は、当該株式会社の成立の日から２年以内に、当該株式会社の設立の無効の訴えを提起することができる。",ans:"誤り",
   exp:"828条２項１号。設立無効の訴えを提起することができる主張権者は、株主等（株主、取締役または清算人（監査役設置会社では株主、取締役、監査役または清算人、指名委員会等設置会社では株主、取締役、執行役または清算人）をいう）に限られ、会社債権者は含まれない。"},
  {id:"K-04-11-006",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:6,rank:"A",src:"令２Ⅰ問題３エ・平24Ⅱ問題４エ",
   q:"発起人がその債権者を害することを知って株式会社を設立した場合には、当該債権者は、当該株式会社の成立の日から２年以内に、当該株式会社の設立の取消しの訴えを提起することができる。",ans:"誤り",
   exp:"832条参照。設立取消しの訴えは、持分会社のみ規定されている。"},
  {id:"K-04-11-007",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:7,rank:"A",src:"平28Ⅱ問題３ウ・平24Ⅱ問題４ウ類",
   q:"株式会社の設立の無効の訴えに係る請求を認容する確定判決は、第三者に対してその効力を有しない。",ans:"誤り",
   exp:"838条法律関係の画一的確定の観点から、設立無効判決は、第三者に対してもその効力を有する。すなわち、設立無効判決には対世的効力が認められているのである。"},
  {id:"K-04-11-008",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:8,rank:"A",src:"令２Ⅱ問題３エ",
   q:"株式会社の設立の無効の訴えに係る請求を認容する判決が確定したときは、当該株式会社の設立は、当該株式会社の成立の時に遡ってその効力を失う。",ans:"誤り",
   exp:"839条。株式会社の設立の無効の訴えに係る請求を認容する判決が確定したときは、法的安定性を確保するために判決の遡及効は阻止され、当該株式会社の設立は、将来に向かってその効力を失う（将来効）。"},
  {id:"K-04-11-009",subject:"企業法",chapter:"第4章 設立",sub:"11. 設立の瑕疵",num:9,rank:"C",src:"令５Ⅰ問題４エ",
   q:"株式会社の設立の無効の訴えに係る請求を認容する判決が確定した場合において、その無効の原因が一部の株主のみにあるときは、他の株主の全員の同意によって、当該株式会社を継続することができる。",ans:"誤り",
   exp:"845条参照。株式会社においては、相互に信頼関係のない無個性な株主を前提としているため、持分会社のような会社継続の規定（845条）は設けられていない。なお、持分会社の社員間には人的信頼関係が存在し、その個性が重視されるため、１人の設立の意思表示が無効・取り消しうるものである限り、それ以外の者のみによる会社の設立を認めるべきではないが、他の社員が会社の継続を欲している場合には、社員の意思を尊重し、会社の継続を認めても問題はないため、他の社員全員の同意により会社を継続することが認められている。"},
  {id:"K-04-12-001",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:1,rank:"A",src:"",
   q:"会社成立時における現物出資財産（裁判所選任の検査役の調査を経ていないものとする）の価額が定款記載額に著しく不足する場合は、発起人、設立時取締役および設立時監査役は、当該会社に対し、連帯して、当該不足額を支払う義務を負う。",ans:"誤り",
   exp:"52条１項参照。設立時監査役には、現物出資財産等の不足額填補責任は課せられていない。"},
  {id:"K-04-12-002",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:2,rank:"A",src:"平24Ⅰ問題３ウ・平20 問題２ア類",
   q:"現物出資をした発起人は、裁判所が選任した検査役による調査を受けた場合であっても、株式会社の成立の時における当該現物出資に係る財産の価額が、定款に記載された価額に著しく不足するときは、その職務を怠らなかったことを証明した場合を除き、その不足額を支払う義務を負う。",ans:"誤り",
   exp:"52条２項柱書かっこ書。発起設立、募集設立を問わず、現物出資者である発起人、財産引受けにおける譲渡人である発起人は、いわば売主の地位にあり不当な利益を得ていることになるため、どんな場合においても無過失責任である。"},
  {id:"K-04-12-003",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:3,rank:"A",src:"令７Ⅱ問題４ウ類・令４Ⅰ問題４ウ類・平28Ⅰ問題４エ",
   q:"募集設立において、株式会社の成立の時における現物出資財産の価額が定款所定の価額に著しく不足するときは、現物出資者以外の発起人および設立時取締役は、裁判所選任の検査役の調査を経た場合またはその職務を行うについて注意を怠らなかったことを証明した場合のいずれかに該当する場合を除き、当該株式会社に対し当該不足額を支払う義務を負う。",ans:"誤り",
   exp:"103条１項、52条２項２号。発起設立、募集設立を問わず、現物出資者である発起人、財産引受けにおける譲渡人である発起人以外の発起人および設立時取締役は、検査役の調査を経た場合を除き、発起設立においては、立証責任が転換された過失責任、募集設立においては無過失責任とされている。したがって、募集設立の場合は、その職務を行うについて注意を怠らなかったことを証明した場合であっても、裁判所選任の検査役の調査を経ていない場合は不足額填補責任を負うこととなるため、本肢は誤りである。"},
  {id:"K-04-12-004",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:4,rank:"A",src:"平20 問題２ウ",
   q:"発起設立において、現物出資を行った者以外の発起人は、検査役の調査を経ていないと、職務を行うについて注意を怠らなかったことを証明した場合でも、不足額の支払義務を免れることができない。",ans:"誤り",
   exp:"52条２項２号。発起設立の場合は、現物出資者である発起人および財産引受けにおける譲渡人である発起人以外の者の責任は、立証責任の転換された過失責任とされている。したがって、その職務を行うについて注意を怠らなかったことを証明した場合は、当該責任を負わない。"},
  {id:"K-04-12-005",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:5,rank:"A",src:"平20 問題２イ類",
   q:"募集設立において、発起人が出資した現物出資財産の価額が著しく不足する場合であっても、当該発起人以外の設立時取締役がその職務を行うについて注意を怠らなかったことを証明した場合は、当該設立時取締役は会社に対して、当該不足額を支払う義務を負わない。",ans:"誤り",
   exp:"103条１項、52条２項２号。募集設立の場合は、現物出資者である発起人および財産引受けにおける譲渡人である発起人以外の発起人および設立時取締役であっても、裁判所選任の検査役の調査を受けている場合を除き、無過失責任とされている。これは、十分な調査の機会が与えられることのない設立時募集株主を保護するためである。"},
  {id:"K-04-12-006",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:6,rank:"B",src:"平20 問題２エ類",
   q:"会社成立時における現物出資財産の価額が定款記載額に著しく不足する場合の発起人および設立時取締役に課せられる不足額填補責任は、総株主の同意があっても免除することができない。",ans:"誤り",
   exp:"55条。会社成立時における現物出資財産の価額が定款記載額に著しく不足する場合の発起人および設立時取締役に課せられる不足額填補責任は、総株主の同意があれば免除することができる。"},
  {id:"K-04-12-007",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:7,rank:"B",src:"平28Ⅰ問題３イ",
   q:"発起人は、自己が引き受けた設立時発行株式の出資に係る金銭の払込みを仮装した場合、株式会社に対し、払込みを仮装した出資に係る金銭の全額を支払う義務を負う。",ans:"正しい",
   exp:"52条の２第１項１号。株式会社の設立に際して出資の履行が仮装される場合には、本来拠出されるべき財産が拠出されていないにもかかわらず、外観上は出資の履行がされたものとして株式会社の設立が行われるため、出資の履行を仮装していない設立時株式引受人から出資の履行を仮装した者に対する不当な価値の移転が生じる。そのため、出資の履行を仮装した発起人等には、株式会社に対して、本来拠出すべきであった財産を拠出させ、他の設立時株式引受人から不当に移転を受けた価値を実質的に返還させることが相当である。そこで、会社法は、出資の履行を仮装した場合の責任を定めている。"},
  {id:"K-04-12-008",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:8,rank:"B",src:"",
   q:"株式会社は、設立時発行株式の出資に係る金銭以外の財産の給付を仮装した発起人に対し、当該給付に代わる当該財産の価額に相当する金銭の支払を請求することができない。",ans:"誤り",
   exp:"52条の２第１項２号。発起人は、金銭以外の財産の給付を仮装した場合には、株式会社に対し、給付を仮装した出資に係る金銭以外の財産の全部の給付（株式会社が当該給付に代えて当該財産の価額に相当する金銭の支払を請求した場合は、当該金銭の全額の支払）をする義務を負う。現物出資が仮装された場合、株式会社の選択により、仮装した現物出資財産の給付か、金銭による支払いを請求することができることとしたのは、いったん現物出資財産の給付が仮装された場合には、株式会社として当該現物出資財産を給付させるのではなく、拠出されるはずだった価値を金銭で補償させることを望む場合もあると考えられるところ、そのような金銭補償の選択を認めることは、引受人が不当に移転を受けた価値の返還という目的との関係でも合理的であるからである。"},
  {id:"K-04-12-009",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:9,rank:"B",src:"令６Ⅱ問題４イ",
   q:"発起人が設立時発行株式の出資に係る金銭の払込みを仮装した場合、その出資の履行を仮装することに関与した発起人は、その職務を行うについて注意を怠らなかったことを証明した場合であっても、株式会社に対し、払込みを仮装した出資に係る金銭の全額の支払をする義務を負う。",ans:"誤り",
   exp:"52条の２第２項ただし書。発起人が金銭出資または金銭以外の財産の出資を仮装した場合には、その出資の履行を仮装することに関与した発起人は、株式会社に対し、出資の履行を仮装した発起人と同額の支払をする義務を負う。ただし、当該発起人（当該出資の履行を仮装したものを除く）がその職務を行うについて注意を怠らなかったことを証明した場合は、当該義務を負わない。"},
  {id:"K-04-12-010",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:10,rank:"B",src:"",
   q:"発起人が設立時発行株式の出資に係る金銭の払込みを仮装した場合、その出資の履行を仮装することに関与した設立時取締役は、株式会社に対し、払込みを仮装した出資に係る金銭の全額の支払をする義務を負わない。",ans:"誤り",
   exp:"52条の２第２項。発起人が金銭出資または金銭以外の財産の出資を仮装した場合には、その出資の履行を仮装することに関与した設立時取締役として法務省令で定める者も、株式会社に対し、出資の履行を仮装した発起人と同額の支払をする義務を負う。ただし、その者（当該出資の履行を仮装したものを除く）がその職務を行うについて注意を怠らなかったことを証明した場合は、当該義務を負わない。"},
  {id:"K-04-12-011",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:11,rank:"B",src:"",
   q:"発起人は、設立時発行株式の出資に係る金銭の払込みを仮装した場合には、払込みを仮装した出資に係る金銭の全額の支払がされた後でなければ、出資の履行を仮装した設立時株式について、設立時株主および株主の権利を行使することができない。",ans:"正しい",
   exp:"52条の２第４項。仮装した発起人による支払義務等が履行されない間は、本来拠出されるべき財産が拠出されていない以上、当該発起人に株主の権利の行使を認めるのは相当でないためである。"},
  {id:"K-04-12-012",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:12,rank:"B",src:"平28Ⅱ問題４ウ類",
   q:"発起人により出資の履行が仮装された設立時発行株式を譲り受けた者は、その者に悪意または重大な過失がある場合を除き、当該設立時発行株式についての設立時株主および株主の権利を行使することができる。",ans:"正しい",
   exp:"52条の２第５項。発起人が出資の履行を仮装した場合において、出資の履行が仮装された当該設立時発行株式またはその株主となる権利を譲り受けた者は、その者が出資の履行の仮装について悪意または重大な過失がない限り、当該設立時発行株式についての設立時株主および株主の権利を行使することができる。出資の履行が仮装されたことを知らずに株式を譲り受けた者についてまで株主の権利の行使を認めないこととすると、株式取引の安全を害するためである。"},
  {id:"K-04-12-013",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:13,rank:"B",src:"令４Ⅰ問題４エ",
   q:"設立時発行株式の払込みを仮装した設立時募集株式の引受人は、株式会社に対し、払込みを仮装した払込金額の全額の支払をする義務を負う。",ans:"正しい",
   exp:"102条の２第１項。当該責任は、無過失責任である。また、払込みを仮装することに関与した発起人または設立時取締役についても、発起人が出資の履行を仮装した場合と同様の責任（52条の２第２項）を負う（103条２項）。"},
  {id:"K-04-12-014",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:14,rank:"B",src:"",
   q:"設立時募集株式引受人が設立時募集株式の払込金額の払込みを仮装したことによる支払義務を免除するためには、総株主の同意は不要である。",ans:"誤り",
   exp:"102条の２第２項。設立時募集株式引受人が設立時募集株式の払込金額の払込みを仮装したことによる支払義務を免除するためには、総株主の同意を要する。これは、払込みを仮装することに関与した発起人または設立時取締役の支払義務を免除する際も同様である（103条３項）。さらに、発起人が出資の履行を仮装した場合の当該発起人および出資の履行を仮装することに関与した発起人または設立時取締役の支払義務を免除する場合も総株主の同意が必要である（55条）。"},
  {id:"K-04-12-015",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:15,rank:"B",src:"令４Ⅱ問題３ウ類",
   q:"設立時募集株式引受人は、設立時募集株式の出資に係る払込みを仮装した場合には、当該設立時募集株式引受人の支払、または、払込みを仮装することに関与した発起人または設立時取締役の支払がされた後でなければ、払込みを仮装した設立時発行株式について、設立時株主および株主の権利を行使することができない。",ans:"正しい",
   exp:"102条３項。"},
  {id:"K-04-12-016",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:16,rank:"B",src:"令８Ⅰ問題４ア",
   q:"設立時募集株式の引受人による金銭の払込みの仮装に関与した発起人が、法定の責任に基づき、払込みを仮装した払込金額の全額を支払ったときは、当該発起人は、払込みを仮装した設立時発行株式について、設立時株主および株主の権利を行使することができる。",ans:"誤り",
   exp:"102条３項参照。設立時募集株式引受人は、払込みを仮装した場合には、当該設立時募集株式引受人の支払（102条の２第１項）、または、払込みを仮装することに関与した発起人または設立時取締役の支払（103条２項本文）がされた後でなければ、払込みを仮装した設立時発行株式について、設立時株主および株主の権利を行使することができない（102条３項）。設立時募集株式引受人が払込みを仮装した場合に、発起人が支払いをしたからといって、当該発起人が設立時株主および株主の権利を行使することができるようになるわけではない。"},
  {id:"K-04-12-017",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:17,rank:"B",src:"平28Ⅱ問題４ウ類",
   q:"設立時募集株式引受人により払込みが仮装された設立時発行株式の株主となる権利を譲り受けた者は、当該設立時発行株式についての設立時株主および株主の権利を行使することができる。",ans:"誤り",
   exp:"102条４項。設立時募集株式引受人により払込みが仮装された設立時発行株式の株主となる権利を譲り受けた者は、その者が払込みの仮装について悪意または重大な過失がない限り、当該設立時発行株式についての設立時株主および株主の権利を行使することができる。"},
  {id:"K-04-12-018",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:18,rank:"A",src:"",
   q:"発起人は、株式会社の設立についてその任務を怠ったときは、当該株式会社に対して、これによって生じた損害を賠償する責任を負う。",ans:"正しい",
   exp:"53条１項。会社の成立を前提とした、発起人等の会社に対する損害賠償責任であり、成立後の役員等の会社に対する損害賠償責任（423条）と同趣旨の規定である。なお、設立時取締役および設立時監査役も、会社に対して、同様の責任を負う。"},
  {id:"K-04-12-019",subject:"企業法",chapter:"第4章 設立",sub:"12. 設立関係者の責任",num:19,rank:"A",src:"平30Ⅰ問題３ウ類・平29Ⅰ問題４ウ類・平22Ⅰ問題３イ類",
   q:"設立時取締役は、株式会社の設立についてその任務を怠ったときは、これによって第三者に生じた損害を賠償する責任を負う。",ans:"誤り",
   exp:"53条２項。設立時取締役がその職務を行うについて悪意または重大な過失があったときは、当該設立時取締役は、これによって第三者に生じた損害を賠償する責任を負う。これは、会社の成立を前提とした、発起人等の第三者に対する損害賠償責任であり、成立後の役員等の第三者に対する損害賠償責任（429条）と同趣旨の規定である。なお、発起人および設立時監査役も、第三者に対して、同様の責任を負う。"},

function initFirebase(){
  try {
    if(window.firebase && !firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      syncStatus = "online";
      listenCloudData();

    syncStatus = "offline";
  }
}

// クラウドからの変更をリアルタイム監視（他端末での操作を瞬時に反映）
function listenCloudData(){
  if(!db) return;
  db.collection("userdata").doc("main_profile").onSnapshot((doc) => {
    if(!doc.exists) return;
    const data = doc.data();
    if(!data) return;

    isRemoteUpdating = true;
    try {
      if(data.statusMap) { statusMap = data.statusMap; localStorage.setItem(LS_STATUS, JSON.stringify(statusMap)); }
      if(data.mistakeCountMap) { mistakeCountMap = data.mistakeCountMap; localStorage.setItem(LS_MISTAKES, JSON.stringify(mistakeCountMap)); }
      if(data.logArr) { logArr = data.logArr; localStorage.setItem(LS_LOG, JSON.stringify(logArr)); }
      if(data.starMap) { starMap = data.starMap; localStorage.setItem(LS_STAR, JSON.stringify(starMap)); }
      if(data.notesList) { notesList = data.notesList; localStorage.setItem(LS_NOTES, JSON.stringify(notesList)); }
      if(data.memoMap) { memoMap = data.memoMap; localStorage.setItem(LS_MEMOS, JSON.stringify(memoMap)); }
      syncStatus = "online";
      render();
    } finally {
      isRemoteUpdating = false;
    }
  }, (err) => {
    console.warn("Firestore snapshot error:", err);
    syncStatus = "offline";
  });
}

// 端末側の変更をクラウドへアップロード（デバウンス付き）
let saveCloudTimer = null;
function triggerCloudSave(){
  if(isRemoteUpdating || !db) return;
  syncStatus = "syncing";
  renderSyncBadge();

  clearTimeout(saveCloudTimer);
  saveCloudTimer = setTimeout(() => {
    db.collection("userdata").doc("main_profile").set({
      statusMap,
      mistakeCountMap,
      logArr,
      starMap,
      notesList,
      memoMap,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(() => {
      syncStatus = "online";
      renderSyncBadge();
    }).catch((err) => {
      console.warn("Firestore save error:", err);
      syncStatus = "offline";
      renderSyncBadge();
    });
  }, 400);
}

function renderSyncBadge(){
  const el = document.getElementById("syncBadgeEl");
  if(!el) return;
  if(syncStatus === "online"){
    el.className = "sync-badge online";
    el.innerHTML = '<span class="sync-dot"></span>クラウド同期中';
  } else if(syncStatus === "syncing"){
    el.className = "sync-badge syncing";
    el.innerHTML = '<span class="sync-dot"></span>同期中...';
  } else {
    el.className = "sync-badge";
    el.innerHTML = '<span class="sync-dot" style="background:var(--muted)"></span>ローカル保存中';
  }
}

const st = id => statusMap[id] || "未着手";
const misCnt = id => mistakeCountMap[id] || 0;
const qsOf = subj => QUESTIONS.filter(q => q.subject === subj);

function stats(list){
  const s = {total:list.length, comp:0, vague:0, mis:0, un:0};
  list.forEach(q => {
    const x = st(q.id);
    if(x === "コンプリート") s.comp++;
    else if(x === "曖昧") s.vague++;
    else if(x === "間違えた") s.mis++;
    else s.un++;
  });
  s.pct = s.total ? Math.round(s.comp / s.total * 100) : 0;
  return s;
}

function bar(s, h=5){
  if(!s.total) return `<div class="bar" style="height:${h}px"></div>`;
  const w = n => (n / s.total * 100).toFixed(1) + "%";
  return `<div class="bar" style="height:${h}px">
    <i style="width:${w(s.comp)};background:var(--green)"></i>
    <i style="width:${w(s.vague)};background:var(--amber)"></i>
    <i style="width:${w(s.mis)};background:var(--red)"></i>
  </div>`;
}

    if(top.v === "subjects") root.innerHTML = vSubjects();
    else if(top.v === "subject") root.innerHTML = vSubject(top.si);
    else if(top.v === "chapter") root.innerHTML = vChapter(top.si, top.ci);
  } else if(state.tab === "notes"){
    root.innerHTML = vNotes();
  } else {
    root.innerHTML = vRecord();
  }
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
}

// 1. ホーム
function vSubjects(){
  const all = stats(QUESTIONS);
  const today = new Date().toISOString().slice(0,10);
  const todayCount = logArr.filter(l => l.t.startsWith(today)).length;

  return `
  <header class="appbar">
    <div class="appbar-in">
      <h1>短答一問一答</h1>
      <div id="syncBadgeEl" class="sync-badge">
        <span class="sync-dot"></span>読込中...
      </div>
    </div>
  </header>
  <div class="content">
    <div class="stats-banner">
      <div class="stat-box"><div class="stat-label">今日の解答</div><div class="stat-val">${todayCount}<small>問</small></div></div>
      <div class="stat-box"><div class="stat-label">要点マーカー</div><div class="stat-val">${notesList.length}<small>箇所</small></div></div>
      <div class="stat-box"><div class="stat-label">全体の達成率</div><div class="stat-val">${all.pct}<small>%</small></div></div>
    </div>

    <div class="section-label">科目を選択</div>
    <div class="tiles">
      ${SUBJECTS.map((s, i) => {
        const list = qsOf(s.key);
        const x = stats(list);
        return `
        <div class="tile" onclick="nav({v:'subject', si:${i}})">
          <div class="tile-head">
            <div class="tile-title">${s.key}</div>
            ${x.mis ? `<span class="badge-mistake">✕ ${x.mis}</span>` : ""}
          </div>
          <div class="tile-desc">${s.desc}</div>
          ${list.length ? `
          <div class="tile-foot">
            <div class="tile-row"><span>達成率 ${x.pct}%</span><b>${x.comp}/${x.total}</b></div>

          </div>` : `<div class="tile-empty">問題未登録</div>`}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

// 2. 章選択
function vSubject(si){
  const s = SUBJECTS[si];
  const list = qsOf(s.key);
  const x = stats(list);
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(list.map(q => q.chapter))];

  return `
  <header class="appbar">
    <div class="appbar-in">
      <button class="iconbtn" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>

    </div>
  </header>
  <div class="content">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;">

      </div>
      ${bar(x, 8)}
      <div class="legend">
        <span><i class="dot d-comp"></i>コンプリート<b>${x.comp}</b></span>

        <span><i class="dot d-vague"></i>曖昧<b>${x.vague}</b></span>

      <button class="qbtn red" ${x.mis ? "" : "disabled"} onclick="quickStart(${si}, -1, '間違えた')">
        <b>${x.mis}</b><span>間違えた問題<br>だけ解く</span>
      </button>
      <button class="qbtn amber" ${x.vague ? "" : "disabled"} onclick="quickStart(${si}, -1, '曖昧')">
        <b>${x.vague}</b><span>曖昧な問題<br>だけ解く</span>
      </button>
    </div>

    <div class="section-label">章を選択</div>
    <div class="list">
      <div class="row all" onclick="openSheet(${si}, -1)">
        <div class="row-main">
          <div class="row-title">すべての章から出題</div>
          <div class="row-sub">${list.length}問 · 絞り込み設定へ</div>
        </div>
        <svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </div>
      ${chapters.map((ch, ci) => {
        const clist = list.filter(q => q.chapter === ch);
        const cx = stats(clist);
        return `
        <div class="row" ${clist.length ? `onclick="nav({v:'chapter', si:${si}, ci:${ci}})"` : "style='opacity:0.5;'"} >
          <div class="row-main">
            <div class="row-title">${ch}</div>
            ${clist.length ? `
            <div class="row-sub">${cx.comp}/${cx.total}問 · 達成率${cx.pct}% ${cx.mis ? `<span style="color:var(--red);font-weight:700;margin-left:6px;">✕${cx.mis}</span>` : ""}</div>
            ${bar(cx, 4)}` : `<div class="row-sub">未登録</div>`}
          </div>
          ${clist.length ? `<svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

// 3. 各章の問題一覧
function vChapter(si, ci){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const chName = chapters[ci];
  const list = qsOf(s.key).filter(q => q.chapter === chName);
  const x = stats(list);

  const groups = {};
  list.forEach(q => {
    if(!groups[q.sub]) groups[q.sub] = [];
    groups[q.sub].push(q);
  });

  return `
  <header class="appbar">
    <div class="appbar-in">
      <button class="iconbtn" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <h1>${chName}</h1>
    </div>
  </header>
  <div class="content">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;">
        <span>進捗</span><span>${x.comp} / ${x.total}問 (${x.pct}%)</span>
      </div>
      ${bar(x, 8)}
      <div class="legend">
        <span><i class="dot d-comp"></i>コンプリート<b>${x.comp}</b></span>
        <span><i class="dot d-mis"></i>間違えた<b>${x.mis}</b></span>
        <span><i class="dot d-vague"></i>曖昧<b>${x.vague}</b></span>
      </div>
    </div>

    <div style="margin-top:14px;">
      <button class="primary-btn" onclick="openSheet(${si}, ${ci})">この章の問題を解く（${list.length}問）</button>
    </div>

    <div class="quick" style="grid-template-columns:1fr 1fr 1fr;">
      <button class="qbtn red" ${x.mis ? "" : "disabled"} onclick="quickStart(${si}, ${ci}, '間違えた')">
        <b>${x.mis}</b><span>間違えた<br>問題</span>
      </button>
      <button class="qbtn amber" ${x.vague ? "" : "disabled"} onclick="quickStart(${si}, ${ci}, '曖昧')">
        <b>${x.vague}</b><span>曖昧な<br>問題</span>
      </button>
      <button class="qbtn" style="border-color:#bfdbfe;background:#eff6ff;color:var(--primary);" ${list.filter(q => memoMap[q.id] && memoMap[q.id].trim()).length ? "" : "disabled"} onclick="quickStartMemo(${si}, ${ci})">
        <b>${list.filter(q => memoMap[q.id] && memoMap[q.id].trim()).length}</b><span>📝 メモあり<br>問題</span>
      </button>
    </div>

    <div class="section-label">
      <span>問題一覧（${list.length}問）</span>
      <span style="font-size:11.5px;color:var(--muted);font-weight:normal;">タップで折りたたみ</span>
    </div>

    <div class="list">
      ${Object.keys(groups).map(subTitle => {
        const items = groups[subTitle];
        const isOpen = openSections[subTitle] !== false;
        return `
        <div class="sec-group">
          <div class="sec-header ${isOpen ? 'open' : ''}" onclick="toggleAccordion('${subTitle}')">
            <div class="sec-header-left">
              <span>${subTitle}</span>
              <span class="sec-badge">${items.length}問</span>
            </div>
            <div class="sec-header-right">
              <button class="sec-play-btn" onclick="event.stopPropagation(); startSectionQuiz(${si}, ${ci}, '${subTitle}')" title="この節だけ演習">
                <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>
                この節を解く
              </button>
              <svg class="sec-arrow" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
          </div>
          <div class="sec-items ${isOpen ? 'open' : ''}">
            ${items.map(q => {
              const qStatus = st(q.id);
              const mCount = misCnt(q.id);
              const hasMemo = Boolean(memoMap[q.id] && memoMap[q.id].trim());
              let dotClass = "d-un";
              if(qStatus === "コンプリート") dotClass = "d-comp";
              else if(qStatus === "間違えた") dotClass = "d-mis";
              else if(qStatus === "曖昧") dotClass = "d-vague";

              return `
              <div class="qitem" onclick="startSingleQuiz('${q.id}')">
                <i class="dot ${dotClass}"></i>
                <div class="qi-main">
                  <div class="qi-meta">
                    <span>問題${q.num} · ランク${q.rank} · ${qStatus}</span>
                    ${mCount > 0 ? `<span class="badge-mis-count">誤答 ${mCount}回</span>` : ""}
                    ${hasMemo ? `<span class="badge-has-memo">📝 メモあり</span>` : ""}
                  </div>
                  <div class="qi-text">${q.q}</div>
                </div>
                <button class="star ${starMap[q.id] ? 'on' : ''}" onclick="event.stopPropagation(); toggleStar('${q.id}')">
                  <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </button>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function toggleAccordion(subTitle){
  openSections[subTitle] = !(openSections[subTitle] !== false);
  render();
}

function toggleStar(id){
  if(starMap[id]) delete starMap[id];
  else starMap[id] = true;
  localStorage.setItem(LS_STAR, JSON.stringify(starMap));
  triggerCloudSave();
  render();
}

// 4. 要点ノート画面（マーカー一覧タブ：科目→章→節の絞り込み対応）
let noteFilterSubj = "すべて";
let noteFilterChap = "すべて";
let noteFilterSec = "すべて";
let openNoteSections = {}; // アコーディオン開閉状態

function vNotes(){
  // 登録済みノートから利用可能な科目一覧
  const availableSubjs = Array.from(new Set(notesList.map(n => n.subject)));
  
  // 科目フィルター
  let filtered = notesList;
  if(noteFilterSubj !== "すべて"){
    filtered = filtered.filter(n => n.subject === noteFilterSubj);
  }

  // 選択科目に紐づく章一覧
  const availableChaps = Array.from(new Set(filtered.map(n => n.chapter)));
  if(noteFilterChap !== "すべて" && !availableChaps.includes(noteFilterChap)){
    noteFilterChap = "すべて";
  }

  // 章フィルター
  if(noteFilterChap !== "すべて"){
    filtered = filtered.filter(n => n.chapter === noteFilterChap);
  }

  // 選択章に紐づく節（論点）一覧
  const availableSecs = Array.from(new Set(filtered.map(n => n.sub)));
  if(noteFilterSec !== "すべて" && !availableSecs.includes(noteFilterSec)){
    noteFilterSec = "すべて";
  }

  // 節フィルター
  if(noteFilterSec !== "すべて"){
    filtered = filtered.filter(n => n.sub === noteFilterSec);
  }

  // 節（論点）ごとにグループ化
  const secGroups = {};
  filtered.forEach(item => {
    const key = `${item.subject} › ${item.chapter} › ${item.sub}`;
    if(!secGroups[key]) secGroups[key] = [];
    secGroups[key].push(item);
  });

  return `
  <header class="appbar">
    <div class="appbar-in">
      <h1>要点マーカーノート</h1>
      <span style="font-size:12px;font-weight:700;color:var(--primary);">${filtered.length}件</span>
    </div>
  </header>
  <div class="content">
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5;">
      解説文でマーカーを引いた重要ポイントです。科目や章で絞り込んで、苦手論点を集中的に総復習できます。
    </div>

    <!-- 絞り込みフィルターエリア -->
    <div class="card" style="padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;">
      <!-- 1. 科目セレクター -->
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11.5px;font-weight:700;color:var(--muted);width:36px;flex-shrink:0;">科目</span>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;">
          <button class="fchip ${noteFilterSubj === 'すべて' ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteSubj('すべて')">すべて</button>
          ${SUBJECTS.map(s => {
            const cnt = notesList.filter(n => n.subject === s.name).length;
            if(cnt === 0) return "";
            return `<button class="fchip ${noteFilterSubj === s.name ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteSubj('${s.name}')">${s.name} <small>(${cnt})</small></button>`;
          }).join("")}
        </div>
      </div>

      <!-- 2. 章セレクター（科目が選択されている場合） -->
      ${noteFilterSubj !== "すべて" && availableChaps.length > 1 ? `
      <div style="display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed var(--line);">
        <span style="font-size:11.5px;font-weight:700;color:var(--muted);width:36px;flex-shrink:0;">章</span>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;">
          <button class="fchip ${noteFilterChap === 'すべて' ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteChap('すべて')">すべての章</button>
          ${availableChaps.map(ch => {
            const cnt = notesList.filter(n => n.subject === noteFilterSubj && n.chapter === ch).length;
            return `<button class="fchip ${noteFilterChap === ch ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteChap('${ch}')">${ch} <small>(${cnt})</small></button>`;
          }).join("")}
        </div>
      </div>
      ` : ""}

      <!-- 3. 節セレクター（章まで絞り込まれている場合） -->
      ${noteFilterChap !== "すべて" && availableSecs.length > 1 ? `
      <div style="display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed var(--line);">
        <span style="font-size:11.5px;font-weight:700;color:var(--muted);width:36px;flex-shrink:0;">節</span>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;">
          <button class="fchip ${noteFilterSec === 'すべて' ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteSec('すべて')">すべての節</button>
          ${availableSecs.map(sc => {
            const cnt = notesList.filter(n => n.subject === noteFilterSubj && n.chapter === noteFilterChap && n.sub === sc).length;
            return `<button class="fchip ${noteFilterSec === sc ? 'on' : ''}" style="padding:4px 10px;font-size:12px;" onclick="setNoteSec('${sc}')">${sc} <small>(${cnt})</small></button>`;
          }).join("")}
        </div>
      </div>
      ` : ""}
    </div>

    <!-- ノート一覧表示（節ごとに折りたたみアコーディオン） -->
    ${filtered.length ? `
      <div class="list">
        ${Object.keys(secGroups).map(groupKey => {
          const items = secGroups[groupKey];
          const isOpen = openNoteSections[groupKey] !== false; // デフォルト展開
          return `
          <div class="sec-group" style="margin-bottom:12px;">
            <div class="sec-header ${isOpen ? 'open' : ''}" onclick="toggleNoteSection('${groupKey}')" style="background:var(--surface);">
              <div class="sec-header-left">
                <span style="font-weight:700;font-size:13px;">${groupKey}</span>
                <span class="sec-badge">${items.length}件</span>
              </div>
              <svg class="sec-arrow" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>
            <div class="sec-items ${isOpen ? 'open' : ''}" style="padding:8px 0 0;">
              ${items.map(item => {
                const origIdx = notesList.findIndex(x => x.qid === item.qid && x.text === item.text);
                return `
                <div class="note-card" onclick="startSingleQuiz('${item.qid}')">
                  <div class="note-meta">
                    <span style="font-weight:600;display:flex;align-items:center;gap:6px;">
                      <span class="note-target-badge ${item.target === 'question' ? 'q' : 'exp'}">${item.target === 'question' ? '問題文' : '解説'}</span>
                      <span style="color:var(--primary);">問題 ${item.qnum}</span>
                    </span>
                    <button class="btn-del-note" title="マーカー削除" onclick="event.stopPropagation(); deleteNote(${origIdx})">
                      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                  </div>
                  <div class="note-text">${item.text}</div>
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    ` : `
      <div class="card" style="text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;">
        該当する要点マーカーがありません。<br>
        演習中に解説の重要箇所をなぞって「マーカー保存」するとここに蓄積されます。
      </div>
    `}
  </div>`;
}

function setNoteSubj(s){
  noteFilterSubj = s;
  noteFilterChap = "すべて";
  noteFilterSec = "すべて";
  render();
}
function setNoteChap(c){
  noteFilterChap = c;
  noteFilterSec = "すべて";
  render();
}
function setNoteSec(sc){
  noteFilterSec = sc;
  render();
}
function toggleNoteSection(key){
  openNoteSections[key] = !(openNoteSections[key] !== false);
  render();
}

function deleteNote(idx){
  if(confirm("このマーカー要点を削除しますか？")){
    notesList.splice(idx, 1);
    localStorage.setItem(LS_NOTES, JSON.stringify(notesList));
    triggerCloudSave();
    render();
  }
}

// 5. 出題設定モーダル
let quizSettings = { status:["未着手","間違えた","曖昧","コンプリート"], rank:["A","B","C"], mistakeOnly:false, memoOnly:false, order:"seq", section:"すべて" };

function openSheet(si, ci, sectionName = "すべて"){
  quizSettings.section = sectionName;
  state.sheet = { si, ci };
  renderSheet();
}
function closeSheet(){
  state.sheet = null;
  document.getElementById("sheet").innerHTML = "";
  document.body.classList.remove("lock");
}

function renderSheet(){
  const { si, ci } = state.sheet;
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  let pool = qsOf(s.key).filter(q => !targetChapter || q.chapter === targetChapter);

  // 利用可能な節一覧
  const availableSections = Array.from(new Set(pool.map(q => q.sub)));

  document.body.classList.add("lock");
  document.getElementById("sheet").innerHTML = `
  <div class="backdrop" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <b>出題設定</b>
      <button onclick="closeSheet()">キャンセル</button>
    </div>
    <div class="opt">
      <div class="opt-label">出題範囲</div>
      <div style="font-size:14px;font-weight:700;">${s.key} ${targetChapter ? '› ' + targetChapter : '（全範囲）'} (${pool.length}問)</div>
    </div>
    ${availableSections.length > 1 ? `
    <div class="opt">
      <div class="opt-label">節・論点（絞り込み）</div>
      <div class="chips">
        <button class="fchip ${quizSettings.section === 'すべて' ? 'on' : ''}" onclick="setQuizSection('すべて')">すべての節</button>
        ${availableSections.map(secName => `
          <button class="fchip ${quizSettings.section === secName ? 'on' : ''}" onclick="setQuizSection('${secName}')">${secName}</button>
        `).join("")}
      </div>
    </div>
    ` : ""}
    <div class="opt">
      <div class="opt-label">記憶度（絞り込み）</div>
      <div class="chips">
        ${["未着手","間違えた","曖昧","コンプリート"].map(stName => `
          <button class="fchip ${quizSettings.status.includes(stName) ? 'on' : ''}" onclick="toggleSetting('status','${stName}')">${stName}</button>
        `).join("")}
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">ランク（重要度）</div>
      <div class="chips">
        ${["A","B","C"].map(r => `
          <button class="fchip ${quizSettings.rank.includes(r) ? 'on' : ''}" onclick="toggleSetting('rank','${r}')">ランク${r}</button>
        `).join("")}
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">条件絞り込み（特訓）</div>
      <div class="chips">
        <button class="fchip ${quizSettings.mistakeOnly ? 'on' : ''}" onclick="toggleMistakeOnly()">過去に間違えたことがある問題のみ</button>
        <button class="fchip ${quizSettings.memoOnly ? 'on' : ''}" onclick="toggleMemoOnly()">📝 Myメモが書いてある問題のみ</button>
      </div>
    </div>
    <div class="opt">
      <div class="opt-label">出題順序</div>
      <div class="seg">
        <button class="${quizSettings.order === 'seq' ? 'on' : ''}" onclick="setOrder('seq')">順番通り</button>
        <button class="${quizSettings.order === 'rand' ? 'on' : ''}" onclick="setOrder('rand')">ランダム</button>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button class="primary-btn" onclick="startFilteredQuiz(${si}, ${ci})">解答を開始する</button>
    </div>
  </div>`;
}

function toggleSetting(type, val){
  const arr = quizSettings[type];
  const idx = arr.indexOf(val);
  if(idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  renderSheet();
}
function toggleMistakeOnly(){
  quizSettings.mistakeOnly = !quizSettings.mistakeOnly;
  renderSheet();
}
function toggleMemoOnly(){
  quizSettings.memoOnly = !quizSettings.memoOnly;
  renderSheet();
}
function setQuizSection(sec){
  quizSettings.section = sec;
  renderSheet();
}
function setOrder(ord){
  quizSettings.order = ord;
  renderSheet();
}

function startFilteredQuiz(si, ci){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  let pool = qsOf(s.key).filter(q => !targetChapter || q.chapter === targetChapter);

  // 節・論点フィルター
  if(quizSettings.section && quizSettings.section !== "すべて"){
    pool = pool.filter(q => q.sub === quizSettings.section);
  }

  pool = pool.filter(q => {
    if(!quizSettings.status.includes(st(q.id))) return false;
    if(!quizSettings.rank.includes(q.rank)) return false;
    if(quizSettings.mistakeOnly && misCnt(q.id) === 0) return false;
    if(quizSettings.memoOnly && !(memoMap[q.id] && memoMap[q.id].trim())) return false;
    return true;
  });

  if(quizSettings.order === 'rand'){
    pool.sort(() => Math.random() - 0.5);
  }
  closeSheet();
  if(!pool.length){
    alert("条件に一致する問題がありませんでした");
    return;
  }
  launchQuiz(pool, `${s.key} ${targetChapter || ''} ${quizSettings.section !== 'すべて' ? '› ' + quizSettings.section : ''}`);
}

function startSectionQuiz(si, ci, subTitle){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  const pool = qsOf(s.key).filter(q => (!targetChapter || q.chapter === targetChapter) && q.sub === subTitle);
  launchQuiz(pool, `${subTitle}（全${pool.length}問）`);
}

function quickStartMemo(si, ci){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  const pool = qsOf(s.key).filter(q => (!targetChapter || q.chapter === targetChapter) && memoMap[q.id] && memoMap[q.id].trim());
  launchQuiz(pool, `📝 メモ付き問題演習（${pool.length}問）`);
}

function quickStart(si, ci, statusName){
  const s = SUBJECTS[si];
  const chapters = CHAPTER_MASTER[s.key] || [...new Set(qsOf(s.key).map(q => q.chapter))];
  const targetChapter = ci >= 0 ? chapters[ci] : null;
  const pool = qsOf(s.key).filter(q => (!targetChapter || q.chapter === targetChapter) && st(q.id) === statusName);
  launchQuiz(pool, `${statusName}問題演習`);
}

function startSingleQuiz(id){
  const q = QUESTIONS.find(x => x.id === id);
  launchQuiz([q], "個別演習");
}

// 6. 演習画面
function launchQuiz(list, title){
  state.session = { list, title, idx:0, answered:false };
  document.getElementById("overlay").classList.add("show");
  document.body.classList.add("lock");
  renderQuizCard();
}

function renderQuizCard(){
  const S = state.session;
  const q = S.list[S.idx];
  const ov = document.getElementById("overlay");
  const mCount = misCnt(q.id);

  ov.innerHTML = `
  <div class="qz-bar">
    <div class="qz-bar-in">
      <button class="iconbtn" onclick="exitQuiz()"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      <div class="qz-title">${S.title} (${S.idx+1}/${S.list.length})</div>
    </div>
    <div class="qz-progress"><i style="width:${((S.idx+1)/S.list.length)*100}%"></i></div>
  </div>
  <div class="qz-body">
    <div class="qz-card">
      <div class="qz-meta">${q.chapter} › ${q.sub}</div>
      <div class="qz-header">
        <span style="font-size:14px;font-weight:800;">問題 ${q.num}</span>
        <span class="rank-badge">ランク ${q.rank}</span>
        ${mCount > 0 ? `<span class="badge-mis-count">通算誤答 ${mCount}回</span>` : ""}
      </div>
      <div class="qz-question" id="qzQuestionContainer">${getHighlightedQuestionHtml(q)}</div>

      <div class="choices">
        <button class="choice" id="btnTrue" onclick="answer('正しい')">○ 正しい</button>
        <button class="choice" id="btnFalse" onclick="answer('誤り')">× 誤り</button>
        <button class="choice" id="btnUnk" onclick="answer('不明')">? わからない</button>
      </div>

      <div id="quizFeedback" style="display:none;"></div>
    </div>
  </div>`;
}

function getHighlightedQuestionHtml(q){
  let qText = q.q;
  const qNotes = notesList.filter(n => n.qid === q.id && n.target === "question");
  qNotes.forEach(n => {
    if(qText.includes(n.text)){
      qText = qText.split(n.text).join(`<mark class="hl-mark">${n.text}</mark>`);
    }
  });
  return qText;
}

function getHighlightedExpHtml(q){
  let expText = q.exp;
  // この問題に付けられた解説マーカーをハイライト反映
  const qNotes = notesList.filter(n => n.qid === q.id && n.target !== "question");
  qNotes.forEach(n => {
    if(expText.includes(n.text)){
      expText = expText.split(n.text).join(`<mark class="hl-mark">${n.text}</mark>`);
    }
  });
  return expText;
}

function answer(userAns){
  const S = state.session;
  if(S.answered) return;
  S.answered = true;
  const q = S.list[S.idx];
  const isCorrect = userAns === q.ans;

  if(!isCorrect){
    mistakeCountMap[q.id] = (mistakeCountMap[q.id] || 0) + 1;
    localStorage.setItem(LS_MISTAKES, JSON.stringify(mistakeCountMap));
  }

  logArr.push({ t: new Date().toISOString(), id: q.id, correct: isCorrect });
  localStorage.setItem(LS_LOG, JSON.stringify(logArr));

  document.getElementById("btnTrue").disabled = true;
  document.getElementById("btnFalse").disabled = true;
  document.getElementById("btnUnk").disabled = true;

  if(q.ans === "正しい") document.getElementById("btnTrue").classList.add("correct");
  else document.getElementById("btnFalse").classList.add("correct");

  if(!isCorrect && userAns === "正しい") document.getElementById("btnTrue").classList.add("wrong");
  if(!isCorrect && userAns === "誤り") document.getElementById("btnFalse").classList.add("wrong");

  const fb = document.getElementById("quizFeedback");
  fb.style.display = "block";
  const curMemo = memoMap[q.id] || "";

  fb.innerHTML = `
    <div class="judge ${isCorrect ? 'ok' : 'ng'}">
      <span>${isCorrect ? '正解！' : '不正解'}</span>
      <span style="font-size:13px;">正答：${q.ans === '正しい' ? '○ 正しい' : '× 誤り'}</span>
    </div>
    <div class="exp">
      <div class="exp-head">
        <div class="exp-title">解説</div>
        <div class="exp-actions">
          <button class="btn-marker-action" onclick="addHighlightFromSelection('${q.id}')">
            <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            選択マーカー保存
          </button>
          <button class="btn-ai-action" onclick="askAiQuestion('${q.id}')" title="Geminiで質問">
            ✨ Geminiに質問
          </button>
        </div>
      </div>
      <div class="exp-text" id="expTextContainer">${getHighlightedExpHtml(q)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">※ 解説を指でなぞって「選択マーカー保存」を押すと要点ノートに追加されます</div>

      <!-- 問題別メモ入力欄 -->
      <div class="memo-section">
        <div class="memo-head">
          <span class="memo-title">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Myメモ（AI回答のコピペや自分なりの覚え方）
          </span>
          <span class="memo-saved-tag" id="memoSavedTag_${q.id}">✓ 保存済</span>
        </div>
        <textarea class="memo-textarea" id="memoInput_${q.id}" placeholder="AIの回答や、自分が間違えた理由・覚え方をここにメモしておけます..." oninput="autoSaveMemo('${q.id}')">${curMemo}</textarea>
      </div>
    </div>
    <div class="rate-box">
      <div class="rate-title">習熟度を記録して次へ</div>
      <div class="rate-btns">
        <button class="rb red" onclick="submitRating('間違えた')">✕ 間違えた</button>
        <button class="rb amber" onclick="submitRating('曖昧')">△ 曖昧</button>
        <button class="rb green" onclick="submitRating('コンプリート')">○ 覚えた！</button>
      </div>
    </div>
  `;
}

function autoSaveMemo(qid){
  const el = document.getElementById("memoInput_" + qid);
  if(!el) return;
  memoMap[qid] = el.value;
  localStorage.setItem(LS_MEMOS, JSON.stringify(memoMap));
  triggerCloudSave();
  const tag = document.getElementById("memoSavedTag_" + qid);
  if(tag){
    tag.style.display = "inline";
    setTimeout(() => { if(tag) tag.style.display = "none"; }, 1500);
  }
}

function askAiQuestion(qid){
  const q = QUESTIONS.find(x => x.id === qid);
  if(!q) return;

  const promptText = `公認会計士試験（短答式）の「${q.subject}」を学習しています。
以下の問題と解説について、なぜこのような規定・考え方になっているのか（制度趣旨や背景、実務上の具体例）を、初心者にわかりやすく3行〜5行で噛み砕いて教えてください。

【論点】${q.chapter} › ${q.sub}
【問題${q.num}】
${q.q}
【解答】${q.ans}
【解説】
${q.exp}

※ ポイントを整理して解説してください。`;

  // クリップボードにコピーしてGeminiを開く
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(promptText).then(() => {
      openGeminiService(promptText);
    }).catch(() => {
      fallbackCopyAndOpenGemini(promptText);
    });
  } else {
    fallbackCopyAndOpenGemini(promptText);
  }
}

function fallbackCopyAndOpenGemini(text){
  const t = document.createElement("textarea");
  t.value = text;
  document.body.appendChild(t);
  t.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  openGeminiService(text);
}

function openGeminiService(promptText){
  // 自動で外部サイトに飛ばず、クリップボードへのコピー完了のみ通知する
  showToast("📋 Gemini用プロンプトをコピーしました！");
}

// iPad / iOS Safari 最適化セレクション管理
let lastCapturedSelectionText = "";
let lastCapturedQid = null;
let lastCapturedTarget = "exp"; // "exp" | "question"

document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : "";
  const bubble = document.getElementById("floatingMarkerBtn");

  if(text.length >= 2 && state.session && state.session.answered){
    const q = state.session.list[state.session.idx];
    const expBox = document.getElementById("expTextContainer");
    const qBox = document.getElementById("qzQuestionContainer");

    // 解説文の中の選択かチェック
    if(expBox && expBox.contains(sel.anchorNode)){
      lastCapturedSelectionText = text;
      lastCapturedQid = q.id;
      lastCapturedTarget = "exp";
      if(bubble) bubble.style.display = "flex";
      return;
    }
    // 問題文の中の選択かチェック（回答後のみ）
    if(qBox && qBox.contains(sel.anchorNode)){
      lastCapturedSelectionText = text;
      lastCapturedQid = q.id;
      lastCapturedTarget = "question";
      if(bubble) bubble.style.display = "flex";
      return;
    }
  }

  // 選択解除時（タップ等でバブルが消えるのは少し遅延）
  setTimeout(() => {
    const curSel = window.getSelection();
    if(!curSel || curSel.toString().trim().length < 2){
      if(bubble) bubble.style.display = "none";
    }
  }, 300);
});

function addHighlightFromCurrentSelection(){
  if(!lastCapturedQid || !lastCapturedSelectionText){
    showToast("マーカーを引きたい文字を選択してください");
    return;
  }
  executeAddHighlight(lastCapturedQid, lastCapturedSelectionText, lastCapturedTarget);
}

function addHighlightFromSelection(qid){
  const sel = window.getSelection();
  let text = sel ? sel.toString().trim() : "";
  if(!text && lastCapturedQid === qid && lastCapturedSelectionText){
    text = lastCapturedSelectionText;
  }
  if(!text || text.length < 2){
    showToast("文字を選択してください");
    return;
  }
  executeAddHighlight(qid, text, lastCapturedTarget || "exp");
}

function executeAddHighlight(qid, selectedText, target = "exp"){
  const q = QUESTIONS.find(x => x.id === qid);
  if(!q) return;

  // 重複チェック
  if(notesList.some(n => n.qid === qid && n.text === selectedText && n.target === target)){
    showToast("既にマーカー登録されています");
    return;
  }

  notesList.unshift({
    qid: q.id,
    subject: q.subject,
    chapter: q.chapter,
    sub: q.sub,
    qnum: q.num,
    target: target, // "exp" または "question"
    text: selectedText
  });
  localStorage.setItem(LS_NOTES, JSON.stringify(notesList));
  triggerCloudSave();

  // 画面の解説および問題文をハイライト再描画
  const expBox = document.getElementById("expTextContainer");
  if(expBox) expBox.innerHTML = getHighlightedExpHtml(q);
  const qBox = document.getElementById("qzQuestionContainer");
  if(qBox) qBox.innerHTML = getHighlightedQuestionHtml(q);

  const bubble = document.getElementById("floatingMarkerBtn");
  if(bubble) bubble.style.display = "none";
  window.getSelection().removeAllRanges();
  lastCapturedSelectionText = "";

  showToast(target === "question" ? "🖊 問題文のマーカーを登録しました" : "🖊 解説のマーカーを登録しました");
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toastNotification");
  const txt = document.getElementById("toastText");
  if(!el || !txt) return;
  txt.innerText = msg;
  el.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.display = "none";
  }, 1200); // 1.2秒後に自動でふわっと消える
}

function submitRating(rating){
  const S = state.session;
  const q = S.list[S.idx];
  statusMap[q.id] = rating;
  localStorage.setItem(LS_STATUS, JSON.stringify(statusMap));
  triggerCloudSave();

  if(S.idx < S.list.length - 1){
    S.idx++;
    S.answered = false;
    renderQuizCard();
    window.scrollTo(0,0);
  } else {
    alert("すべての問題を解き終えました！");
    exitQuiz();
  }
}

function exitQuiz(){
  state.session = null;
  document.getElementById("overlay").classList.remove("show");
  document.body.classList.remove("lock");
  render();
}

// 7. 学習記録
function vRecord(){
  const all = stats(QUESTIONS);
  const correctCount = logArr.filter(l => l.correct).length;
  const rate = logArr.length ? Math.round(correctCount / logArr.length * 100) : 0;

  const mistakeRanking = QUESTIONS.filter(q => misCnt(q.id) > 0)
    .sort((a,b) => misCnt(b.id) - misCnt(a.id))
    .slice(0, 5);

  return `
  <header class="appbar"><div class="appbar-in"><h1>学習記録</h1></div></header>
  <div class="content">
    <div class="stats-banner" style="grid-template-columns:1fr 1fr;">
      <div class="stat-box"><div class="stat-label">総解答回数</div><div class="stat-val">${logArr.length}<small>回</small></div></div>
      <div class="stat-box"><div class="stat-label">累計正答率</div><div class="stat-val">${rate}<small>%</small></div></div>
    </div>

    <div class="section-label">習熟度サマリー</div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;">
        <span>全科目のコンプリート率</span><span>${all.comp}/${all.total}問 (${all.pct}%)</span>
      </div>
      ${bar(all, 10)}
      <div class="legend" style="margin-top:14px;">
        <span><i class="dot d-comp"></i>コンプリート <b>${all.comp}</b>問</span>
        <span><i class="dot d-mis"></i>間違えた <b>${all.mis}</b>問</span>
        <span><i class="dot d-vague"></i>曖昧 <b>${all.vague}</b>問</span>
        <span><i class="dot d-un"></i>未着手 <b>${all.un}</b>問</span>
      </div>
    </div>

    <div class="section-label">間違えた回数が多い問題（ワースト）</div>
    <div class="list">
      ${mistakeRanking.length ? mistakeRanking.map(q => `
        <div class="qitem" onclick="startSingleQuiz('${q.id}')">
          <span class="badge-mis-count" style="font-size:12px;padding:3px 8px;">✕ ${misCnt(q.id)}回誤答</span>
          <div class="qi-main">
            <div class="qi-meta">${q.subject} · ${q.chapter} · 問題${q.num}</div>
            <div class="qi-text">${q.q}</div>
          </div>
        </div>
      `).join("") : `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">まだ間違えた記録はありません</div>`}
    </div>

    <div class="section-label">データ管理（保存・復元）</div>
    <div class="card" style="display:flex; flex-direction:column; gap:8px;">
      <button class="ghost-btn" onclick="exportData()">学習データをファイルにバックアップ</button>
      <button class="ghost-btn" style="color:var(--red);" onclick="resetData()">学習記録を初期化</button>
    </div>
  </div>`;
}

function exportData(){
  const blob = new Blob([JSON.stringify({ statusMap, mistakeCountMap, logArr, starMap, notesList, memoMap })], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `cpa_study_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function resetData(){
  if(confirm("解答履歴・マーカー・メモ・間違えた回数の記録をすべてリセットしますか？")){
    statusMap = {}; mistakeCountMap = {}; logArr = []; starMap = {}; notesList = []; memoMap = {};
    localStorage.removeItem(LS_STATUS);
    localStorage.removeItem(LS_MISTAKES);
    localStorage.removeItem(LS_LOG);
    localStorage.removeItem(LS_STAR);
    localStorage.removeItem(LS_NOTES);
    localStorage.removeItem(LS_MEMOS);
    triggerCloudSave();
    render();
  }
}

// 起動
render();
initFirebase();
</script>
