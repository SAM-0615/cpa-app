  {id:"K-02-02-132",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:7,rank:"B",src:"令４Ⅱ問題17 ア",
   q:"株式買取請求があった場合における株式の価格の決定について、効力発生日から30日以内に協議が調わない場合に、株式買取請求を受けた会社は、その期間の満了の日後30日以内に、裁判所に対し、価格の決定の申立てをすることができる。",ans:"正しい",
   exp:"株式買取請求があった場合における株式の価格の決定は、株主と株式会社との間の協議による（117条１項、182条の５第１項、470条１項、786条１項、798条１項、807条１項）。ただし、株式の価格の決定について、効力発生日（新設型再編の場合は、設立会社の成立の日）から30日以内に協議が調わないときは、株主または株式会社は、その期間の満了の日後30日以内に、裁判所に対し、価格の決定の申立てをすることができる（117条２項、182条の５第２項、470条２項、786条２項、798条２項、807条２項）。"},
  {id:"K-02-02-133",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:8,rank:"B",src:"平23Ⅱ問題18 エ",
   q:"新設合併における反対株主による株式買取請求に係る株式の価格の決定について、一定期間内に協議が調わない場合、株式買取請求をした株主は、裁判所に対し、公正な価格を調査させるため、検査役の選任を請求することができる。",ans:"誤り",
   exp:"807条２項。株式の価格の決定について、新設合併設立会社の成立の日から30日以内に協議が調わないときは、株主または新設合併消滅株式会社は、その期間の満了の日後30日以内に、裁判所に対し、価格の決定の申立てをすることができるが、価格を調査させるための検査役の選任の請求をすることはできない。"},
  {id:"K-02-02-134",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:9,rank:"C",src:"平30Ⅱ問題18 エ",
   q:"株式会社が吸収分割を行うに際し、吸収分割会社の株主による株式買取請求があった場合において、株式の買取価格の決定につき株主と株式会社との間に協議が調ったときは、当該株式会社は、吸収分割の効力発生日から60日以内にその支払をしなければならない。",ans:"正しい",
   exp:"786条１項。"},
  {id:"K-02-02-135",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:10,rank:"B",src:"",
   q:"株式買取請求があった場合において、株式会社は、株式の価格の決定があるまでは、株主に対し代金の支払いをすることができない。",ans:"誤り",
   exp:"117条５項、182条の５第５項、470条５項、786条５項、798条５項、807条５項。株式会社は、株式の価格の決定があるまでは、株主に対し、当該株式会社が公正な価格と認める額を支払うことができる。これにより、裁判所による価格決定前に株式買取請求を受けた株式会社が反対株主に対して一定額を支払うことを認められるため、株式会社が当該一定額に係る利息の負担を回避することができるのである。"},
  {id:"K-02-02-136",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (12) 反対株主の株式買取請求",num:11,rank:"C",src:"令４Ⅱ問題17 イ",
   q:"株式買取請求を受けた会社は、裁判所の決定した価格に対する効力発生日後の法定利率による利息を支払わなければならない。",ans:"誤り",
   exp:"117条５項、182条の５第５項、470条５項、786条５項、798条５項、807条５項。株式買取請求があった場合において、株式の買取価格の決定につき株主と株式会社との間に協議が調ったときは、当該株式会社は、効力発生日から60日以内にその支払をしなければならない（117条１項、182条の５第１項、470条１項、786条１項、798条１項、807条１項）。そして、期間内に代金が支払われない場合は、債務不履行となり、株式会社は、裁判所の決定した価格に対する効力発生日（新設型再編の場合は、設立会社の成立の日）から60日経過後の法定利率による利息をも支払わなければならない。"},
  {id:"K-02-02-137",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:1,rank:"A",src:"平29Ⅰ問題10 イ",
   q:"株主総会の招集の手続または決議の方法が法令もしくは定款に違反し、または著しく不公正な場合は、株主総会の決議取消事由に該当する。",ans:"正しい",
   exp:"831条１項１号。株主総会の決議の取消事由は、① 招集手続または決議方法が法令もしくは定款に違反し、または著しく不公正な場合（831条１項１号）、② 決議の内容が定款に違反する場合（同条項２号）、③ 決議について特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がされた場合（同条項３号）である。"},
  {id:"K-02-02-138",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:2,rank:"A",src:"令２Ⅰ問題９イ類",
   q:"株主総会の決議の内容が法令に違反する場合は、株主総会の決議取消事由に該当する。",ans:"誤り",
   exp:"830条２項。決議の内容が法令に違反する場合は、決議無効事由（830条２項）に該当する。なお、株主総会の決議の内容が定款に違反する場合は、株主総会の決議取消事由に該当する（831条１項２号）。"},
  {id:"K-02-02-139",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:3,rank:"A",src:"",
   q:"株主総会の決議について特別の利害関係を有する者が議決権を行使した場合は、株主総会の決議取消事由に該当する。",ans:"誤り",
   exp:"831条１項３号。株主総会の決議について特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がなされた場合は、株主総会の決議取消事由に該当する。特別利害関係とは、特定の株主が、決議について何らかの個人的利害関係を有する場合である。会社法は、決議について特別な利害関係を有する株主であっても、原則として議決権の行使を許容している（例外は自己株式の売主である（140条３項、160条４項、175条２項））。株主は株式会社の実質的所有者であるため、自己の利益を確保するために議決権を行使することが認められているのである。しかし、このような特別利害関係を有する株主が議決権を行使したことにより著しく不当な決議が行われた場合については、決議取消事由となる。"},
  {id:"K-02-02-140",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:4,rank:"A",src:"令３問題９ウ類・平29Ⅰ問題10 エ類・平20 問題９ア類",
   q:"株主総会の決議取消しの訴えは、株主総会の日から１年以内に限り、提起することができる。",ans:"誤り",
   exp:"831条１項柱書前段。株主総会の決議取消しの訴えは、株主総会の日から３か月以内に限り、提起することができる。"},
  {id:"K-02-02-141",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:5,rank:"B",src:"令８Ⅰ問題10 ア・令４Ⅰ問題10 ウ・平30Ⅱ問題11 ア",
   q:"最高裁判所の判例によれば、株主総会決議取消しの訴えを提起した後、提訴期間経過後に新たな取消事由を追加主張することは許されない。",ans:"正しい",
   exp:"最判昭51年12月24日。最高裁判所の判例によれば、提訴期間経過後は新たな取消事由を追加して主張することはできない。決議の取消しの訴えについて提訴期間が設けられている趣旨は、瑕疵が比較的軽微であり、瑕疵の有無や程度の判定も時の経過とともに困難となるため、可能な限り、早期に決議の効力を確定することにある。そうであるならば、提訴期間経過後に新たな取消事由を追加して主張することは、当該趣旨に反することになるためである。"},
  {id:"K-02-02-142",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:6,rank:"A",src:"令４Ⅰ問題10 エ・平25Ⅱ問題８イ類",
   q:"株式会社の債権者は、株主総会の決議の日から３か月以内に、訴えをもって当該決議の取消しを請求することができる。",ans:"誤り",
   exp:"831条１項柱書。決議の取消しを主張することができる者は、株主等（創立総会の場合は、株主等、設立時株主、設立時取締役または設立時監査役）である。ここで、株主等とは、以下の者をいう（828条２項１号かっこ書参照）。１監査役設置会社：株主、取締役、監査役または清算人２指名委員会等設置会社：株主、取締役、執行役または清算人３それ以外の会社：株主、取締役または清算人"},
  {id:"K-02-02-143",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:7,rank:"A",src:"平27Ⅱ問題７ウ",
   q:"指名委員会等設置会社において、株主総会の決議の内容が定款に違反する場合には、当該指名委員会等設置会社の執行役は、訴えをもって当該決議の取消しを請求することができない。",ans:"誤り",
   exp:"831条１項柱書前段。決議の内容が定款に違反する場合は、決議取消事由に該当する。また、執行役は株主等に該当するため、訴えをもって株主総会の決議の取消しを主張することができる。"},
  {id:"K-02-02-144",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:8,rank:"A",src:"平27Ⅱ問題７イ",
   q:"会計参与設置会社において、株主総会の決議の方法が著しく不公正である場合には、当該会計参与設置会社の会計参与は、訴えをもって当該決議の取消しを請求することができない。",ans:"正しい",
   exp:"831条１項柱書前段。問題６の解説参照。決議の方法が著しく不公正である場合は、決議取消事由に該当する。しかし、会計参与は主張権者に含まれない。"},
  {id:"K-02-02-145",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:9,rank:"A",src:"平27Ⅱ問題７エ",
   q:"会計監査人設置会社において、招集の手続に法令違反のある株主総会の決議により会計監査人が解任された場合には、当該会計監査人は、訴えをもって当該決議の取消しを請求することができない。",ans:"正しい",
   exp:"831条１項柱書前段。問題６の解説参照。招集の手続が法令に違反する場合は、決議取消事由に該当する。しかし、会計監査人は主張権者に含まれない。"},
  {id:"K-02-02-146",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:10,rank:"A",src:"平24Ⅱ問題８エ",
   q:"定款の定めにより監査の範囲を会計に関するものに限定された監査役は、訴えをもって株主総会の決議の取消しを請求することができない。",ans:"正しい",
   exp:"831条１項柱書。問題６の解説参照。株主総会の決議の取消しの訴えを提起することができる監査役は、監査役設置会社（２条９号）の監査役であるから、定款の定めにより監査の範囲を会計に関するものに限定された監査役は、株主総会の決議の取消しの訴えを請求することはできない。"},
  {id:"K-02-02-147",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:11,rank:"B",src:"令５Ⅱ問題10 ウ・平30Ⅱ問題11 イ",
   q:"最高裁判所の判例によれば、株主は、自己に対する株主総会の招集手続に瑕疵がない場合には、他の株主に対する招集手続に瑕疵があるときであっても、当該株主総会の決議の取消しの訴えを提起することができない。",ans:"誤り",
   exp:"最判昭42年9月28日。最高裁判所の判例によれば、株主は、他の株主に対する株主総会の招集手続に瑕疵があるときであっても、当該株主総会の決議の取消しの訴えを提起することができる。招集手続に瑕疵がある場合の決議取消しの訴えの制度は、手続の瑕疵それ自体に対する非難というよりは、むしろその瑕疵に公正な決議の成立が妨げられたかもしれないという意味での抗議を認める制度であり、決議の公正について利害関係をもつ他の株主についても主張を認めるべきだからである。"},
  {id:"K-02-02-148",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:12,rank:"B",src:"",
   q:"最高裁判所の判例によれば、計算書類等の承認決議がその手続に法令違反等があるとして当該計算書類等の承認決議の取消しの訴えが提起された場合において、当該承認決議について再決議がなされた等の特別の事情がない限り、その後の決算期において新たな計算書類等の承認がなされたときであっても、当該計算書類等の承認決議の取消しを求める訴えの利益は失われない。",ans:"正しい",
   exp:"最判昭58年６月７日。判例によれば、計算書類等の承認決議（先行決議）がその手続に法令違反等があるとして取り消された場合は、たとえ当該計算書類等の内容自体が適正であったとしても、承認決議は遡及的に無効となるため、当該計算書類等は未確定となる。そして当該承認決議について再決議がなされた等の特別の事情がない限り、その後の決算期において新たな計算書類等の承認がなされたとしても、過去の未確定の決算を前提としたものにならざるを得ず、新たな計算書類等の記載内容も不確定なものとなる。そのため、計算書類等の承認決議（先行決議）の取消しを求める訴えの利益は失われないものとされる。"},
  {id:"K-02-02-149",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:13,rank:"B",src:"令５Ⅰ問題８ウ類",
   q:"株主総会の決議取消しによって取締役となる者は、当該株主総会の決議の日から３か月以内に、訴えをもって当該決議の取消しを請求することができる。",ans:"正しい",
   exp:"831条１項柱書後段。"},
  {id:"K-02-02-150",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:14,rank:"B",src:"令２Ⅰ問題９エ",
   q:"全部取得条項付種類株式の取得が行われた場合に、これにより株主の地位を失った者は、当該全部取得条項付種類株式の取得を決定した株主総会の決議について、当該決議の取消しの訴えの原告適格を有しない。",ans:"誤り",
   exp:"831条１項柱書後段。決議の取消しにより株主（当該決議が創立総会の決議である場合にあっては、設立時株主）または取締役、監査役もしくは清算人（留任義務（346条１項、479条４項）により取締役、監査役または清算人としての権利義務を有する者を含み、決議が創立総会である場合にあっては設立時取締役または設立時監査役を含む）となる者も決議の取消しを主張することができる。すなわち、決議が取り消されれば地位を回復できる者（例えば、キャッシュ・アウトが株主総会の決議をもって行われ、そのキャッシュ・アウトにより株式を失った者や解任の決議により解任された取締役等）にも原告適格が認められる。"},
  {id:"K-02-02-151",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:15,rank:"A",src:"平27Ⅱ問題７ア",
   q:"株主総会において、ある議案に係る決議の方法が定款に違反する場合には、当該議案につき賛成の議決権を行使した株主は、訴えをもって当該決議の取消しを請求することができない。",ans:"誤り",
   exp:"831条１項柱書前段。株主総会の決議取消事由は、① 招集手続または決議方法が法令もしくは定款に違反し、または著しく不公正な場合、② 決議の内容が定款に違反する場合、③ 決議について特別の利害関係を有する者が議決権を行使したことによって、著しく不当な決議がされた場合である（831条１項各号）。したがって、決議の方法が定款に違反する場合は、決議取消事由に該当する。ここで、決議取消しの主張権者は、株主等（828条２項１号）である。株主等とは、株主、取締役または清算人（監査役設置会社では株主、取締役、監査役または清算人、指名委員会等設置会社では株主、取締役、執行役または清算人）をいう。ここで、賛成の議決権を行使した株主であっても主張権者から除外はされていないため、本肢は誤りである。"},
  {id:"K-02-02-152",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:16,rank:"B",src:"",
   q:"株主総会決議の取消しは、訴えによらずに主張することができる。",ans:"誤り",
   exp:"831条１項。株主総会決議の取消しは、必ず、決議取消しの訴えによって主張しなければならない。"},
  {id:"K-02-02-153",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:17,rank:"A",src:"令８Ⅰ問題10 ウ・平29Ⅰ問題10 ウ・平25Ⅱ問題８エ",
   q:"株主総会決議の取消しの訴えに係る請求を認容する確定判決は、第三者に対しその効力を有しない。",ans:"誤り",
   exp:"834条17号、838条。法律関係の画一的確定の観点から、決議取消判決は、第三者に対してもその効力を有する。すなわち、決議取消判決には対世的効力が認められているのである。"},
  {id:"K-02-02-154",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:18,rank:"A",src:"令８Ⅰ問題10 イ・令４Ⅰ問題10 イ類・平29Ⅰ問題10 ア・平25Ⅱ問題８ウ類",
   q:"株主総会決議の取消しの訴えに係る請求を認容する判決が確定したときは、当該株主総会決議は、将来に向かってその効力を失う。",ans:"誤り",
   exp:"839条の反対解釈。会社法は、839条において会社の組織に関する訴えのうち遡及効を否定する場合について規定しているが、その中には決議取消しの訴えは含まれていない（839条、834条17号）。したがって、決議取消判決により決議が取り消された場合は、当該決議は遡及的に無効となる。すなわち、決議の時点まで遡って無効となるのである（839条の反対解釈）。"},
  {id:"K-02-02-155",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:19,rank:"A",src:"令８Ⅰ問題10 エ類・平25Ⅱ問題８ア",
   q:"株主総会の決議の方法が法令に違反することを原因として決議の取消しの訴えが提起された場合において、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、当該決議の取消しの請求を棄却することができる。",ans:"正しい",
   exp:"831条２項。決議取消しの訴えの提起があった場合において、招集手続または決議方法が法令または定款に違反するときであっても、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、決議取消しの請求を棄却することができる。これを、裁量棄却という。裁量棄却が認められるのは、招集手続または決議方法の法令定款違反は軽微な瑕疵であることが多いと考えられるし、その場合は決議をやり直しても同じ結果が予想されるためである。"},
  {id:"K-02-02-156",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:20,rank:"A",src:"令３問題９エ",
   q:"株主総会の決議取消しの訴えの提起があった場合において、株主総会の決議の内容が定款に違反するときであっても、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、当該訴えに係る請求を棄却することができる。",ans:"誤り",
   exp:"831条２項。裁量棄却をすることができるのは、決議取消事由が株主総会の招集の手続または決議の方法が法令または定款に違反する場合のみである。したがって、株主総会の決議の内容が定款に違反する場合は裁量棄却をすることができない。"},
  {id:"K-02-02-157",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:21,rank:"A",src:"令４Ⅰ問題10 ア",
   q:"株主総会の決議の取消しの訴えが提起された場合、当該決議の方法が著しく不公正なときであっても、裁判所は、その事実が決議に影響を及ぼさないものであると認めるときは、当該決議の取消しの請求を棄却することができる。",ans:"誤り",
   exp:"831条２項。問題20 と同様、裁量棄却をすることができるのは、決議取消事由が株主総会の招集の手続または決議の方法が法令または定款に違反する場合のみである。したがって、株主総会の決議の方法が著しく不公正なときは裁量棄却をすることができない。"},
  {id:"K-02-02-158",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:22,rank:"B",src:"平31Ⅰ問題９ウ",
   q:"最高裁判所の判例によれば、役員選任の株主総会決議取消しの訴えの係属中に、当該決議に基づいて選任された取締役ら役員が全て任期満了により退任し、その後の株主総会の決議によって取締役ら役員が新たに選任された場合には、特段の事情のない限り、当該取消しの訴えは実益を失い、訴えの利益を欠くに至る。",ans:"正しい",
   exp:"最判昭45年４月２日。"},
  {id:"K-02-02-159",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:23,rank:"B",src:"令５Ⅱ問題10 エ・令２Ⅰ問題９ウ",
   q:"最高裁判所の判例によれば、議案を否決する株主総会の決議について、当該決議の取消しを請求する訴えは、適法である。",ans:"誤り",
   exp:"最判平28年３月４日。最高裁判所の判例によれば、ある議案を否決する株主総会の決議の取消しを請求する訴えは、不適法である。ある議案を否決する株主総会の決議の場合には、これによって新たな法律関係が生ずることはないし、これを取り消すことによって新たな法律関係が生ずることもないためである。"},
  {id:"K-02-02-160",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:24,rank:"A",src:"令５Ⅱ問題10 イ類・令３問題９イ",
   q:"最高裁判所の判例によれば、株主総会の招集の手続がその招集につき決定の権限を有する取締役会の有効な決議に基づかないでなされたものであって、かつ、その招集の通知が、通知すべき全ての株主に対して法定の招集期間に不足してなされた場合における株主総会の決議は、他に招集の手続に瑕疵がないとしても、不存在である。",ans:"誤り",
   exp:"最判昭46年３月18日。最高裁判所の判例によれば、株主総会が取締役会の決議に基づかないで招集され、その招集通知がすべての株主に対して法定の招集期間に２日足りない会日である12日前になされた場合には、決議取消事由に該当するものとされ、重大な瑕疵があり、裁量棄却することはできないとしている。"},
  {id:"K-02-02-161",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:25,rank:"B",src:"令７Ⅱ問題10 エ・令３問題９ア",
   q:"最高裁判所の判例によれば、株主総会の決議に基づいて新株が既に発行された後は、当該新株発行に関する株主総会の決議の無効の確認の訴えは、確認の利益を欠き、提起することができない。",ans:"正しい",
   exp:"最判昭40年６月29日。最高裁判所の判例によれば、新株発行に関する株主総会に無効事由があっても、その決議に基づく新株が発行済みである場合には、新株発行無効の訴えを提起しない限り当該新株を無効にすることはできず、新株発行に関する決議無効確認の訴えは確認の利益を欠き提起することはできない。なお、決議取消しの訴えについても同様の判例がある（最判昭37年１月19日）。"},
  {id:"K-02-02-162",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:26,rank:"A",src:"平29Ⅱ問題10 ウ",
   q:"株主総会決議の方法が法令または定款に違反する場合には、訴えをもって当該決議が無効であることの確認を請求することができる。",ans:"誤り",
   exp:"831条１項１号。株主総会の決議の方法が法令または定款に違反する場合は、決議取消事由に該当する。したがって、本肢は誤りである。"},
  {id:"K-02-02-163",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:27,rank:"A",src:"平30Ⅱ問題11 ウ",
   q:"株主総会決議の内容が法令に違反する場合、当該株主総会決議には無効原因が認められる。",ans:"正しい",
   exp:"830条２項。なお、株主総会の決議の内容が定款に違反する場合は、決議取消事由に該当する（831条１項２号）。"},
  {id:"K-02-02-164",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:28,rank:"B",src:"平29Ⅱ問題10 イ",
   q:"株主総会決議の無効確認の訴えは、確認の利益を有する限り、誰でも提起することができる。",ans:"正しい",
   exp:"830条２項。株主総会決議の無効確認の訴えは、確認の利益を有する限り、誰でも提起することができる。"},
  {id:"K-02-02-165",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:29,rank:"B",src:"平29Ⅱ問題10 ア",
   q:"株主総会決議の無効確認の訴えについては、提訴期間は法定されていない。",ans:"正しい",
   exp:"830条２項。決議の内容が法令に違反するときは、瑕疵が重大であり、当該決議は当然に無効となる。そして、その無効は民法の一般原則により、いつでも、だれでも、どのような方法でも、主張することができるが、判決によって画一的に決議が無効であることを確認する必要があれば、決議無効確認の訴えを提起することができる。株主総会決議の無効確認の訴えは、瑕疵が重大であることから、提訴期間は法定されていない。"},
  {id:"K-02-02-166",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:30,rank:"B",src:"",
   q:"株主総会の決議無効確認の訴えに係る請求を認容する確定判決は、当該訴えの当事者に対してのみその効力を有する。",ans:"誤り",
   exp:"834条16号、838条。株主総会の決議無効の主張方法には制限はない。したがって、訴えによらず訴訟外で決議の無効を主張することができる。ただし、当該判決に対世的効力を与えたい場合には、株主総会の決議無効確認の訴えによらなければならない。したがって、株主総会の決議無効確認の訴えに係る請求を認容する確定判決は、第三者に対してもその効力を有するため、本肢は誤りである。これは、株主総会の決議不存在確認の訴えについても同様である。"},
  {id:"K-02-02-167",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:31,rank:"B",src:"平30Ⅱ問題11 エ",
   q:"株主総会決議が無効であることの確認の訴えにおいて、請求を認容する判決が確定したときは、当該株主総会決議は将来に向かってその効力を失う。",ans:"誤り",
   exp:"決議の内容が法令に違反する場合は瑕疵が重大であるため、そもそもはじめから当該決議は無効である。"},
  {id:"K-02-02-168",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:32,rank:"B",src:"平29Ⅱ問題10 エ",
   q:"株主総会決議の無効確認の訴えの提起があった場合において、裁判所は、法令または定款に違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、当該無効確認の請求を棄却することができる。",ans:"誤り",
   exp:"決議の内容が法令に違反する場合は、瑕疵が重大であることから、株主総会の決議取消しの訴えの場合（831条２項）と異なり、裁量棄却の規定は設けられていない。"},
  {id:"K-02-02-169",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:33,rank:"B",src:"令６Ⅰ問題10 ア",
   q:"株主総会決議の不存在の確認の訴えは、確認の利益を有する限り、誰でも提起することができる。",ans:"正しい",
   exp:"830条１項。株主総会決議の不存在確認の訴えは、無効確認の訴えと同様に、確認の利益を有する限り、誰でも提起することができる。"},
  {id:"K-02-02-170",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:34,rank:"B",src:"",
   q:"株主総会の決議不存在確認の訴えについては、提訴期間の制限はない。",ans:"正しい",
   exp:"株主総会の決議不存在確認の訴えについては、提訴権者、提訴期間に制限はない。"},
  {id:"K-02-02-171",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (13) 株主総会の瑕疵",num:35,rank:"B",src:"平28Ⅰ問題８エ",
   q:"招集手続の瑕疵が著しいために、株主の集まりを株主総会と評価することができない場合には、誰でも株主総会の決議が存在しないことを前提とした法律上の主張をすることができる。",ans:"正しい",
   exp:"830条１項。株主総会の決議の事実自体が存在しない場合、または決議らしき事実はあるが法的に決議として評価することができない場合は、決議不存在となる。決議不存在は、瑕疵が重大であるため、民法の一般原則により、いつでも、だれでも、どのような方法でも、主張することができるが、判決によって画一的に決議が不存在であることを確認する必要があれば、決議不存在確認の訴えを提起することができる。"},
  {id:"K-02-02-172",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:1,rank:"C",src:"",
   q:"種類株主総会は、会社法に規定する事項および株式会社の組織、運営、管理その他株式会社に関する一切の事項について決議をすることができる。",ans:"誤り",
   exp:"321条。種類株主総会は、会社法に規定する事項および定款で定めた事項に限り、決議をすることができる。"},
  {id:"K-02-02-173",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:2,rank:"B",src:"平23Ⅱ問題７イ",
   q:"種類株式発行会社が株式の分割をする場合において、ある種類の株式の種類株主に損害を及ぼすおそれがあるときは、当該種類の種類株主を構成員とする種類株主総会において議決権を行使することができる種類株主が存しない場合を除き、当該種類株主総会の決議がなければ、当該株式の分割は効力を生じない。ただし、定款に別段の定めはないものとする。",ans:"正しい",
   exp:"322条１項柱書、２号。種類株式発行会社が株式の分割をする場合において、ある種類株主に損害を及ぼすおそれがあるときは、当該行為は、当該種類株主を構成員とする種類株主総会の決議がなければその効力を生じない。当該種類株主総会の決議は、特別決議である（324条２項４号）。"},
  {id:"K-02-02-174",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:3,rank:"B",src:"平30Ⅱ問題10 ウ",
   q:"種類株式発行会社は、ある種類の株式の内容として、株式の分割が当該種類の株式の種類株主に損害を及ぼすおそれがあるときに、当該種類の株式の種類株主を構成員とする種類株主総会の決議を要しない旨を定款で定めることができる。",ans:"正しい",
   exp:"322条２項。株式の分割を円滑に行うことを可能とするために、定款による種類株主総会決議の排除が認められている。"},
  {id:"K-02-02-175",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:4,rank:"C",src:"",
   q:"種類株式発行会社は、ある種類株式の内容として、単元株式数についての定款の変更をする場合に、当該変更が当該種類株式の種類株主に損害を及ぼすおそれがあるときに、当該種類株主を構成員とする種類株主総会の決議を要しない旨を定款で定めることはできない。",ans:"誤り",
   exp:"322条３項ただし書かっこ書。322条１項１号に規定されている、（ⅰ）株式の種類の追加、（ⅱ）株式の内容の変更、（ⅲ）発行可能株式総数または発行可能種類株式総数の増加に関する定款変更は、単元株式数に関する変更を除き、定款によっても種類株主総会の決議を排除することができない（322条３項）。これらの定款変更は、種類株主の利益を損なうおそれが高いと考えられるためである。単元株式数の変更は、その実質が、株式の併合および株式の分割に等しい。そして、株式の併合または株式の分割は、定款によって種類株主総会の決議を排除することができるため（同条１項２号、２項、３項ただし書参照）、それと実質を同じにする単元株式数の変更決議も同様に定款による決議の排除を認めているのである。"},
  {id:"K-02-02-176",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:5,rank:"B",src:"",
   q:"種類株式発行会社が株式の種類の追加をする場合において、ある種類株主に損害を及ぼすおそれがあるときは、当該行為は、当該種類株主の全員の同意がなければ、その効力を生じない。",ans:"誤り",
   exp:"322条１項１号イ、324条２項４号。種類株式発行会社が株式の種類の追加をする場合において、ある種類株主に損害を及ぼすおそれがあるときは、当該行為は、当該種類株主を構成員とする種類株主総会の特別決議がなければその効力を生じない。"},
  {id:"K-02-02-177",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:6,rank:"B",src:"",
   q:"種類株式発行会社が、ある種類株式の発行後に定款を変更して、当該種類株主に損害を及ぼすおそれがある場合の種類株主総会を要しない旨の定めを設けようとするときは、当該種類の種類株主全員の同意を得なければならない。",ans:"正しい",
   exp:"322条２項４項。定款による種類株主総会の排除の定めは、種類株主の利益に重大な影響を及ぼすものであるため、種類株主全員が当該定款の定めについて同意していることが求められるのである。"},
  {id:"K-02-02-178",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:7,rank:"B",src:"",
   q:"種類株式発行会社において、株式の分割をすることによりある種類株主に損害を及ぼすおそれがあるときは、定款に別段の定めがなくとも、反対株主は、株式会社に対し、自己が有する当該種類株式を公正な価格で買取ることを請求することができる。",ans:"誤り",
   exp:"116条１項３号イ。株式会社が、① 株式の併合または株式の分割、② 株式無償割当て、③ 単元株式数についての定款の変更、④ 株主割当ての方法による募集株式の発行等、⑤ 株主割当ての方法による新株予約権の発行、⑥ 新株予約権無償割当てをする場合（要は322条１項２号～６号までの行為または単元株式数に関する定款の変更をする場合）において、ある種類株式（定款による種類株主総会の排除の定め（322条２項）があるものに限る）を有する種類株主に損害を及ぼすおそれがある場合には、反対株主は、株式会社に対し、自己の有する当該種類株式を公正な価格で買い取ることを請求することができる。当該株式買取請求権は、定款により種類株主総会が排除されることへの代償として株主に付与されるものである。"},
  {id:"K-02-02-179",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:8,rank:"B",src:"平31Ⅱ問題10 エ",
   q:"種類株式発行会社は、種類株主総会の決議要件を定款の定めにより加重することができる。",ans:"正しい",
   exp:"324条各項参照。種類株主総会の決議についても、通常の株主総会の決議と同様に、定款により会社法によって定められた要件を加重することが認められている。"},
  {id:"K-02-02-180",subject:"企業法",chapter:"第2章 機関",sub:"2. 株主総会 (14) 種類株主総会",num:9,rank:"C",src:"平20 問題９エ",
   q:"種類株主総会の決議には、株主総会の決議とは異なり、決議の省略の制度は存在しない。",ans:"誤り",
   exp:"325条参照。種類株主総会においては、株主総会の権限、株主総会の招集および株主総会の決議に関する規定を除いて、株主総会に関する規定が準用されるため、決議の省略制度（書面決議）を採用することができる。"},
  {id:"K-02-03-001",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:1,rank:"A",src:"平25Ⅰ問題12 エ類",
   q:"公開会社では、取締役が株主でなければならない旨を定款で定めることができる。",ans:"誤り",
   exp:"331条２項。公開会社は、取締役が株主でなければならない旨を定款で定めることができない（331条２項本文）。公開会社は、株主が頻繁に変動することが想定されるため、株主以外の者からも広く有能な人材を取締役として選任できることが適切だからである。これに対して、非公開会社においては、取締役が株主でなければならない旨を定款で定めることも認められている（331条２項ただし書）。なお、監査役および執行役においても同様に、定款による資格制限の規定が設けられている（335条１項、402条５項）。"},
  {id:"K-02-03-002",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:2,rank:"A",src:"令６Ⅱ問題11 ア・平29Ⅱ問題８ア",
   q:"公開会社でない株式会社は、取締役が株主でなければならない旨を定款で定めることができる。",ans:"正しい",
   exp:"331条２項ただし書。問題１の解説参照。"},
  {id:"K-02-03-003",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:3,rank:"B",src:"平20 問題11 ア",
   q:"自然人だけでなく、法人も取締役になることができる。",ans:"誤り",
   exp:"331条１項１号。法人は取締役の欠格事由に含まれているため、法人は取締役となることはできない。"},
  {id:"K-02-03-004",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:4,rank:"B",src:"令２Ⅱ問題10 ア・平25Ⅰ問題12 イ",
   q:"未成年者は取締役となることができない。",ans:"誤り",
   exp:"331条１項。取締役の欠格事由に未成年者は含まれていないため、未成年者は取締役となることができる。"},
  {id:"K-02-03-005",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:5,rank:"B",src:"令６Ⅱ問題11 イ類",
   q:"成年被後見人は、取締役になることができない。",ans:"誤り",
   exp:"331条の２第１項。成年被後見人が取締役に就任するには、その成年後見人が、成年被後見人の同意（後見監督人がある場合にあっては、成年被後見人および後見監督人の同意）を得たうえで、成年被後見人に代わって就任の承諾をしなければならない。すなわち、当該同意があれば、成年被後見人であっても取締役になることができる。なお、被保佐人が取締役に就任するには、その保佐人の同意を得なければならない（331条の２第２項）。"},
  {id:"K-02-03-006",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:6,rank:"B",src:"令２Ⅱ問題10 イ",
   q:"破産者であって復権を得ていない者も、取締役となることができる。",ans:"正しい",
   exp:"破産者であって復権を得ていない者は、331条１項各号の欠格事由に定められていないので、取締役となることができる。"},
  {id:"K-02-03-007",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:7,rank:"B",src:"平28Ⅱ問題11 ア",
   q:"日本国内に住所を有しない外国人が株式会社の取締役となる場合、日本国内に住所を有する代理人を指定しなければならない。",ans:"誤り",
   exp:"このような規定は存在しない。"},
  {id:"K-02-03-008",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:8,rank:"A",src:"平26Ⅱ問題８ア類",
   q:"株式会社の取締役であって、過去に当該株式会社またはその子会社の業務執行取締役となったことがあるものは、当該株式会社の社外取締役の要件を満たすことはない。",ans:"誤り",
   exp:"２条15号イ。過去に当該株式会社またはその子会社の業務執行取締役等（業務執行取締役もしくは執行役または支配人その他の使用人）となったことがあるものであっても、その後10年が経過している場合は、経営者との関係が希薄となるから社外取締役の要件を満たす。すなわち、株式会社の取締役であって、その就任の前10年間当該株式会社またはその子会社の業務執行取締役等であったことがないものは、当該株式会社の社外取締役となることができる場合があるのである。"},
  {id:"K-02-03-009",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:9,rank:"A",src:"平30Ⅱ問題13 ア",
   q:"株式会社の取締役であって、その就任の前10年間当該株式会社またはその子会社の業務執行取締役等であったことがある者は、当該株式会社の社外取締役となることができない。",ans:"正しい",
   exp:"２条15号イ。"},
  {id:"K-02-03-010",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:10,rank:"A",src:"平30Ⅱ問題13 エ・平28Ⅱ問題11 イ類",
   q:"株式会社の取締役のうち、当該株式会社の親会社の取締役である者は、当該株式会社の社外取締役には該当しない。",ans:"正しい",
   exp:"２条15号ハ。当該株式会社の親会社等（自然人であるものに限る）または親会社等の取締役もしくは執行役もしくは支配人その他の使用人であるものは、社外取締役となることができない。これらのものは、子会社の株主総会決議における議決権行使を通じて当該子会社の経営者に対し影響を及ぼすことができる立場にあるため、子会社の経営者が子会社の利益を犠牲にして、親会社等の利益を図るおそれがある。したがって、親会社等とその関係者については、その子会社と利益相反の関係に立つことがあり、社外取締役に期待される監督機能を実効的に果たすことが期待できないことから、社外取締役の要件において除外されているのである。"},
  {id:"K-02-03-011",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:11,rank:"B",src:"令８Ⅰ問題12 ア類",
   q:"株式会社の取締役であって、その就任の前10年内のいずれかの時において当該株式会社の親会社等の取締役であったことがあるものは、社外取締役となることができない。",ans:"誤り",
   exp:"２条15号ハ。社外取締役に就任する以前の期間において、親会社等とその関係者であったことがないことまでは要件とされておらず、あくまで就任時点において親会社等とその関係者でなければ足りる点に注意をしてほしい。"},
  {id:"K-02-03-012",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:12,rank:"B",src:"",
   q:"株式会社の取締役であって、当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役等であるものは、社外取締役になることができない。",ans:"正しい",
   exp:"２条15号ニ。当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役等であるものは、社外取締役となることができない。すなわち、兄弟会社の業務執行取締役等については、社外取締役の要件から除外しているのである。親会社等は、兄弟会社の業務執行取締役等に対しても影響を及ぼすことができる立場にある。そこで、株式会社とその親会社等との間で利益が相反する場合に、兄弟会社の業務執行取締役等に対しても社外取締役に期待される監督機能を実効的に果たすことが期待できないことから、社外取締役の要件において除外されているのである。"},
  {id:"K-02-03-013",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:13,rank:"B",src:"",
   q:"株式会社の取締役であって、当該株式会社の親会社等の子会社等（当該株式会社およびその子会社を除く）の業務執行取締役以外の取締役であるものは、社外取締役になることができない。",ans:"誤り",
   exp:"２条15号ニ。兄弟会社の場合は、その業務執行取締役等でないことが要件とされているため、業務執行取締役等でない取締役（例えば兄弟会社の社外取締役）は、株式会社の社外取締役の要件を満たす。また、あくまで就任時点において兄弟会社の業務執行取締役等でなければ足りる点に注意をしてほしい。"},
  {id:"K-02-03-014",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:14,rank:"A",src:"",
   q:"株式会社の取締役であって、当該株式会社の取締役の配偶者であるものは、社外取締役となることができる。",ans:"誤り",
   exp:"２条15号ホ。当該株式会社の取締役もしくは執行役もしくは支配人その他の重要な使用人または親会社等（自然人であるものに限る）の配偶者または２親等内の親族であるものは、社外取締役となることができない。すなわち、株式会社の関係者の近親者については、社外取締役の要件から除外しているのである。"},
  {id:"K-02-03-015",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:15,rank:"A",src:"令５Ⅱ問題11 ウ類",
   q:"監査役会設置会社（公開大会社であるものに限る）であって、金融商品取引法第24条１項の規定によりその発行する株式について有価証券報告書を内閣総理大臣に提出しなければならないものは、社外取締役を置かなければならない。",ans:"正しい",
   exp:"327条の２。公開会社の株主は、頻繁に変動することが想定されるため、株主による監督が期待できず、大会社においては、多数の株主や債権者等の利害関係者の存在が想定されるため、社会に与える影響が大きいと考えられる。また、発行する株式について有価証券報告書提出義務がある会社の株式は、流通性を有すると考えられることから、コーポレート・ガバナンスをより強化する必要がある。そのため、社外取締役の設置を義務付けることで、業務執行者に対する監督の実効性を確保しようとしているのである。なお、あくまで株式について有価証券報告書を提出している株式会社が対象であるので、発行する社債についてのみ有価証券報告書提出義務のある株式会社は、対象ではない。"},
  {id:"K-02-03-016",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:16,rank:"A",src:"平29Ⅱ問題８イ類・平22Ⅱ問題８ア",
   q:"大会社である取締役会設置会社においては、取締役は、３人以上で、そのうち１人以上は、社外取締役でなければならない。",ans:"誤り",
   exp:"331条５項。取締役会設置会社においては、取締役は３人以上でなければならないが、大会社だからといって、そのうち１人以上が社外取締役である必要はない。"},
  {id:"K-02-03-017",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:17,rank:"A",src:"",
   q:"株式会社（指名委員会等設置会社を除く）が社外取締役を置いている場合において、当該株式会社と取締役との利益が相反する状況にあるとき、その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該株式会社は、当該株式会社の業務を執行することを社外取締役に委託することができるが、この場合には、株主総会の決議による承認を受ける必要がある。",ans:"誤り",
   exp:"348条の２第１項。株式会社（指名委員会等設置会社を除く）が社外取締役を置いている場合において、当該株式会社と取締役との利益が相反する状況にあるとき、その他取締役が当該株式会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該株式会社は、その都度、取締役の決定（取締役会設置会社にあっては、取締役会の決議）によって、当該株式会社の業務を執行することを社外取締役に委託することができる。"},
  {id:"K-02-03-018",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:18,rank:"A",src:"令５Ⅱ問題11 エ",
   q:"指名委員会等設置会社において、執行役が当該指名委員会等設置会社の業務を執行することにより株主の利益を損なうおそれがあるときは、当該指名委員会等設置会社は、その都度、取締役会の決議によって、当該指名委員会等設置会社の業務を執行することを社外取締役に委託することができる。",ans:"正しい",
   exp:"348条の２第２項。"},
  {id:"K-02-03-019",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:19,rank:"A",src:"令８Ⅰ問題12 イ",
   q:"取締役会設置会社（指名委員会等設置会社を除く）の取締役が当該取締役会設置会社のある業務を執行することにより株主の利益を損なうおそれがあるときは、取締役会の決議によって当該業務の執行を委託された社外取締役が当該業務を執行しても、当該業務の執行が業務執行取締役の指揮命令によるものでなければ、当該社外取締役は、社外取締役の要件を欠くことにはならない。",ans:"正しい",
   exp:"348条の２第３項。"},
  {id:"K-02-03-020",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:1,rank:"A",src:"令６Ⅱ問題13 イ類・平31Ⅰ問題11 ア・平22Ⅱ問題10 ア",
   q:"会計参与は、弁護士もしくは弁護士法人または公認会計士もしくは監査法人でなければならない。",ans:"誤り",
   exp:"333条１項。会計参与は、公認会計士もしくは監査法人または税理士もしくは税理士法人でなければならない。会計参与制度の趣旨は、会計に関する専門的知識を有する者が、取締役または執行役と共同して計算書類等を作成することにより計算書類等の適正性を確保することにあるため、会計参与となることができるのは、会計に関する専門資格を有する者に限定されている。"},
  {id:"K-02-03-021",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:2,rank:"A",src:"",
   q:"株式会社の取締役は、当該株式会社の会計参与を兼ねることができない。",ans:"正しい",
   exp:"333条３項１号。株式会社またはその子会社の取締役、監査役、執行役または支配人その他の使用人は、会計参与となることができない（333条３項１号）。まず、株式会社またはその子会社の取締役、執行役または使用人との兼任が認められないのは、計算書類の適正性を担保するという機能を失わないようにするために、会計参与には、業務執行からの独立性が求められるからである。また、株式会社の監査役との兼任が認められないのは、自己監査となるため適当でなく、取締役または執行役と共同して計算書類を作成するという会計参与の職務からして当然である。なお、子会社の監査役が会計参与となることができないとされている趣旨は、必ずしも明らかではない。"},
  {id:"K-02-03-022",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:3,rank:"A",src:"平22Ⅱ問題10 イ",
   q:"株式会社の支配人は、当該会社の会計参与となることができない。",ans:"正しい",
   exp:"333条３項１号。問題２の解説参照。"},
  {id:"K-02-03-023",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:4,rank:"A",src:"平27Ⅱ問題９ア類・平24Ⅰ問題11 ア",
   q:"株式会社の取締役は、その親会社の会計参与となることができる。",ans:"誤り",
   exp:"333条３項１号。株式会社の取締役は、その親会社の会計参与となることができない。計算書類の適正性を担保するという機能を失わないようにするために、会計参与には、業務執行からの独立性が求められるからである。"},
  {id:"K-02-03-024",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:5,rank:"A",src:"平31Ⅰ問題８イ",
   q:"監査等委員である取締役は、監査等委員会設置会社の子会社の会計参与を兼ねることができない。",ans:"正しい",
   exp:"331条３項。監査等委員である取締役は、監査等委員会設置会社もしくはその子会社の業務執行取締役もしくは支配人その他の使用人または当該子会社の会計参与（会計参与が法人であるときは、その職務を行うべき社員）もしくは執行役を兼ねることができない。監査等委員である取締役の兼任禁止規定の趣旨は、自己監査の防止と独立性の確保である。監査する者と監査される者が同一の者であるという状況では監査の実が上がらないためである。"},
  {id:"K-02-03-025",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:6,rank:"A",src:"平31Ⅰ問題11 イ",
   q:"株式会社またはその子会社の監査役は、当該株式会社の会計参与となることができない。",ans:"正しい",
   exp:"333条３項１号。問題２の解説参照。なお、子会社の監査役が会計参与となることができないとされている趣旨は、必ずしも明らかではない。"},
  {id:"K-02-03-026",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:7,rank:"A",src:"平25Ⅰ問題12 ウ",
   q:"子会社の会計参与は、親会社の会計参与を兼任することができない。",ans:"誤り",
   exp:"333条３項１号。株式会社またはその子会社の取締役、監査役もしくは執行役または支配人その他の使用人は、会計参与となることができない。しかし、子会社の会計参与との兼任は禁止されていない。"},
  {id:"K-02-03-027",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:8,rank:"C",src:"",
   q:"会計参与は、その職務を行うに当たっては、公認会計士法の規定により業務の停止の処分を受け、その停止の期間を経過しない者を使用してはならない。",ans:"正しい",
   exp:"374条５項。この他、税理士法の規定により業務の停止の処分を受け、その停止の期間を経過しない者や、税理士が、弁護士、司法書士など、他の一定の専門資格を有している場合に、他の専門業務について業務停止処分を受けていることにより税理士業務を行うことができない者も同様である。"},
  {id:"K-02-03-028",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:1,rank:"A",src:"平27Ⅰ問題10 ア類",
   q:"公開会社でない株式会社において、監査役の資格を株主に限定する旨の定款の定めは、無効である。",ans:"誤り",
   exp:"335条１項、331条２項ただし書。非公開会社は、監査役が株主でなければならない旨を定款で定めることができる。一方、公開会社は、監査役が株主でなければならない旨を定款で定めることができない（335条１項、331条２項本文）。"},
  {id:"K-02-03-029",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:2,rank:"B",src:"平22Ⅱ問題11 ア類",
   q:"監査法人は監査役となることができない。",ans:"正しい",
   exp:"335条１項、331条１項１号。法人は監査役となることができない。これは、取締役も同様である。"},
  {id:"K-02-03-030",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:3,rank:"A",src:"平28Ⅰ問題10 イ類・平24Ⅱ問題11 イ・平21 問題11 イ類",
   q:"株式会社の監査役は、当該株式会社の親会社の取締役を兼任することができる。",ans:"正しい",
   exp:"335条２項参照。監査役の独立性が損なわれることはないため、株式会社の監査役は、当該株式会社の親会社の取締役を兼任することができる。"},
  {id:"K-02-03-031",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:4,rank:"A",src:"平30Ⅰ問題12 エ類・平21 問題11 ア",
   q:"株式会社の監査役は、当該株式会社の子会社の監査役を兼ねることができない。",ans:"誤り",
   exp:"335条２項参照。監査役の独立性が損なわれることはないため、株式会社の監査役は、当該株式会社の子会社の監査役を兼ねることができる。"},
  {id:"K-02-03-032",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:5,rank:"A",src:"平28Ⅰ問題10 ア・平21 問題11 エ類",
   q:"株式会社の監査役は、当該株式会社の子会社の支配人を兼ねることができない。",ans:"正しい",
   exp:"335条２項。監査役は、株式会社またはその子会社の取締役、支配人その他の使用人を兼ねることができない。また、株式会社の子会社の会計参与（会計参与が法人であるときは、その職務を行うべき社員）または執行役も兼ねることができない（335条２項）。監査役の兼任禁止規定の趣旨は、自己監査の防止と独立性の確保である。監査する者と監査される者が同一の者である、または、監査する者が監査される者に従属しているという状況では監査の実が上がらないためである。"},
  {id:"K-02-03-033",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:6,rank:"A",src:"令６Ⅱ問題11 ウ・平25Ⅱ問題９イ類・平21 問題11 ウ",
   q:"株式会社の監査役は、当該株式会社の子会社の取締役を兼ねることができない。",ans:"正しい",
   exp:"335条２項。問題５の解説参照。"},
  {id:"K-02-03-034",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:7,rank:"A",src:"令８Ⅰ問題11 ア・平27Ⅱ問題10 ア類・平24Ⅱ問題11 ア",
   q:"株式会社の監査役は、当該株式会社の子会社の会計参与を兼任することができない。",ans:"正しい",
   exp:"335条２項。問題５の解説参照。"},
  {id:"K-02-03-035",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:8,rank:"C",src:"平22Ⅱ問題11 イ",
   q:"任期満了により会社の取締役を退任した者が、その後当該会社の監査役となることはできるが、任期満了により会社の監査役を退任した者が、その後当該会社の取締役となることはできない。",ans:"誤り",
   exp:"任期満了により会社の取締役を退任した者は、その後当該会社の監査役となることができる。同様に、任期満了により会社の監査役を退任した者は、その後当該会社の取締役となることができる。"},
  {id:"K-02-03-036",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:9,rank:"B",src:"",
   q:"最高裁判所の判例によれば、取締役の地位にある者を監査役に選任した株主総会の決議は、無効である。",ans:"誤り",
   exp:"最判平元年９月19日。最高裁判所の判例によれば、取締役の地位にある者等、兼任が禁止されている者が監査役に選任された株主総会決議の効力は有効である。監査役への就任は、株主総会の選任決議のみでは生じず、被選任者の就任承諾があって生じるところ、監査役への就任前に被選任者が前職の取締役等を辞任していれば、兼任禁止には抵触しない。そして、被選任者が就任を承諾したときは、前職の辞任をしたものと解すべきであり、たとえこの者が事実上前職を継続していたとしても、そのことは監査役としての任務懈怠責任の原因となり得るが、選任決議の効力に影響を及ぼすものではないとしている。"},
  {id:"K-02-03-037",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:10,rank:"B",src:"",
   q:"最高裁判所の判例によれば、弁護士の資格を有する株式会社の監査役が、特定の訴訟事件につき会社から委任を受けてその訴訟代理人となることは禁止される。",ans:"誤り",
   exp:"最判昭61年２月18日。最高裁判所の判例によれば、株式会社の監査役である弁護士が、訴訟事件において会社の代理人となることを禁止していない。"},
  {id:"K-02-03-038",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:11,rank:"A",src:"平25Ⅱ問題９ウ類",
   q:"株式会社の監査役であって、過去に１度でも当該株式会社またはその子会社の取締役となったことがあるものは、当該株式会社の社外監査役の要件を満たすことはない。",ans:"誤り",
   exp:"２条16号イ。過去に当該株式会社またはその子会社の取締役となったことがあるものであっても、その後10年が経過している場合は、経営者との関係が希薄となるから社外監査役の要件を満たす。すなわち、株式会社の監査役であって、その就任の前10年間当該株式会社またはその子会社の取締役、会計参与（会計参与が法人であるときは、その職務を行うべき社員）もしくは執行役または支配人その他の使用人であったことがないものは、当該株式会社の社外監査役となることができる場合があるのである。"},
  {id:"K-02-03-039",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:12,rank:"A",src:"平28Ⅰ問題10 エ",
   q:"株式会社の監査役は、当該株式会社の子会社の社外監査役となることができる。",ans:"誤り",
   exp:"２条16号ハ。株式会社の親会社等（自然人であるものに限る）または親会社等の取締役、監査役もしくは執行役もしくは支配人その他の使用人であるものは、当該株式会社の社外監査役となることができない。"},
  {id:"K-02-03-040",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:13,rank:"A",src:"平28Ⅰ問題10 ウ",
   q:"株式会社の取締役の二親等内の親族は、当該株式会社の社外監査役となることができない。",ans:"正しい",
   exp:"２条16号ホ。株式会社の取締役もしくは支配人その他の重要な使用人または親会社等（自然人であるものに限る）の配偶者または二親等内の親族であるものは、当該株式会社の社外監査役となることができない。"},
  {id:"K-02-03-041",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:14,rank:"C",src:"",
   q:"株式会社の監査役であって、当該株式会社の重要な取引先の関係者であるものは、社外監査役となることができない。",ans:"誤り",
   exp:"社外取締役および社外監査役の要件として、重要な取引先の関係者でないことを追加すべきか否かが議論されたが、重要な取引先は株式会社に重大な利害関係を有しており、むしろ注意深い監督等を期待することができるという指摘や、重要な取引先に関する客観的な形式的基準を会社法上設置することは困難であることから、当該要件を追加することは見送られた。"},
  {id:"K-02-03-042",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:1,rank:"B",src:"",
   q:"会計監査人は、公認会計士または監査法人でなければならない。",ans:"正しい",
   exp:"337条１項。会計監査人は、専門家として計算書類等の監査を行う者であるため、会計監査人となるためには、その専門資格が要求される。"},
  {id:"K-02-03-043",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:2,rank:"C",src:"",
   q:"株式会社の取締役は、当該株式会社の会計監査人となることができる。",ans:"誤り",
   exp:"337条３項１号、公認会計士法24条１項１号。公認会計士法24条１項１号によれば、公認会計士が役員、これに準ずるものである会社の財務書類を監査することができないとされているため、公認会計士である者が役員、これに準ずるもの（取締役、会計参与、監査役または執行役）に選任されている場合には、その者は当該株式会社の会計監査人となることができない。また、公認会計士法の規定により株式会社の計算書類について監査をすることができない者は、会計監査人となることができないとされている（337条３項１号）。"},
  {id:"K-02-03-044",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:3,rank:"B",src:"",
   q:"株式会社の子会社もしくはその取締役、会計参与、監査役もしくは執行役から公認会計士もしくは監査法人の業務以外の業務により継続的な報酬を受けている者またはその配偶者は、当該株式会社の会計監査人となることができない。",ans:"正しい",
   exp:"337条３項２号。"},
  {id:"K-02-03-045",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:4,rank:"B",src:"平25Ⅰ問題12 ア",
   q:"監査法人の社員の半数以上が、株式会社の子会社から当該監査法人の業務以外の業務により継続的な報酬を受けている者であるときは、当該監査法人は、当該株式会社の会計監査人となることができない。",ans:"正しい",
   exp:"337条３項２号３号。"},
  {id:"K-02-03-046",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:5,rank:"C",src:"",
   q:"会計監査人は、その職務を行うに当たっては、会計監査人設置会社の子会社から公認会計士の業務以外の業務により継続的な報酬を受けている者を使用してはならない。",ans:"正しい",
   exp:"396条５項３号。会計監査人は、その職務を行うに当たっては、① 公認会計士法の規定により会社の計算書類について監査することができない者、② 子会社もしくはその取締役、会計参与、監査役もしくは執行役から公認会計士もしくは監査法人の業務以外の業務により継続的な報酬を受けている者またはその配偶者、③ 会計監査人設置会社またはその子会社の取締役、会計参与、監査役もしくは執行役または支配人その他の使用人である者、④ 会計監査人設置会社またはその子会社から公認会計士または監査法人の業務以外の業務により継続的な報酬を受けている者を使用してはならない。"},
  {id:"K-02-03-047",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (1) 役員および会計監査人の資格",num:6,rank:"C",src:"平25Ⅰ問題10 エ",
   q:"株式会社の会計監査人は、その職務を行うに当たって、当該株式会社の子会社の使用人を使用することができる。",ans:"誤り",
   exp:"396条５項２号。補助者として不適任な者が会計監査に関わることを排除し、監査の公正を確保するために、株式会社の会計監査人は、その職務を行うに当たっては、会計監査人設置会社の子会社の使用人を使用することができない。"},
  {id:"K-02-03-048",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (2) 役員および会計監査人の員数",num:1,rank:"A",src:"",
   q:"取締役会設置会社においては、取締役は３人以上でなければならない。",ans:"正しい",
   exp:"331条５項。"},
  {id:"K-02-03-049",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (2) 役員および会計監査人の員数",num:2,rank:"A",src:"令２Ⅱ問題８ア",
   q:"監査役会設置会社の取締役は、３人以上でなければならない。",ans:"正しい",
   exp:"327条１項２号、331条５項。監査役会設置会社は、取締役会を置かなければならない。業務執行について取締役会を置かないという簡易な機関設計を採用したにも関わらず、監査について監査役会という複雑な仕組みを置く需要は想定しにくいため、これを認める必要はないからである。そして、取締役会設置会社では、取締役は３人以上でなければならないことから、本肢は正しい。"},
  {id:"K-02-03-050",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (2) 役員および会計監査人の員数",num:3,rank:"A",src:"平22Ⅰ問題８ウ",
   q:"監査役会設置会社においては、監査役は、３人以上で、そのうち半数以上は社外監査役でなければならない。",ans:"正しい",
   exp:"335条３項。監査役会設置会社では、監査役は３人以上で、そのうち半数以上は社外監査役でなければならない。過半数ではなく半数以上であることに注意する必要がある。"},
  {id:"K-02-03-051",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:1,rank:"A",src:"",
   q:"監査役を選任する株主総会の決議は、定款の定めをもってしても、定足数について議決権を行使することができる株主の議決権の３分の１未満と定めることはできない。",ans:"正しい",
   exp:"329条１項、341条。役員（取締役、会計参与および監査役）は、株主総会の普通決議によって選任する（329条１項）。ただし、役員の選任決議は、定款の定めをもってしても、定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない。これは、株式会社の機関としての役員の地位の重要性から、できるだけ多くの株主の意思を反映させるために、その特則を定めたものである。"},
  {id:"K-02-03-052",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:2,rank:"B",src:"平28Ⅱ問題11 ウ",
   q:"株式会社の株主総会において取締役の選任決議を行う場合、当該株式会社は、あらかじめ取締役就任につき候補者の承諾を得ておかなければならない。",ans:"誤り",
   exp:"取締役の選任決議を行う場合、当該株式会社は、あらかじめ取締役就任につき候補者の承諾を得ておく必要はない。"},
  {id:"K-02-03-053",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:3,rank:"A",src:"平31Ⅰ問題８ウ類",
   q:"監査等委員会設置会社においては、取締役の選任は、株主総会において監査等委員である取締役とそれ以外の取締役とを区別してしなければならない。",ans:"正しい",
   exp:"329条２項。監査等委員の独立性を確保するためである。このように、監査等委員は、株主総会の決議により取締役の地位と一体となって選任されるのである。この点、指名委員会等設置会社の監査委員が取締役会で選任されることと異なるため（400条２項）、監査等委員会設置会社における監査等委員の身分は、監査役に近いものと考えられる。"},
  {id:"K-02-03-054",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:4,rank:"A",src:"平29Ⅱ問題８ウ",
   q:"指名委員会等設置会社においては、取締役の選任は、各委員会の委員である取締役とそれ以外の取締役とを区別してしなければならない。",ans:"誤り",
   exp:"400条２項。各委員会の委員は、取締役の中から、取締役会の決議によって選定する。これに対して、監査等委員会設置会社においては、取締役の選任は、監査等委員である取締役とそれ以外の取締役とを区別してしなければならない（329条２項）。"},
  {id:"K-02-03-055",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:5,rank:"B",src:"平22Ⅱ問題11 ウ類",
   q:"株主総会において会計参与の選任の決議をする場合には、会計参与が欠けた場合に備えて補欠の会計参与を選任しなければならない。",ans:"誤り",
   exp:"329条３項。役員の選任決議をする場合には、役員が欠けた場合または会社法もしくは定款で定めた役員の員数を欠くこととなるときに備えて補欠の役員を選任することができる。なお、役員等ではなく役員であるため会計監査人は含まれないことに留意してほしい。"},
  {id:"K-02-03-056",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:6,rank:"B",src:"平22Ⅰ問題９ウ",
   q:"累積投票による取締役の選任の決議については、株主はその有する1 株につき、当該株主総会において選任する取締役の数と同数の議決権を有する。",ans:"正しい",
   exp:"342条３項。累積投票による取締役選任の請求があった場合には、取締役の選任の決議については、株主は、その有する株式１株（単元株式数を定款で定めている場合にあっては、１単元の株式）につき、当該株主総会において選任する取締役の数と同数の議決権を有する。この場合においては、株主は、１人のみに投票し、または２人以上に投票して、その議決権を行使することができる。"},
  {id:"K-02-03-057",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:7,rank:"B",src:"",
   q:"株主総会の目的である事項が２人以上の監査役の選任である場合には、株主は、株式会社に対し、累積投票制度により監査役を選任すべきことを請求することができる。",ans:"誤り",
   exp:"342条。累積投票制度は、株主総会の目的である事項が２人以上の取締役（監査等委員会設置会社にあっては、監査等委員である取締役またはそれ以外の取締役）の選任である場合に限って認められており、累積投票による監査役の選任の制度は設けられていない。"},
  {id:"K-02-03-058",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:8,rank:"C",src:"",
   q:"累積投票による取締役の選任の請求は、株主総会の当日にすることで足りる。",ans:"誤り",
   exp:"342条２項。累積投票による取締役の選任の請求は、当該株主総会の日の５日前までにしなければならない。"},
  {id:"K-02-03-059",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:9,rank:"B",src:"",
   q:"株式会社は、定款の定めをもって、累積投票制度を全面的に排除することができる。",ans:"正しい",
   exp:"342条１項。累積投票制度は、取締役会内部に利害の対立を持ち込み、迅速かつ効率的な会社運営を阻害する危険が大きいため、定款の定めをもって累積投票制度を全面的に排除することができる。"},
  {id:"K-02-03-060",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:10,rank:"A",src:"平27Ⅰ問題11 ア類・平25Ⅱ問題９エ類",
   q:"会計監査人の選任は、株主総会の普通決議によって行うが、定足数の定めを完全に排除することは認められない。",ans:"誤り",
   exp:"329条、309条１項。株主総会の普通決議の特則（341条）が設けられているのは、役員の選任および解任についてであるため、役員に該当しない会計監査人の選任および解任には当該特則が適用されない。したがって、会計監査人の選任および解任については、定足数の定めを完全に排除することが認められる。"},
  {id:"K-02-03-061",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (3) 役員および会計監査人の選任",num:11,rank:"A",src:"",
   q:"会計監査人の選任決議をする場合には、会計監査人が欠けた場合または定款で定めた会計監査人の員数を欠くこととなるときに備えて補欠の会計監査人を選任することができる。",ans:"誤り",
   exp:"329条３項。補欠の選任が認められているのは役員のみであり、補欠会計監査人の選任は認められていない。"},
  {id:"K-02-03-062",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:1,rank:"A",src:"",
   q:"監査等委員会設置会社または指名委員会等設置会社以外の株式会社において、取締役の任期は、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとされるが、定款または株主総会の決議によって、その任期を短縮することができる。",ans:"正しい",
   exp:"332条１項。"},
  {id:"K-02-03-063",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:2,rank:"A",src:"平24Ⅰ問題９ア",
   q:"公開会社でなく、監査等委員会設置会社または指名委員会等設置会社でもない株式会社の取締役の任期は、定款によって、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとすることができる。",ans:"正しい",
   exp:"332条２項。非公開会社では、株主の変動が頻繁には生じることはなく、株主間の関係が緊密であるため、頻繁に株主総会において取締役の適否につき株主の信任を問う必要がない。したがって、取締役の任期を、定款の定めによって、選任後 10年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとすることができるが、本問のように任期を短縮することも認められる。"},
  {id:"K-02-03-064",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:3,rank:"A",src:"令５Ⅰ問題11 ア類",
   q:"監査等委員会設置会社において、監査等委員である取締役以外の取締役の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとし、定款または株主総会の決議によって短縮することができる。",ans:"正しい",
   exp:"332条１項本文、３項。監査等委員会設置会社では、剰余金の配当を取締役会が決定する旨を定款に定めることができるので（459条１項４号）、毎年の定時株主総会において取締役の適否につき株主の信任を問う必要があるためである。"},
  {id:"K-02-03-065",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:4,rank:"A",src:"令７Ⅰ問題11 ア類",
   q:"監査等委員である取締役の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。",ans:"誤り",
   exp:"332条１項本文。監査等委員会設置会社における監査等委員である取締役の任期は、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。任期を監査等委員以外の取締役よりも長くしているのは、監査等委員である取締役の地位を強化し、独立性を確保するためである。"},
  {id:"K-02-03-066",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:5,rank:"A",src:"平28Ⅱ問題13 イ",
   q:"監査等委員である取締役の任期は、定款の定めにより法定の任期よりも短縮することができる。",ans:"誤り",
   exp:"332条４項。監査等委員会設置会社における監査等委員である取締役の任期は、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする（332条１項本文）。監査等委員である取締役の任期は、監査等委員以外の取締役の任期の規定と異なり、定款または株主総会の決議によって、その任期を短縮することができない。任期を監査等委員以外の取締役よりも長くし、また、短縮することができないとしている理由は、監査等委員である取締役の地位を強化し、独立性を確保するためである。"},
  {id:"K-02-03-067",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:6,rank:"A",src:"令７Ⅰ問題11 エ",
   q:"任期の満了前に退任した監査等委員である取締役の補欠として選任された監査等委員である取締役の任期は、定款の定めによって、退任した監査等委員である取締役の任期の満了する時までとすることができる。",ans:"正しい",
   exp:"332条５項。監査等委員である取締役の改選の時期を揃えるためには、補欠として選任された監査等委員である取締役の任期の満了する日を他の監査等委員と合わせることが必要となる。しかし、監査等委員である取締役の任期の短縮は認められていないため（332条４項）、補欠として選任された監査等委員である取締役の任期の例外が規定されているのである。"},
  {id:"K-02-03-068",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:7,rank:"A",src:"平24Ⅰ問題９イ",
   q:"指名委員会等設置会社の取締役の任期は、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。",ans:"誤り",
   exp:"332条１項６項。指名委員会等設置会社では、剰余金の配当の決定を、定款の定めによって株主総会ではなく取締役会の決議事項とすることができるため（459条１項４号）、毎年の定時株主総会において取締役の適否につき株主の信任を問う必要がある。したがって、指名委員会等設置会社における取締役の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとされる。また、この場合であっても、定款または株主総会の決議によって、当該任期を短縮することができる（332条１項ただし書、６項）。"},
  {id:"K-02-03-069",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:8,rank:"A",src:"平27Ⅰ問題８ア",
   q:"指名委員会等設置会社でない株式会社が指名委員会等を置く旨の定款の変更を行った場合には、当該株式会社の取締役の任期は、当該定款の変更を行った事業年度の終結の時に満了する。",ans:"誤り",
   exp:"332条７項１号。株式会社が指名委員会等を置く旨の定款の変更をした場合には、取締役の任期は、当該定款の変更の効力が生じた時に満了する。指名委員会等設置会社と指名委員会等設置会社以外の会社では、取締役の権限や役割が大きく異なるためである。"},
  {id:"K-02-03-070",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:9,rank:"A",src:"令７Ⅰ問題11 イ",
   q:"株式会社において、監査等委員会を置く旨の定款の定めを廃止する定款の変更をした場合には、当該株式会社の取締役の任期は、当該定款の変更を行った事業年度の終了の時に満了する。",ans:"誤り",
   exp:"332条７項２号。監査等委員会または指名委員会等を置く旨の定款の定めを廃止する定款の変更をした場合には、取締役の任期は、当該定款変更の効力が生じた時に満了する。"},
  {id:"K-02-03-071",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:10,rank:"A",src:"令７Ⅰ問題11 ウ類・平27Ⅰ問題８イ",
   q:"指名委員会等設置会社において、その発行する株式の全部の内容として、譲渡による当該株式の取得について当該指名委員会等設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には、当該指名委員会等設置会社の取締役の任期は当該定款の変更が効力を生じた時に満了する。",ans:"誤り",
   exp:"332条７項３号。監査等委員会設置会社または指名委員会等設置会社以外の株式会社において、その発行する株式の全部の内容として譲渡による当該株式の取得について会社の承認を要する旨の定款の定めを廃止する定款の変更をした場合、取締役の任期は、当該定款の変更の効力が生じた時に満了する。これは、取締役の任期を伸長している非公開会社が、公開会社となる場合にその伸長された任期が維持されるのでは、公開会社の取締役の任期を原則として２年とした趣旨が没却されてしまうためである。しかし、監査等委員会設置会社および指名委員会等設置会社においては、公開会社か否かを問わず、取締役の任期を伸長することができないため、非公開会社が公開会社となる場合であっても、定款の変更により取締役の任期を満了させる必要はない。"},
  {id:"K-02-03-072",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:11,rank:"B",src:"平31Ⅰ問題11 ウ類",
   q:"監査役設置会社における会計参与の法定の任期は、選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。",ans:"誤り",
   exp:"334条１項、332条１項本文。会計参与の任期は、原則として、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。会計参与の任期については、取締役の任期の規定が準用される。"},
  {id:"K-02-03-073",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:12,rank:"A",src:"",
   q:"監査役（任期の満了前に退任した監査役の補欠として選任された監査役を除く）の任期は、選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとするが、定款によって、任期を短縮することが認められている。",ans:"誤り",
   exp:"336条１項。監査役の任期は、選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。取締役のように、定款または株主総会の決議によって、その任期を短縮することは認められない。このように任期を取締役と比して長くし、短縮することができないとしている理由は、監査役の地位を強化し、独立性を確保するためである。なお、定款によって、任期の満了前に辞任した監査役の補欠として選任された監査役の任期を、退任した監査役の任期が満了する時までとすることが認められる（336条３項）。"},
  {id:"K-02-03-074",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:13,rank:"A",src:"",
   q:"公開会社でない株式会社では、監査役の任期を、定款によって、選任後10年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで伸長することができる。",ans:"正しい",
   exp:"336条２項。非公開会社に限って任期の伸長が認められるのは、非公開会社では株主が頻繁に変動することは想定しにくく、株主間の関係が緊密であると考えられることから、頻繁に株主総会において監査役の適否につき株主の信任を問う必要がないためである。"},
  {id:"K-02-03-075",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:14,rank:"A",src:"令５Ⅰ問題11 ウ類・平27Ⅰ問題８ウ・平24Ⅰ問題９ウ類",
   q:"任期の満了前に退任した監査役の補欠として選任された監査役の任期は、定款により、退任した監査役の任期の満了する時までとすることができる。",ans:"正しい",
   exp:"336条３項。監査役が複数いる場合において、監査役の改選の時期を揃えるためには、補欠として選任された監査役の任期の満了する日を他の監査役と合わせることが必要となる。しかし、監査役の任期の短縮は認められていないため（336条１項参照）、補欠として選任された監査役の任期の例外が規定されているのである。"},
  {id:"K-02-03-076",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:15,rank:"A",src:"平29Ⅰ問題13 ア",
   q:"監査役の監査の範囲を会計に関するものに限定する旨を定款で定めている株式会社において、監査役の監査の範囲を会計に関するものに限定する旨の定款の定めを廃止する定款の変更をした場合には、監査役の任期は当該定款の変更の効力が生じた時に満了する。",ans:"正しい",
   exp:"336条４項３号。監査役の監査の範囲を会計に関するものに限定する旨の定款の定めを廃止する定款の変更をする場合は、監査役の監査の範囲が拡大するため、監査役を改めて選任する必要があるからである。"},
  {id:"K-02-03-077",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:16,rank:"A",src:"",
   q:"監査役設置会社において、その発行する株式の全部の内容として、譲渡による当該株式の取得について当該監査役設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には、当該監査役設置会社の監査役の任期は当該定款の変更が効力を生じた時に満了する。",ans:"正しい",
   exp:"336条４項４号。監査役設置会社において、その発行する株式の全部の内容として譲渡による当該株式の取得について会社の承認を要する旨の定款の定めを廃止する定款の変更をした場合、監査役の任期は、当該定款の変更の効力が生じた時に満了する。これは、監査役の任期を伸長している非公開会社が、公開会社となる場合にその伸長された任期が維持されるのでは、公開会社の監査役の任期を原則として４年とした趣旨が没却されてしまうためである。"},
  {id:"K-02-03-078",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:17,rank:"A",src:"平24Ⅰ問題９エ類",
   q:"会計監査人の任期は、選任後２年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。",ans:"誤り",
   exp:"338条１項。会計監査人の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。会計監査人の職務は会計監査であって、対象となる株式会社の事業年度は１年であるのが通常であることから、会計監査人の任期についても１年程度が適当であると考えられたことによる。"},
  {id:"K-02-03-079",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:18,rank:"A",src:"平29Ⅱ問題12 ア・平24Ⅱ問題11 エ",
   q:"監査役設置会社では、監査役の全員の同意により、会計監査人の法定の任期を伸長することができる。",ans:"誤り",
   exp:"338条１項。会計監査人の任期は、選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする（338条１項）。会計監査人の任期は伸長することも短縮することもできない。会計監査人の職務は会計監査であって、対象となる株式会社の事業年度は１年であるのが通常であることから、会計監査人の任期についても１年程度が適当であると考えられたことによる。"},
  {id:"K-02-03-080",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:19,rank:"A",src:"令５Ⅰ問題11 エ類・平27Ⅰ問題８エ",
   q:"会計監査人は、その終結の時をもって当該会計監査人の任期が満了するものとされている定時株主総会において別段の決議がなされなかったときは、当該定時株主総会において再任されたものとみなす。",ans:"正しい",
   exp:"338条２項。会計監査人の選任決議を定時株主総会で毎年行うこととすると、会計監査人が地位の継続を考えるあまり公正な監査を行うことができなくなる可能性が生じる。そこで、独立性を確保するために、再任の擬制がなされているのである。"},
  {id:"K-02-03-081",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (4) 役員および会計監査人の任期",num:20,rank:"B",src:"",
   q:"会計監査人設置会社において、その発行する株式の全部の内容として、譲渡による当該株式の取得について当該会計監査人設置会社の承認を要する旨の定款の定めを廃止する定款の変更を行った場合には、当該会計監査人設置会社の会計監査人の任期は当該定款の変更が効力を生じた時に満了する。",ans:"誤り",
   exp:"338条３項。会計監査人設置会社において、定款の変更による任期の満了は、会計監査人を置く旨の定款の定めを廃止する定款の変更をした場合のみである。"},
  {id:"K-02-03-082",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:1,rank:"A",src:"令２Ⅰ問題８ウ類・平24Ⅱ問題９イ類・平22Ⅱ問題11 エ類・平20 問題11 ウ類",
   q:"役員および会計監査人は、正当な理由がある場合に限って、株主総会の決議によって解任することができる。",ans:"誤り",
   exp:"339条１項。役員および会計監査人は、いつでも、株主総会の決議によって解任することができる。したがって、解任するために正当な理由は不要である。"},
  {id:"K-02-03-083",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:2,rank:"A",src:"平27Ⅱ問題８ア・平20 問題13 ウ",
   q:"役員または会計監査人が正当な理由なくして解任された場合には、当該役員または会計監査人は当該解任によって生じた損害の賠償を株式会社に請求することができる。",ans:"正しい",
   exp:"339条２項。役員および会計監査人は、いつでも、株主総会の決議によって解任することができるが（339条１項）、役員および会計監査人が株式会社に対して損害賠償を請求することができるのは、正当な理由がない場合に限られる。"},
  {id:"K-02-03-084",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:3,rank:"A",src:"令２Ⅱ問題９エ類・平23Ⅱ問題12 ウ類",
   q:"会計参与を解任する株主総会の決議について、定足数の定めを完全に排除することは認められない。",ans:"正しい",
   exp:"341条、344条の２第３項、309条２項７号。取締役（監査等委員である取締役を除く）または会計参与の解任については、定款の定めをもってしても、定足数について議決権を行使することができる株主の議決権の３分の１未満に引き下げることはできない（普通決議の特則）。株式会社の機関としての役員の地位の重要性から、できるだけ多くの株主の意思を反映させるためである。"},
  {id:"K-02-03-085",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:4,rank:"A",src:"令５Ⅱ問題11 ア類・平30Ⅱ問題13 ウ",
   q:"監査役設置会社の社外取締役の解任は、株主総会の特殊決議によらなければならない。",ans:"誤り",
   exp:"社外取締役の解任については、特別な規定が設けられているわけではないことから、その解任は、普通決議の特則による（341条）。したがって、本肢は誤りである。"},
  {id:"K-02-03-086",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:5,rank:"A",src:"令６Ⅱ問題10 ウ類・平29Ⅱ問題11 エ",
   q:"監査等委員会設置会社の監査等委員である取締役の解任は、株主総会の普通決議によって行う。",ans:"誤り",
   exp:"344条の２第３項、309条２項７号。監査等委員である取締役を解任する株主総会の決議は、特別決議を要する。監査等委員である取締役または監査役の解任に特別決議を要求した趣旨は、決議要件を加重することによって、監査等委員である取締役または監査役の地位の強化を図ることにある。"},
  {id:"K-02-03-087",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:6,rank:"A",src:"令４Ⅰ問題13 ア類・平24Ⅱ問題９エ・平20 問題11 イ類",
   q:"株式会社が、株主総会の決議により監査役を解任するには、特別決議によらなければならない。",ans:"正しい",
   exp:"343条４項、309条２項７号。監査役の解任に特別決議を要求した趣旨は、決議要件を加重することによって、監査役の地位の強化を図ることにある。"},
  {id:"K-02-03-088",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:7,rank:"B",src:"平25Ⅱ問題９ア・平23Ⅱ問題12 イ",
   q:"累積投票によって選任された取締役を株主総会の決議により解任するには、株主総会の特別決議によらなければならない。",ans:"正しい",
   exp:"309条２項７号。累積投票で選ばれた取締役の解任は、特別決議によらなければならない。特別決議が要求された理由は、普通決議による解任を認めてしまうと、少数派株主により選任された取締役が多数派株主により容易に解任されてしまうためである。"},
  {id:"K-02-03-089",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:8,rank:"B",src:"平20 問題11 エ",
   q:"取締役は、株主総会の決議によらなければ解任されることはない。",ans:"誤り",
   exp:"854条。役員（会計監査人は含まれない）については、株主総会の決議のほか、一定の場合には役員解任の訴え（854条）によっても解任される。"},
  {id:"K-02-03-090",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:9,rank:"B",src:"令４Ⅰ問題13 イ類・平23Ⅱ問題12 ア",
   q:"公開会社において、総株主の議決権の100 分の３以上の議決権を有する公開会社の株主は、その株式の保有期間にかかわらず、取締役を解任する旨の議案が株主総会において否決された日から30日以内に、訴えをもって当該取締役の解任を請求することができる。",ans:"誤り",
   exp:"854条１項１号２号。公開会社にあっては、役員解任の訴えを提訴する株主には、６か月の継続保有要件がある。なお、役員解任の訴えは、役員の職務の執行に関し不正の行為または法令もしくは定款に違反する重大な事実があったにもかかわらず、① 当該役員を解任する旨の議案が株主総会において否決されたとき、または、②当該役員を解任する旨の株主総会の決議が、323条の規定によりその効力を生じないとき（拒否権付種類株式を有する種類株主を構成員とする種類株主総会での承認が得られないとき）に、一定の株主が、当該株主総会の日から30日以内に、訴えをもって当該役員の解任を請求することができる制度である。ここで、一定の株主とは、総株主の議決権の100 分の３（定款で緩和可）以上の議決権、または、発行済株式の100 分の３（定款で緩和可）以上の数の株式を保有する株主である（少数株主権）。"},
  {id:"K-02-03-091",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:10,rank:"A",src:"令７Ⅰ問題10 ウ類・平27Ⅰ問題11 イ",
   q:"株主総会の決議により会計監査人を解任するには、特別決議によらなければならない。",ans:"誤り",
   exp:"339条１項、309条１項。会計監査人は、いつでも、株主総会の普通決議によって解任することができる。なお、会計監査人は役員でないため、解任決議について341条の適用はない。したがって、会計監査人の解任決議については、定款によって定足数の要件を完全に排除することができる。"},
  {id:"K-02-03-092",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:11,rank:"A",src:"",
   q:"会計監査人は、必ず、株主総会の決議によって解任しなければならず、その他の方法によって解任することは認められない。",ans:"誤り",
   exp:"340条。会計監査人は、株主総会の決議によって解任される他、一定の場合における監査役または監査（等）委員の全員の同意によっても解任される。会計監査人の解任は、原則として株主総会の決議によらなければならない（339条１項）。しかし、会計監査人による監査を受けるような大会社では、会計監査人の解任のためだけに臨時株主総会を招集することは、実際上コストがかかり過ぎる。そこで、信頼関係を喪失するほどの重大な事由がある場合に限って、例外的に監査役等の全員の同意によって会計監査人を解任することができることとしたのである。"},
  {id:"K-02-03-093",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:12,rank:"A",src:"令６Ⅰ問題13 ウ類・平23Ⅱ問題12 エ類",
   q:"監査役会設置会社でない監査役設置会社において、会計監査人が職務上の義務に違反し、または職務を怠ったときは、監査役（監査役が２人以上ある場合にあっては、その過半数）の同意によって、会計監査人を解任することができる。",ans:"誤り",
   exp:"340条１項１号２項。会計監査人が、① 職務上の義務に違反し、または職務を怠ったとき、② 会計監査人としてふさわしくない非行があったとき、③ 心身の故障のため、職務の執行に支障があり、またはこれに堪えないときは、監査役（監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会）は、その会計監査人を解任することができる。当該解任は、監査役が２人以上ある場合には監査役全員の同意（監査役会設置会社であっても監査役全員の同意、監査等委員会設置会社では監査等委員全員の同意、指名委員会等設置会社では監査委員全員の同意）によって行われなければならない（340条１項２項４項５項６項）。また、この場合、監査役（監査役が２人以上いる場合は監査役の互選によって定めた監査役、監査役会設置会社では監査役会が選定した監査役、監査等委員会設置会社では監査等委員会が選定した監査等委員、指名委員会等設置会社においては監査委員会が選定した監査委員会の委員）は、解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない（340条３項４項５項６項）。これは、会計監査人の独立性の確保を図ると同時に、株主に解任事由を伝達することを目的とする。"},
  {id:"K-02-03-094",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:13,rank:"A",src:"令７Ⅱ問題13 ア・平29Ⅱ問題12 イ・平26Ⅰ問題11 ア・平24Ⅱ問題12 ア類",
   q:"監査役会設置会社において、会計監査人としてふさわしくない非行があったときは、監査役の全員の同意によって、会計監査人を解任することができる。",ans:"正しい",
   exp:"340条１項２号２項４項。問題12 の解説参照。"},
  {id:"K-02-03-095",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:14,rank:"A",src:"",
   q:"監査役の全員の同意により会計監査人を解任したときは、監査役（監査役が２人以上ある場合は監査役の互選によって定めた監査役、監査役会設置会社では監査役会が選定した監査役）は、解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない。",ans:"正しい",
   exp:"340条３項４項。監査役等の全員の同意により会計監査人を解任したときは、監査役（監査役が２人以上いる場合は監査役の互選によって定めた監査役、監査役会設置会社では監査役会が選定した監査役、監査等委員会設置会社では監査等委員会が選定した監査等委員、指名委員会等設置会社においては監査委員会が選定した監査委員会の委員）は、解任した旨およびその理由を解任後最初に招集される株主総会に報告しなければならない（340条３項４項５項６項）。これは、会計監査人の独立性の確保を図ると同時に、株主に解任事由を伝達することを目的とする。"},
  {id:"K-02-03-096",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:15,rank:"A",src:"平24Ⅱ問題12 ウ類・平24Ⅰ問題11 イ",
   q:"監査役会設置会社において、会計参与が職務上の義務に違反し、または職務を怠ったときは、監査役会は、その決議によって当該会計参与を解任することができる。",ans:"誤り",
   exp:"会計監査人と異なり、会計参与に関しては、監査役等による解任の規定は設けられていない（340条参照）。"},
  {id:"K-02-03-097",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:16,rank:"A",src:"平26Ⅰ問題11 イ",
   q:"指名委員会等設置会社において、会計監査人が職務上の義務に違反した場合には、監査委員会の委員の過半数の同意によって、その会計監査人を解任することができる。",ans:"誤り",
   exp:"340条１項２項６項。指名委員会等設置会社において、監査委員会による会計監査人の解任は、監査委員会の委員の全員の同意によって行わなければならない。"},
  {id:"K-02-03-098",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (5) 役員および会計監査人の解任",num:17,rank:"A",src:"平27Ⅱ問題９イ",
   q:"指名委員会等設置会社の取締役会は、その決議によって当該指名委員会等設置会社の会計参与を解任することができる。",ans:"誤り",
   exp:"指名委員会等設置会社の取締役会に会計参与を解任する権限はない。会計参与は、いつでも、株主総会の決議により解任することができる（339条１項）。"},
  {id:"K-02-03-099",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:1,rank:"A",src:"平24Ⅱ問題９ア・平23Ⅱ問題10 イ",
   q:"監査役設置会社において、取締役は、監査役の選任に関する議案を株主総会に提出するには、監査役全員の同意を得なければならない。",ans:"誤り",
   exp:"343条１項３項。取締役は、監査役がある場合において、監査役の選任に関する議案を株主総会に提出する場合には、監査役（監査役が２人以上ある場合はその過半数、監査役会設置会社では監査役会）の同意を得なければならない（343条１項３項）。これは、取締役が株主総会に提出する監査役の選任議案に対して、監査役（監査役会）に拒否権を与えたものである。"},
  {id:"K-02-03-100",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:2,rank:"A",src:"令５Ⅰ問題13 エ",
   q:"取締役は、監査等委員会がある場合において、監査等委員である取締役の選任に関する議案を株主総会に提出するには、監査等委員会の同意を得なければならない。",ans:"正しい",
   exp:"344条の２第１項。取締役が株主総会に提出する監査等委員である取締役の選任議案に対して、監査等委員会に同意権（拒否権）を与えることで、監査等委員である取締役の地位を強化している。"},
  {id:"K-02-03-101",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:3,rank:"B",src:"",
   q:"監査役会設置会社において、監査役会は、取締役に対し、監査役の選任を株主総会の目的とすることを請求することができない。",ans:"誤り",
   exp:"343条２項３項。監査役（監査役会設置会社では監査役会）は、取締役に対し、監査役の選任を株主総会の目的とすること、または、監査役の選任に関する議案を株主総会に提出することを請求することができる。監査役の選任に関して、監査役の意見を反映させることで、監査役の地位を強化する趣旨である。なお、監査等委員会設置会社においても、同様の趣旨で、監査等委員である取締役に対し、同様の権限を与えている（344条の２第２項）。"},
  {id:"K-02-03-102",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:4,rank:"A",src:"",
   q:"（令３問題７エ類・平28Ⅰ問題11 ウ類・平26Ⅰ問題11 ウ類・平26Ⅰ問題11 エ・平24Ⅱ問題12 イ類）監査役会設置会社においては、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は、監査役会が決定する。",ans:"正しい",
   exp:"344条１項３項。監査役設置会社においては、株主総会に提出する会計監査人の選任および解任ならびに会計監査人を再任しないことに関する議案の内容は、監査役（監査役が２人以上ある場合はその過半数をもって、監査役会設置会社では監査役会）が決定する（344条）。当該規定の趣旨は、会計監査人の独立性を確保すると同時に、監査役と会計監査人との職務上の密接な関係に鑑みて、その選任等につき監査役の意思を反映させることである。また、監査等委員会設置会社または指名委員会等設置会社においても同様に、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会が決定する（399条の２第３項２号、404条２項２号）。"},
  {id:"K-02-03-103",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:5,rank:"A",src:"令５Ⅰ問題13 ア類・令４Ⅰ問題13 エ類・平24Ⅱ問題９ウ",
   q:"会計参与、監査役、会計監査人および監査等委員である取締役は、株主総会において、それぞれ会計参与、監査役、会計監査人および監査等委員である取締役の解任または辞任について意見を述べることができるが、選任について意見を述べることができない。",ans:"誤り",
   exp:"345条、342条の２。会計参与、監査役、会計監査人および監査等委員である取締役には、その地位の独立性を確保するために、選任、解任、不再任（会計監査人の場合）または辞任に関する意見陳述権が認められている。"},
  {id:"K-02-03-104",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:6,rank:"B",src:"令５Ⅰ問題13 ウ類・平30Ⅰ問題11 ウ類",
   q:"すべての監査等委員である取締役は、株主総会において、監査等委員である取締役以外の取締役の選任もしくは解任または辞任について監査等委員会の意見を述べることができる。",ans:"誤り",
   exp:"342条の２第４項。監査等委員会が選定する監査等委員は、株主総会において、監査等委員である取締役以外の取締役の選任もしくは解任または辞任について監査等委員会の意見を述べることができる。このように、監査等委員会には、指名委員会等設置会社における指名委員会に準ずる経営評価の役割が期待されているのである。"},
  {id:"K-02-03-105",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:7,rank:"A",src:"令８Ⅰ問題11 ウ",
   q:"会計参与を辞任した者は、辞任後最初に招集される株主総会に出席して、辞任した旨およびその理由を述べることができる。",ans:"正しい",
   exp:"345条２項。会計参与を辞任した者は、辞任後最初に招集される株主総会に出席して、辞任した旨およびその理由を述べることができる。そのため、取締役は、会計参与を辞任した者が株主総会に出席することができるように、取締役は、当該辞任をした者に対し、当該株主総会を招集する旨および当該株主総会の日時および場所を通知しなければならない（345条３項）。なお、監査役、会計監査人および監査等委員である取締役にも同様の規定が設けられている（同条２項～５項、342条の２第２項３項）。"},
  {id:"K-02-03-106",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:8,rank:"A",src:"平22Ⅱ問題10 エ",
   q:"監査役設置会社においては、取締役は、会計参与の解任を株主総会の目的とするときは、監査役（監査役が２人以上ある場合にあっては、その過半数）の同意を得なければならない。",ans:"誤り",
   exp:"このような規定はない。"},
  {id:"K-02-03-107",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:9,rank:"B",src:"",
   q:"取締役が欠けた場合または会社法もしくは定款で定めた取締役の員数が欠けた場合には、解任により退任した取締役は、新たに選任された取締役が就任するまで、なお取締役としての権利義務を有する。",ans:"誤り",
   exp:"346条１項。役員（監査等委員会設置会社では、監査等委員である取締役もしくはそれ以外の取締役または会計参与）が欠けた場合または会社法もしくは定款で定めた役員の員数が欠けた場合には、任期の満了または辞任により退任した取締役は、新たに選任された取締役が就任するまで、なお取締役としての権利義務を有する。したがって、解任された役員には留任義務はない。留任義務が課せられる役員が任期の満了または辞任により退任した役員に限定されているのは、解任、欠格事由の発生、定款所定の資格喪失の場合に権利義務を継続させることは不適当であり、役員の死亡や会社解散の場合には継続させることが不可能だからである。"},
  {id:"K-02-03-108",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:10,rank:"B",src:"",
   q:"会計監査人が欠けた場合または会社法もしくは定款で定めた会計監査人の員数が欠けた場合には、任期の満了または辞任により退任した会計監査人は、新たに選任された会計監査人が就任するまで、なお会計監査人としての権利義務を有する。",ans:"誤り",
   exp:"会計監査人に欠員が生じた場合は、役員の場合と異なり、留任義務の規定（346条１項）が設けられていない。"},
  {id:"K-02-03-109",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:11,rank:"A",src:"令４Ⅰ問題13 ウ類・平22Ⅰ問題14 ア・平22Ⅰ問題14 ウ類",
   q:"役員が欠けた場合または会社法もしくは定款で定めた役員の員数が欠けた場合において、裁判所は、必要があると認めるときは、利害関係人の申立てにより、一時役員の職務を行うべき者を選任することができる。",ans:"正しい",
   exp:"346条２項。役員が解任等の事由で退任した場合には留任義務を負う役員が存在しないし、また、任期の満了または辞任により退任した役員であっても、健康上の問題等様々な理由で権利義務を継続させることが不適当な場合があるためである。"},
  {id:"K-02-03-110",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:12,rank:"A",src:"平22Ⅰ問題14 エ",
   q:"会計監査人が欠けた場合または定款で定めた会計監査人の員数が欠けた場合において、裁判所は、必要があると認めるときは、利害関係人の申立てにより、一時会計監査人の職務を行うべき者を選任することができる。",ans:"誤り",
   exp:"346条４項６項７項８項。会計監査人が欠けた場合または定款で定めた会計監査人の員数が欠けた場合において、遅滞なく会計監査人が選任されないときは、監査役（監査役会設置会社では監査役会、監査等委員会設置会社では監査等委員会、指名委員会等設置会社では監査委員会）は、一時会計監査人の職務を行うべき者を選任しなければならない。"},
  {id:"K-02-03-111",subject:"企業法",chapter:"第2章 機関",sub:"3. 役員・会計監査人の選任解任 (6) その他選任および解任に関する規定",num:13,rank:"A",src:"平28Ⅱ問題11 エ",
   q:"裁判所が利害関係人の申立てにより一時取締役の職務を行うべき者を選任した場合、裁判所は、株式会社がその者に対して支払う報酬の額を定めることができる。",ans:"正しい",
   exp:"346条３項。"},
  {id:"K-02-04-001",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:1,rank:"B",src:"",
   q:"取締役会設置会社以外の株式会社においては、定款で株式会社の業務を執行する取締役を定めなければならない。",ans:"誤り",
   exp:"348条１項。取締役会非設置会社においては、各取締役が会社の業務を執行するのが原則である。ただし、定款で別段の定めを設けることが認められる。"},
  {id:"K-02-04-002",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:2,rank:"B",src:"令７Ⅱ問題11 エ類",
   q:"取締役会設置会社以外の株式会社において、取締役が２人以上ある場合には、当該株式会社の業務は、業務を執行する権限を有する取締役の過半数をもって決定する。",ans:"誤り",
   exp:"348条２項。取締役会非設置会社において、取締役が２人以上ある場合には、当該株式会社の業務は、定款に別段の定めがある場合を除き、取締役の過半数をもって決定する。すなわち、定款により業務を執行しない取締役を定めた場合であっても、当該取締役は業務の決定に関与するのが原則である。"},
  {id:"K-02-04-003",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:3,rank:"A",src:"",
   q:"取締役会設置会社以外の株式会社において、取締役は、多額の借財についての決定を各取締役に委任することができない。",ans:"誤り",
   exp:"348条３項。取締役会非設置会社において、取締役は、多額の借財についての決定を各取締役に委任することができる。これは、重要な財産の処分および讓受けについても同様である。一方、取締役会設置会社において、取締役会は、重要な財産の処分および譲受け、多額の借財についての決定を取締役に委任することはできない（362条４項１号２号）。"},
  {id:"K-02-04-004",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:4,rank:"A",src:"",
   q:"取締役会設置会社以外の株式会社において、取締役は、支配人の選任および解任についての決定を各取締役に委任することができる。",ans:"誤り",
   exp:"348条３項。取締役会非設置会社において、取締役は、① 支配人の選任および解任、② 支店の設置、移転および廃止、③ 株主総会（種類株主総会）の招集の決定、④ 内部統制システムの整備、⑤ 426条１項の規定による定款の定めに基づく役員等の株式会社に対する損害賠償責任の一部免除についての決定を各取締役に委任することはできない。"},
  {id:"K-02-04-005",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:5,rank:"A",src:"平30Ⅱ問題12 ウ類・平25Ⅰ問題11 ア",
   q:"取締役会設置会社でない大会社において、取締役は、その過半数をもって、株式会社の業務の適正を確保するための体制の整備を決定しなければならない。ただし、定款に別段の定めはないものとする。",ans:"正しい",
   exp:"348条４項。大会社であれば、取締役会設置会社であるか否かを問わず、内部統制システムの整備義務があり（348条４項、362条５項）、その決定は、各取締役に委任することができない（348条３項４号、362条４項６号）。ある程度以上の規模の株式会社には、その業務の適正を確保するための組織体制の構築が必要であるという考え方に基づくものである。また、監査等委員会設置会社および指名委員会等設置会社においては、大会社か否かを問わず、内部統制システムの整備義務がある（399条の13 第１項１号ロハ、２項、416条１項１号ロホ、２項）。"},
  {id:"K-02-04-006",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:6,rank:"A",src:"",
   q:"取締役会設置会社においては、原則として、取締役会の決議によって業務執行の決定を行う。",ans:"正しい",
   exp:"362条２項１号。なお、取締役会は、取締役会の定める規則または取締役会の決議により、業務執行の決定を代表取締役または代表取締役以外の業務執行取締役に委任することができる。また、日常の業務の決定は、代表取締役に当然に委任されていると解されている。"},
  {id:"K-02-04-007",subject:"企業法",chapter:"第2章 機関",sub:"4. 取締役",num:7,rank:"A",src:"",
   q:"指名委員会等設置会社以外の取締役会設置会社においては、代表取締役以外の取締役が当該取締役会設置会社の業務を執行することはない。",ans:"誤り",
   exp:"363条１項。指名委員会等設置会社以外の取締役会設置会社においては、① 代表取締役、② 代表取締役以外の取締役であって、取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定された者が業務を執行する。"},
  {id:"K-02-05-001",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:1,rank:"A",src:"平25Ⅰ問題２エ",
   q:"定款の定めによって取締役会を任意に設置した公開会社でない株式会社は、取締役会設置会社ではない。",ans:"誤り",
   exp:"２条７号。取締役会設置会社とは、取締役会を置く株式会社または会社法の規定により取締役会を置かなければならない株式会社をいう。前半の「取締役会を置く株式会社」とは、現に取締役会を置いている株式会社のことを指す。これに対して、後半の「会社法の規定により取締役会を置かなければならない株式会社」とは、会社法の規定（327条１項）により本来は取締役会を置かなければならない株式会社が取締役会を置いてない場合の当該株式会社のことを指す。"},
  {id:"K-02-05-002",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:2,rank:"A",src:"",
   q:"取締役会はすべての取締役で組織する。",ans:"正しい",
   exp:"362条１項。"},
  {id:"K-02-05-003",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:3,rank:"A",src:"令２Ⅰ問題10 ウ・平25Ⅰ問題９ウ",
   q:"監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において、取締役会は、支配人その他の重要な使用人の選任および解任の決定を代表取締役に委任することができる。",ans:"誤り",
   exp:"362条４項３号。監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において、取締役会は、支配人その他の重要な使用人の選任および解任を取締役に委任することができない。"},
  {id:"K-02-05-004",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:4,rank:"A",src:"平28Ⅰ問題９イ",
   q:"監査役設置会社である取締役会設置会社において、取締役会は、その決議により、支店その他の重要な組織の設置の決定を取締役に委任することができる。",ans:"誤り",
   exp:"362条４項４号。監査役設置会社である取締役会設置会社であっても、取締役会は、支店その他の重要な組織の設置の決定を取締役に委任することができない。"},
  {id:"K-02-05-005",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:5,rank:"A",src:"平30Ⅱ問題12 イ",
   q:"大会社である取締役会設置会社において、取締役会は、内部統制システムの整備について決定しなければならない。",ans:"正しい",
   exp:"362条５項。大会社は一定以上の規模の株式会社であるため、その業務の適正を確保するための組織体制の整備についての決定が必要となるのである。"},
  {id:"K-02-05-006",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:6,rank:"A",src:"平30Ⅱ問題12 ア",
   q:"大会社でなく、かつ、監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社において、取締役会は、内部統制システムの整備の決定につき、取締役に委任することができる。",ans:"誤り",
   exp:"362条４項６号。大会社に該当しない場合であっても、内部統制システムの整備の決定については、取締役に委任することはできない。"},
  {id:"K-02-05-007",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (1) 総論",num:7,rank:"A",src:"平29Ⅱ問題11 ア・平24Ⅱ問題10 イ",
   q:"指名委員会等設置会社でない株式会社においては、代表取締役以外の取締役であって、取締役会の決議によって選定された業務執行取締役は、３か月に１回以上、自己の職務の執行の状況を取締役会に報告しなければならない。",ans:"正しい",
   exp:"363条２項。指名委員会等設置会社でない株式会社においては、① 代表取締役、および、②代表取締役以外の取締役であって、取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定された取締役は、３か月に１回以上、自己の職務の執行の状況を取締役会に報告しなければならない（363条２項）。取締役会の監督機能の実効性を確保するためである。"},
  {id:"K-02-05-008",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:1,rank:"A",src:"平30Ⅰ問題13 エ・平26Ⅰ問題８ア類",
   q:"取締役会は、取締役会を招集する取締役を定めなければならない。",ans:"誤り",
   exp:"366条１項。取締役会は、原則として各取締役が招集する。ただし、定款または取締役会によって、取締役会を招集する取締役（招集権者）を定めることができる。"},
  {id:"K-02-05-009",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:2,rank:"B",src:"",
   q:"定款または取締役会で取締役会の招集権者である取締役を定めた場合であっても、当該招集権者以外の取締役は、招集権者に対し、取締役会の目的である事項を示して、取締役会の招集を請求することができる。",ans:"正しい",
   exp:"366条２項。招集権者を定款または取締役会で定めた場合、招集権者以外の取締役は、招集権者に対し、取締役会の目的である事項を示して、取締役会の招集を請求することができる。なお、請求があった日から５日以内に、当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は、その請求をした取締役は、取締役会を招集することができる（366条３項）。これは、招集権者が請求に応じて取締役会の招集手続を行わない場合に備えた規定である。"},
  {id:"K-02-05-010",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:3,rank:"A",src:"令５Ⅱ問題13 ア・平23Ⅱ問題９ア",
   q:"監査役設置会社における株主は、取締役が当該会社の目的の範囲外の行為もしくは定款に違反する行為をし、またはこれらの行為をするおそれがあると認めるときは、取締役会の招集を請求することができる。",ans:"誤り",
   exp:"367条１項。取締役会設置会社（監査役設置会社、監査等委員会設置会社および指名委員会等設置会社を除く）の株主は、取締役が取締役会設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし、またはこれらの行為をするおそれがあると認めるときは、取締役会の招集を請求することができる。当該請求は、取締役会に対し、取締役会の目的である事項を示して行わなければならない（367条２項）。そして、請求があった日から５日以内に、当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は、その請求をした株主は、取締役会を招集することができる（同条３項）。監査役設置会社、監査等委員会設置会社または指名委員会等設置会社以外の取締役会設置会社では、取締役の職務の執行を監督する権限を有するものは取締役会を除いて存在しない。そのような株式会社において、取締役が取締役会設置会社の目的の範囲外の行為その他法令もしくは定款に違反する行為をし、またはこれらの行為をするおそれがある場合には、これを防止する必要がある。そこで、株主に対して取締役会の招集請求権および招集権を認めたのである。"},
  {id:"K-02-05-011",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:4,rank:"B",src:"令４Ⅱ問題４ア類",
   q:"株主による取締役会の招集請求に基づいて招集された取締役会であっても、当該株主は、当該取締役会に出席することは認められない。",ans:"誤り",
   exp:"367条４項。取締役会の招集請求を行った株主は、当該請求に基づき招集された取締役会、または、自ら招集した取締役会に出席し、意見を述べることができる。"},
  {id:"K-02-05-012",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:5,rank:"B",src:"",
   q:"監査役設置会社において、監査役は、著しく不当な事実があると認める場合において、必要があると認めるときは、取締役会を招集することができる。",ans:"誤り",
   exp:"383条２項。監査役は、取締役が不正の行為をし、もしくは当該行為をするおそれがあると認めるとき、または法令もしくは定款に違反する事実もしくは著しく不当な事実があると認める場合において、必要があると認めるときは、取締役に対し、取締役会の招集を請求することができる。そして、請求があった日から５日以内に、当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられない場合は、その請求をした監査役は、取締役会を招集することができる（383条３項）。"},
  {id:"K-02-05-013",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:6,rank:"B",src:"令４Ⅰ問題12 ア",
   q:"指名委員会等設置会社においては、取締役会の招集権者の定めがある場合であっても、指名委員会等がその委員の中から選定する者は、取締役会を招集することができる。",ans:"正しい",
   exp:"417条１項。指名委員会等の職務の執行にあたって取締役会の決議を要する場合に備えた規定である。なお、監査等委員会設置会社においても同様に、招集権者の定めがある場合であっても、監査等委員会がその委員の中から選定する監査等委員は、取締役会を招集することができる（399条の14）。"},
  {id:"K-02-05-014",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:7,rank:"B",src:"",
   q:"執行役は、いつでも、取締役会の招集をすることができ、自ら招集した取締役会に出席し、意見を述べることができる。",ans:"誤り",
   exp:"417条２項前段。執行役は、取締役会の招集請求を受けるものとして定められた取締役（416条１項１号ニ）に対し、取締役会の目的である事項を示して、取締役会の招集を請求することができる。この場合において、執行役による招集の請求があった日から５日以内に、当該請求があった日から２週間以内の日を取締役会の日とする取締役会の招集の通知が発せられないときは、当該執行役は、取締役会を招集することができる（417条２項後段）。なお、執行役には、取締役会への出席権および発言権は与えられていない点に注意する必要がある。"},
  {id:"K-02-05-015",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:8,rank:"A",src:"",
   q:"取締役会の招集通知には、期限の制約がない。",ans:"誤り",
   exp:"368条１項。取締役会の招集通知の期限は、取締役会の日の１週間（定款で短縮可）前までとされる。"},
  {id:"K-02-05-016",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:9,rank:"A",src:"平31Ⅱ問題11 イ",
   q:"監査役会設置会社において、取締役会（特別取締役による取締役会の場合を除く）を招集する者が招集の通知を発する場合には、取締役会の日の１週間前までに、各取締役および各監査役に対してその通知を発しなければならない。ただし、定款に別段の定めはないものとする。",ans:"正しい",
   exp:"368条１項。取締役会を招集する者は、取締役会の日の１週間（定款で短縮可）前までに、各取締役（監査役設置会社では各取締役および各監査役）に対してその通知を発しなければならない。監査役は、取締役会に出席し、必要があると認めるときは、意見を述べなければならないため（383条１項前段）、監査役設置会社では、各監査役に対しても取締役会の招集通知を発しなければならない。"},
  {id:"K-02-05-017",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:10,rank:"A",src:"平23Ⅱ問題９エ",
   q:"会計監査人設置会社においては、取締役会の招集通知を、会計監査人にも発しなければならない。",ans:"誤り",
   exp:"368条１項。会計監査人には、取締役会への出席義務はないため、招集通知の発信も不要である。"},
  {id:"K-02-05-018",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:11,rank:"A",src:"令６Ⅰ問題12 ア類・平29Ⅱ問題11 イ・平28Ⅰ問題９エ類・平23Ⅱ問題９イ類",
   q:"取締役会の招集通知は、書面または電磁的方法によらなければならない。",ans:"誤り",
   exp:"取締役会の招集通知の方法に制限はなく、口頭（電話を含む）、書面またはメールなど、何でもよい。また、招集通知には取締役会の目的である事項（議題）を示す必要はない。なぜなら、会議中に業務の執行に必要な事項が議題に追加されるのは当然のことだからである。なお、取締役会の招集通知の方法を定款または取締役会で定めることも認められる。"},
  {id:"K-02-05-019",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:12,rank:"A",src:"平30Ⅰ問題13 ウ",
   q:"取締役会は、取締役会の招集通知に記載された会議の目的事項以外の事項について決議をすることができる。",ans:"正しい",
   exp:"取締役会は、会社から経営を委任された受任者である取締役で構成されているため、当然に日々の経営に関与していることから、招集通知に記載された会議の目的事項以外の事項について決定することができる。"},
  {id:"K-02-05-020",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:13,rank:"A",src:"令５Ⅱ問題13 イ類・平29Ⅱ問題11 ウ類・平26Ⅰ問題８イ類・平23Ⅱ問題９ウ類",
   q:"監査役設置会社において、取締役会は、取締役全員の同意があるときは、招集の手続を経ることなく開催することができる。",ans:"誤り",
   exp:"368条２項。取締役会は、取締役（監査役設置会社にあっては取締役および監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる。取締役会の招集手続の省略は、会社経営の機動性および迅速性を確保するために認められる。"},
  {id:"K-02-05-021",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (2) 取締役会の招集",num:14,rank:"A",src:"平26Ⅱ問題９ア",
   q:"取締役会の招集の手続を省略するには、定款の定めが必要である。",ans:"誤り",
   exp:"368条２項。取締役会は、取締役（監査役設置会社では取締役および監査役）の全員の同意があるときは、招集の手続を経ることなく開催することができる。これは会社経営の機動性および迅速性を確保するためであり、定款の定めは不要である。"},
  {id:"K-02-05-022",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:1,rank:"A",src:"",
   q:"取締役会の決議は、議決に加わることができる取締役全員が出席し、その過半数をもって行う。ただし、定款に別段の定めはないものとする。",ans:"誤り",
   exp:"369条１項。取締役会の決議は、議決に加わることができる取締役の過半数（定款で加重可）が出席し、その過半数（定款で加重可）をもって行う。"},
  {id:"K-02-05-023",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:2,rank:"A",src:"平26Ⅱ問題９イ",
   q:"取締役会の決議の定足数の要件を加重するには、定款の定めが必要である。",ans:"正しい",
   exp:"369条１項かっこ書。取締役会の決議は、議決に加わることができる取締役の過半数（定款で加重可）が出席し、その過半数（定款で加重可）をもって行う。"},
  {id:"K-02-05-024",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:3,rank:"B",src:"",
   q:"取締役は、取締役会において、代理人によってその議決権を行使することができる。",ans:"誤り",
   exp:"取締役会においては、経営の専門家である取締役が集まって、協議し、意見を交換して、業務執行について最善の結論を出すことが期待される。したがって、代理人による議決権の行使、書面投票、電子投票などは認められない。"},
  {id:"K-02-05-025",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:4,rank:"A",src:"平28Ⅰ問題９ウ",
   q:"取締役会の決議について特別の利害関係を有する取締役は、議決に加わることができない。",ans:"正しい",
   exp:"369条２項。株主の議決権が、実質的所有者たる株主の個人的利益のために与えられているのと異なり、株式会社と委任関係にある取締役の取締役会における議決権は、もっぱら株式会社の利益を図るためにのみ議決権を行使しなければならない（355条）。そこで、忠実義務違反を予防し、決議の公正を図るため、特別利害関係取締役は取締役会の議決に加わることができないとされている。"},
  {id:"K-02-05-026",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:5,rank:"B",src:"令６Ⅰ問題12 ウ",
   q:"最高裁判所の判例によれば、代表取締役の解職を決定する取締役会決議において、当該解職決議の対象となる代表取締役は、特別利害関係を有する者に該当するとしている。",ans:"正しい",
   exp:"最判昭44年３月28日。本人の意思に反して代表取締役を解職する決議がなされる場合は、当該代表取締役に対し、一切の私心を捨て去り、会社に対する忠実義務に従い、公正に議決権を行使することは期待できず、かえって自己の利益を図って議決権を行使することが考えられるためである。"},
  {id:"K-02-05-027",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:6,rank:"A",src:"平26Ⅱ問題９ウ",
   q:"取締役会の決議を省略するには、定款の定めが必要である。",ans:"正しい",
   exp:"370条。取締役会設置会社は、取締役が取締役会の決議の目的である事項について提案をした場合において、当該提案につき取締役（当該事項について議決に加わることができるものに限る）の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役設置会社では監査役が当該提案について異議を述べたときを除く）は、当該提案を可決する旨の取締役会の決議があったものとみなす旨を定款で定めることができる。取締役会の決議省略制度において定款の定めが必要とされているのは、取締役がどのような方法によって経営上の意思決定を行うかは、株主にとって重大な関心事であり、会社経営の基本的事項であると考えられるからである。"},
  {id:"K-02-05-028",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:7,rank:"A",src:"令５Ⅱ問題13 ウ・平31Ⅱ問題11 ウ類",
   q:"監査役設置会社の取締役が取締役会の決議の目的である事項について提案をした場合において、当該提案につき取締役の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役が当該提案について異議を述べたときを除く）は、当該提案を可決する旨の取締役会の決議があったものとみなされる。ただし、定款に別段の定めはないものとする。",ans:"誤り",
   exp:"370条。取締役会設置会社は、取締役が取締役会の決議の目的である事項について提案をした場合において、当該提案につき取締役（当該事項について議決に加わることができるものに限る）の全員が書面または電磁的記録により同意の意思表示をしたとき（監査役設置会社では監査役が当該提案について異議を述べたときを除く）は、当該提案を可決する旨の取締役会の決議があったものとみなす旨を定款で定めることができる。取締役会の決議省略制度において定款の定めが必要とされているのは、取締役がどのような方法によって経営上の意思決定を行うかは、株主にとって重大な関心事であり、会社経営の基本的事項であると考えられるからである。"},
  {id:"K-02-05-029",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:8,rank:"A",src:"平26Ⅱ問題９エ",
   q:"監査役が取締役会に報告すべき事項の報告を省略するには、定款の定めが必要である。",ans:"誤り",
   exp:"372条１項。取締役、会計参与、監査役または会計監査人が取締役（監査役設置会社では取締役および監査役）の全員に対して取締役会に報告すべき事項を通知したときは、当該事項を取締役会へ報告することを要しない。この報告の省略については、定款の定めは不要である。"},
  {id:"K-02-05-030",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:9,rank:"B",src:"平27Ⅰ問題９ア",
   q:"取締役会は、３か月に１回以上開催されなければならない。",ans:"正しい",
   exp:"372条２項、363条２項。代表取締役等が行う３か月に１回以上の職務執行状況の定例報告（363条２項、417条４項）は、省略することができない（372条２項３項）。370条の取締役会の決議の省略の規定と当該報告の省略の規定を過度に併用することにより、取締役会の監督機能が低下してしまうのを防ぐためである。したがって、取締役会は、少なくとも３か月に１回は開催することが義務づけられる。"},
  {id:"K-02-05-031",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (3) 取締役会の決議・報告の省略",num:10,rank:"B",src:"平31Ⅱ問題11 エ",
   q:"監査役設置会社における代表取締役は、３か月に１回以上、自己の職務の執行の状況を取締役会に報告しなければならないが、これを取締役および監査役の全員に対して通知したときは、当該事項を取締役会へ報告することを要しない。",ans:"誤り",
   exp:"372条２項、363条２項。代表取締役が行う３か月に１回以上の職務執行状況の定例報告（363条２項）は、省略することができない（372条２項３項）。370条の取締役会の決議の省略の規定と当該報告の省略の規定を過度に併用することにより、取締役会の監督機能が低下してしまうのを防ぐためである。したがって、取締役会は、少なくとも３か月に１回は開催することが義務づけられる。"},
  {id:"K-02-05-032",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:1,rank:"A",src:"平29Ⅰ問題11 エ",
   q:"特別取締役による取締役会の決議で決定することができるのは、重要な財産の処分および譲受け、多額の借財、支配人その他の使用人の選任および解任についてである。",ans:"誤り",
   exp:"373条１項柱書。特別取締役による取締役会の決議で決定することができるのは、① 重要な財産の処分および譲受け（362条４項１号、399条の13 第４項１号）、② 多額の借財（362条４項２号、399条の13 第４項２号）についてである。したがって、支配人その他の使用人の選任および解任について決定することは認められない。"},
  {id:"K-02-05-033",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:2,rank:"A",src:"平22Ⅱ問題９イ",
   q:"特別取締役による取締役会は、支店その他の重要な組織の設置を決議することができる。",ans:"誤り",
   exp:"373条１項柱書。支店その他の重要な組織の設置については、特別取締役による取締役会の決議で決定することができない。"},
  {id:"K-02-05-034",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:3,rank:"A",src:"平27Ⅰ問題９イ",
   q:"特別取締役による取締役会は、その決議により代表取締役を解職することができる。",ans:"誤り",
   exp:"373条１項柱書。代表取締役の解職については、特別取締役による取締役会の決議で決定することができない。"},
  {id:"K-02-05-035",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:4,rank:"A",src:"令４Ⅱ問題11 ア類・平29Ⅰ問題11 イ・平22Ⅱ問題９ア",
   q:"指名委員会等設置会社においては、特別取締役による取締役会の決議を行うことができない。",ans:"正しい",
   exp:"373条１項柱書。特別取締役による取締役会の決議の趣旨は、重要な財産の処分および譲受けおよび多額の借財について迅速な意思決定を可能にすることにある。ここで、指名委員会等設置会社において特別取締役による取締役会の決議の制度を採用することができないのは、執行役に業務執行の決定権限を大幅に委ねることで迅速な意思決定が可能なためである。"},
  {id:"K-02-05-036",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:5,rank:"A",src:"",
   q:"監査等委員会設置会社においては、特別取締役による取締役会の決議の制度を採用することはできない。",ans:"誤り",
   exp:"373条１項柱書かっこ書。監査等委員会設置会社においては、① 取締役の過半数が社外取締役である場合（399条の13 第５項）、または、② 取締役会の決議によって重要な財産の処分および讓受けならびに多額の借財を取締役に委任することができる旨の定款の定めがある場合（399条の13 第６項）は、特別取締役による取締役会の決議の制度を採用することができない（373条１項柱書かっこ書）。この場合は、取締役会の決議によって、重要な財産の処分および譲受け等の決定を代表取締役等に委任することにより迅速な意思決定が可能なためである。"},
  {id:"K-02-05-037",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:6,rank:"A",src:"令６Ⅱ問題11 エ・平29Ⅰ問題11 ア",
   q:"監査役設置会社が特別取締役による取締役会決議を行うには、当該会社が取締役会設置会社であって、取締役の数が６人以上であり、かつ、取締役のうち１人以上が社外取締役であることを要する。",ans:"正しい",
   exp:"373条１項柱書１号２号。特別取締役による取締役会の決議の制度は、取締役の数が多く機動的に取締役会を開催できない大規模な会社が利用することを前提としているためである。すなわち、取締役が少人数の取締役会設置会社においては、取締役会を機動的かつ頻繁に招集することができるため、特別取締役による取締役会の決議の制度を認める必要がないのである。また、取締役のうち１人以上が社外取締役でなければならないのは、特別取締役による取締役会の制度を採用するためには、取締役会の監督機能が適切に働く株式会社であることが求められるためである。"},
  {id:"K-02-05-038",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:7,rank:"A",src:"",
   q:"５人の取締役を置く株式会社において、当該取締役のうち３人以上が社外取締役でなければ、特別取締役による取締役会の決議を行うことができない。",ans:"誤り",
   exp:"373条１項２号。特別取締役による取締役会を置くためには、取締役のうち１人以上が社外取締役でなければならない。なぜなら、特別取締役による取締役会の制度を採用するためには、取締役会の監督機能が適切に働く株式会社であることが求められるためである。"},
  {id:"K-02-05-039",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:8,rank:"A",src:"平27Ⅱ問題８ウ類・平22Ⅱ問題９ウ",
   q:"特別取締役のうち少なくとも１人は、社外取締役でなければならない。",ans:"誤り",
   exp:"取締役のうち１人以上が社外取締役であることが特別取締役による取締役会の決議を採用するための要件とされているが（373条１項２号）、社外取締役が特別取締役に選定される必要はない。社外取締役が特別取締役として選定されていた方が監督機能を強化する点では望ましいが、別に本務を抱える多忙な社外取締役を特別取締役に選定してしまうと、迅速な意思決定を可能にするという趣旨を達成できなくなってしまうためである。"},
  {id:"K-02-05-040",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:9,rank:"A",src:"",
   q:"特別取締役による取締役会の決議の制度を採用するためには、定款でその旨を定めなければならない。",ans:"誤り",
   exp:"373条１項柱書。特別取締役による取締役会の制度の採用は、取締役会の決議をもって決定するため、定款で定める必要はない。取締役会の専決事項の一部について、迅速な意思決定ができるように設けられた制度であるため、取締役会の決議のみで定めることができるのである。"},
  {id:"K-02-05-041",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:10,rank:"B",src:"",
   q:"特別取締役による取締役会の決議については、あらかじめ選定した３人以上の特別取締役のうち、議決に加わることができるものの過半数（取締役会で加重可）が出席し、その過半数（取締役会で加重可）をもって行う。",ans:"正しい",
   exp:"373条１項柱書。特別取締役による取締役会の制度の採用が取締役会の決議のみで可能なことから、定足数および決議要件の加重は、取締役会の決議によってすることができる。なお、緩和は認められない。"},
  {id:"K-02-05-042",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:11,rank:"B",src:"",
   q:"特別取締役による取締役会の決議の制度を採用する旨の定めがある場合には、特別取締役以外の取締役は、当該特別取締役による取締役会に出席することを要しない。",ans:"正しい",
   exp:"373条２項。"},
  {id:"K-02-05-043",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:12,rank:"A",src:"令４Ⅱ問題11 ウ・平27Ⅱ問題８エ・平24Ⅱ問題10 ア類・平22Ⅱ問題９エ",
   q:"特別取締役の互選によって定められた者は、特別取締役による取締役会の決議後、遅滞なく、当該決議の内容を特別取締役以外の取締役に報告しなければならない。",ans:"正しい",
   exp:"373条３項。特別取締役の互選によって定められた者は、特別取締役による取締役会の決議後、遅滞なく、当該決議の内容を特別取締役以外の取締役に報告しなければならない。なお、当該報告については、別途取締役会を招集する必要はない。"},
  {id:"K-02-05-044",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:13,rank:"B",src:"",
   q:"特別取締役による取締役会は、各特別取締役が招集するが、取締役会の決議によって、特別取締役による取締役会を招集する特別取締役を定めることができる。",ans:"誤り",
   exp:"373条２項４項。特別取締役による取締役会には、取締役会を招集することができる取締役を限定することができる規定は適用されない（373条４項、366条１項ただし書）。したがって、特別取締役による取締役会の招集権者は各特別取締役（373条２項、366条１項本文）であり、招集することができる特別取締役を限定することはできない。"},
  {id:"K-02-05-045",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:14,rank:"B",src:"令４Ⅱ問題11 イ類",
   q:"特別取締役による取締役会については、株主による招集請求は認められない。",ans:"正しい",
   exp:"373条４項。機動的な開催が期待される特別取締役による取締役会の決議の制度趣旨に合致しないためである。同様に、特別取締役による取締役会には、株主による招集請求の規定、監査役による招集請求の規定、および、監査等委員会が選定する監査等委員による招集の規定は適用されない（373条４項、367条、383条４項、399条の14）。"},
  {id:"K-02-05-046",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:15,rank:"B",src:"",
   q:"特別取締役による取締役会については、特別取締役が当該特別取締役による取締役会の目的である事項について提案した場合において、当該提案につき特別取締役の全員が書面または電磁的記録により同意の意思表示をしたときは、当該提案を可決する旨の特別取締役による取締役会決議があったものとみなす旨を定款で定めることができる。",ans:"誤り",
   exp:"373条４項、370条。機動的に会議を開催するのに適した取締役が特別取締役として選定されているはずなので、取締役会の決議の省略の規定は適用されない（373条４項、370条）。"},
  {id:"K-02-05-047",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:16,rank:"B",src:"",
   q:"特別取締役による取締役会の招集の通知は、当該取締役会の日の１週間前までに発する必要があり、これを下回る期間を定めることはできない。",ans:"誤り",
   exp:"373条２項後段、368条１項。特別取締役による取締役会の招集の通知は、原則として、会日の１週間前までに発する必要があるが、取締役会の決議によってこれを下回る期間を定めることができる。"},
  {id:"K-02-05-048",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:17,rank:"B",src:"",
   q:"監査役設置会社において、特別取締役による取締役会の招集の通知は、各特別取締役および各監査役に対して発しなければならない。",ans:"正しい",
   exp:"373条２項後段、368条１項。特別取締役による取締役会の招集の通知を発出する対象は、各特別取締役（監査役設置会社では各特別取締役および各監査役）である（373条２項後段、368条１項）。また、特別取締役による取締役会についても招集手続の省略の規定（368条２項）が適用されるが、その場合には、特別取締役（監査役設置会社では特別取締役および監査役）の全員の同意が必要である。"},
  {id:"K-02-05-049",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (4) 特別取締役による取締役会の決議",num:18,rank:"B",src:"令４Ⅱ問題11 エ類・令２Ⅱ問題11 イ類・平29Ⅰ問題11 ウ",
   q:"監査役設置会社において、特別取締役による取締役会決議が行われる取締役会には、監査役は出席することを要しない。",ans:"誤り",
   exp:"383条１項。監査役は、特別取締役による取締役会決議が行われる取締役会に出席し、必要があると認めるときは、意見を述べなければならない。ただし、監査役が２人以上ある場合において、監査役の互選によって、監査役の中から特に当該取締役会に出席する監査役を定めることができる。"},
  {id:"K-02-05-050",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (5) 取締役会の議事録",num:1,rank:"B",src:"",
   q:"取締役会の議事録について、取締役の署名は求められていない。",ans:"誤り",
   exp:"369条３項。取締役会の議事については、法務省令で定めるところにより、議事録を作成し、議事録が書面をもって作成されているときは、出席した取締役および監査役は、これに署名し、または記名押印しなければならない。議事録は、決議事項に関する賛否の意思表示の重要な証拠資料となるためである。"},
  {id:"K-02-05-051",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (5) 取締役会の議事録",num:2,rank:"A",src:"令２Ⅱ問題10 ウ・平26Ⅰ問題８ウ類",
   q:"取締役会の決議に参加した取締役であって、当該取締役会の議事録に異議をとどめない者は、その決議に賛成したものとみなされる。",ans:"誤り",
   exp:"369条５項。取締役会の決議に参加した取締役であって、当該取締役会の議事録に異議をとどめない者は、その決議に賛成したものと推定される。議事録の記載または記録から取締役等の責任の範囲を明らかにすることは困難であるため、その立証を容易にするために当該推定規定が設けられている。"},
  {id:"K-02-05-052",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (5) 取締役会の議事録",num:3,rank:"B",src:"",
   q:"指名委員会等設置会社の株主は、その権利を行使するため必要があるときは、株式会社の営業時間内はいつでも、取締役会の議事録の閲覧を請求することができる。",ans:"誤り",
   exp:"371条２項３項。株主は、その権利を行使するために必要があるときは、会社の営業時間内はいつでも、議事録等の閲覧または謄写を請求することができる。ただし、監査役設置会社、監査等委員会設置会社または指名委員会等設置会社においては、裁判所の許可が必要となる。これは、業務執行機関としての取締役会の議事録は株式会社の機密が詰まっているため、株主に強い権限を与える必要がある株式会社以外については、裁判所の許可を必要としたものである。"},
  {id:"K-02-05-053",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (5) 取締役会の議事録",num:4,rank:"B",src:"令６Ⅰ問題12 エ・平26Ⅰ問題８エ",
   q:"取締役会設置会社の親会社の債権者は、当該取締役会設置会社の役員または執行役の責任を追及するため必要があるときは、裁判所の許可を得て、当該取締役会設置会社の取締役会の議事録の閲覧または謄写の請求をすることができる。",ans:"誤り",
   exp:"371条４項。取締役会設置会社の債権者は、役員または執行役の責任を追及するために必要があるときは、裁判所の許可を得て、議事録等の閲覧または謄写を請求することができる。また、取締役会設置会社の親会社社員がその権利を行使するため必要がある場合も、同様に、裁判所の許可を得て、議事録等の閲覧または謄写を請求することができる。しかし、親会社の債権者にはそのような権利は認められていない。"},
  {id:"K-02-05-054",subject:"企業法",chapter:"第2章 機関",sub:"5. 取締役会 (5) 取締役会の議事録",num:5,rank:"B",src:"",
   q:"裁判所は、取締役会設置会社の親会社社員の請求による取締役会の議事録の閲覧をすることにより、当該取締役会設置会社またはその親会社もしくは子会社に著しい損害を及ぼすおそれがあると認めるときは、当該閲覧の請求を許可することができない。",ans:"正しい",
   exp:"371条６項。"},
  {id:"K-02-06-001",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:1,rank:"B",src:"令７Ⅱ問題11 ア類・令２Ⅰ問題10 ア類・平21 問題10 ア類",
   q:"取締役会設置会社以外の株式会社において、取締役が２人以上ある場合には、定款、定款の定めに基づく取締役の互選または株主総会の決議による定めがある場合を除き、取締役は、各自、株式会社を代表する。",ans:"正しい",
   exp:"349条１項。取締役会非設置会社における、各自代表の原則である。"},
  {id:"K-02-06-002",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:2,rank:"C",src:"平26Ⅱ問題８イ",
   q:"取締役会設置会社以外の株式会社において、代表取締役その他株式会社を代表する取締役を定めた場合には、それ以外の取締役は当該株式会社を代表する権限を有しない。",ans:"正しい",
   exp:"349条１項ただし書。取締役会非設置会社では、定款、定款の定めに基づく取締役の互選または株主総会の決議によって、取締役の中から代表取締役を定めることができる（349条３項）。すなわち、この場合は当該代表取締役以外の取締役は代表権を有しない（349条１項ただし書）。"},
  {id:"K-02-06-003",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:3,rank:"B",src:"",
   q:"取締役会設置会社以外の株式会社において、定款により取締役の中から代表取締役を定めた場合は、当該取締役以外の取締役は当該株式会社の業務を執行する権限を失う。",ans:"誤り",
   exp:"代表権のない取締役であっても、定款で業務執行権の制約がなされていない限り業務を執行する権限を有する（348条１項）ため、本肢は誤りである。"},
  {id:"K-02-06-004",subject:"企業法",chapter:"第2章 機関",sub:"6. 代表取締役",num:4,rank:"A",src:"",
